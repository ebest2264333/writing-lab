<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Writing Lab · 천일문 WRITING</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSans.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#4A3F55;--navy-2:#372E40;--violet:#FF8FAA;--violet-2:#FF6F93;--violet-soft:#FFE4EC;
    --blue:#38BFC7;--blue-2:#1FA3AC;--blue-soft:#DFF6F5;
    --accent:#FFAC42;--accent-2:#FF8F2E;--accent-soft:#FFEEDA;
    --green:#3FBE87;--green-soft:#E2F8EF;--red:#FF6B6B;--red-soft:#FFE8E8;
    --amber:#FFC44E;--amber-soft:#FFF3D9;--purple:#B48CFF;--purple-soft:#F0E7FF;
    --rose:#B79CFF;--rose-2:#9678EE;--rose-soft:#EFE7FF;
    --ink:#463C50;--muted:#8D8298;--line:#F2EAF3;--line-2:#E6DAE9;--bg-1:#FFF6F0;--bg-2:#FFEAE0;--paper:#ffffff;
    --shadow-sm:0 2px 10px rgba(74,58,80,.08);--shadow-md:0 10px 28px rgba(74,58,80,.12);--shadow-lg:0 16px 40px rgba(74,58,80,.16);
    --sans:'Gmarket Sans','Pretendard Variable','Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --serif:var(--sans);
  }
  /* 학생이 답을 외부에서 복사해 붙여넣지 못하도록 사이트 전체에서 복사·붙여넣기를 막아요.
     input/textarea는 직접 타이핑·커서 이동은 그대로 되고, 복사(copy)·잘라내기(cut)·붙여넣기(paste)만 막혀요. */
  *{user-select:none;-webkit-user-select:none}
  input,textarea{user-select:text;-webkit-user-select:text}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);line-height:1.55;height:100vh;overflow:hidden;
    background:linear-gradient(150deg,#FFEDE0 0%,#FFE0EC 35%,#F3E4FF 68%,#DFF6F5 100%);
    display:flex;align-items:stretch;justify-content:center;padding:0 26px;position:relative}
  #page{position:relative;z-index:1;width:100%;max-width:920px;height:100%;display:flex;align-items:stretch;justify-content:center;margin:0 auto;transition:max-width .25s ease}
  #page.wide{max-width:1320px}
  #frame{width:100%;height:100%;background:var(--paper);border-radius:22px;
    box-shadow:0 30px 60px rgba(80,55,70,.25);display:flex;flex-direction:column;overflow:hidden}
  /* ===== hero ===== */
  .hero{background:linear-gradient(120deg,var(--violet),var(--rose-2) 70%);border-radius:22px;padding:40px 300px 40px 34px;color:#fff;
    box-shadow:var(--shadow-lg);position:relative;overflow:visible;margin-bottom:18px;display:flex;align-items:center;min-height:60px}
  .hero-decor{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
  .hero-decor::before{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.10)}
  .hero-decor::after{content:'';position:absolute;right:40px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero-tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:5px 14px;border-radius:999px;margin-bottom:12px}
  .hero h1{font-family:var(--sans);font-weight:800;font-size:26px;margin:0;position:relative;text-shadow:0 1px 4px rgba(0,0,0,.12)}
  .hero-sub{font-size:14px;opacity:.9;position:relative;max-width:420px;line-height:1.6}
  .hero-art{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:230px;height:180px;z-index:2}
  .hero-art .ha-card{position:absolute;background:#fff;border-radius:16px;box-shadow:0 14px 30px rgba(10,14,40,.28);display:flex;align-items:center;justify-content:center}
  .hero-art .ha1{width:104px;height:104px;left:0;top:8px;transform:rotate(-9deg);background:var(--accent-soft)}
  .hero-art .ha2{width:96px;height:96px;right:0;top:0;transform:rotate(8deg);background:var(--blue-soft)}
  .hero-art .ha3{width:120px;height:78px;left:38px;bottom:0;transform:rotate(-3deg);background:#fff}
  .hero-art svg{width:44px;height:44px}
  .hero-quick{position:relative;z-index:3;margin:-34px 20px 0;background:var(--paper);border-radius:16px;box-shadow:var(--shadow-lg);
    display:flex;justify-content:space-around;padding:16px 10px 12px;flex-wrap:wrap;gap:10px}
  .hq-item{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font-family:var(--sans);color:var(--navy);flex:1;min-width:80px}
  .hq-item .hq-ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
  .hq-item .hq-ic svg{width:20px;height:20px}
  .hq-item:nth-child(1) .hq-ic{background:linear-gradient(135deg,var(--violet),var(--violet-2))}
  .hq-item:nth-child(2) .hq-ic{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .hq-item:nth-child(3) .hq-ic{background:linear-gradient(135deg,var(--blue),var(--blue-2))}
  .hq-item:nth-child(4) .hq-ic{background:linear-gradient(135deg,var(--rose),var(--rose-2))}
  .hq-item span{font-size:12.5px;font-weight:700}
  .hq-item:hover .hq-ic{filter:brightness(1.08)}
  @media(max-width:640px){.hero{padding:30px 34px 46px}.hero-art{display:none}}
  #topbar{display:flex;align-items:center;gap:12px;padding:16px 26px;background:linear-gradient(120deg,#FFD9C4,#FFC7DC);color:var(--navy)}
  #topbar .logo{font-family:var(--sans);font-weight:800;font-size:16px;color:var(--navy)}
  #topbar .logo small{font-weight:600;opacity:.65;font-size:11px;letter-spacing:.04em;margin-left:2px;color:var(--navy)}
  #topbar .who{margin-left:auto;font-size:13px;color:var(--navy);opacity:.95;font-weight:700;background:rgba(255,255,255,.55);padding:6px 14px 6px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:8px}
  #topbar .who:not(:empty)::before{content:'';display:inline-block;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--violet));flex:0 0 auto}
  #topbar .hbtn{background:rgba(255,255,255,.55);color:var(--navy);border:1px solid rgba(74,63,85,.25);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:background .15s,border-color .15s}
  #topbar .hbtn:hover{background:rgba(255,255,255,.85);border-color:rgba(74,63,85,.4)}
  #progress{height:3px;background:rgba(36,42,92,.08)}#progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--accent));transition:.25s}
  #stage{flex:1;position:relative;overflow:hidden}
  .view,.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:0;overflow-y:auto}
  .view.active{display:flex}
  .slide{justify-content:safe center;align-items:safe center;padding:3vh 5vw}
  .slide.active{display:flex;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .wrap{width:100%;max-width:900px;margin:0 auto;padding:30px 5vw}
  #page.wide .wrap{max-width:1280px}
  .inner{width:100%;max-width:820px}
  h1.title{font-family:var(--sans);color:var(--navy);font-weight:800;font-size:25px;margin:2px 0 14px;letter-spacing:.1px}
  .lead{font-size:20px;line-height:1.9;margin:8px 0;white-space:pre-wrap}
  .hint{font-size:14.5px;color:var(--muted);margin-top:6px}
  .badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.02em;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2));padding:5px 14px;border-radius:999px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
  .badge.blue{background:linear-gradient(120deg,var(--blue),var(--blue-2))}.badge.green{background:var(--green)}.badge.purple{background:linear-gradient(120deg,var(--violet),var(--violet-2))}
  .step-tag{font-family:var(--sans);font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin-bottom:4px}
  /* home */
  .greet{font-family:var(--sans);font-size:23px;font-weight:800;color:var(--navy);margin:4px 0 4px}
  .leveltabs{display:flex;gap:10px;margin:18px 0 8px}
  .leveltabs .lt{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;cursor:pointer;font-weight:700;color:var(--muted);transition:border-color .15s,background .15s,box-shadow .15s;box-shadow:var(--shadow-sm)}
  .leveltabs .lt:hover{border-color:var(--line-2);box-shadow:var(--shadow-md)}
  .leveltabs .lt b{display:block;font-family:var(--sans);font-size:18px;color:var(--navy);font-weight:800}
  .leveltabs .lt small{font-size:11.5px}
  .leveltabs .lt.on{border-color:transparent;background:linear-gradient(120deg,var(--violet),var(--violet-2));color:#fff;box-shadow:var(--shadow-md)}
  .leveltabs .lt.on b{color:#fff}
  .leveltabs .lt:nth-child(1).on{background:linear-gradient(120deg,var(--violet),var(--violet-2))}
  .leveltabs .lt:nth-child(2).on{background:linear-gradient(120deg,var(--blue),var(--blue-2))}
  .leveltabs .lt:nth-child(3).on{background:linear-gradient(120deg,var(--rose),var(--rose-2))}
  .prog{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin:12px 0 18px;box-shadow:var(--shadow-sm)}
  .prog h3{margin:0 0 10px;font-size:13.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
  .pbar{height:9px;background:var(--bg-1);border-radius:999px;overflow:hidden}.pbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue));border-radius:999px;transition:.3s}
  .prog .pn{font-size:13.5px;color:var(--navy);font-weight:700;margin-top:8px}
  .tracks{display:flex;gap:18px;flex-wrap:wrap}
  .track{flex:1;min-width:250px;border-radius:22px;padding:26px;cursor:pointer;color:#fff;transition:transform .15s,box-shadow .15s;text-align:left;border:none;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
  .track:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .track::before{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
  .track.drill{background:linear-gradient(135deg,var(--violet),var(--violet-2))}
  .track.para{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .track.article{background:linear-gradient(135deg,var(--blue),var(--blue-2))}
  .track.exam{background:linear-gradient(135deg,var(--rose),var(--rose-2))}
  .track.rewrite{background:linear-gradient(135deg,var(--green),#1f8a5c)}
  .track .tt{font-family:var(--sans);font-size:21px;font-weight:800}.track .td{font-size:14.5px;opacity:.9;margin-top:8px;line-height:1.65}
  .track .tk{margin-top:14px;font-size:12px;font-weight:800;letter-spacing:.02em;background:rgba(255,255,255,.22);display:inline-block;padding:6px 14px;border-radius:999px}
  .track .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .track .ic svg{width:24px;height:24px}
  /* point menu */
  .chapter{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden;box-shadow:var(--shadow-sm)}
  .chapter .ch-h{padding:13px 18px;font-weight:800;color:var(--navy);font-size:15px;background:var(--bg-1);border-bottom:1px solid var(--line)}
  .point{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .point:last-child{border-bottom:none}.point:hover{background:var(--bg-1)}
  .point .dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);flex:0 0 auto;text-align:center;line-height:23px;font-weight:800;font-size:12.5px;color:var(--muted);background:var(--paper)}
  .point.done .dot{background:linear-gradient(135deg,var(--green),#1f8a5c);border-color:transparent;color:#fff}
  .point .pt{font-size:15.5px;font-weight:600;flex:1}
  .point .meta{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--bg-1);padding:4px 10px;border-radius:999px}
  .point.soon{opacity:.5;cursor:not-allowed}.point.soon .pt::after{content:' · 준비 중';color:var(--accent);font-weight:700;font-size:11.5px}
  .backbtn{background:var(--paper);border:1px solid var(--line-2);border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;margin-bottom:14px;font-family:var(--sans);box-shadow:var(--shadow-sm)}
  .backbtn:hover{border-color:var(--violet);color:var(--violet)}
  /* generic content */
  .key{background:var(--amber-soft);border-bottom:2px solid var(--amber);border-radius:5px;padding:1px 6px;cursor:pointer;font-weight:700;color:#7a5c0d}
  .key.clicked{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .notebox{margin-top:16px;background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:12px;padding:14px 18px;font-size:18px;min-height:52px}
  code.k{background:var(--violet-soft);border-radius:6px;padding:2px 7px;color:var(--violet-2);font-weight:700;font-family:inherit}
  .qtext{font-family:var(--sans);font-size:21px;font-weight:800;color:var(--navy);line-height:1.7;margin:6px 0 16px}
  .qtext u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{border:1.5px solid var(--line-2);border-radius:14px;padding:14px 18px;font-size:17px;cursor:pointer;background:var(--paper);text-align:left;font-family:inherit;transition:border-color .12s,box-shadow .12s;box-shadow:var(--shadow-sm)}
  .opt:hover{border-color:var(--violet);box-shadow:var(--shadow-md)}
  .opt.ok{border-color:var(--green);background:var(--green-soft);font-weight:700}
  .opt.no{border-color:var(--red);background:var(--red-soft)}
  .opt:disabled{cursor:default}
  .expl{margin-top:12px;background:var(--green-soft);border-left:4px solid var(--green);border-radius:12px;padding:12px 16px;font-size:15px;display:none}
  .expl.show{display:block}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
  .chip{background:var(--paper);border:1.5px solid var(--blue);border-radius:999px;padding:8px 16px;font-size:18px;font-weight:700;color:var(--navy);font-family:var(--sans);transition:background .15s,border-color .15s,color .15s}
  .chip.used{background:var(--line);border-color:var(--line-2);color:var(--muted)}
  .chip.pick{cursor:pointer;transition:opacity .15s,transform .1s;user-select:none}
  .chip.pick:hover{background:var(--blue-soft)}
  .chip.pick:active{transform:scale(.96)}
  .chip.pick.used{opacity:.3;pointer-events:none}
  .chip.pick.locked{pointer-events:none}
  .arrange-ans{min-height:54px;border:2px dashed var(--line-2);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px;background:var(--bg-1)}
  .arrange-ph{color:var(--muted);font-size:14.5px;font-family:var(--sans)}
  .chip.picked{background:var(--violet);border-color:var(--violet);color:#fff;cursor:pointer}
  .chip.picked:hover{opacity:.85}
  .arrange-ans.ok{border-color:var(--green);border-style:solid;background:var(--green-soft)}
  .arrange-ans.no{border-color:var(--red);border-style:solid;background:var(--red-soft)}
  .kobox{font-size:19px;font-weight:600;color:var(--navy);margin:4px 0 10px}
  .kobox::before{content:'KOR';display:inline-block;font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--violet);padding:3px 7px;border-radius:6px;margin-right:8px;vertical-align:2px}
  .frame{font-size:13px;color:var(--muted);margin:2px 0 8px}
  input.in,textarea.in{width:100%;border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;font-size:17px;font-family:var(--sans);background:var(--paper)}
  textarea.in{min-height:120px;resize:vertical}
  input.in:focus,textarea.in:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
  input.in.ok,textarea.in.ok{border-color:var(--green);background:var(--green-soft)}
  input.in.no{border-color:var(--red);background:var(--red-soft)}
  .fx{font-size:15.5px;margin-top:10px;font-weight:700;min-height:22px}.fx.ok{color:var(--green)}.fx.no{color:var(--red)}
  .enter-tip{font-size:12px;color:var(--muted);margin-top:6px}
  .field{margin:12px 0}.field .fl{font-size:13.5px;font-weight:700;color:#4A3F55;margin-bottom:5px}
  .login-box{max-width:340px;margin:8vh auto 0;text-align:center}
  .login-box .step-tag,.login-box .title,.login-box .hint{text-align:center}
  .login-box .field{text-align:left}
  .login-box .field input.in{width:100%}
  .login-box .btn{width:100%}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;border:none;border-radius:999px;padding:12px 24px;font-size:16px;font-weight:800;cursor:pointer;font-family:var(--sans);transition:transform .12s,box-shadow .12s;box-shadow:var(--shadow-sm)}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .btn.blue{background:linear-gradient(120deg,var(--violet),var(--violet-2))}.btn.green{background:linear-gradient(120deg,var(--green),#1f8a5c)}.btn.ghost{background:var(--paper);color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
  .conds{list-style:none;padding:0;margin:14px 0 0}
  .conds li{font-size:15.5px;padding:7px 0 7px 30px;position:relative;color:var(--muted)}
  .conds li .mk{position:absolute;left:0;top:7px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);text-align:center;line-height:17px;font-size:12px;font-weight:800}
  .conds li.pass{color:var(--green)}.conds li.pass .mk{background:var(--green);border-color:var(--green);color:#fff}
  .conds li.fail .mk{border-color:var(--red);color:var(--red)}
  .copybox{border:1.5px dashed var(--accent);border-radius:12px;padding:10px 14px;background:var(--accent-soft);font-size:17px;font-weight:700;color:var(--navy);margin:8px 0;font-family:var(--sans)}
  /* report */
  .rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:11px 2px}
  .rrow .rl{font-size:16.5px;font-weight:600;color:var(--navy)}.rrow .rn{font-size:15.5px;font-weight:800;color:var(--accent)}
  .scorehero{text-align:center;margin:6px 0 14px}
  .scorehero .big{font-family:var(--sans);font-size:54px;font-weight:800;color:var(--navy);line-height:1}
  .scorehero .big small{font-family:var(--sans);font-size:22px;color:var(--muted);font-weight:700}
  .grade{display:inline-block;margin-top:10px;font-size:17px;font-weight:800;padding:6px 20px;border-radius:999px}
  .grade.A{background:var(--green-soft);color:var(--green)}.grade.B{background:var(--blue-soft);color:var(--blue)}
  .grade.C{background:var(--amber-soft);color:var(--amber)}.grade.D{background:var(--red-soft);color:var(--red)}
  /* split writer */
  .writer{display:flex;gap:22px;align-items:flex-start}
  .wleft{flex:1 1 55%;min-width:0}.wright{flex:1 1 45%;position:sticky;top:0}
  /* Re-Writing 화면 전용 3분할: 왼쪽(고쳐진 원문 참고자료) · 가운데(다시쓰기, 더 넓게) · 오른쪽(조건 확인) */
  .rewriter{display:flex;gap:18px;align-items:stretch}
  .rw-left{flex:0 1 35%;min-width:0;display:flex;flex-direction:column}
  .rw-left-scroll{flex:1;max-height:70vh;overflow-y:auto;padding-right:4px}

const autoFormatPrompt=(text)=>{
  if(!text)return text;

};

/* 선생님이 "🏷️ 레벨 관리" 화면에서 추가하거나 이름을 바꾼 레벨 목록이에요 (id/name/book/seq).
   "🔄 사이트에 반영하기"를 누르면 이 자리가 최신 내용으로 채워져요. 기존 레벨(L1/L2/L3)은 이름·교재명만
   덮어쓰고, 새로 추가된 레벨은 Pattern Drill 챕터 없이(Paragraph Writing/Article/수행평가/Re-Writing은 바로
   가능) LEVELS 맨 뒤에 추가돼요. */
const LEVELS_DATA=[{"id":"L0","name":"초5","book":"LEVEL 1","seq":1},{"id":"L1","name":"초6","book":"LEVEL 2","seq":2},{"id":"L2","name":"중1","book":"LEVEL 3","seq":3},{"id":"L3","name":"중2","book":"LEVEL 4","seq":4}];
(function applyLevelsData(){
  if(!Array.isArray(LEVELS_DATA)||!LEVELS_DATA.length)return;
  const bySeq=LEVELS_DATA.slice().sort((a,b)=>(a.seq||0)-(b.seq||0));
  bySeq.forEach(d=>{
    const existing=LEVELS.find(l=>l.id===d.id);
    if(existing){ if(d.name)existing.name=d.name; if(d.book)existing.book=d.book; }
    else{ LEVELS.push({id:d.id,name:d.name||d.id,book:d.book||'',chapters:[]}); }
  });
  const order={};bySeq.forEach((d,i)=>{order[d.id]=i;});
  LEVELS.sort((a,b)=>(order[a.id]!==undefined?order[a.id]:999)-(order[b.id]!==undefined?order[b.id]:999));
})();

/* 선생님이 "🏷️ 레벨 관리 > Pattern Drill 챕터/유닛" 화면에서 추가한 챕터·유닛 구성이에요.
   "🔄 사이트에 반영하기"를 누르면 이 자리가 최신 내용으로 채워져요. 기존 챕터(id로 매칭)는 제목만
   덮어쓰고, 새 챕터는 해당 레벨의 챕터 목록 맨 뒤에 추가돼요. 유닛도 마찬가지로 기존 id는 제목만
   덮어쓰고(퀴즈/설명 등 실제 컨텐츠는 그대로 유지) 새 id는 "준비 중" 자리로 추가돼서,
   선생님이 "✏️ 컨텐츠 수정/추가"에서 바로 내용을 채울 수 있어요. */
const PATTERN_STRUCTURE_DATA=[];
(function applyPatternStructureData(){
  if(!Array.isArray(PATTERN_STRUCTURE_DATA)||!PATTERN_STRUCTURE_DATA.length)return;
  PATTERN_STRUCTURE_DATA.slice().sort((a,b)=>(a.seq||0)-(b.seq||0)).forEach(ch=>{
    const lv=LEVELS.find(l=>l.id===ch.level_id);
    if(!lv)return;
    let chap=lv.chapters.find(c=>c.id===ch.id);
    if(!chap){ chap={id:ch.id,t:ch.title||ch.id,points:[]}; lv.chapters.push(chap); }
    else if(ch.title){ chap.t=ch.title; }
    (ch.units||[]).slice().sort((a,b)=>(a.seq||0)-(b.seq||0)).forEach(u=>{
      const pt=chap.points.find(p=>p&&p.id===u.id);
      if(!pt){ chap.points.push({id:u.id,title:u.title||u.id,soon:true}); }
      else if(pt.soon&&u.title){ pt.title=u.title; }
    });
  });
})();

ample":"I get up at 7 in the morning. I have English class on Monday. In summer, I swim for two hours every day.","conds":[{"label":"문장 3개 이상","minSentences":3},{"label":"시각을 나타내는 전치사 at 사용","regex":"\\bat\\b"},{"label":"요일·월·계절을 나타내는 on 또는 in 사용","regex":"\\b(on|in)\\b"}]},"images":""},{"id":"L1C11U3","title":"여러 가지 전치사","explainParts":[{"t":"전치사는 명사나 대명사 앞에 놓여 방법, 대상, 출신 등을 나타내는 말이에요. 이번에는 여러 가지 전치사를 배워봐요. "},{"k":"with / without","n":"with는 '~와 함께, ~을 가지고'라는 뜻이고, without은 그 반대인 '~ 없이'라는 뜻이에요. 예: with my friend(내 친구와 함께), without you(너 없이)."},{"t":" 교통수단을 말할 때는 "},{"k":"by + 교통수단","n":"by는 '~을 타고'라는 뜻으로 교통수단을 나타내요. 이때 교통수단 앞에는 a나 the 같은 관사를 쓰지 않아요. 예: by bus(버스를 타고), by train(기차를 타고)."},{"t":" 를 써요. 또 about은 '~에 대하여', for는 '~을 위하여'라는 뜻이고, "},{"k":"from","n":"from은 '~로부터, ~에서'라는 뜻으로 출신이나 출발점을 나타내요. 예: I'm from Korea.(나는 한국 출신이야.)"},{"t":" 처럼 각 전치사의 뜻을 정확히 익혀 두면 문장을 자유롭게 만들 수 있어요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"나는 버스를 타고 학교에 가요. I go to school ___ bus.","o":["by","with","for","from","about"],"a":0,"e":"교통수단을 나타낼 때는 '~을 타고'라는 뜻의 by를 써요."},{"q":"이것은 너를 위한 선물이야. This is a gift ___ you.","o":["with","from","for","by","about"],"a":2,"e":"'~을 위하여'라는 뜻은 전치사 for로 나타내요."},{"q":"나는 내 친구와 함께 논다. I play ___ my friend.","o":["about","with","by","for","from"],"a":1,"e":"'~와 함께'라는 뜻은 전치사 with로 나타내요."},{"q":"그는 한국에서 왔다. He is ___ Korea.","o":["for","by","about","from","with"],"a":3,"e":"출신을 나타낼 때는 '~에서, ~로부터'라는 뜻의 from을 써요."},{"q":"우리는 동물에 대한 책을 읽는다. We read a book ___ animals.","o":["with","for","from","by","about"],"a":4,"e":"'~에 대하여'라는 뜻은 전치사 about으로 나타내요."},{"q":"그녀는 우산 없이 나갔다. She went out ___ an umbrella.","o":["without","with","about","for","by"],"a":0,"e":"'~ 없이'라는 뜻은 전치사 without으로 나타내요."},{"q":"밑줄 친 부분의 우리말 뜻으로 알맞은 것은? I go there [[by]] bike every day.","o":["~을 위해","~을 타고","~에 대해","~ 없이","~로부터"],"a":1,"e":"교통수단 앞에 쓰인 by는 '~을 타고'라는 뜻이에요."},{"q":"나에게 너의 가족에 대해 말해 줘. Tell me ___ your family.","o":["for","by","with","about","from"],"a":3,"e":"'~에 대하여'라는 뜻이므로 about이 알맞아요."},{"q":"나는 내 휴대폰 없이 살 수 없어. I can't live ___ my phone.","o":["with","without","by","for","from"],"a":1,"e":"'~ 없이'라는 뜻이므로 without이 알맞아요."},{"q":"그는 엄마의 생신을 위해 이 케이크를 만들었다. He made this cake ___ his mom's birthday.","o":["about","by","for","with","from"],"a":2,"e":"목적이나 대상을 나타내어 '~을 위하여'라는 뜻이므로 for가 알맞아요."}],"arrange":[{"ko":"나는 내 친구와 함께 있다.","a":"I am with my friend."},{"ko":"나는 버스를 타고 간다.","a":"I go by bus."},{"ko":"우리는 동물에 대해 이야기한다.","a":"We talk about animals."},{"ko":"이것은 너를 위한 것이다.","a":"This is for you."},{"ko":"그녀는 한국에서 왔다.","a":"She is from Korea."},{"ko":"그는 너 없이 갔다.","a":"He went without you."},{"ko":"나는 기차를 타고 여행한다.","a":"I travel by train."},{"ko":"그것은 나를 위한 선물이다.","a":"It is a gift for me."},{"ko":"우리는 우리 선생님에 대해 이야기했다.","a":"We talked about our teacher."},{"ko":"나는 내 가족과 함께 산다.","a":"I live with my family."},{"ko":"그들은 서울에서 왔다.","a":"They are from Seoul."},{"ko":"나는 물 없이 살 수 없다.","a":"I can't live without water."},{"ko":"그녀는 자전거를 타고 온다.","a":"She comes by bike."},{"ko":"이 책은 아이들을 위한 것이다.","a":"This book is for children."},{"ko":"나는 내 개와 함께 걷는다.","a":"I walk with my dog."}],"compose":[{"k":"나는 버스를 타고 학교에 간다.","a":"I go to school by bus.","h":"go/by/bus","alt":[]},{"k":"이 선물은 너를 위한 것이다.","a":"This present is for you.","h":"present/for","alt":["This gift is for you."]},{"k":"우리는 우리 애완동물에 대해 이야기한다.","a":"We talk about our pets.","h":"talk/about","alt":[]},{"k":"그는 나 없이 떠났다.","a":"He left without me.","h":"left/without","alt":[]},{"k":"나는 내 부모님과 함께 산다.","a":"I live with my parents.","h":"live/with","alt":[]},{"k":"그녀는 일본에서 왔다.","a":"She is from Japan.","h":"from","alt":["She comes from Japan."]},{"k":"나는 기차를 타고 부산에 간다.","a":"I go to Busan by train.","h":"by/train","alt":[]},{"k":"이 편지는 내 엄마를 위한 것이다.","a":"This letter is for my mom.","h":"letter/for","alt":["This letter is for my mother."]},{"k":"우리는 그 영화에 대해 이야기했다.","a":"We talked about the movie.","h":"talked/about","alt":[]},{"k":"나는 내 여동생과 함께 논다.","a":"I play with my sister.","h":"play/with","alt":[]},{"k":"그들은 돈 없이 여행한다.","a":"They travel without money.","h":"travel/without","alt":[]},{"k":"나는 비행기를 타고 미국에 간다.","a":"I go to America by plane.","h":"by/plane","alt":["I go to the USA by plane."]},{"k":"이 노래는 우리 아빠에 관한 것이다.","a":"This song is about my dad.","h":"song/about","alt":["This song is about my father."]},{"k":"그는 캐나다에서 왔다.","a":"He is from Canada.","h":"from","alt":["He comes from Canada."]},{"k":"나는 내 우산 없이 밖에 나갔다.","a":"I went out without my umbrella.","h":"went/without","alt":[]}],"task":{"prompt":"여러분 자신을 소개하는 짧은 글을 써 보세요. 이번 단원에서 배운 전치사 <b>with</b>, <b>without</b>, <b>from</b>, <b>by</b>, <b>about</b>, <b>for</b> 를 활용하여 3문장 이상으로 쓰세요.","sample":"I am from Korea. I go to school by bus with my friend. I love a book about animals.","conds":[{"label":"문장 3개 이상","minSentences":3},{"label":"전치사 with 또는 without 사용","regex":"\\bwith(out)?\\b"},{"label":"전치사 from, by, about, for 중 하나 이상 사용","regex":"\\b(from|by|about|for)\\b"}]},"images":""},{"id":"L1C12U1","title":"and / but / or","explainParts":[{"t":"and, but, or는 단어와 단어, 구와 구처럼 문법적으로 대등한 것을 연결하는 등위접속사예요. 예를 들어 apples and bananas처럼 "},{"k":"and","n":"'그리고, ~와/과'라는 뜻으로, 비슷하거나 서로 더해지는 내용을 연결해요."},{"t":"는 내용을 더할 때 쓰고, small but strong처럼 "},{"k":"but","n":"'그러나, 하지만'이라는 뜻으로, 서로 반대되거나 대조되는 내용을 연결해요."},{"t":"는 앞뒤가 서로 대조될 때 써요. 마지막으로 tea or coffee처럼 "},{"k":"or","n":"'또는, ~이나'라는 뜻으로, 둘 중 하나를 선택하는 내용을 연결해요."},{"t":"는 둘 중 하나를 고를 때 사용해요. 이때 연결되는 앞뒤는 항상 같은 종류(명사와 명사, 형용사와 형용사)여야 해요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"나는 사과와 바나나를 좋아한다. I like apples ___ bananas.","o":["and","but","or","so","because"],"a":0,"e":"두 명사를 나란히 더해 주므로 '그리고'를 뜻하는 and가 알맞아요."},{"q":"그것은 작지만 강하다. It is small ___ strong.","o":["and","but","or","for","with"],"a":1,"e":"'작다'와 '강하다'가 서로 대조되므로 '그러나'를 뜻하는 but이 알맞아요."},{"q":"차 또는 커피 드실래요? Do you want tea ___ coffee?","o":["and","but","or","so","to"],"a":2,"e":"둘 중 하나를 고르는 것이므로 '또는'을 뜻하는 or가 알맞아요."},{"q":"그는 키가 크고 친절하다. He is tall ___ kind.","o":["or","but","because","and","if"],"a":3,"e":"두 형용사를 더해 주므로 '그리고'를 뜻하는 and가 알맞아요."},{"q":"밑줄 친 접속사의 우리말 뜻으로 알맞은 것은? The bag is cheap [[but]] good.","o":["그리고","또는","~와 함께","그러나","그래서"],"a":3,"e":"but은 '그러나, 하지만'의 뜻으로 앞뒤 대조를 나타내요."},{"q":"우리는 걷거나 버스를 탈 수 있다. We can walk ___ take a bus.","o":["or","and","but","so","for"],"a":0,"e":"두 가지 중 하나를 선택하는 것이므로 or가 알맞아요."},{"q":"그녀는 열심히 공부했지만 시험에 떨어졌다. She studied hard ___ failed the test.","o":["and","but","or","because","when"],"a":1,"e":"열심히 했으나 떨어진 대조 관계이므로 but이 알맞아요."},{"q":"펜과 공책을 가져와. Bring a pen ___ a notebook.","o":["but","or","and","so","if"],"a":2,"e":"두 물건을 함께 가져오라는 뜻이므로 and가 알맞아요."},{"q":"어법상 옳은 문장을 고르시오.","o":["I like tea and.","She is small but.","Do you want juice or?","He is short but strong.","Cats and but dogs."],"a":3,"e":"접속사는 대등한 두 요소를 연결해야 하므로 'short but strong'이 옳아요."},{"q":"문맥상 두 빈칸에 알맞은 것은? She is rich, ___ she is not happy. Buy bread ___ milk.","o":["and / but","or / and","but / or","and / and","but / and"],"a":4,"e":"부자지만 행복하지 않은 대조는 but, 빵과 우유를 더하는 것은 and가 알맞아요."}],"arrange":[{"ko":"나는 사과와 바나나를 좋아한다.","a":"I like apples and bananas."},{"ko":"그것은 작지만 강하다.","a":"It is small but strong."},{"ko":"차 또는 커피 드릴까요?","a":"Do you want tea or coffee?"},{"ko":"그는 키가 크고 친절하다.","a":"He is tall and kind."},{"ko":"나는 피곤하지만 행복하다.","a":"I am tired but happy."},{"ko":"너는 개나 고양이를 좋아하니?","a":"Do you like dogs or cats?"},{"ko":"그녀는 노래하고 춤춘다.","a":"She sings and dances."},{"ko":"이 가방은 싸지만 좋다.","a":"This bag is cheap but good."},{"ko":"우리는 걷거나 달릴 수 있다.","a":"We can walk or run."},{"ko":"나는 펜과 공책을 샀다.","a":"I bought a pen and a notebook."},{"ko":"그는 어리지만 똑똑하다.","a":"He is young but smart."},{"ko":"빨간색 또는 파란색을 골라라.","a":"Choose red or blue."},{"ko":"그들은 축구와 야구를 한다.","a":"They play soccer and baseball."},{"ko":"날씨는 춥지만 화창하다.","a":"It is cold but sunny."},{"ko":"너는 지금 가니 아니면 나중에 가니?","a":"Are you going now or later?"}],"compose":[{"k":"나는 우유와 빵을 원한다.","a":"I want milk and bread.","h":"milk/and/bread","alt":[]},{"k":"그녀는 예쁘지만 슬프다.","a":"She is pretty b g(내가 어렸을 때), if you want(네가 원한다면)처럼 써요."},{"t":" 는 시간과 조건을 나타내고, "},{"k":"because / so","n":"because는 '~ 때문에'라는 이유를, so는 '그래서'라는 결과를 나타내요. because it is cold(추워서), so I took an umbrella(그래서 나는 우산을 가져갔다)처럼 써요."},{"t":" 는 이유와 결과를 이어 줘요. 또 I think that ~처럼 that은 '~라는 것'이라는 뜻으로 생각이나 사실을 담은 절을 이끌어요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I was happy ___ I saw you.","o":["when","for","and","of","to"],"a":0,"e":"'~할 때'라는 시간을 나타내므로 when이 알맞아요."},{"q":"___ you want, you can come with us.","o":["Because","If","That","So","And"],"a":1,"e":"'만약 ~라면'이라는 조건을 나타내므로 If가 알맞아요."},{"q":"I stayed home ___ it was cold.","o":["if","that","because","when","or"],"a":2,"e":"'~ 때문에'라는 이유를 나타내므로 because가 알맞아요."},{"q":"I think ___ he is right.","o":["if","when","so","that","but"],"a":3,"e":"'~라는 것'이라는 뜻으로 생각을 담은 절을 이끄는 that이 알맞아요."},{"q":"It was raining, ___ I took an umbrella.","o":["because","if","when","that","so"],"a":4,"e":"'그래서'라는 결과를 나타내므로 so가 알맞아요."},{"q":"밑줄 친 부분의 우리말 뜻으로 알맞은 것은? I called you [[because]] I missed you.","o":["~할 때","~ 때문에","만약 ~라면","~라는 것","그래서"],"a":1,"e":"because는 '~ 때문에'라는 이유를 나타내요."},{"q":"We can play outside ___ the weather is nice.","o":["if","so","that","because","for"],"a":0,"e":"'만약 날씨가 좋으면'이라는 조건이므로 if가 알맞아요."},{"q":"She was tired ___ she worked all day.","o":["when","if","that","because","so"],"a":3,"e":"'하루 종일 일했기 때문에'라는 이유이므로 because가 알맞아요."},{"q":"I know ___ you are honest.","o":["if","when","that","so","because"],"a":2,"e":"'네가 정직하다는 것'을 안다는 뜻이므로 that이 알맞아요."},{"q":"It was very cold, ___ I wore a coat.","o":["when","because","if","that","so"],"a":4,"e":"'추워서 그래서 코트를 입었다'라는 결과이므로 so가 알맞아요."}],"arrange":[{"ko":"내가 어렸을 때 나는 부산에 살았다.","a":"When I was young, I lived in Busan."},{"ko":"추워서 나는 집에 머물렀다.","a":"I stayed home because it was cold."},{"ko":"만약 네가 원한다면 너는 갈 수 있다.","a":"If you want, you can go."},{"ko":"나는 그가 옳다고 생각한다.","a":"I think that he is right."},{"ko":"비가 와서 나는 우산을 가져갔다.","a":"It was raining, so I took an umbrella."},{"ko":"나는 너를 "감각동사 taste 뒤에는 형용사 good을 써요."},{"q":"He gave ___ a gift. (그는 나에게 선물을 주었다.)","o":["I","to me","me","my","mine"],"a":2,"e":"4형식의 간접목적어 자리에는 목적격 me를 써요."},{"q":"The flowers smell ___. (그 꽃들은 좋은 냄새가 난다.)","o":["nicely","to nice","nice","niced","being nice"],"a":2,"e":"감각동사 smell 뒤에는 형용사 nice가 와요."},{"q":"My teacher ___ us English. (내 선생님은 우리에게 영어를 가르치신다.)","o":["teach","teaching","to teach","taught to","teaches"],"a":4,"e":"주어가 3인칭 단수이고 현재형이므로 teaches를 쓰고, 4형식으로 us English 순서예요."},{"q":"Can you ___ me the photo? (나에게 그 사진 좀 보여 줄래?)","o":["showed to","show","to show","shows","showing"],"a":1,"e":"조동사 can 뒤에는 동사원형 show를 쓰고, 4형식으로 me the photo 순서예요."},{"q":"It is getting ___ outside. (밖이 점점 추워지고 있다.)","o":["coldly","to cold","being cold","cold","more coldly"],"a":3,"e":"get 뒤에는 형용사 cold를 써서 상태 변화를 나타내요."},{"q":"She ___ me a letter last week. (그녀는 지난주에 나에게 편지를 보냈다.)","o":["send","sends","sending","was send","sent"],"a":4,"e":"last week은 과거이므로 send의 과거형 sent를 써요."},{"q":"다음 문장의 밑줄 친 부분을 바르게 고친 것은? Your idea sounds [[greatly]]. (네 생각 멋지게 들려.)","o":["great","greatly","more great","to great","greatest"],"a":0,"e":"감각동사 sound 뒤에는 부사 greatly가 아니라 형용사 great를 써야 해요."},{"q":"My dad bought ___ yesterday. (우리 아빠는 어제 나에게 새 자전거를 사 주셨다.)","o":["a new bike for I","for me a new bike","a new bike me","me a new bike","me to a new bike"],"a":3,"e":"buy는 4형식으로 간접목적어 me 다음에 직접목적어 a new bike 순서로 써요."}],"arrange":[{"ko":"너 오늘 피곤해 보여.","a":"You look tired today."},{"ko":"그 수프는 맛이 좋다.","a":"The soup tastes good."},{"ko":"그는 나에게 선물을 주었다.","a":"He gave me a gift."},{"ko":"그 꽃들은 좋은 냄새가 난다.","a":"The flowers smell nice."},{"ko":"내 선생님은 우리에게 영어를 가르치신다.","a":"My teacher teaches us English."},{"ko":"그 음악은 슬프게 들린다.","a":"The music sounds sad."},{"ko":"날씨가 추워지고 있다.","a":"It is getting cold."},{"ko":"그녀는 나에게 편지를 보냈다.","a":"She sent me a letter."},{"ko":"네 얼굴이 창백해 보인다.","a":"Your face looks pale."},{"ko":"우리 엄마는 나에게 새 가방을 사 주셨다.","a":"My mom bought me a new bag."},{"ko":"나에게 그 사진을 보여 줘.","a":"Show me the photo."},{"ko":"그는 유명해졌다.","a":"He became famous."},{"ko":"이 케이크는 달콤한 맛이 난다.","a":"This cake tastes sweet."},{"ko":"그들은 나에게 어려운 질문을 했다.","a":"They asked me a difficult question."},{"ko":"그 담요는 부드럽게 느껴진다.","a":"The blanket feels soft."}],"compose":[{"k":"너 행복해 보여.","a":"You look happy.","h":"감각동사 look / 형용사","alt":["You seem happy."]},{"k":"그것은 좋게 들린다.","a":"It sounds good.","h":"sound / 형용사","alt":["That sounds good."]},{"k":"그는 나에게 책 한 권을 주었다.","a":"He gave me a book.","h":"수여동사 give / 간접목적어+직접목적어","alt":["He gave a book to me."]},{"k":"그 피자는 맛있는 냄새가 난다.","a":"The pizza smells delicious.","h":"smell / 형용사","alt":["The pizza smells good."]},{"k":"그녀는 나에게 수학을 가르친다.","a":"She teaches me math.","h":"teach / me + math","alt":["She teaches math to me."]},{"k":"나는 피곤해졌다.","a":"I got tired.","h":"get / 형용사","alt":["I became tired."]},{"k":"그가 나에게 이메일을 보냈다.","a":"He sent me an email.","h":"send / 간접목적어+직접목적어","alt":["He sent an email to me."]},{"k":"이 차는 따뜻하게 느껴진다.","a":"This tea feels warm.","h":"feel / 형용사","alt":[]},{"k":"그 이야기는 흥미롭게 들린다.","a":"The story sounds interesting.","h":"sound / 형용사","alt":[]},{"k":"나에게 네 그림을 보여 줘.","a":"Show me your picture.","h":"show / me + your picture","alt":["Show your picture to me."]},{"k":"내 여동생은 배우가 되었다.","a":"My sister became an actress.","h":"become / 명사(직업)","alt":["My sister became an actor."]},{"k":"그 사과들은 신맛이 난다.","a":"The apples taste sour.","h":"taste / 형용사","alt":[]},{"k":"우리 아빠는 나에게 자전거를 사 주셨다.","a":"My dad bought me a bike.","h":"buy / me + a bike","alt":["My dad bought a bike for me."]},{"k":"그는 나에게 재미있는 이야기를 해 주었다.","a":"He told me a funny story.","h":"tell / 간접목적어+직접목적어","alt":["He told a funny story to me."]},{"k":"네 목소리가 이상하게 들린다.","a":"Your voice sounds strange.","h":"sound / 형용사","alt":["Your voice sounds weird."]}],"task":{"prompt":"여러분의 오늘 하루를 떠올리며 짧은 일기를 영어로 써 보세요. <b>감각동사(look, sound, taste, smell, feel)나 become/get + 형용사</b>를 사용한 문장과, <b>수여동사(give, send, show, teach, buy, make 등)를 쓴 4형식(누구에게 무엇을)</b> 문장을 각각 포함하여 3문장 이상 쓰세요.","sample":"This morning the bread smelled great. My mom made me a warm sandwich. After breakfast I felt happy.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"감각동사 또는 become/get + 형용사를 사용했나요?","regex":"\\b(look|looks|looked|sound|sounds|sounded|taste|tastes|tasted|smell|smells|smelled|feel|feels|felt|become|becomes|became|get|gets|got)\\b"},{"label":"수여동사 4형식(누구에게 무엇을) 문장을 썼나요?","regex":"\\b(give|gives|gave|send|sends|sent|show|shows|showed|teach|teaches|taught|buy|buys|bought|make|makes|made|tell|tells|told)\\b"}]},"images":""},{"id":"L2C1U2","title":"SVOC – 목적격보어의 종류","explainParts":[{"t":"5형식(SVOC) 문장은 「주어+동사+목적어+목적격보어」로 이루어져요. 목적격보어는 목적어를 보충 설명해 주는 말이에요."},{"k":"명사·형용사 목적격보어","n":"make, call, keep, find, name 뒤에는 「목적어+명사」 또는 「목적어+형용사」가 와요. 예: It made me happy.(형용사) / They named the baby Sam.(명사)"},{"t":"예를 들어 It made me happy.에서는 me가 목적어, happy가 목적어를 설명하는 목적격보어예요. 이때 부사(happily)는 쓸 수 없어요."},{"k":"to부정사 목적격보어","n":"want, ask, tell 뒤에는 「목적어+to부정사」가 와요. 예: I want you to come. / He told me to wait."},{"t":"want / ask / tell 다음에는 반드시 to가 붙은 to부정사를 써야 해요. 동사원형만 쓰면 틀린 문장이 돼요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"The good news made me very ___ .","o":["happily","happier than","happy","to happily","happiness"],"a":2,"e":"make+목적어+형용사이므로 부사가 아닌 형용사 happy를 써야 해요."},{"q":"My friends ___ me Sujin.","o":["calls to","call","to call","calling","call to"],"a":1,"e":"주어가 복수 My friends이고 call+목적어+명사(이름) 형태이므로 call이 맞아요."},{"q":"I want you ___ here early tomorrow.","o":["come","coming","comes","to come","came"],"a":3,"e":"want+목적어+to부정사이므로 to come이 정답이에요."},{"q":"Please keep the door ___ during class.","o":["open","opens","to open it","opening it","openly"],"a":0,"e":"keep+목적어+형용사이므로 형용사 open이 맞아요."},{"q":"They ___ their new puppy Coco.","o":["name to","naming","names to","name for","named"],"a":4,"e":"name+목적어+명사(이름) 형태이고 과거이므로 named가 정답이에요."},{"q":"The teacher told us ___ quiet in the library.","o":["be","being","to be","are","were"],"a":2,"e":"tell+목적어+to부정사이므로 to be가 맞아요."},{"q":"I found the science class ___ .","o":["interestingly","interesting","to interest","interested well","interest"],"a":1,"e":"find+목적어+형용사이므로 형용사 interesting을 써야 해요."},{"q":"My mom asked me ___ the dishes after dinner.","o":["wash","washing","washes","to wash","washed"],"a":3,"e":"ask+목적어+to부정사이므로 to wash가 정답이에요."},{"q":"She wants her children [[be]] honest with her.","o":["to be","be","being","are","to being"],"a":0,"e":"want+목적어+to부정사이므로 밑줄 친 be를 to be로 고쳐야 해요."},{"q":"다음 중 어법상 옳은 문장을 고르세요.","o":["He told me bring my umbrella.","He wanted me bringing my umbrella.","He made me to clean the room.","She kept the soup warmly.","He told me to bring my umbrella."],"a":4,"e":"tell+목적어+to부정사가 옳고, 나머지는 make+동사원형, keep+형용사 규칙을 어겨서 틀려요."}],"arrange":[{"ko":"그 소식은 나를 행복하게 만들었다.","a":"The news made me happy."},{"ko":"나는 네가 오기를 원한다.","a":"I want you to come."},{"ko":"우리는 그를 Tom이라고 부른다.","a":"We call him Tom."},{"ko":"방을 깨끗하게 유지해라.","a":"Keep the room clean."},{"ko":"그들은 그 아기를 Sam이라고 이름 지었다.","a":"They named the baby Sam."},{"ko":"나는 그 책이 지루하다고 생각했다.","a":"I found the book boring."},{"ko":"선생님은 나에게 기다리라고 말했다.","a":"The teacher told me to wait."},{"ko":"엄마는 나에게 설거지를 하라고 부탁했다.","a":"My mom asked me to wash the dishes."},{"ko":"그 영화는 우리를 슬프게 만들었다.","a":"The movie made us sad."},{"ko":"나는 네가 정직하기를 원한다.","a":"I want you to be honest."},{"ko":"사람들은 그녀를 여왕이라고 불렀다.","a":"People called her a queen."},{"ko":"담요는 나를 따뜻하게 해 준다.","a":"The blanket keeps me warm."},{"ko":"그는 나에게 창문을 닫으라고 말했다.","a":"He told me to close the window."},{"ko":"우리는 그 강아지를 Coco라고 이름 지었다.","a":"We named the puppy Coco."},{"ko":"나는 그가 좋은 친구라는 것을 알게 되었다.","a":"I found him a good friend."}],"compose":[{"k":"그것은 나를 행복하게 만들었다.","a":"It made me happy.","h":"make+목적어+형용사 / made","alt":["It made me feel happy."]},{"k":"나는 네가 오기를 원한다.","a":"I want you to come.","h":"want+목적어+to부정사","alt":["I want you to come here."]},{"k":"우리는 그를 대장이라고 부른다.","a":"We call him the leader.","h":"call+목적어+명사","alt":["We call him our leader."]},{"k":"창문을 열어 두어라.","a":"Keep the window open.","h":"keep+목적어+형용사","alt":["Please keep the window open."]},{"k":"그들은 그 고양이를 Kitty라고 이름 지었다.","a":"They named the cat Kitty.","h":"name+목적어+명사 / named","alt":["They called the cat Kitty."]},{"k":"나는 그 시험이 어렵다고 생각했다.","a":"I found the test difficult.","h":"find+목적어+형용사 / found","alt":["I found the test hard."]},{"k":"선생님은 우리에게 조용히 하라고 말했다.","a":"The teacher told us to be quiet.","h":"tell+목적어+to부정사 / told","alt":["The teacher told us to keep quiet."]},{"k":"그녀는 나에게 도와 달라고 부탁했다.","a":"She asked me to help her.","h":"ask+목적어+to부정사 / asked","alt":["She asked me to help."]},{"k":"그 노래는 나를 행복하게 한다.","a":"The song makes me happy.","h":"make+목적어+형용사 / makes","alt":["The song makes me feel happy."]},{"k":"나는 네가 최선을 다하기를 원한다.","a":"I want you to do your best.","h":"want+목적어+to부정사","alt":["I want you to try your best."]},{"k":"사람들은 그를 영웅이라고 불렀다.","a":"People called him a hero.","h":"call+목적어+명사 / called","alt":["They called him a hero."]},{"k":"운동은 나를 건강하게 유지해 준다.","a":"Exercise keeps me healthy.","h":"keep+목적어+형용사 / keeps","alt":["Exercise keeps me fit."]},{"k":"그는 나에게 일찍 오라고 말했다.","a":"He told me to come early.","h":"tell+목적어+to부정사 / told","alt":["He told me to arrive early."]},{"k":"우리는 그 인형을 Molly라고 이름 지었다.","a":"We named the doll Molly.","h":"name+목적어+명사 / named","alt":["We called the doll Molly."]},{"k":"나는 그 문제가 쉽다는 것을 알았다.","a":"I found the problem easy.","h":"find+목적어+형용사 / found","alt":["I found the question easy."]}],"task":{"prompt":"여러분의 하루에 있었던 일을 5형식(SVOC) 문장으로 써 보세요. <b>make/keep/find/call/name</b> 또는 <b>want/ask/tell</b>을 활용하여 목적격보어가 있는 문장을 3문장 이상 쓰세요.","sample":"The music made me happy. My teacher told me to study hard. I want my friends to be honest.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"make/keep/find/call/name 중 하나로 목적격보어(명사·형용사) 문장 쓰기","regex":"\\b(make|makes|made|keep|keeps|kept|find|finds|found|call|calls|called|name|names|named)\\b"},{"label":"want/ask/tell + 목적어 + to부정사 문장 쓰기","regex":"\\b(want|wants|wanted|ask|asks|asked|tell|tells|told)\\b\\s+\\w+\\s+to\\b"}]},"images":""},{"id":"L2C2U1","title":"현재, 과거, 미래 & 진행형","explainParts":[{"t":"영어 문장은 그 일이 '언제' 일어나는지에 따라 동사의 형태가 달라져요."},{"k":"현재·과거·미래 시제","n":"현재는 동사원형(3인칭 단수는 -s), 과거는 -ed 또는 불규칙형, 미래는 will+동사원형으로 나타내요. 예: study / studied / will study"},{"t":"지금 이 순간이나 특정 시점에 '진행 중'인 동작은 진행형으로 표현해요."},{"k":"진행형 (be + 동사-ing)","n":"현재진행형은 am/is/are + 동사-ing, 과거진행형은 was/were + 동사-ing예요. 예: I am studying now. / She was reading."},{"t":"주어와 시제에 맞게 be동사를 골라야 해요. 진행형에서도 주어의 수에 주의하세요."},{"k":"시간 표현","n":"now, today는 현재·진행, yesterday·last night은 과거, tomorrow·next week은 미래를 알려줘요. 시간 표현이 시제를 결정해요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I ___ TV now.","o":["watch","watched","am watching","watches","will watch"],"a":2,"e":"now는 지금 진행 중인 동작을 나타내므로 현재진행형 am watching이 맞아요."},{"q":"She ___ a book yesterday.","o":["read","reads","is reading","will read","reading"],"a":0,"e":"yesterday(어제)는 과거를 나타내므로 과거형 read가 맞아요."},{"q":"We ___ to Busan next week.","o":["travel","traveled","are traveling","will travel","travels"],"a":3,"e":"next week(다음 주)은 미래이므로 will travel이 맞아요."},{"q":"Look! The baby ___ now.","o":["sleeps","is sleeping","slept","will sleep","sleep"],"a":1,"e":"now와 함께 지금 자고 있는 상황이므로 현재진행형 is sleeping이 맞아요."},{"q":"They ___ soccer last Sunday.","o":["play","plays","is playing","will play","played"],"a":4,"e":"last Sunday(지난 일요일)는 과거이므로 played가 맞아요."},{"q":"I ___ my homework when you called.","o":["do","did","was doing","were doing","am doing"],"a":2,"e":"네가 전화했을 때 진행 중이던 동작이고 주어가 I이므로 과거진행형 was doing이 맞아요."},{"q":"The children [[was]] playing in the park. 밑줄 친 부분을 바르게 고친 것은?","o":["was","were","are","is","will be"],"a":1,"e":"children은 복수 주어이므로 과거진행형의 be동사는 were가 맞아요."},{"q":"My father ___ dinner right now.","o":["is cooking","cooks","cooked","are cooking","will cook"],"a":0,"e":"right now는 지금 진행 중임을 나타내고 3인칭 단수 주어이므로 is cooking이 맞아요."},{"q":"Tomorrow I ___ my grand k.","h":"has not / finished","alt":["She hasn't finished her work."]}],"task":{"prompt":"여러분이 최근에 <b>완료한 일</b>이나 지금까지의 <b>경험</b>에 대해 현재완료(have/has + 과거분사)를 사용하여 영어로 3문장 이상 써 보세요. 부정문이나 의문문도 한 번 이상 포함해 보세요.","sample":"I have finished my homework. I have never been to Japan. Have you seen my new bike?","conds":[{"label":"3문장 이상 썼어요","minSentences":3},{"label":"현재완료(have/has + 과거분사)를 사용했어요","regex":"(have|has|Have|Has|haven't|hasn't)\\s+\\w+"},{"label":"부정문 또는 의문문을 포함했어요","regex":"(not|n't|\\?)"}]},"images":""},{"id":"L2C2U3","title":"현재완료의 주요 의미","explainParts":[{"t":"현재완료(have/has + 과거분사)는 과거의 일이 지금과 연결될 때 써요. 대표적으로 네 가지 의미가 있어요."},{"k":"경험","n":"'~한 적 있다'. ever(한 번이라도), never(한 번도 ~않다)와 자주 쓰여요. 예: I have been to Japan.(일본에 가 본 적 있다)"},{"k":"계속","n":"'(지금까지) 쭉 ~해 왔다'. 기간 앞에는 for, 시작 시점 앞에는 since를 써요. 예: She has lived here for five years."},{"k":"완료·결과","n":"'막/이미 ~했다'. just, already는 주로 긍정문, yet은 부정문·의문문에 써요. 결과는 그 일의 영향이 지금 남아 있음을 뜻해요."},{"t":"have been to는 '가 본 적 있다(경험)', have gone to는 '가 버려서 지금 여기 없다(결과)'로 뜻이 서로 달라요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"She ___ lived here for five years.","o":["has","have","had","is","was"],"a":0,"e":"주어가 3인칭 단수(She)이므로 현재완료에서 has를 쓴다."},{"q":"Have you ___ been to Canada?","o":["already","just","ever","since","for"],"a":2,"e":"의문문에서 '한 번이라도'라는 경험을 물을 때는 ever를 쓴다."},{"q":"She has lived in Seoul ___ 2019.","o":["for","since","from","at","in"],"a":1,"e":"since 뒤에는 시작 시점(2019)이 온다."},{"q":"We have known each other ___ ten years.","o":["for","since","during","at","from"],"a":0,"e":"for 뒤에는 기간(ten years)이 온다."},{"q":"The train has ___ left the station.","o":["never","ever","just","yet","since"],"a":2,"e":"'막 ~했다'라는 완료의 뜻은 just로 나타낸다."},{"q":"I haven't finished my homework ___.","o":["just","already","still","yet","ever"],"a":3,"e":"부정문에서 '아직'이라는 뜻은 yet이며 보통 문장 끝에 온다."},{"q":"다음 문장의 밑줄 친 부분을 바르게 고친 것은? I have [[knew]] him since 2020.","o":["known","knew","know","have known","knows"],"a":0,"e":"현재완료는 have + 과거분사이므로 knew를 런 영화를 본 적이 없다.","a":"I have never seen such a movie.","h":"never / 경험","alt":["I have never watched such a movie."]},{"k":"그 버스는 막 도착했다.","a":"The bus has just arrived.","h":"just / 완료","alt":[]},{"k":"너는 이미 점심을 먹었니?","a":"Have you already eaten lunch?","h":"already / 완료","alt":["Have you eaten lunch already?"]},{"k":"나는 아직 그 편지를 쓰지 않았다.","a":"I haven't written the letter yet.","h":"yet / 부정문","alt":["I have not written the letter yet."]},{"k":"우리는 오랫동안 서로 알고 지냈다.","a":"We have known each other for a long time.","h":"for / 계속","alt":[]},{"k":"그녀는 부산에 가 버려서 지금 여기 없다.","a":"She has gone to Busan.","h":"have gone to / 결과","alt":[]},{"k":"너는 김치를 먹어 본 적이 있니?","a":"Have you ever eaten kimchi?","h":"ever / 경험","alt":["Have you ever tried kimchi?"]},{"k":"그들은 2020년부터 서울에 살고 있다.","a":"They have lived in Seoul since 2020.","h":"since / 계속","alt":[]},{"k":"나는 그 영화를 세 번 봤다.","a":"I have seen the movie three times.","h":"경험 / 횟수","alt":["I have watched the movie three times."]},{"k":"그는 아직 그의 방을 청소하지 않았다.","a":"He hasn't cleaned his room yet.","h":"yet / 부정문","alt":["He has not cleaned his room yet."]},{"k":"우리는 방금 저녁 식사를 마쳤다.","a":"We have just finished dinner.","h":"just / 완료","alt":[]},{"k":"너는 그 노래를 들어 본 적이 있니?","a":"Have you ever heard that song?","h":"ever / 경험","alt":["Have you heard that song?"]}],"task":{"prompt":"여러분의 경험을 <b>현재완료</b>로 소개하는 글을 <b>세 문장 이상</b>으로 쓰세요. 가 본 곳, 해 본 일(또는 해 본 적 없는 일), 그리고 얼마나 오래 해 온 일을 포함하세요.","sample":"I have been to Jeju Island twice. I have never tried scuba diving. I have played the violin for three years.","conds":[{"label":"세 문장 이상 쓰기","minSentences":3},{"label":"현재완료(have/has + 과거분사) 사용","regex":"\\b(have|has)\\b\\s+\\w+"},{"label":"경험·계속 표현(ever, never, for, since 등) 포함","regex":"\\b(ever|never|for|since|just|already|yet)\\b"}]},"images":""},{"id":"L2C3U1","title":"can / may / will","explainParts":[{"t":"조동사(can, may, will 등)는 동사에 특별한 의미를 더해 주는 말이에요. 조동사 바로 뒤에는 항상 동사원형이 오고, 주어가 3인칭 단수여도 조동사에 -s를 붙이지 않아요."},{"k":"can","n":"'~할 수 있다'(능력)와 '~해도 된다'(허가)를 나타내요. 과거나 공손한 표현은 could를 쓰고, can은 be able to로 바꿔 쓸 수 있어요. 예: I can swim. = I am able to swim."},{"t":"예: She can speak French. (그녀는 프랑스어를 말할 수 있다.)"},{"k":"may","n":"'~해도 된다'(허가)와 '~일지도 모른다'(약한 추측)를 나타내요. 추측의 뜻은 might으로도 쓸 수 있어요. 예: You may go now. / It may rain."},{"t":"예: It may rain this afternoon. (오후에 비가 올지도 모른다.)"},{"k":"will","n":"'~할 것이다'(미래)와 '~하겠다'(의지)를 나타내요. 부정은 will not이고, 줄여서 won't으로 써요. 예: I will help you."},{"t":"예: They will not come tomorrow. (그들은 내일 오지 않을 것이다.)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"She ___ speak three languages. (그녀는 세 개의 언어를 말할 수 있다.)","o":["cans","can to","can","is can","can speaks"],"a":2,"e":"능력을 나타내는 조동사 can 뒤에는 동사원형이 오고, 3인칭 단수여도 -s를 붙이지 않아요."},{"q":"You ___ go now. It's already late. (이제 가도 좋아. 벌써 늦었어.)","o":["may to","may","mays","maying","to may"],"a":1,"e":"허가를 나타내는 조동사 may는 뒤에 동사원형이 오며 형태가 변하지 않아요."},{"q":"It ___ rain this afternoon, but I'm not sure. (오후에 비가 올지도 모르지만 확실하지 않아.)","o":["may be","is going","rains","may","will rains"],"a":3,"e":"약한 추측 '~일지도 모른다'는 조동사 may로 나타내고 뒤에 동사원형 rain이 와요."},{"q":"I ___ help you with your homework. (내가 네 숙제를 도와줄게.)","o":["will","will helps","am will","will to","willing"],"a":0,"e":"의지를 나타내는 will 뒤에는 동사원형 help가 오고, will helps처럼 -s를 붙이지 않아요."},{"q":"I can run fast. = I ___ run fast. (나는 빨리 달릴 수 있다.)","o":["can able to","able to","am able","can to","am able to"],"a":4,"e":"조동사 can은 be able to로 바꿔 쓸 수 있으므로 am able to가 알맞아요."},{"q":"When I was five, I ___ not read. (내가 다섯 살이었을 때, 나는 읽지 못했다.)","o":["can","may","could","will","am able"],"a":2,"e":"과거의 능력은 can의 과거형 could로 나타내므로 could not이 알맞아요."},{"q":"___ you pass me the salt, please? (소금 좀 건네주시겠어요?)","o":["May you","Could","Do can","Will can","Are able"],"a":1,"e":"공손한 요청은 Could you ~?로 표현해요."},{"q":"She ___ come to the party. She is too busy. (그녀는 파티에 오지 않을 것이다. 너무 바쁘다.)","o":["willn't","doesn't will","will don't","won't","not will"],"a":3,"e":"will의 부정은 will not이고, 줄이면 won't이에요."},{"q":"He isn't answering the  그 문제를 풀 수 있니?","a":"Can you solve the problem?","h":"Can you ~?","alt":["Are you able to solve the problem?"]},{"k":"나는 어제 너를 도울 수 없었다.","a":"I could not help you yesterday.","h":"could(과거)","alt":["I couldn't help you yesterday."]},{"k":"그녀는 바쁠지도 모른다.","a":"She may be busy.","h":"may be","alt":["She might be busy."]},{"k":"우리는 그 경기에서 이길 것이다.","a":"We will win the game.","h":"will(미래)","alt":["We'll win the game."]},{"k":"창문을 열어 주시겠어요?","a":"Could you open the window?","h":"Could you ~?(공손)","alt":["Can you open the window?"]},{"k":"그들은 그 파티에 오지 않을 것이다.","a":"They will not come to the party.","h":"will not(won't)","alt":["They won't come to the party."]},{"k":"나는 그 노래를 부를 수 있다.","a":"I can sing the song.","h":"can / 동사원형","alt":["I am able to sing the song."]}],"task":{"prompt":"조동사 <b>can</b>, <b>may</b>, <b>will</b>을 사용해 이번 주말에 대한 자신의 계획과 능력을 소개하는 글을 3문장 이상 써 보세요. 세 조동사를 각각 한 번 이상 사용하세요.","sample":"I can play soccer very well. I will practice with my friends this weekend. It may rain, but I will still go to the park.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"can 또는 could를 사용했나요?","regex":"\\b([Cc]an|[Cc]ould)\\b"},{"label":"will 또는 may(might)를 사용했나요?","regex":"\\b([Ww]ill|[Mm]ay|[Mm]ight)\\b"}]},"images":""},{"id":"L2C3U2","title":"must / have to / should","explainParts":[{"t":"must, have to, should는 '의무', '충고', '강한 추측'을 나타내는 조동사예요."},{"k":"must / have to","n":"'~해야 한다'라는 의무를 나타내요. 두 표현 모두 뒤에는 항상 동사원형이 와요. 예: You must study. / You have to study."},{"t":"should는 '~하는 게 좋다, ~해야 한다'라는 충고나 제안을 나타내요. 예: He should rest. (그는 좀 쉬는 게 좋겠어.)"},{"k":"must (강한 추측)","n":"must에는 '~임에 틀림없다'라는 강한 추측의 뜻도 있어요. 예: She must be tired. (그녀는 피곤한 게 틀림없어.)"},{"k":"must not vs don't have to","n":"must not은 '~하면 안 된다'(금지), don't have to는 '~할 필요 없다'(불필요)로 뜻이 완전히 달라요. 헷갈리지 않게 조심하세요."},{"t":"주어가 3인칭 단수일 때 have to는 has to로 바꿔 쓰고, must와 should는 주어에 상관없이 형태가 그대로예요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"You must ___ the rules at school.","o":["follow","follows"," 해 쓰였다.","a":"This story was written by Shakespeare."},{"ko":"그 창문들은 소년에 의해 깨지지 않았다.","a":"The windows were not broken by the boy."},{"ko":"그 도시는 많은 관광객들에게 방문된다.","a":"The city is visited by many tourists."},{"ko":"그 숙제는 그에 의해 끝내졌다.","a":"The homework was finished by him."},{"ko":"이 자동차는 한국에서 만들어진다.","a":"This car is made in Korea."},{"ko":"그 노래들은 아이들에 의해 불린다.","a":"The songs are sung by children."}],"compose":[{"k":"창문이 깨졌다.","a":"The window was broken.","h":"be+p.p. / break→broken","alt":[]},{"k":"이 노래는 많은 사람들에게 사랑받는다.","a":"This song is loved by many.","h":"is+p.p. / by+행위자","alt":["This song is loved by many people."]},{"k":"그 편지는 Tom에 의해 쓰여졌다.","a":"The letter was written by Tom.","h":"was+written / by Tom","alt":[]},{"k":"그 방은 매일 청소된다.","a":"The room is cleaned every day.","h":"is+p.p.","alt":[]},{"k":"이 책들은 학생들에 의해 읽힌다.","a":"These books are read by students.","h":"are+read / 복수 주어","alt":["These books are read by the students."]},{"k":"그 케이크는 어제 만들어졌다.","a":"The cake was made yesterday.","h":"was+made / 과거","alt":[]},{"k":"그 다리는 1990년에 지어졌다.","a":"The bridge was built in 1990.","h":"was+built","alt":[]},{"k":"이 그림은 유명한 화가에 의해 그려졌다.","a":"This picture was painted by a famous artist.","h":"was+painted / by","alt":[]},{"k":"그 문은 경비원에 의해 잠겼다.","a":"The door was locked by the guard.","h":"was+locked / by","alt":[]},{"k":"이 이야기는 셰익스피어에 의해 쓰였다.","a":"This story was written by Shakespeare.","h":"was written / by","alt":[]},{"k":"그 창문들은 소년에 의해 깨지지 않았다.","a":"The windows were not broken by the boy.","h":"were not+p.p. / 부정","alt":["The windows weren't broken by the boy."]},{"k":"그 도시는 많은 관광객들에게 방문된다.","a":"The city is visited by many tourists.","h":"is+visited","alt":[]},{"k":"그 숙제는 그에 의해 끝내졌다.","a":"The homework was finished by him.","h":"was+finished / by him","alt":[]},{"k":"이 자동차는 한국에서 만들어진다.","a":"This car is made in Korea.","h":"is+made","alt":[]},{"k":"그 노래들은 아이들에 의해 불린다.","a":"The songs are sung by children.","h":"are+sung / sing→sung","alt":["The songs are sung by the children."]}],"task":{"prompt":"<b>수동태(be동사+과거분사)</b>를 사용하여 여러분 주변에서 '~되다/당하다'로 표현할 수 있는 일을 영어로 <b>3문장 이상</b> 써 보세요. 그중 최소 한 문장에는 <b>by+행위자</b>를 포함하세요.","sample":"This book was written by a famous author. The classroom is cleaned every day. Many songs are loved by young people.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"수동태(be동사+과거분사) 사용","regex":"\\b(is|are|was|were|am)\\s+\\w+(ed|en)\\b"},{"label":"by+행위자 포함","regex":"\\bby\\s+\\w+"}]},"images":""},{"id":"L2C4U2","title":"수동태의 여러 가지 형태","explainParts":[{"t":"수동태는 「be동사 + 과거분사(p.p.)」로 '~되다, ~당하다'라는 뜻을 나타내요. 이때 be동사의 형태를 바꾸면 여러 가지 시제를 표현할 수 있어요."},{"k":"시제별 수동태","n":"현재는 「am/is/are + p.p.」, 과거는 「was/were + p.p.」, 미래는 「will be + p.p.」, 완료는 「have/has been + p.p.」로 나타내요. 예: It will be done.(끝날 것이다) / It has been finished.(끝났다)"},{"t":"조동사가 들어간 문장을 수동태로 바꿀 때는 「조동사 + be + p.p.」 형태로 써요. 조동사 뒤에는 시제와 관계없이 항상 동사원형 be를 써야 해요."},{"k":"조동사 수동태","n":"can, must, should 등의 조동사 뒤에 「be + p.p.」를 써요. 예: It can be seen.(그것은 보일 수 있다) / The rule must be kept.(그 규칙은 지켜져야 한다)"},{"t":"부정문은 be동사(또는 조동사) 바로 뒤에 not을 붙이고, 의문문은 be동사(또는 조동사)를 주어 앞으로 보내요."},{"k":"부정·의문 수동태","n":"부정문: It is not made here. / 의문문: Is it made here? / 완료 수동태의 부정과 의문은 has not been p.p., Has it been p.p.? 형태로 써요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"The room ___ cleaned every day.","o":["is","are","was","be","been"],"a":0,"e":"단수 주어이고 현재 반복되는 일이므로 is cleaned가 알맞다."},{"q":"The letter ___ written yesterday.","o":["is","was","were","are","be"],"a":1,"e":"yesterday로 과거이고 단수 주어이므로 was written이 알맞다."},{"q":"The work will ___ done tomorrow.","o":["was","is","be","been","being"],"a":2,"e":"미래 수동태는 「will be + p.p.」이므로 will be done이 알맞다."},{"q":"The stars can ___ seen at night.","o":["is","be","are","been","being"],"a":1,"e":"조동사 뒤에는 「be + p.p.」를 쓰므로 can be seen이 알맞다."},{"q":"The project has ___ finished.","o":["be","been","being","was","is"],"a":1,"e":"현재완료 수동태는 「have/has been + p.p.」이므로 has been finished가 알맞다."},{"q":"This book ___ writt   I need something ___.","o":["to write","writing","to write on","write","to write with"],"a":4,"e":"write with는 '~을 가지고 쓰다'로 도구(펜)를 나타내므로 something to write with가 맞다."}],"arrange":[{"ko":"나는 해야 할 일이 있다.","a":"I have work to do."},{"ko":"나는 마실 물이 좀 필요하다.","a":"I need some water to drink."},{"ko":"우리는 먹을 것이 좀 있다.","a":"We have something to eat."},{"ko":"그녀는 읽을 책이 몇 권 있다.","a":"She has some books to read."},{"ko":"지금은 잘 시간이다.","a":"It is time to go to bed."},{"ko":"나는 함께 놀 친구가 없다.","a":"I have no friend to play with."},{"ko":"우리는 앉을 의자가 필요하다.","a":"We need a chair to sit on."},{"ko":"저는 차가운 마실 것을 원해요.","a":"I want something cold to drink."},{"ko":"그는 나를 도와줄 친구들이 많다.","a":"He has many friends to help him."},{"ko":"그녀는 여행할 계획이 있다.","a":"She has a plan to travel."},{"ko":"나는 쓸 것이 필요하다.","a":"I need something to write with."},{"ko":"그들은 살 집이 있다.","a":"They have a house to live in."},{"ko":"나는 만날 친구가 있다.","a":"I have a friend to meet."},{"ko":"마실 것 좀 주세요.","a":"Please give me something to drink."},{"ko":"그는 할 숙제가 많다.","a":"He has a lot of homework to do."}],"compose":[{"k":"나는 해야 할 일이 있다.","a":"I have work to do.","h":"work to do / to+동사원형","alt":["I have some work to do."]},{"k":"우리는 먹을 것이 좀 있다.","a":"We have something to eat.","h":"something to eat","alt":["We have some food to eat."]},{"k":"나는 마실 물이 필요하다.","a":"I need water to drink.","h":"water to drink","alt":["I need some water to drink."]},{"k":"그녀는 읽을 책이 있다.","a":"She has a book to read.","h":"book to read","alt":["She has books to read.","She has some books to read."]},{"k":"우리는 앉을 의자가 필요하다.","a":"We need a chair to sit on.","h":"sit on / 전치사 on","alt":["We need chairs to sit on."]},{"k":"나는 함께 놀 친구가 없다.","a":"I have no friend to play with.","h":"play with / 전치사 with","alt":["I don't have a friend to play with."]},{"k":"저는 차가운 마실 것을 원해요.","a":"I want something cold to drink.","h":"-thing+형용사+to","alt":["I want something cold to drink, please."]},{"k":"그는 나를 도와줄 친구들이 많다.","a":"He has many friends to help him.","h":"friends to help","alt":["He has a lot of friends to help him."]},{"k":"그녀는 여행할 계획이 있다.","a":"She has a plan to travel.","h":"plan to travel","alt":["She has plans to travel."]},{"k":"그들은 살 집이 있다.","a":"They have a house to live in.","h":"live in / 전치사 in","alt":["They have a house to live in now."]},{"k":"나는 쓸 것(펜)이 필요하다.","a":"I need something to write with.","h":"write with / 도구 with","alt":["I need a pen to write with."]},{"k":"지금은 잘 시간이다.","a":"It is time to go to bed.","h":"time to+동사","alt":["It's time to go to bed."]},{"k":"그는 할 숙제가 많다.","a":"He has a lot of homework to do.","h":"homework to do","alt":["He has much homework to do."]},{"k":"나는 만날 친구가 있다.","a":"I have a friend to meet.","h":"friend to meet","alt":["I have friends to meet."]},{"k":"마실 것 좀 주세요.","a":"Please give me something to drink.","h":"something to drink","alt":["Give me something to drink, please."]}],"task":{"prompt":"여러분의 하루를 떠올리며, <b>to부정사의 형용사적 용법</b>을 사용해 '~할 명사'를 나타내는 영어 문장을 <b>3문장 이상</b> 써 보세요. (예: work to do, something to eat, water to drink)","sample":"I have a lot of work to do today. I also need some water to drink. After that, I want something to eat.","conds":[{"label":"3문장 이상 썼어요","minSentences":3},{"label":"to부정사(to+동사원형)를 사용했어요","regex":"[Tt]o\\s+[a-z]+"},{"label":"명사를 꾸미는 형태(예: something to ~, work to ~)를 사용했어요","regex":"(something|anything|nothing|water|work|book|books|friend|friends|time|homework|food|place|chair|house)\\s+(cold\\s+|hot\\s+|nice\\s+)?to\\s+[a-z]+"}]},"images":""},{"id":"L2C5U3","title":"to부정사의 부사적 쓰임","explainParts":[{"t":"to부정사(to+동사원형)는 문장에서 부사처럼 쓰여 동사나 형용사를 꾸며 줄 수 있어요. 크게 세 가지 의미로 쓰여요."},{"k":"목적","n":"'~하기 위해'라는 뜻으로 행동의 목적을 나타내요. 예: I went to see him. (나는 그를 보러 갔다) 의미를 강조할 때는 in order to를 쓰기도 해요."},{"t":"위 문장에서 to see는 '보기 위해'라는 목적을 나타내며 앞의 동사 went를 꾸며 줘요."},{"k":"감정의 원인","n":"glad, happy, sad, surprised 같은 감정 형용사 뒤에 to부정사를 써서 '~해서'라는 감정의 원인을 나타내요. 예: I am glad to meet you. (나는 너를 만나서 기쁘다)"},{"t":"마지막으로 '(그 결과) ~하게 되다'처럼 어떤 행동의 결과를 나타내기도 해요."},{"k":" 차는 너무 뜨거워서 지금 마실 수 없다.","a":"This tea is too hot to drink now."},{"ko":"그는 버스를 잡을 만큼 빨리 달렸다.","a":"He ran fast enough to catch the bus."},{"ko":"계란 하나를 삶는 데 십 분이 걸린다.","a":"It takes ten minutes to boil an egg."},{"ko":"선생님은 우리에게 조용히 하라고 말씀하셨다.","a":"The teacher told us to be quiet."},{"ko":"그 아이는 너무 어려서 혼자 학교에 갈 수 없다.","a":"The child is too young to go to school alone."},{"ko":"나는 네가 일찍 오기를 원한다.","a":"I want you to come early."},{"ko":"그 문제를 푸는 데 한 시간이 걸렸다.","a":"It took an hour to solve the problem."}],"compose":[{"k":"나는 너무 어려서 그 영화를 볼 수 없다.","a":"I am too young to watch the movie.","h":"too ~ to / 어린 young","alt":["I'm too young to watch the movie."]},{"k":"그는 그 시험에 통과할 만큼 똑똑하다.","a":"He is smart enough to pass the test.","h":"~ enough to","alt":["He is clever enough to pass the test."]},{"k":"그 커피는 너무 뜨거워서 마실 수 없다.","a":"The coffee is too hot to drink.","h":"too ~ to","alt":["This coffee is too hot to drink."]},{"k":"아빠는 나에게 일찍 자라고 말씀하셨다.","a":"My dad told me to go to bed early.","h":"tell+O+to / 과거 told","alt":["My father told me to go to bed early."]},{"k":"학교에 가는 데 삼십 분이 걸린다.","a":"It takes thirty minutes to get to school.","h":"it takes+시간+to","alt":["It takes 30 minutes to get to school."]},{"k":"나는 네가 진실을 말하기를 원한다.","a":"I want you to tell the truth.","h":"want+O+to","alt":["I want you to tell me the truth."]},{"k":"그녀는 나에게 조용히 해 달라고 부탁했다.","a":"She asked me to be quiet.","h":"ask+O+to","alt":["She asked me to keep quiet."]},{"k":"그 상자는 그것을 담을 만큼 충분히 크다.","a":"The box is big enough to hold it.","h":"~ enough to","alt":["This box is big enough to hold it."]},{"k":"그는 너무 화가 나서 말을 할 수 없었다.","a":"He was too angry to speak.","h":"too ~ to / 과거 was","alt":["He was too angry to talk."]},{"k":"그 소년은 축구를 할 만큼 나이가 들었다.","a":"The boy is old enough to play soccer.","h":"~ enough to","alt":["The boy is old enough to play football."]},{"k":"그 산을 오르는 데 세 시간이 걸렸다.","a":"It took three hours to climb the mountain.","h":"it took+시간+to / 과거","alt":["It took 3 hours to climb the mountain."]},{"k":"의사는 나에게 물을 많이 마시라고 말했다.","a":"The doctor told me to drink a lot of water.","h":"tell+O+to","alt":["The doctor told me to drink lots of water."]},{"k":"나는 너무 바빠서 너를 도울 수 없다.","a":"I am too busy to help you.","h":"too ~ to","alt":["I'm too busy to help you."]},{"k":"우리는 그가 회의에 오기를 원한다.","a":"We want him to come to the meeting.","h":"want+O+to","alt":["We want him to attend the meeting."]},{"k":"그 편지를 쓰는 데 한 시간이 걸린다.","a":"It takes an hour to write the letter.","h":"it takes+시간+to","alt":["It takes one hour to write the letter."]}],"task":{"prompt":"여러분의 하루 일과나 계획에 대해 <b>to부정사 구문</b>을 사용하여 영어로 3문장 이상 쓰세요. <b>too ~ to</b>, <b>enough to</b>, <b>동사+목적어+to부정사(want/ask/tell)</b>, <b>it takes+시간+to</b> 중 여러 구문을 활용해 보세요.","sample":"It takes thirty minutes to get to my school. In the morning, I am sometimes too sleepy to eat breakfast. My mom always tells me to hurry up.","conds":[{"label":"세 문장 이상 썼나요?","minSentences":3},{"label":"too ~ to 또는 enough to 구문을 사용했나요?","regex":"(too\\s+\\w+\\s+to\\s+\\w+|enough\\s+to\\s+\\w+)"},{"label":"「it takes+시간+to」 또는 「동사+목적어+to부정사」 구문을 사용했나요?","regex":"([Ii]t\\s+(takes?|took)\\s+.*to\\s+\\w+|(want|ask|tell|told|asked|wanted|wants)\\s+\\w+\\s+to\\s+\\w+)"}]},"images":""},{"id":"L2C6U1","title":"명사로 쓰이는 동명사","explainParts":[{"t":"동사에 -ing를 붙이면 '~하기, ~하는 것'이라는 뜻의 "},{"k":"동명사","n":"「동사원형+-ing」 형태로 '~하기, ~하는 것'을 뜻하며, 명사처럼 쓰여요. 예: swim → swimming(수영하기), read → reading(읽기)"},{"t":"이 만들어집니다. 동명사는 명사처럼 쓰이므로 문장에서 "},{"k":"주어·목적어·보어","n":"주어: Reading is fun.(읽기는 재미있다) / 목적어: I enjoy swimming.(나는 수영을 즐긴다) / 보어: My hobby is cooking.(내 취미는 요리다). 동명사 주어는 단수 취급하여 is/was를 써요."},{"t":" 자리에 모두 올 수 있어요. 특히 "},{"k":"enjoy·finish·mind·keep","n":"이 동사들은 목적어로 to부정사가 아니라 동명사(-ing)만 취해요. enjoy/finish/mind/keep + -ing. 예: She finished doing her homework. Do you mind opening the window?"},{"t":" 뒤에는 반드시 동명사(-ing)를 써야 한다는 점을 꼭 기억하세요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"동사 swim의 동명사 형태로 알맞은 것은?","o":["swimming","swim","to swim","swam","swims"],"a":0,"e":"동명사는 동사원형에 -ing를 붙여 만드므로 swimming이 맞아요."},{"q":"___ is my favorite hobby. (요리하기)","o":["Cooks","Cooking","Cook","Cooked","To cook"],"a":1,"e":"주어 자리에 '요리하기'는 동명사 Cooking을 써요."},{"q":"I enjoy ___ soccer with my friends.","o":["play","to play","played","playing","plays"],"a":3,"e":"enjoy는 목적어로 동명사를 취하므로 playing이 맞아요."},{"q":"My hobby is ___ comic books.","o":["read","reads","reading","to read","readed"],"a":2,"e":"보어 자리에 동명사 reading을 써서 '책 읽기'를 나타내요."},{"q":"Do you mind ___ the door?","o":["close","to close","closed","closes","closing"],"a":4,"e":"mind 뒤에는 동명사가 오므로 closing이 맞아요."},{"q":"She finished ___ her homework an hour ago.","o":["do","doing","to do","did","does"],"a":1,"e":"finish는 동명사를 목적어로 취하므로 doing이 맞아요."},{"q":"Keep ___ and you will get better at the piano.","o":["to practice","practice","practices","practicing","practiced"],"a":3,"e":"keep 뒤에는 동명사가 오므로 practicing이 맞아요."},{"q":"___ early is good for your health. (일찍 일어나기)","o":["Waking up","Wake up","Woke up","To wake up","Wakes up"],"a":0,"e":"주어 자리에 동명사 Waking up을 써서 '일찍 일어나기'를 나타내요."},{"q":"밑줄 친 부분을 바르게 고친 것은? I enjoy [[to swim]] in the sea.","o":["swim","swims","swimming","swam","to swim (그대로 둔다)"],"a":2,"e":"enjoy 뒤에는 동명사가 오므로 to swim을 swimming으로 고쳐야 해요."},{"q":"다음 중 어법상 옳은 문장은?","o":["I enjoy to read comic books.","Reading comic books are fun.","My hobby is collect stamps.","She finished cleaning her room.","Do you mind to wait here?"],"a":3,"e":"finish는 동명사를 목적어로 취하므로 'She finished cleaning her room.'만 옳아요."}],"arrange":[{"ko":"읽기는 재미있다.","a":"Reading is fun."},{"ko":"나는 수영하는 것을 즐긴다.","a":"I enjoy swimming."},{"ko":"내 취미는 요리하기이다.","a":"My hobby is cooking."},{"ko":"그녀는 숙제하는 것을 끝냈다.","a":"She finished doing her homework."},{"ko":"창문을 열어 주시겠어요?","a":"Do you mind opening the window?"},{"ko":"계속 연습해라.","a":"Keep practicing."},{"ko":"그는 음악 듣는 것을 즐긴다.","a":"He enjoys listening to music."},{"ko":"일찍 일어나는 것은 건강에 좋다.","a":"Waking up early is good for your health."},{"ko":"나의 꿈은 세계를 여  영어로 3문장 이상 써 보세요. 동명사를 주어, 목적어, 보어 자리에 각각 활용하고, enjoy·finish·mind·keep 중 하나 이상을 사용해 보세요.","sample":"I enjoy reading books every day. My hobby is playing the piano. Swimming is good for my health.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"동명사(동사+ing)를 사용했나요?","regex":"\\b\\w+ing\\b"},{"label":"enjoy, finish, mind, keep 중 하나를 사용했나요?","regex":"\\b(enjoy|enjoys|enjoyed|finish|finished|finishes|mind|minds|keep|keeps|kept)\\b"}]},"images":""},{"id":"L2C6U2","title":"동명사 vs. to부정사","explainParts":[{"t":"동사 뒤에 목적어로 동명사(-ing)를 쓸지 to부정사(to+동사원형)를 쓸지는 앞에 오는 동사에 따라 달라져요."},{"k":"둘 다 가능","n":"like, love, begin, start 같은 동사는 동명사와 to부정사를 모두 목적어로 쓸 수 있고, 의미 차이가 거의 없어요. 예: I like reading = I like to read (나는 읽는 것을 좋아한다)."},{"t":"하지만 어떤 동사는 뒤에 무엇을 쓰느냐에 따라 뜻이 완전히 달라지니 조심해야 해요."},{"k":"의미가 달라지는 동사","n":"remember/forget/stop은 동명사면 '과거에 한 일', to부정사면 '앞으로 할 일'을 뜻해요. 특히 stop -ing는 '~하던 것을 멈추다(끊다)', stop to+동사는 '~하려고 멈추다'예요."},{"t":"예를 들어 stop smoking은 '담배를 끊다', stop to smoke는 '담배를 피우려고 (가던 길을) 멈추다'라는 뜻이에요."},{"k":"전치사 + 동명사","n":"at, in, of, for, about 같은 전치사 뒤에 동사를 쓸 때는 반드시 동명사(-ing)를 써요. 예: good at singing(노래를 잘하는), interested in playing(하는 것에 관심 있는)."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"She is good at ___ .","o":["sing","sang","singing","to sing","sings"],"a":2,"e":"전치사 at 뒤에는 동명사를 쓰므로 singing이 맞아요."},{"q":"They love ___ on weekends.","o":["travels","to travel","traveled","travel","to traveling"],"a":1,"e":"love는 to부정사를 목적어로 쓸 수 있어서 to travel이 맞아요."},{"q":"Don't forget ___ the door when you leave.","o":["locking","locks","lock","to lock","locked"],"a":3,"e":"forget to+동사원형은 '(앞으로) ~할 것을 잊다'이므로 to lock이 맞아요."},{"q":"He stopped ___ because it was bad for his health.","o":["to smoke","smoke","smoking","smoked","smokes"],"a":2,"e":"stop -ing는 '~하던 것을 멈추다(끊다)'이므로 smoking이 맞아요."},{"q":"On the way home, he stopped ___ some water.","o":["buying","bought","buy","to buy","buys"],"a":3,"e":"stop to+동사원형은 '~하려고 멈추다'이므로 to buy가 맞아요."},{"q":"Thank you for ___ me." "alt":["I'm shocked."]},{"k":"그 결과는 실망스럽다.","a":"The result is disappointing.","h":"disappointing","alt":["The results are disappointing."]},{"k":"그들은 실망했다.","a":"They were disappointed.","h":"disappointed / 사람","alt":[]},{"k":"그 콘서트는 놀라웠다.","a":"The concert was amazing.","h":"amazing","alt":[]}],"task":{"prompt":"감정분사를 사용하여 최근에 겪은 일을 <b>3문장</b>으로 써 보세요. 사물·상황을 설명할 때는 <b>-ing 분사</b>를, 감정을 느끼는 사람을 설명할 때는 <b>-ed 분사</b>를 사용하세요.","sample":"The English class was interesting. I was interested in the new words. My friends were excited, too.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"감정분사 -ing(대상)를 사용했나요?","regex":"[Ii]nteresting|[Ee]xciting|[Bb]oring|[Ss]urprising|[Tt]iring|[Ss]hocking|[Dd]isappointing|[Aa]mazing"},{"label":"감정분사 -ed(사람)를 사용했나요?","regex":"[Ii]nterested|[Ee]xcited|[Bb]ored|[Ss]urprised|[Tt]ired|[Ss]hocked|[Dd]isappointed|[Aa]mazed"}]},"images":""},{"id":"L2C8U1","title":"부정대명사 I","explainParts":[{"t":"부정대명사는 정해지지 않은 사람이나 사물을 가리킬 때 써요. 앞에 나온 명사를 대신하죠."},{"k":"one / another / the other","n":"둘 중 하나는 one, 나머지 하나는 the other로 나타내요. 여럿 중 '또 다른 하나'는 another를 써요. 예) One is red, the other is blue."},{"t":"셋 이상을 순서대로 가리킬 때는 one, another, the other처럼 이어서 써요."},{"k":"the others / others","n":"the others는 '정해진 나머지 전부', others는 '(막연한) 다른 것들·다른 사람들'을 뜻해요. 예) Some are boys, and the others are girls."},{"k":"some / any","n":"some은 주로 긍정문에서, any는 부정문·의문문에서 '몇몇·약간'을 대신 가리켜요. 예) Some like it. / I don't have any."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I have two pens. One is black and ___ is blue.","o":["the other","other","another","others","some"],"a":0,"e":"두 개 중 나머지 하나는 the other로 나타내요."},{"q":"I don't like this hat. Please show me ___ one.","o":["other","others","another","the other","the others"],"a":2,"e":"여러 개 중 '또 다른 하나'는 another를 써요."},{"q":"Some students like math, but ___ don't.","o":["others","the other","one","another","other"],"a":0,"e":"막연한 '다른 사람들'은 others로 나타내요."},{"q":"Do you have any pens? No, I don't have ___.","o":["some","any","one","other","another"],"a":1,"e":"부정문에서는 any를 써요."},{"q":"There are three balls. One is red, another is blue, and ___ is green.","o":["other","others","the other","the others","another"],"a":2,"e":"셋 중 마지막 하나는 the other로 가리켜요."},{"q":"Ten students are here. Five are boys and ___ are girls.","o":["others","other","another","the others","one"],"a":3,"e":"정해진 나머지 전부는 the others로 나타내요."},{"q":"A: Are there any eggs? B: Yes, there are ___.","o":["any","some","one","the other","others"],"a":1,"e":"긍정의 대답에서는 some을 써요."},{"q":"밑줄 친 부분을 바르게 고친 것은? I have two dogs. One is white and [[other]] is brown.","o":["other","the other","another","others","the others"],"a":1,"e":"두 마리 중 나머지 하나이므로 the other로 고쳐야 해요."},{"q":"I don't like these shoes. Can you show me ___?","o":["another","the other","others","the others","some"],"a":2,"e":"막연한 '다른 것들'은 복수형 others로 나타내요."},{"q":"There are five books on the desk. I've read two of them, and I'll read ___ later.","o":["others","other","another","the others","any"],"a":3,"e":"정해진 집합에서 나머지 전부는 the others로 나타내요."}],"arrange":[{"ko":"하나는 빨간색이고, 다른 하나는 파란색이다.","a":"One is red, the other is blue."},{"ko":"몇몇은 그것을 좋아한다.","a":"Some like it."},{"ko":"나는 다른 것을 하나 원한다.","a":"I want another one."},{"ko":"학생 중 몇몇은 소년이고, 나머지는 소녀이다.","a":"Some of the students are boys, and the others are girls."},{"ko":"나는 펜이 하나도 없다.","a":"I don't have any pens."},{"ko":"어떤 사람들은 커피를 좋아하고, 다른 사람들은 차를 좋아한다.","a":"Some people like coffee, and others like tea."},{"ko":"하나는 내 것이고, 다른 하나는 그의 것이다.","a":"One is mine, and the other is his."},{"ko":"너는 사과가 좀 있니?","a":"Do you have any apples?"},{"ko":"하나는 빨간색, 또 다른 하나는 파란색, 나머지 하나는 초록색이다.","a":"One is red, another is blue, and the other is green."},{"ko":"나에게 다른 것을 보여 줄 수 있니?","a":"Can you show me another one?"},{"ko":"나는 쿠키가 조금 있다.","a":"I have some cookies."},{"ko":"나머지 사람들은 집에 갔다.","a":"The others went home."},{"ko":"어떤 것들은 크고, 다른 것들은 작다.","a":"Some are big, and others are small."},{"ko":"그녀는 물을 조금 원한다.","a":"She wants some
