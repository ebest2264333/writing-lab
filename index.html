 <b>what</b>을 사용하여 소개하는 글을 3문장 이상 영어로 쓰세요.","sample":"I have a friend whose smile is always bright. What I like most about her is her kindness. She always shares what she has with me.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"소유격 관계대명사 whose를 사용했나요?","regex":"\\b[Ww]hose\\b"},{"label":"관계대명사 what을 사용했나요?","regex":"\\b[Ww]hat\\b"}]},"images":""},{"id":"L3C1U1","title":"현재완료, 현재완료진행","explainParts":[{"t":"현재완료 have/has p.p.는 과거에 일어난 일이 현재까지 영향을 미치거나 이어질 때 써요."},{"k":"현재완료의 4가지 의미","n":"경험(~한 적 있다), 계속(~해 왔다), 완료(막 ~했다), 결과(~해버렸다)를 나타내요. just, already, yet, ever, never, since, for 같은 표현과 자주 쓰여요."},{"t":"예를 들어 She has just left.는 '그녀는 방금 떠났다'라는 완료의 의미예요."},{"k":"현재완료진행 have/has been -ing","n":"과거에 시작한 동작이 지금도 계속 진행 중임을 강조해요. 주로 for(~동안), since(~이래로)와 함께 써요."},{"t":"예를 들어 I have been waiting for an hour.는 '한 시간째 계속 기다리는 중'이라는 뜻이에요."},{"k":"상태동사 주의","n":"know, like, have(가지다)처럼 상태를 나타내는 동사는 진행형으로 쓰지 않아요. I have known her.(O) / I have been knowing her.(X)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"She has ___ finished her homework. (그녀는 이미 숙제를 끝냈다.)","o":["yet","ago","already","since","will"],"a":2,"e":"긍정문에서 '이미'라는 완료의 의미로는 already를 써요."},{"q":"They ___ lived here for ten years. (그들은 여기서 10년 동안 살았다.)","o":["has","are","were","have","having"],"a":3,"e":"주어 They는 복수라서 현재완료에 have를 쓰고 for와 함께 계속을 나타내요."},{"q":"He ___ to Japan three times. (그는 일본에 세 번 가 본 적이 있다.)","o":["have been","has been","has gone","is","was"],"a":1,"e":"'가 본 적이 있다'는 경험이므로 has been to를 써요. has gone은 '가버려서 없다'는 결과예요."},{"q":"I have been ___ for the bus for twenty minutes. (나는 20분째 버스를 기다리고 있다.)","o":["wait","waited","waiting","to wait","waits"],"a":2,"e":"현재완료진행 have been 다음에는 동사원형-ing가 와요."},{"q":"She has just ___ the room. (그녀는 방금 방을 나갔다.)","o":["leave","leaves","leaving","left","to leave"],"a":3,"e":"현재완료 have/has 다음에는 과거분사가 오므로 leave의 과거분사 left를 써요."},{"q":"We have known each other ___ 2010. (우리는 2010년부터 서로 알고 지냈다.)","o":["for","since","during","from","in"],"a":1,"e":"특정 시점(2010년) 앞에는 '~이래로'를 뜻하는 since를 써요."},{"q":"How long ___ you ___ English? (너는 얼마나 오랫동안 영어를 공부해 왔니?)","o":["has / been studying","have / been studying","do / study","are / studying","have / studying"],"a":1,"e":"지금까지 계속 진행 중인 동작을 물으므로 have been studying이 알맞아요."},{"q":"I have [[been knowing]] her for five years. 밑줄 친 부분을 바르게 고친 것은?","o":["known","been knew","knowing","know","knew"],"a":0,"e":"know는 상태동사라 진행형으로 쓸 수 없으므로 현재완료 have known으로 고쳐요."},{"q":"It ___ since this morning, so the ground is wet. (아침부터 계속 비가 내려서 땅이 젖어 있다.)","o":["has rained","rains","has been raining","is raining","rained"],"a":2,"e":"아침부터 지금까지 계속 진행 중임을 강조하므로 현재완료진행 has been raining을 써요."},{"q":"He ___ his wallet, so he has no money now. (그는 지갑을 잃어버려서 지금 돈이 없다.)","o":["has lost","has been losing","loses","is losing","lost"],"a":0,"e":"과거에 잃어버린 결과가 지금까지 이어지는 '결과'의 현재완료 has lost가 알맞아요."}],"arrange":[{"ko":"나는 한 시간 동안 기다리고 있다.","a":"I have been waiting for an hour."},{"ko":"그녀는 방금 떠났다.","a":"She has just left."},{"ko":"나는 파리에 가 본 적이 있다.","a":"I have been to Paris."},{"ko":"그는 그의 열쇠를 잃어버렸다.","a":"He has lost his key."},{"ko":"우리는 2010년부터 서로 알고 지냈다.","a":"We have known each other since 2010."},{"ko":"비가 아침부터 계속 내리고 있다.","a":"It has been raining since morning."},{"ko":"그들은 여기서 십 년 동안 살았다.","a":"They have lived here for ten years."},{"ko":"너는 얼마나 오랫동안 영어를 공부해 왔니?","a":"How long have you been studying English?"},{"ko":"나는 그 영화를 이미 봤다.","a":"I have already seen the movie."},{"ko":"그녀는 일본에 세 번 가 본 적이 있다.","a":"She has been to Japan three times."},{"ko":"나는 아직 숙제를 끝내지 못했다.","a":"I have not finished my homework yet."},{"ko":"그는 두 시간 동안 축구를 하고 있다.","a":"He has been playing soccer for two hours."},{"ko":"너는 그를 본 적이 있니?","a":"Have you ever seen him?"},{"ko":"나는 5년 동안 그녀를 알고 지냈다.","a":"I have known her for five years."},{"ko":"우리는 막 저녁 식사를 끝냈다.","a":"We have just finished dinner."}],"compose":[{"k":"나는 한 시간 동안 기다리고 있다.","a":"I have been waiting for an hour.","h":"현재완료진행 have been -ing / for an hour","alt":["I've been waiting for an hour."]},{"k":"그녀는 방금 떠났다.","a":"She has just left.","h":"has + p.p. / just","alt":["She's just left."]},{"k":"그들은 3년 동안 서로 알고 지냈다.","a":"They have known each other for three years.","h":"계속 have p.p. / for","alt":["They've known each other for three years."]},{"k":"비가 두 시간째 내리고 있다.","a":"It has been raining for two hours.","h":"have been -ing / for two hours","alt":["It's been raining for two hours."]},{"k":"나는 이미 점심을 먹었다.","a":"I have already eaten lunch.","h":"완료 already / have p.p.","alt":["I've already eaten lunch."]},{"k":"너는 파리에 가 본 적이 있니?","a":"Have you ever been to Paris?","h":"경험 ever / been to","alt":["Have you been to Paris?"]},{"k":"그는 그의 지갑을 잃어버렸다.","a":"He has lost his wallet.","h":"결과 have p.p.","alt":["He's lost his wallet."]},{"k":"우리는 여기서 오랫동안 살아 왔다.","a":"We have lived here for a long time.","h":"계속 for a long time","alt":["We've lived here for a long time."]},{"k":"나는 아직 그 책을 끝내지 못했다.","a":"I have not finished the book yet.","h":"부정 not ~ yet","alt":["I haven't finished the book yet.","I've not finished the book yet."]},{"k":"그녀는 세 시간 동안 공부하고 있다.","a":"She has been studying for three hours.","h":"have been -ing / for","alt":["She's been studying for three hours."]},{"k":"너는 얼마나 오랫동안 그를 알고 지냈니?","a":"How long have you known him?","h":"How long / have p.p.","alt":[]},{"k":"그들은 막 도착했다.","a":"They have just arrived.","h":"just + p.p.","alt":["They've just arrived."]},{"k":"나는 그 소식을 이미 들었다.","a":"I have already heard the news.","h":"완료 already","alt":["I've already heard the news."]},{"k":"그는 다섯 시간 동안 자고 있다.","a":"He has been sleeping for five hours.","h":"have been -ing / for","alt":["He's been sleeping for five hours."]},{"k":"나는 그 영화를 두 번 봤다.","a":"I have seen the movie twice.","h":"경험 have p.p. / twice","alt":["I've seen the movie twice."]}],"task":{"prompt":"자신이 <b>오랫동안 해 온 취미나 활동</b>에 대해, 현재완료(have p.p.)와 현재완료진행(have been -ing)을 모두 사용하여 세 문장으로 써 보세요. <b>기간 표현(for 또는 since)</b>을 반드시 포함하세요.","sample":"I have played the piano since I was seven. I have been practicing hard for three hours every day. I have never given up my dream of becoming a great pianist.","conds":[{"label":"세 문장 이상 썼나요?","minSentences":3},{"label":"현재완료진행(have/has been -ing)을 사용했나요?","regex":"(have|has)\\s+been\\s+\\w+ing"},{"label":"기간 표현(for 또는 since)을 사용했나요?","regex":"\\b(for|since)\\b"}]},"images":""},{"id":"L3C1U2","title":"과거완료","explainParts":[{"t":"과거의 어떤 시점보다 "},{"k":"더 이전에 일어난 일","n":"과거완료 had p.p.는 과거의 특정 시점보다 더 앞선 시점(대과거)에 일어난 일을 나타내며, 보통 '~했었다'로 해석해요. 두 개의 과거 사건 중 먼저 일어난 일에 씁니다."},{"t":"을 나타낼 때 과거완료 "},{"k":"had p.p.","n":"과거완료는 「had + 과거분사(p.p.)」의 형태예요. 주어의 인칭이나 수와 상관없이 항상 had를 쓰고, 뒤에는 반드시 과거분사가 옵니다. (예: had left, had eaten, had gone)"},{"t":"를 써요. 예를 들어 The train "},{"k":"had left before I arrived","n":"내가 도착한 것(과거)보다 기차가 떠난 것이 더 먼저 일어났으므로, 더 먼저 일어난 일에 과거완료 had left를 써요. '내가 도착하기 전에 기차는 이미 떠났었다'라는 뜻으로, 두 과거 사건의 시간 순서를 분명하게 보여 줍니다."},{"t":"처럼 문장 안에서 어느 일이 먼저 일어났는지를 명확히 나타낼 수 있어요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"The train ___ before I arrived at the station.","o":["leaves","has left","had left","leaving","was leave"],"a":2,"e":"내가 도착한 과거 시점보다 기차가 떠난 것이 더 먼저이므로 과거완료 had left를 쓴다."},{"q":"She ___ never seen snow before she moved to Canada.","o":["has","had","have","was","is"],"a":1,"e":"캐나다로 이사 간 과거보다 더 이전의 경험을 나타내므로 had를 쓴다."},{"q":"They had already ___ when we got to the restaurant.","o":["ate","eat","eaten","eating","eats"],"a":2,"e":"had 뒤에는 과거분사가 오므로 eaten을 쓴다."},{"q":"By the time the movie started, we ___ our popcorn.","o":["finish","finished","have finished","had finished","are finishing"],"a":3,"e":"영화가 시작된 과거보다 팝콘을 다 먹은 것이 더 먼저이므로 과거완료를 쓴다."},{"q":"I couldn't get in because I ___ my key at home.","o":["had forgotten","forget","have forgotten","forgetting","forgets"],"a":0,"e":"들어가지 못한 과거보다 열쇠를 두고 온 것이 더 먼저이므로 과거완료를 쓴다."},{"q":"다음 문장에서 밑줄 친 부분을 어법상 바르게 고친 것은? The museum [[has closed]] before we got there.","o":["has closed (그대로 둔다)","had closed","closes","closing","was closed"],"a":1,"e":"우리가 도착한 과거보다 박물관이 문을 닫은 것이 더 먼저이므로 과거완료 had closed로 고쳐야 한다."},{"q":"After he ___ his homework, he went out to play.","o":["finishes","has finished","had finished","finish","finishing"],"a":2,"e":"놀러 나간 과거보다 숙제를 끝낸 것이 더 먼저이므로 과거완료를 쓴다."},{"q":"When I called her, she had already ___ to bed.","o":["go","went","gone","going","goes"],"a":2,"e":"had 뒤에는 과거분사가 오므로 gone을 쓴다."},{"q":"The house looked new, but it ___ built fifty years earlier.","o":["has been","had been","was been","have been","is"],"a":1,"e":"집을 본 과거보다 50년 전에 지어진 것이 더 먼저이므로 과거완료 수동태 had been built를 쓴다."},{"q":"We didn't recognize the town because it ___ so much since our last visit.","o":["changes","changed","has changed","had changed","change"],"a":3,"e":"알아보지 못한 과거보다 마을이 그때까지 변해 있던 것이 더 먼저이므로 과거완료 had changed를 쓴다."}],"arrange":[{"ko":"그 기차는 내가 도착하기 전에 떠났었다.","a":"The train had left before I arrived."},{"ko":"내가 집에 도착했을 때 엄마는 이미 저녁을 요리하셨었다.","a":"When I got home, my mother had already cooked dinner."},{"ko":"그녀는 캐나다로 이사 가기 전에 눈을 본 적이 없었다.","a":"She had never seen snow before she moved to Canada."},{"ko":"우리가 식당에 도착했을 때 그들은 이미 다 먹었었다.","a":"When we arrived at the restaurant, they had already eaten."},{"ko":"나는 열쇠를 집에 두고 와서 안에 들어갈 수 없었다.","a":"I couldn't get in because I had left my key at home."},{"ko":"영화가 시작되기 전에 우리는 팝콘을 다 먹었었다.","a":"We had finished our popcorn before the movie started."},{"ko":"그는 숙제를 끝낸 후에 밖으로 놀러 나갔다.","a":"After he had finished his homework, he went out to play."},{"ko":"내가 그녀에게 전화했을 때 그녀는 이미 잠자리에 들었었다.","a":"When I called her, she had already gone to bed."},{"ko":"그 집은 새것처럼 보였지만 50년 전에 지어졌었다.","a":"The house looked new, but it had been built fifty years earlier."},{"ko":"우리는 그 마을이 너무 많이 변해서 알아보지 못했다.","a":"We didn't recognize the town because it had changed so much."},{"ko":"그가 도착했을 때 회의는 이미 끝나 있었다.","a":"When he arrived, the meeting had already ended."},{"ko":"나는 그 영화를 전에 본 적이 있어서 결말을 알고 있었다.","a":"I knew the ending because I had seen the movie before."},{"ko":"그녀는 늦잠을 잤기 때문에 버스를 놓쳤다.","a":"She missed the bus because she had overslept."},{"ko":"우리가 공항에 도착했을 때 비행기는 이미 이륙했었다.","a":"When we reached the airport, the plane had already taken off."},{"ko":"그는 전에 그곳에 가본 적이 없어서 길을 잃었다.","a":"He got lost because he had never been there before."}],"compose":[{"k":"그 기차는 내가 도착하기 전에 떠났었다.","a":"The train had left before I arrived.","h":"과거완료 had p.p. / before + 과거","alt":["The train had already left before I arrived."]},{"k":"내가 도착했을 때 그들은 이미 떠났었다.","a":"When I arrived, they had already left.","h":"had already p.p.","alt":["They had already left when I arrived."]},{"k":"그는 숙제를 끝낸 후에 잤다.","a":"He went to bed after he had finished his homework.","h":"after + had p.p.","alt":["After he had finished his homework, he went to bed."]},{"k":"나는 그 책을 전에 읽은 적이 있었다.","a":"I had read the book before.","h":"had p.p.","alt":["I had read that book before."]},{"k":"우리가 도착했을 때 영화는 이미 시작했었다.","a":"When we arrived, the movie had already started.","h":"had already started","alt":["The movie had already started when we arrived."]},{"k":"그녀는 열쇠를 잃어버려서 집에 들어갈 수 없었다.","a":"She couldn't enter the house because she had lost her key.","h":"because + had p.p.","alt":["She couldn't get into the house because she had lost her key."]},{"k":"비가 그쳤을 때 우리는 이미 젖어 있었다.","a":"When the rain stopped, we had already gotten wet.","h":"had already p.p.","alt":["When the rain stopped, we had already got wet."]},{"k":"그는 그 도시에 가본 적이 없어서 긴장했다.","a":"He was nervous because he had never been to the city.","h":"had never been","alt":["He felt nervous because he had never been to the city."]},{"k":"내가 그를 만났을 때 그는 이미 저녁을 먹었었다.","a":"When I met him, he had already eaten dinner.","h":"had already eaten","alt":["He had already eaten dinner when I met him."]},{"k":"그 소포는 내가 집에 오기 전에 도착했었다.","a":"The package had arrived before I came home.","h":"had p.p. / before","alt":["The package had arrived before I got home."]},{"k":"그녀는 시험 공부를 열심히 했기 때문에 좋은 점수를 받았다.","a":"She got a good grade because she had studied hard.","h":"because + had p.p.","alt":["She received a good grade because she had studied hard."]},{"k":"우리가 공항에 도착했을 때 비행기는 이미 떠났었다.","a":"When we got to the airport, the plane had already left.","h":"had already left","alt":["The plane had already left when we got to the airport."]},{"k":"그는 전에 그 노래를 들은 적이 있어서 따라 불렀다.","a":"He sang along because he had heard the song before.","h":"had p.p.","alt":["He sang along because he had heard that song before."]},{"k":"내가 도서관에 도착했을 때 그곳은 이미 문을 닫았었다.","a":"When I got to the library, it had already closed.","h":"had already closed","alt":["The library had already closed when I got there."]},{"k":"그들은 이미 저녁을 준비해 두었었다.","a":"They had already prepared dinner.","h":"had already p.p.","alt":["They had prepared dinner already."]}],"task":{"prompt":"여러분이 어제 겪은 일 중에서, 어떤 일이 일어나기 <b>전에 이미 벌어져 있던 일</b>을 과거완료(had p.p.)를 사용해 영어로 3문장 써 보세요.","sample":"When I got to school, the class had already started. I couldn't answer the question because I had not read the textbook. After I had finished my homework, I felt very relaxed.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"과거완료 had p.p.를 사용했나요?","regex":"\\bhad\\b\\s+\\w+"},{"label":"시간 관계를 나타내는 표현(before, after, when, already 등)을 넣었나요?","regex":"\\b(before|after|when|already|by the time)\\b"}]},"images":""},{"id":"L3C2U1","title":"can / may / will (조동사의 기본 쓰임)","explainParts":[{"t":"조동사(can, may, will 등)는 동사 앞에 놓여 능력·허가·추측·미래 같은 의미를 더해 줘요."},{"k":"can","n":"'~할 수 있다'(능력)와 '~해도 된다'(허가)를 나타내요. 과거는 could, 미래나 다른 시제에서는 be able to로 바꿔 써요. 예: I will be able to swim."},{"t":"예: He can swim. (능력) / You can go now. (허가)"},{"k":"may","n":"'~해도 된다'(허가)와 '~일지도 모른다'(약한 추측)를 나타내요. 추측이 더 불확실할 때는 might을 써요."},{"t":"예: It may be true. (추측) / You may leave. (허가)"},{"k":"will","n":"'~할 것이다'(미래·의지)를 나타내요. could나 might은 can·may보다 더 조심스럽거나 불확실한 느낌을 줘요. 예: He could be right."},{"t":"조동사 뒤에는 항상 동사원형이 오고, 주어가 3인칭 단수여도 동사에 -s를 붙이지 않아요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"He can ___ very fast. (그는 매우 빠르게 달릴 수 있다.)","o":["runs","running","run","ran","to run"],"a":2,"e":"조동사 can 뒤에는 동사원형이 오므로 run이 알맞아요."},{"q":"___ I come in? (들어가도 될까요?)","o":["Do","Am","Have","May","Being"],"a":3,"e":"허가를 구할 때는 'May I ~?'를 써요."},{"q":"It ___ be true. (그것은 사실일지도 모른다.)","o":["may","does","is","being","has"],"a":0,"e":"'~일지도 모른다'는 약한 추측이므로 may를 써요."},{"q":"When I was young, I ___ swim well. (어렸을 때 나는 수영을 잘할 수 있었다.)","o":["can","may","will","am able to","could"],"a":4,"e":"과거의 능력은 can의 과거형 could로 나타내요."},{"q":"I will ___ finish it tomorrow. (나는 내일 그것을 끝낼 수 있을 것이다.)","o":["can","could","be able to","able","being able"],"a":2,"e":"미래에는 can을 쓸 수 없어 will be able to로 표현해요."},{"q":"She ___ be at home, but I'm not sure. (그녀는 집에 있을지도 모르지만 확실하진 않다.)","o":["must","might","can","will","shall"],"a":1,"e":"확실하지 않은 약한 추측이므로 might이 알맞아요."},{"q":"He may [[goes]] to the party tonight. 밑줄 친 부분을 바르게 고친 것은?","o":["going","went","goes","go","to go"],"a":3,"e":"조동사 may 뒤에는 동사원형 go가 와야 해요."},{"q":"I'm busy, so I ___ come to your party. (바빠서 파티에 갈 수 없다.)","o":["can","can't","may","could","will"],"a":1,"e":"올 수 없다는 부정이므로 can't이 알맞아요."},{"q":"His idea sounds good; he ___ be right. (그의 생각이 좋아 보인다. 그가 옳을 수도 있다.)","o":["could","must not","doesn't","is","being"],"a":0,"e":"'~일 수도 있다'는 약한 추측이므로 could가 알맞아요."},{"q":"A: ___ I ask you a question? B: Sure, go ahead. (질문 하나 해도 될까요?)","o":["Must","Should","Did","Am","May"],"a":4,"e":"공손하게 허가를 구할 때 'May I ~?'를 써요."}],"arrange":[{"ko":"그는 매우 빠르게 달릴 수 있다.","a":"He can run very fast."},{"ko":"들어가도 될까요?","a":"May I come in?"},{"ko":"그것은 사실일지도 모른다.","a":"It may be true."},{"ko":"그가 옳을 수도 있다.","a":"He could be right."},{"ko":"나는 어렸을 때 수영을 잘할 수 있었다.","a":"When I was young, I could swim well."},{"ko":"내일 비가 올지도 모른다.","a":"It might rain tomorrow."},{"ko":"너는 지금 집에 가도 된다.","a":"You may go home now."},{"ko":"나는 내일 그것을 끝낼 수 있을 것이다.","a":"I will be able to finish it tomorrow."},{"ko":"제 전화기를 써도 됩니다.","a":"You may use my phone."},{"ko":"그녀는 집에 있을지도 모른다.","a":"She may be at home."},{"ko":"나는 그 파티에 갈 수 없다.","a":"I can't go to the party."},{"ko":"우리는 내일 그를 만날 것이다.","a":"We will meet him tomorrow."},{"ko":"그는 피아노를 칠 수 있다.","a":"He can play the piano."},{"ko":"질문 하나 해도 될까요?","a":"May I ask you a question?"},{"ko":"그것은 사실이 아닐지도 모른다.","a":"It may not be true."}],"compose":[{"k":"그는 빠르게 달릴 수 있다.","a":"He can run fast.","h":"can / 능력 / 동사원형","alt":["He is able to run fast."]},{"k":"들어가도 될까요?","a":"May I come in?","h":"may / 허가","alt":["Can I come in?"]},{"k":"그것은 사실일지도 모른다.","a":"It may be true.","h":"may / 추측","alt":["It might be true."]},{"k":"그가 옳을 수도 있다.","a":"He could be right.","h":"could / 약한 추측","alt":["He might be right."]},{"k":"나는 내일 그것을 끝낼 수 있을 것이다.","a":"I will be able to finish it tomorrow.","h":"will be able to / 미래","alt":["I'll be able to finish it tomorrow."]},{"k":"내일 비가 올지도 모른다.","a":"It might rain tomorrow.","h":"might / 추측","alt":["It may rain tomorrow."]},{"k":"너는 지금 가도 된다.","a":"You may go now.","h":"may / 허가","alt":["You can go now."]},{"k":"그녀는 집에 있을지도 모른다.","a":"She may be at home.","h":"may be / 추측","alt":["She might be at home."]},{"k":"나는 그 파티에 갈 수 없다.","a":"I can't go to the party.","h":"cannot / 부정","alt":["I cannot go to the party."]},{"k":"우리는 내일 그를 만날 것이다.","a":"We will meet him tomorrow.","h":"will / 미래","alt":["We'll meet him tomorrow.","We are going to meet him tomorrow."]},{"k":"그는 피아노를 칠 수 있다.","a":"He can play the piano.","h":"can / 능력","alt":["He is able to play the piano."]},{"k":"질문 하나 해도 될까요?","a":"May I ask you a question?","h":"may / 허가","alt":["Can I ask you a question?"]},{"k":"너는 내 전화기를 써도 된다.","a":"You may use my phone.","h":"may / 허가","alt":["You can use my phone."]},{"k":"그것은 사실이 아닐지도 모른다.","a":"It may not be true.","h":"may not / 부정 추측","alt":["It might not be true."]},{"k":"나는 어렸을 때 빨리 달릴 수 있었다.","a":"I could run fast when I was young.","h":"could / 과거 능력","alt":["I was able to run fast when I was young."]}],"task":{"prompt":"<b>이번 주말 계획</b>과 그에 대한 추측을 조동사를 사용하여 3문장 이상 영어로 써 보세요. can, may, will, could, might 중 알맞은 것을 활용하세요.","sample":"This weekend, I will visit my grandmother in the countryside. We may go to the park together if the weather is nice. It could rain in the afternoon, so I will take an umbrella just in case.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"조동사(can/may/will/could/might)를 사용했나요?","regex":"\\b(can|may|will|could|might)\\b"},{"label":"추측을 나타내는 may/might/could를 사용했나요?","regex":"\\b(may|might|could)\\b"}]},"images":""},{"id":"L3C2U2","title":"must / have to / should","explainParts":[{"t":"조동사 must, have to, should는 의무나 충고, 강한 추측을 나타내요. 조동사 뒤에는 항상 동사원형이 와요."},{"k":"must","n":"'~해야 한다'(강한 의무)와 '~임에 틀림없다'(강한 추측) 두 가지 뜻으로 써요. 예: You must be tired.(너 피곤한 게 틀림없어.) / You must go now.(너 지금 가야 해.)"},{"t":"have to도 '~해야 한다'는 의무를 나타내요. 주어가 3인칭 단수이면 has to로 써요."},{"k":"should / ought to","n":"'~하는 게 좋겠다, ~해야 한다'는 충고를 나타내요. ought to는 should와 뜻이 거의 같고, 뒤에 to가 붙어요. 예: She ought to rest.(그녀는 쉬는 게 좋겠어.)"},{"t":"금지를 말할 때는 must not(~해서는 안 된다), 불필요를 말할 때는 don't have to(~할 필요가 없다)를 써서 뜻을 구분해요."},{"k":"had to","n":"must는 과거형이 없어요. 그래서 '~해야 했다'라는 과거의 의무는 had to로 나타내요. 예: I had to walk home.(나는 집까지 걸어가야 했다.)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"You've been working all day. You ___ be tired.","o":["must","are","have","were","being"],"a":0,"e":"'~임에 틀림없다'는 강한 추측은 must be로 나타내요."},{"q":"He ___ to wear a uniform at school.","o":["have","is","has","does","having"],"a":2,"e":"주어가 3인칭 단수이면 have to를 has to로 써요."},{"q":"You look sick. You ___ see a doctor.","o":["would","could","might","shall","should"],"a":4,"e":"충고를 할 때는 '~하는 게 좋겠다'는 뜻의 should를 써요."},{"q":"She is very tired. She ___ to rest.","o":["should","ought","must","has","need"],"a":1,"e":"ought to는 should와 비슷하게 충고를 나타내며 ought to의 형태로 써요."},{"q":"Yesterday I ___ to finish the report on time.","o":["have","has","must","had","having"],"a":3,"e":"must는 과거형이 없어서 과거의 의무는 had to로 나타내요."},{"q":"It's Sunday, so you ___ get up early today.","o":["don't have to","must not","should not","have to","must"],"a":0,"e":"don't have to는 '~할 필요가 없다'는 불필요를 나타내요."},{"q":"You ___ tell lies. It is very wrong.","o":["don't have to","need not","must not","have to","should be"],"a":2,"e":"must not은 '~해서는 안 된다'는 금지를 나타내요."},{"q":"다음 밑줄 친 부분을 바르게 고친 것은? He must [[to finish]] it today.","o":["finishes","finished","finishing","to finishing","finish"],"a":4,"e":"조동사 must 뒤에는 동사원형이 오므로 finish가 맞아요."},{"q":"She missed the bus, so she ___ to walk home.","o":["must","had","has","have","ought"],"a":1,"e":"과거의 의무는 must가 아니라 had to로 나타내요."},{"q":"That man ___ be a famous actor. Everyone is taking his photo.","o":["should","has to","ought to","must","had to"],"a":3,"e":"확신에 찬 강한 추측은 must be로 나타내요."}],"arrange":[{"ko":"너는 피곤한 게 틀림없다.","a":"You must be tired."},{"ko":"그녀는 쉬어야 한다.","a":"She ought to rest."},{"ko":"너는 지금 집에 가야 한다.","a":"You must go home now."},{"ko":"그는 교복을 입어야 한다.","a":"He has to wear a uniform."},{"ko":"우리는 규칙을 따라야 한다.","a":"We must follow the rules."},{"ko":"너는 더 열심히 공부하는 게 좋겠다.","a":"You should study harder."},{"ko":"나는 어제 일찍 일어나야 했다.","a":"I had to get up early yesterday."},{"ko":"그녀는 의사를 만나봐야 한다.","a":"She should see a doctor."},{"ko":"너는 거짓말을 해서는 안 된다.","a":"You must not tell lies."},{"ko":"우리는 서두를 필요가 없다.","a":"We don't have to hurry."},{"ko":"그는 유명한 배우임에 틀림없다.","a":"He must be a famous actor."},{"ko":"너는 손을 씻어야 한다.","a":"You have to wash your hands."},{"ko":"그들은 조용히 해야 한다.","a":"They must be quiet."},{"ko":"나는 버스를 놓쳐서 걸어가야 했다.","a":"I had to walk because I missed the bus."},{"ko":"너는 그 규칙을 기억하는 게 좋겠다.","a":"You ought to remember the rule."}],"compose":[{"k":"너는 피곤한 게 틀림없다.","a":"You must be tired.","h":"must / ~임에 틀림없다","alt":["You must be tired!"]},{"k":"그녀는 쉬어야 한다.","a":"She ought to rest.","h":"ought to / 충고","alt":["She should rest.","She has to rest."]},{"k":"우리는 규칙을 따라야 한다.","a":"We must follow the rules.","h":"must / 동사원형","alt":["We have to follow the rules."]},{"k":"그는 교복을 입어야 한다.","a":"He has to wear a uniform.","h":"has to / 3인칭 단수","alt":["He must wear a uniform."]},{"k":"너는 더 열심히 공부하는 게 좋겠다.","a":"You should study harder.","h":"should / 충고","alt":["You ought to study harder."]},{"k":"나는 어제 일찍 일어나야 했다.","a":"I had to get up early yesterday.","h":"had to / 과거 의무","alt":["Yesterday I had to get up early."]},{"k":"너는 거짓말을 해서는 안 된다.","a":"You must not tell lies.","h":"must not / 금지","alt":["You must not tell a lie."]},{"k":"우리는 서두를 필요가 없다.","a":"We don't have to hurry.","h":"don't have to / 불필요","alt":["We do not have to hurry."]},{"k":"그는 유명한 배우임에 틀림없다.","a":"He must be a famous actor.","h":"must be / 강한 추측","alt":["He must be a famous actor!"]},{"k":"너는 손을 씻어야 한다.","a":"You have to wash your hands.","h":"have to / 의무","alt":["You must wash your hands."]},{"k":"그들은 조용히 해야 한다.","a":"They must be quiet.","h":"must / 의무","alt":["They have to be quiet.","They should be quiet."]},{"k":"나는 버스를 놓쳐서 걸어가야 했다.","a":"I had to walk because I missed the bus.","h":"had to / 과거 의무","alt":["I had to walk since I missed the bus."]},{"k":"너는 그 규칙을 기억하는 게 좋겠다.","a":"You ought to remember the rule.","h":"ought to / 충고","alt":["You should remember the rule."]},{"k":"그녀는 의사를 만나봐야 한다.","a":"She should see a doctor.","h":"should / 충고","alt":["She ought to see a doctor.","She has to see a doctor."]},{"k":"너는 지금 집에 가야 한다.","a":"You must go home now.","h":"must / 의무","alt":["You have to go home now."]}],"task":{"prompt":"여러분이 지켜야 할 <b>학교 규칙이나 생활 습관</b>에 대해 must, have to, should를 사용하여 영어로 3문장 이상 써 보세요.","sample":"We must wear a uniform at school. You should not run in the hallway. Students have to arrive before eight o'clock.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"must, have to, should(ought to, had to) 중 하나 이상을 사용했나요?","regex":"\\b(must|have to|has to|should|ought to|had to)\\b"},{"label":"조동사 뒤에 동사원형을 바르게 썼나요?","regex":"\\b(must|should)\\s+(not\\s+)?[a-z]+"}]},"images":""},{"id":"L3C2U3","title":"had better / used to / would","explainParts":[{"t":"이번 Unit에서는 충고, 과거의 습관·상태, 과거에 반복된 동작을 나타내는 표현을 배워요."},{"k":"had better","n":"'~하는 게 좋겠다'라는 충고·경고를 나타내요. 뒤에는 동사원형이 오고, 부정은 had better not으로 써요. 회화에서는 줄여서 'd better로도 써요. 예: You had better rest.(너는 쉬는 게 좋겠다.)"},{"k":"used to","n":"'예전에 ~했다 / ~였다'라는 과거의 습관이나 상태를 나타내요. 지금은 그렇지 않다는 뜻을 담고 있어요. 「used to + 동사원형」으로 쓰며, 동작뿐 아니라 상태에도 쓸 수 있어요. 예: I used to live there.(나는 예전에 그곳에 살았다.)"},{"k":"would","n":"'~하곤 했다'라는 과거에 반복된 동작을 나타내요. 동작에만 쓰고 상태에는 쓸 수 없어서 be, live 같은 상태 표현과는 어울리지 않아요. 예: He would often visit us.(그는 자주 우리를 방문하곤 했다.)"},{"t":"과거의 상태는 used to로만, 반복된 동작은 used to와 would 둘 다로 나타낼 수 있다는 점을 꼭 기억하세요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"You look sick. You ___ go home and rest.","o":["had better","used to","would rather not","are used to","would have"],"a":0,"e":"충고를 나타낼 때는 '~하는 게 좋겠다'라는 뜻의 had better를 쓴다."},{"q":"When I was a child, I ___ be afraid of dogs.","o":["would","had better","used to","am used to","use to"],"a":2,"e":"지금과 다른 과거의 상태는 used to로 나타내며, would는 상태에 쓸 수 없다."},{"q":"Every summer, we ___ go to the beach together.","o":["had better","would","used","have used","are used to"],"a":1,"e":"과거에 반복된 동작은 '~하곤 했다'라는 뜻의 would로 나타낼 수 있다."},{"q":"You ___ tell a lie to your parents.","o":["had better not","had not better","used not to","would not","not had better"],"a":0,"e":"had better의 부정은 had better not이며 not은 better 뒤에 온다."},{"q":"There ___ a bakery on this corner, but it closed last year.","o":["would be","had better be","used to be","would have been","is used to be"],"a":2,"e":"지금은 없는 과거의 상태는 used to be로 나타낸다."},{"q":"You [[had better]] hurry, or you'll miss the bus. 밑줄 친 부분의 의미로 알맞은 것은?","o":["서두르는 게 좋겠다","서두르곤 했다","서두른 적이 있다","서두르고 싶다","서두를 것이다"],"a":0,"e":"had better는 '~하는 게 좋겠다'라는 충고·경고의 의미이다."},{"q":"I ___ smoke, but I quit five years ago.","o":["would rather","used to","had better","am used to","would better"],"a":1,"e":"지금은 하지 않는 과거의 습관은 used to로 나타낸다."},{"q":"My grandfather ___ tell us interesting stories every night.","o":["had better","is used to","used","would","would better"],"a":3,"e":"과거에 반복된 동작은 would로 나타낼 수 있다."},{"q":"He ___ play the piano when he was young. 빈칸에 들어갈 말로 알맞지 않은 것은?","o":["used to","would","would often","had better","would sometimes"],"a":3,"e":"과거 반복 동작에는 used to와 would를 쓸 수 있지만 충고를 뜻하는 had better는 어색하다."},{"q":"This building ___ a school, but now it is a museum.","o":["would","would often","had better","used to be","would be"],"a":3,"e":"지금과 다른 과거의 상태는 used to be로만 나타내며 would는 상태를 나타낼 수 없다."}],"arrange":[{"ko":"너는 지금 자는 게 좋겠다.","a":"You had better sleep now."},{"ko":"나는 예전에 그곳에 살았다.","a":"I used to live there."},{"ko":"그는 자주 우리를 방문하곤 했다.","a":"He would often visit us."},{"ko":"너는 거짓말하지 않는 게 좋겠다.","a":"You had better not tell a lie."},{"ko":"여기에 큰 나무가 한 그루 있었다.","a":"There used to be a big tree here."},{"ko":"우리는 방과 후에 축구를 하곤 했다.","a":"We would play soccer after school."},{"ko":"너는 서두르는 게 좋겠다.","a":"You had better hurry."},{"ko":"나는 예전에 안경을 썼다.","a":"I used to wear glasses."},{"ko":"그녀는 매일 아침 일찍 일어나곤 했다.","a":"She would get up early every morning."},{"ko":"너는 그를 믿지 않는 게 좋겠다.","a":"You had better not trust him."},{"ko":"이 근처에 극장이 하나 있었다.","a":"There used to be a theater near here."},{"ko":"내 할아버지는 우리에게 이야기를 들려주곤 하셨다.","a":"My grandfather would tell us stories."},{"ko":"너는 의사에게 진찰을 받는 게 좋겠다.","a":"You had better see a doctor."},{"ko":"나는 예전에 축구를 아주 좋아했다.","a":"I used to love soccer."},{"ko":"우리는 여름마다 바다에 가곤 했다.","a":"We would go to the sea every summer."}],"compose":[{"k":"너는 지금 자는 게 좋겠다.","a":"You had better sleep now.","h":"had better / 충고","alt":["You'd better sleep now."]},{"k":"나는 예전에 그곳에 살았다.","a":"I used to live there.","h":"used to / 과거 상태","alt":[]},{"k":"그는 자주 우리를 방문하곤 했다.","a":"He would often visit us.","h":"would / 반복","alt":["He used to visit us often."]},{"k":"너는 거짓말하지 않는 게 좋겠다.","a":"You had better not tell a lie.","h":"had better not","alt":["You'd better not tell a lie.","You had better not lie."]},{"k":"여기에 큰 나무가 한 그루 있었다.","a":"There used to be a big tree here.","h":"used to be / 과거 상태","alt":[]},{"k":"그녀는 매일 일찍 일어나곤 했다.","a":"She would get up early every day.","h":"would / 반복","alt":["She used to get up early every day."]},{"k":"너는 서두르는 게 좋겠다.","a":"You had better hurry.","h":"had better","alt":["You'd better hurry."]},{"k":"나는 예전에 안경을 썼다.","a":"I used to wear glasses.","h":"used to / 과거 습관","alt":[]},{"k":"우리는 방과 후에 농구를 하곤 했다.","a":"We would play basketball after school.","h":"would / 반복","alt":["We used to play basketball after school."]},{"k":"너는 그 소식을 그에게 말하지 않는 게 좋겠다.","a":"You had better not tell him the news.","h":"had better not","alt":["You'd better not tell him the news."]},{"k":"이 자리에 빵집이 하나 있었다.","a":"There used to be a bakery here.","h":"used to be / 과거 상태","alt":[]},{"k":"내 할아버지는 우리에게 이야기를 들려주곤 하셨다.","a":"My grandfather would tell us stories.","h":"would / 반복","alt":["My grandfather used to tell us stories."]},{"k":"너는 의사에게 진찰을 받는 게 좋겠다.","a":"You had better see a doctor.","h":"had better","alt":["You'd better see a doctor."]},{"k":"나는 예전에 이 노래를 아주 좋아했다.","a":"I used to love this song.","h":"used to / 과거 상태","alt":[]},{"k":"우리는 여름마다 바다에 가곤 했다.","a":"We would go to the sea every summer.","h":"would / 반복","alt":["We used to go to the sea every summer."]}],"task":{"prompt":"여러분의 어린 시절을 떠올려 보세요. 지금은 하지 않지만 예전에 하던 일과, 친구에게 해 주고 싶은 충고를 영어로 써 보세요. <b>had better</b>, <b>used to</b>, <b>would</b>를 각각 한 번 이상 사용하세요.","sample":"When I was young, I used to be very shy. Every weekend, I would play outside with my friends. If you feel nervous, you had better take a deep breath.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"used to 또는 would를 사용했나요?","regex":"(used to|would)"},{"label":"had better를 사용했나요?","regex":"had better"}]},"images":""},{"id":"L3C2U4","title":"조동사 + have p.p.","explainParts":[{"t":"‘조동사 + have p.p.’는 지금이 아니라 과거의 일에 대한 추측이나 후회를 나타내요. 형태는 항상 ‘조동사 + have + 과거분사(p.p.)’예요."},{"k":"must have p.p.","n":"‘~했음에 틀림없다’라는 뜻으로, 과거의 일에 대한 강한 확신·추측을 나타내요. 예: He must have left. (그는 떠났음에 틀림없다.) 반대로 ‘~했을 리가 없다’라고 강하게 부정할 때는 can't have p.p.를 써요."},{"k":"should have p.p.","n":"‘~했어야 했는데 (실제로는 안 했다)’라는 뜻으로, 하지 않은 과거의 일에 대한 후회나 유감을 나타내요. 예: You should have studied. (너는 공부했어야 했는데.) 부정형 shouldn't have p.p.는 ‘~하지 말았어야 했는데’라는 뜻이에요."},{"k":"could/might have p.p.","n":"‘~했을 수도 있었다 / ~했을지도 모른다’라는 뜻으로, 과거에 대한 약한 추측이나 실현되지 않은 가능성을 나타내요. 예: It might have rained. (비가 왔을지도 모른다.)"},{"t":"주어의 인칭·수에 상관없이 have는 항상 그대로 쓰고, have 뒤에는 반드시 과거분사(p.p.)가 와야 해요. (has나 과거형·원형을 쓰면 안 돼요.)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"He looks very tired. He ___ hard all day.","o":["must have worked","must work","must have work","must has worked","must be worked"],"a":0,"e":"‘~했음에 틀림없다’는 must have p.p.이고 work의 과거분사는 worked예요."},{"q":"I failed the test. I ___ harder.","o":["should study","should studied","should have study","should have studied","should be studied"],"a":3,"e":"‘~했어야 했는데’라는 후회는 should have p.p.로 나타내요."},{"q":"The ground is wet. It ___ last night.","o":["might rain","might have rained","might have rain","might rained","might has rained"],"a":1,"e":"‘~했을지도 모른다’라는 약한 추측은 might have p.p.로 표현해요."},{"q":"You should have [[came]] to the party. 밑줄 친 부분을 바르게 고친 것은?","o":["come","come to","coming","been come","did come"],"a":0,"e":"have 다음에는 과거분사가 와야 하므로 come의 과거분사인 come이 맞아요."},{"q":"She never replied to me. She ___ my message.","o":["must have seen","must not see","must not seen","must have saw","must not have seen"],"a":4,"e":"답장을 안 한 걸로 보아 ‘못 봤음에 틀림없다’이므로 must not have seen이 알맞아요."},{"q":"I didn't call you back. I'm sorry. I ___ you earlier.","o":["should call","should have called","should have call","must have called","can have called"],"a":1,"e":"미안하다는 후회의 맥락이므로 ‘전화했어야 했는데’ should have called가 알맞아요."},{"q":"He got a perfect score. He ___ the answers.","o":["must know","should have known","must have known","might have known","can't have known"],"a":2,"e":"만점을 받았으니 ‘답을 알았음에 틀림없다’ must have known이 자연스러워요."},{"q":"She was at home all day, so she ___ the crime.","o":["must have committed","should have committed","might have committed","can't have committed","must not committing"],"a":3,"e":"하루 종일 집에 있었으니 ‘저질렀을 리가 없다’ can't have committed가 알맞아요."},{"q":"We missed the train and now we are late. We ___ the earlier one.","o":["must have taken","could have took","should have take","might have taken","should have taken"],"a":4,"e":"지금 늦었으니 ‘더 일찍 기차를 탔어야 했는데’라는 후회로 should have taken이 맞아요."},{"q":"You were lucky. You ___ badly hurt in that crash, but you weren't.","o":["must have been","should have been","can't have been","could be","could have been"],"a":4,"e":"‘~했을 뻔했다/했을 수도 있었다’는 could have p.p.이고 be의 과거분사 been을 써요."}],"arrange":[{"ko":"그는 그 시험에 합격했음에 틀림없다.","a":"He must have passed the exam."},{"ko":"너는 더 일찍 잤어야 했는데.","a":"You should have gone to bed earlier."},{"ko":"그녀는 열쇠를 잃어버렸을지도 모른다.","a":"She might have lost her key."},{"ko":"우리는 그 버스를 탈 수도 있었다.","a":"We could have taken the bus."},{"ko":"그들은 진실을 알았음에 틀림없다.","a":"They must have known the truth."},{"ko":"나는 너에게 전화했어야 했는데.","a":"I should have called you."},{"ko":"그가 그것을 훔쳤을 리가 없다.","a":"He can't have stolen it."},{"ko":"비가 밤새 왔음에 틀림없다.","a":"It must have rained all night."},{"ko":"너는 그렇게 많이 먹지 말았어야 했는데.","a":"You shouldn't have eaten so much."},{"ko":"그녀는 그 편지를 못 봤을지도 모른다.","a":"She might not have seen the letter."},{"ko":"우리는 그 경기에서 이길 수도 있었다.","a":"We could have won the game."},{"ko":"너는 나에게 말했어야 했는데.","a":"You should have told me."},{"ko":"그는 집에서 일찍 떠났음에 틀림없다.","a":"He must have left home early."},{"ko":"그들은 우리를 기다렸을지도 모른다.","a":"They might have waited for us."},{"ko":"나는 그 실수를 하지 말았어야 했는데.","a":"I shouldn't have made the mistake."}],"compose":[{"k":"그는 이미 떠났음에 틀림없다.","a":"He must have already left.","h":"must have p.p. / already / leave→left","alt":["He must have left already."]},{"k":"너는 우산을 가져왔어야 했는데.","a":"You should have brought an umbrella.","h":"should have p.p. / bring→brought","alt":["You should have brought your umbrella."]},{"k":"그녀는 그 답을 알았을지도 모른다.","a":"She might have known the answer.","h":"might have p.p. / know→known","alt":["She may have known the answer."]},{"k":"우리는 더 열심히 노력할 수도 있었다.","a":"We could have tried harder.","h":"could have p.p. / try→tried","alt":["We could have worked harder."]},{"k":"그들은 그 소식을 들었음에 틀림없다.","a":"They must have heard the news.","h":"must have p.p. / hear→heard","alt":[]},{"k":"나는 그 회의에 갔어야 했는데.","a":"I should have gone to the meeting.","h":"should have p.p. / go→gone","alt":["I should have attended the meeting."]},{"k":"그가 거짓말을 했을 리가 없다.","a":"He can't have lied.","h":"can't have p.p. / lie→lied","alt":["He couldn't have lied."]},{"k":"너는 그를 도와줬어야 했는데.","a":"You should have helped him.","h":"should have p.p. / help→helped","alt":[]},{"k":"누군가 문을 열어 두었음에 틀림없다.","a":"Someone must have left the door open.","h":"must have p.p. / leave→left","alt":["Someone must have opened the door."]},{"k":"나는 그것을 사지 말았어야 했는데.","a":"I shouldn't have bought it.","h":"shouldn't have p.p. / buy→bought","alt":["I should not have bought it."]},{"k":"그녀는 버스를 놓쳤을지도 모른다.","a":"She might have missed the bus.","h":"might have p.p. / miss→missed","alt":["She may have missed the bus."]},{"k":"우리는 그 사고를 피할 수도 있었다.","a":"We could have avoided the accident.","h":"could have p.p. / avoid→avoided","alt":[]},{"k":"그들은 우리를 잊었음에 틀림없다.","a":"They must have forgotten us.","h":"must have p.p. / forget→forgotten","alt":[]},{"k":"너는 나에게 진실을 말했어야 했는데.","a":"You should have told me the truth.","h":"should have p.p. / tell→told","alt":[]},{"k":"그는 집에 있었을지도 모른다.","a":"He might have been at home.","h":"might have p.p. / be→been","alt":["He may have been at home."]}],"task":{"prompt":"최근에 후회했던 일이나 과거에 대한 추측을 <b>조동사 + have p.p.</b>를 사용하여 영어로 3문장 써 보세요. 예를 들어 시험, 약속, 실수 등에 대해 ‘~했어야 했는데(should have p.p.)’, ‘~했음에 틀림없다(must have p.p.)’, ‘~했을 수도 있었다(could/might have p.p.)’를 활용해 보세요.","sample":"Yesterday I failed my math test. I should have studied harder the night before. I must have been too tired, and I could have gotten a better grade.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"‘조동사 + have + 과거분사’ 형태를 사용하기","regex":"(must|should|shouldn't|could|might|can't|couldn't)\\s+(not\\s+)?have\\s+\\w+"},{"label":"후회를 나타내는 should have p.p.를 최소 한 번 사용하기","regex":"(should|shouldn't)\\s+(not\\s+)?have\\s+\\w+"}]},"images":""},{"id":"L3C3U1","title":"수동태의 형태","explainParts":[{"t":"수동태는 주어가 동작을 '당하거나 받는' 것을 나타내며, 기본 형태는 "},{"k":"be동사 + 과거분사(p.p.)","n":"수동태의 기본 형태예요. '~되다, ~당하다'라는 뜻을 나타내요. 예: It was written by her.(그것은 그녀에 의해 쓰여졌다.) 행위자는 보통 「by + 목적격」으로 나타내요."},{"t":" 예요. 이때 시제는 "},{"k":"be동사로 시제 표현","n":"현재는 am/are/is, 과거는 was/were, 미래는 will be로 be동사만 바꿔 시제를 나타내요. 과거분사(p.p.)는 그대로 두어요. 예: is made(현재) / was made(과거) / will be made(미래)."},{"t":"로 나타내요. 조동사가 함께 쓰일 때는 "},{"k":"조동사 + be + 과거분사","n":"can, will, must 같은 조동사 뒤에는 반드시 동사원형이 와야 하므로 be를 써요. 형태는 「조동사 + be + p.p.」예요. 예: It can be done.(그것은 될 수 있다.)"},{"t":" 형태를 써서 '~될 수 있다, ~될 것이다'와 같은 뜻을 나타내요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"빈칸에 알맞은 것은? English ___ in many countries.","o":["is spoken","speaks","spoke","is speaking","speak"],"a":0,"e":"여러 나라에서 영어가 '말해지는' 것이므로 현재 수동태 is spoken이 알맞다."},{"q":"빈칸에 알맞은 것은? The window ___ by the boy.","o":["broke","was broken","breaks","break","is breaking"],"a":1,"e":"창문이 소년에 의해 '깨진' 과거 수동태이므로 was broken이 알맞다."},{"q":"빈칸에 알맞은 것은? The work can ___ in an hour.","o":["do","done","be done","did","does"],"a":2,"e":"조동사 can 뒤에는 「be + 과거분사」가 와야 하므로 be done이 알맞다."},{"q":"빈칸에 알맞은 것은? The bridge will ___ next year.","o":["build","builds","be building","be built","built"],"a":3,"e":"미래 수동태는 「will be + 과거분사」이므로 be built가 알맞다."},{"q":"빈칸에 알맞은 것은? It ___ by her.(그것은 그녀에 의해 쓰여졌다.)","o":["wrote","was wrote","is write","written","was written"],"a":4,"e":"과거 수동태는 「was + 과거분사」이고 write의 과거분사는 written이므로 was written이 알맞다."},{"q":"밑줄 친 부분을 어법에 맞게 고친 것은? The song [[sang]] by many people yesterday.","o":["was sung","sang","sings","sung","is singing"],"a":0,"e":"어제 노래가 '불려진' 과거 수동이므로 sing의 과거분사를 써서 was sung이 알맞다."},{"q":"빈칸에 알맞은 것은? The homework must ___ by tomorrow.","o":["finish","be finished","finished","finishes","be finishing"],"a":1,"e":"조동사 must 뒤에는 「be + 과거분사」가 와야 하므로 be finished가 알맞다."},{"q":"빈칸에 알맞은 것은? ___ this picture painted by Picasso?","o":["Did","Does","Was","Has","Is being"],"a":2,"e":"과거 수동태 의문문은 「Was + 주어 + 과거분사?」이므로 Was가 알맞다."},{"q":"빈칸에 알맞은 것은? The building ___ two years ago.","o":["is built","builds","is building","was built","will be built"],"a":3,"e":"two years ago(2년 전)는 과거이므로 과거 수동태 was built가 알맞다."},{"q":"빈칸에 알맞은 것은? This problem cannot ___ easily.","o":["solve","be solving","solved","solves","be solved"],"a":4,"e":"조동사 부정 cannot 뒤에도 「be + 과거분사」가 와야 하므로 be solved가 알맞다."}],"arrange":[{"ko":"그것은 그녀에 의해 쓰여졌다.","a":"It was written by her."},{"ko":"그 일은 될 수 있다.","a":"It can be done."},{"ko":"영어는 많은 나라에서 말해진다.","a":"English is spoken in many countries."},{"ko":"그 창문은 그 소년에 의해 깨졌다.","a":"The window was broken by the boy."},{"ko":"그 다리는 내년에 지어질 것이다.","a":"The bridge will be built next year."},{"ko":"그 방은 매일 청소된다.","a":"The room is cleaned every day."},{"ko":"이 책은 유명한 작가에 의해 쓰여졌다.","a":"This book was written by a famous writer."},{"ko":"그 숙제는 내일까지 끝내져야 한다.","a":"The homework must be finished by tomorrow."},{"ko":"그 노래는 많은 사람들에 의해 불려진다.","a":"The song is sung by many people."},{"ko":"그 편지들은 어제 보내졌다.","a":"The letters were sent yesterday."},{"ko":"그 문제는 쉽게 풀릴 수 없다.","a":"This problem cannot be solved easily."},{"ko":"그 차들은 한국에서 만들어진다.","a":"The cars are made in Korea."},{"ko":"그 건물은 2년 전에 지어졌다.","a":"The building was built two years ago."},{"ko":"이 그림은 피카소에 의해 그려졌다.","a":"This picture was painted by Picasso."},{"ko":"그 나무들은 내년에 심어질 것이다.","a":"The trees will be planted next year."}],"compose":[{"k":"그것은 그녀에 의해 쓰여졌다.","a":"It was written by her.","h":"과거 수동 was + p.p. / write-wrote-written / by + 행위자","alt":[]},{"k":"그 일은 될 수 있다.","a":"It can be done.","h":"조동사 + be + p.p. / do-did-done","alt":[]},{"k":"영어는 많은 나라에서 말해진다.","a":"English is spoken in many countries.","h":"현재 수동 is + p.p. / speak-spoke-spoken","alt":["English is spoken in many nations."]},{"k":"그 창문은 그 소년에 의해 깨졌다.","a":"The window was broken by the boy.","h":"과거 수동 was + p.p. / break-broke-broken / by","alt":[]},{"k":"그 다리는 내년에 지어질 것이다.","a":"The bridge will be built next year.","h":"미래 수동 will be + p.p. / build-built-built","alt":[]},{"k":"그 방은 매일 청소된다.","a":"The room is cleaned every day.","h":"현재 수동 is + p.p. / clean-cleaned","alt":[]},{"k":"이 책은 유명한 작가에 의해 쓰여졌다.","a":"This book was written by a famous writer.","h":"과거 수동 was + p.p. / write-written / by","alt":["This book was written by a famous author."]},{"k":"그 숙제는 내일까지 끝내져야 한다.","a":"The homework must be finished by tomorrow.","h":"조동사 must + be + p.p. / finish-finished","alt":[]},{"k":"그 노래는 많은 사람들에 의해 불려진다.","a":"The song is sung by many people.","h":"현재 수동 is + p.p. / sing-sang-sung / by","alt":[]},{"k":"그 편지들은 어제 보내졌다.","a":"The letters were sent yesterday.","h":"복수 과거 수동 were + p.p. / send-sent","alt":[]},{"k":"그 문제는 쉽게 풀릴 수 없다.","a":"This problem cannot be solved easily.","h":"조동사 부정 cannot + be + p.p. / solve-solved","alt":["This problem can't be solved easily."]},{"k":"그 차들은 한국에서 만들어진다.","a":"The cars are made in Korea.","h":"복수 현재 수동 are + p.p. / make-made","alt":[]},{"k":"그 건물은 2년 전에 지어졌다.","a":"The building was built two years ago.","h":"과거 수동 was + p.p. / build-built / ago","alt":[]},{"k":"이 그림은 피카소에 의해 그려졌다.","a":"This picture was painted by Picasso.","h":"과거 수동 was + p.p. / paint-painted / by","alt":[]},{"k":"그 나무들은 내년에 심어질 것이다.","a":"The trees will be planted next year.","h":"미래 수동 will be + p.p. / plant-planted","alt":[]}],"task":{"prompt":"여러분이 좋아하는 물건, 노래, 또는 장소를 <b>수동태</b>를 사용해 소개하는 글을 3문장 이상 써 보세요. 그것이 <b>어떻게 만들어지거나 사용되는지</b>, 그리고 <b>앞으로 어떻게 될 것인지</b>도 설명해 보세요.","sample":"This song is loved by many students. It was written by a famous musician. It will be played at our school festival.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"be동사 + 과거분사(수동태)를 사용했나요?","regex":"(is|are|am|was|were|be)\\s+(\\w+ed|written|made|built|sung|sent|done|broken|spoken|taken|given|painted|planted|used|loved|known)"},{"label":"조동사 수동태(can/will be + 과거분사)를 사용했나요?","regex":"(can|will|must|should|could)\\s+be\\s+\\w+"}]},"images":""},{"id":"L3C3U2","title":"SVOO / SVOC 문형의 수동태","explainParts":[{"t":"4형식 문장(주어+동사+간접목적어+직접목적어)은 목적어가 두 개라서, 각 목적어를 주어로 하는 두 가지 수동태를 만들 수 있어요."},{"k":"간접목적어를 주어로","n":"「He was given a book.」처럼 사람(간접목적어)을 주어로 삼으면, 직접목적어(a book)는 동사 뒤에 그대로 남아요. give, tell, send, show 같은 동사에서 자주 쓰여요."},{"k":"직접목적어를 주어로","n":"「A book was given to him.」처럼 사물(직접목적어)을 주어로 삼으면, 남은 간접목적어 앞에 전치사를 붙여요. (give·send·tell→to, buy·make→for, ask→of)"},{"t":"5형식 문장(주어+동사+목적어+목적격보어)의 수동태는 목적어를 주어로 하고, 목적격보어는 동사 뒤에 그대로 둬요."},{"k":"동사원형이 to부정사로","n":"사역동사 make나 지각동사(see, hear 등)는 목적격보어로 동사원형을 쓰지만, 수동태가 되면 「He was made to work.」처럼 동사원형이 to부정사로 바뀌어요."},{"t":"예: They made him work. → He was made to work. / I gave her a gift. → She was given a gift."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"They gave me a book. → I ___ a book.","o":["gave","was gave","was given","give","was giving"],"a":2,"e":"4형식 수동태에서 간접목적어(me→I)가 주어가 되면 be동사+과거분사(was given)를 쓴다."},{"q":"He was made ___ the work by his boss.","o":["do","to do","doing","did","done"],"a":1,"e":"사역동사 make의 수동태에서는 목적격보어인 동사원형이 to부정사(to do)로 바뀐다."},{"q":"A letter was sent ___ me.","o":["for","of","with","to","at"],"a":3,"e":"send는 직접목적어를 주어로 한 수동태에서 남은 간접목적어 앞에 전치사 to를 쓴다."},{"q":"The boy was seen ___ the street.","o":["cross","crossed","crosses","is crossing","to cross"],"a":4,"e":"지각동사 see의 수동태에서 동사원형 목적격보어는 to부정사(to cross)로 바뀐다."},{"q":"My mom bought me a coat. → A coat ___ me.","o":["was bought for","was bought to","bought for","was buy for","is bought to"],"a":0,"e":"buy는 직접목적어를 주어로 한 수동태에서 남은 간접목적어 앞에 for를 쓴다."},{"q":"The teacher told us a story. 를 바르게 바꾼 수동태는?","o":["A story was told us.","We told a story.","We were told a story.","We were told a story to.","We are told a story to us."],"a":2,"e":"tell은 간접목적어(us→We)를 주어로 하면 We were told a story가 된다."},{"q":"다음 문장에서 밑줄 친 부분을 어법에 맞게 고친 것은? He was made [[work]] harder than before.","o":["working","to work","worked","works","work"],"a":1,"e":"사역동사 make의 수동태에서는 동사원형이 to부정사(to work)로 바뀌므로 to work가 맞다."},{"q":"She asked me a question. → A question ___ me.","o":["was asked to","was asked for","asked of","was asked of","was ask of"],"a":3,"e":"ask는 직접목적어를 주어로 한 수동태에서 남은 간접목적어 앞에 of를 쓴다."},{"q":"He showed me the photos. → I was shown ___ by him.","o":["to the photos","the photos to","for the photos","of photos","the photos"],"a":4,"e":"show의 간접목적어(me→I)를 주어로 한 수동태에서 직접목적어(the photos)는 동사 뒤에 그대로 온다."},{"q":"People heard him sing a song. 를 바르게 바꾼 수동태는?","o":["He was heard to sing a song.","He was heard sing a song.","He was heard singing to a song.","He was heard sang a song.","He heard to sing a song."],"a":0,"e":"지각동사 hear의 수동태에서 목적격보어 동사원형은 to부정사로 바뀌어 He was heard to sing a song이 된다."}],"arrange":[{"ko":"나는 책 한 권을 받았다.","a":"I was given a book."},{"ko":"그는 일하도록 시켜졌다.","a":"He was made to work."},{"ko":"그녀는 선물 하나를 받았다.","a":"She was given a gift."},{"ko":"편지 한 통이 나에게 보내졌다.","a":"A letter was sent to me."},{"ko":"그 소년은 길을 건너는 것이 목격되었다.","a":"The boy was seen to cross the street."},{"ko":"우리는 재미있는 이야기 하나를 들었다.","a":"We were told a funny story."},{"ko":"그 코트는 나를 위해 구입되었다.","a":"The coat was bought for me."},{"ko":"질문 하나가 나에게 던져졌다.","a":"A question was asked of me."},{"ko":"그는 노래 한 곡을 부르는 것이 들렸다.","a":"He was heard to sing a song."},{"ko":"나는 그 사진들을 보게 되었다.","a":"I was shown the photos."},{"ko":"그 아이들은 일찍 자도록 시켜졌다.","a":"The children were made to go to bed early."},{"ko":"새 자전거 한 대가 그에게 주어졌다.","a":"A new bike was given to him."},{"ko":"그 학생은 큰 소리로 읽도록 시켜졌다.","a":"The student was made to read aloud."},{"ko":"맛있는 케이크 하나가 그녀를 위해 만들어졌다.","a":"A delicious cake was made for her."},{"ko":"그 남자가 방에 들어가는 것이 목격되었다.","a":"The man was seen to enter the room."}],"compose":[{"k":"나는 책 한 권을 받았다.","a":"I was given a book.","h":"간접목적어를 주어로 / was given","alt":["A book was given to me."]},{"k":"그녀는 선물 하나를 받았다.","a":"She was given a gift.","h":"was given","alt":["A gift was given to her."]},{"k":"편지 한 통이 나에게 보내졌다.","a":"A letter was sent to me.","h":"직접목적어 주어 / to","alt":["I was sent a letter."]},{"k":"그 소년은 길을 건너는 것이 목격되었다.","a":"The boy was seen to cross the street.","h":"지각동사 수동태 / to부정사","alt":[]},{"k":"그는 일하도록 시켜졌다.","a":"He was made to work.","h":"사역동사 make / to work","alt":["He was made to work hard."]},{"k":"우리는 이야기 하나를 들었다.","a":"We were told a story.","h":"were told","alt":["A story was told to us."]},{"k":"그 코트는 나를 위해 구입되었다.","a":"The coat was bought for me.","h":"buy / for","alt":["I was bought a coat."]},{"k":"질문 하나가 나에게 던져졌다.","a":"A question was asked of me.","h":"ask / of","alt":["I was asked a question."]},{"k":"그는 노래 한 곡을 부르는 것이 들렸다.","a":"He was heard to sing a song.","h":"지각동사 hear / to부정사","alt":[]},{"k":"나는 그 사진들을 보게 되었다.","a":"I was shown the photos.","h":"was shown","alt":["The photos were shown to me."]},{"k":"그 아이들은 일찍 자도록 시켜졌다.","a":"The children were made to go to bed early.","h":"사역동사 / to go","alt":[]},{"k":"새 자전거 한 대가 그에게 주어졌다.","a":"A new bike was given to him.","h":"직접목적어 주어 / to","alt":["He was given a new bike."]},{"k":"그 학생은 큰 소리로 읽도록 시켜졌다.","a":"The student was made to read aloud.","h":"make 수동태 / to read","alt":[]},{"k":"맛있는 케이크 하나가 그녀를 위해 만들어졌다.","a":"A delicious cake was made for her.","h":"make / for","alt":["She was made a delicious cake."]},{"k":"그 남자가 방에 들어가는 것이 목격되었다.","a":"The man was seen to enter the room.","h":"지각동사 see / to enter","alt":[]}],"task":{"prompt":"오늘 학교나 집에서 다른 사람에 의해 여러분이 <b>겪은 일</b>을 수동태로 표현해 봅시다. <b>4형식 수동태</b>(was given, was told, was shown 등)와 <b>5형식 수동태</b>(was made to ~, was seen to ~ 등)를 각각 활용하여 세 문장 이상 영어로 쓰세요.","sample":"I was given a new book by my teacher. My friend was told an interesting story during the class. After school, I was made to clean the classroom.","conds":[{"label":"세 문장 이상 썼나요?","minSentences":3},{"label":"4형식 수동태(was/were + given/told/sent/shown 등)를 사용했나요?","regex":"(was|were)\\s+\\w*\\s*(given|told|sent|shown|bought|asked)"},{"label":"5형식 수동태(was/were + made/seen/heard + to부정사)를 사용했나요?","regex":"(was|were)\\s+(made|seen|heard)\\s+to\\s+\\w+"}]},"images":""},{"id":"L3C3U3","title":"주의해야 할 수동태","explainParts":[{"t":"수동태는 보통 「be동사 + 과거분사(p.p.) + by ~」로 행위자를 나타내요. 그런데 by 대신 다른 전치사를 쓰거나, 전치사를 꼭 남겨야 하는 표현들이 있어요."},{"k":"by 이외의 전치사","n":"be interested in(~에 관심이 있다), be surprised at(~에 놀라다), be covered with(~로 덮이다), be satisfied with(~에 만족하다)처럼 감정·상태를 나타내는 수동태 표현은 by가 아니라 정해진 전치사와 함께 써요. 예: I am interested in music. / It is covered with snow."},{"t":"이런 표현들은 통째로 외워 두는 것이 좋아요. be filled with(~로 가득 차다)도 자주 쓰여요."},{"k":"구동사의 수동태","n":"look after(~을 돌보다), laugh at(~을 비웃다)처럼 여러 단어로 이루어진 구동사를 수동태로 바꿀 때는 동사구를 한 덩어리로 취급해요. 즉 「be + p.p. + 전치사/부사 + by ~」 형태로, 뒤의 전치사를 절대 빠뜨리면 안 돼요. 예: The baby is looked after by her."},{"k":"be known + 전치사","n":"같은 동사라도 전치사에 따라 뜻이 달라져요. be known for(~로 유명하다), be known as(~로서 알려지다), be known to(~에게 알려지다)처럼 구별해서 써야 해요."},{"t":"정리하면, 수동태에서는 by만 떠올리지 말고 표현에 맞는 전치사를 정확히 골라 써야 해요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I am interested ___ music.","o":["at","in","with","for","of"],"a":1,"e":"be interested in은 '~에 관심이 있다'는 뜻으로 전치사 in을 써요."},{"q":"The mountain is covered ___ snow.","o":["by","with","in","at","for"],"a":1,"e":"be covered with는 '~로 덮여 있다'는 뜻으로 전치사 with를 써요."},{"q":"She was surprised ___ the news.","o":["with","in","of","at","to"],"a":3,"e":"be surprised at은 '~에 놀라다'는 뜻으로 전치사 at을 써요."},{"q":"I am satisfied ___ the result.","o":["at","in","with","for","by"],"a":2,"e":"be satisfied with는 '~에 만족하다'는 뜻으로 전치사 with를 써요."},{"q":"The singer is known ___ her beautiful voice.","o":["as","to","with","in","for"],"a":4,"e":"be known for는 '~로 유명하다'는 뜻으로 전치사 for를 써요."},{"q":"The children are looked ___ by their grandmother.","o":["at","after","for","up","into"],"a":1,"e":"look after(~을 돌보다)의 수동태이므로 after를 반드시 남겨야 해요."},{"q":"The room was filled ___ people.","o":["of","by","at","in","with"],"a":4,"e":"be filled with는 '~로 가득 차다'는 뜻으로 전치사 with를 써요."},{"q":"다음 중 어법상 옳은 문장을 고르시오.","o":["He was laughed at by everyone.","He was laughed by everyone.","He was laughed everyone.","He laughed at by everyone.","He is laugh at by everyone."],"a":0,"e":"구동사 laugh at의 수동태는 at을 남기고 행위자 앞에 by를 붙여 'be laughed at by ~'로 써요."},{"q":"밑줄 친 부분을 바르게 고친 것은? He is interested [[with]] science.","o":["in","at","for","of","on"],"a":0,"e":"be interested in이 올바른 표현이므로 with를 in으로 고쳐야 해요."},{"q":"다음 능동태를 수동태로 바꿀 때 알맞은 것은? A lot of snow covered the ground. → The ground ___ a lot of snow.","o":["was covered by","was covered with","covered with","is covering","covered by"],"a":1,"e":"be covered with 표현을 쓰고 과거시제이므로 was covered with가 알맞아요."}],"arrange":[{"ko":"나는 미술에 관심이 있다.","a":"I am interested in art."},{"ko":"그 산은 눈으로 덮여 있다.","a":"The mountain is covered with snow."},{"ko":"그녀는 그 소식에 놀랐다.","a":"She was surprised at the news."},{"ko":"나는 그 결과에 만족한다.","a":"I am satisfied with the result."},{"ko":"그 가수는 아름다운 목소리로 유명하다.","a":"The singer is known for her beautiful voice."},{"ko":"그 아기는 그의 할머니에 의해 돌봐진다.","a":"The baby is looked after by his grandmother."},{"ko":"그 방은 사람들로 가득 차 있었다.","a":"The room was filled with people."},{"ko":"그는 모두에게 비웃음을 당했다.","a":"He was laughed at by everyone."},{"ko":"우리는 그 영화에 관심이 있다.","a":"We are interested in the movie."},{"ko":"그 들판은 꽃으로 덮여 있다.","a":"The field is covered with flowers."},{"ko":"그들은 그 결과에 놀랐다.","a":"They were surprised at the result."},{"ko":"이 도시는 그 다리로 유명하다.","a":"This city is known for its bridge."},{"ko":"나는 나의 새 학교에 만족한다.","a":"I am satisfied with my new school."},{"ko":"그 개는 나의 형에 의해 돌봐진다.","a":"The dog is looked after by my brother."},{"ko":"그 병은 물로 가득 차 있다.","a":"The bottle is filled with water."}],"compose":[{"k":"나는 음악에 관심이 있다.","a":"I am interested in music.","h":"be interested in / 현재시제","alt":["I'm interested in music."]},{"k":"그것은 눈으로 덮여 있다.","a":"It is covered with snow.","h":"be covered with","alt":["It's covered with snow."]},{"k":"그는 그 소식에 놀랐다.","a":"He was surprised at the news.","h":"be surprised at / 과거","alt":[]},{"k":"우리는 그 서비스에 만족한다.","a":"We are satisfied with the service.","h":"be satisfied with","alt":["We're satisfied with the service."]},{"k":"그 배우는 그의 연기로 유명하다.","a":"The actor is known for his acting.","h":"be known for","alt":[]},{"k":"그 아이는 그녀에 의해 돌봐진다.","a":"The child is looked after by her.","h":"look after 수동태 / after 남기기","alt":[]},{"k":"그 상자는 책으로 가득 차 있다.","a":"The box is filled with books.","h":"be filled with","alt":["The box is full of books."]},{"k":"그는 그의 친구들에게 비웃음을 당했다.","a":"He was laughed at by his friends.","h":"laugh at 수동태 / at + by","alt":[]},{"k":"나는 과학에 관심이 있다.","a":"I am interested in science.","h":"be interested in","alt":["I'm interested in science."]},{"k":"그 지붕은 눈으로 덮여 있었다.","a":"The roof was covered with snow.","h":"be covered with / 과거","alt":[]},{"k":"그녀는 그 선물에 놀랐다.","a":"She was surprised at the gift.","h":"be surprised at / 과거","alt":[]},{"k":"나는 나의 점수에 만족한다.","a":"I am satisfied with my grade.","h":"be satisfied with","alt":["I'm satisfied with my grade.","I am satisfied with my score.","I'm satisfied with my score."]},{"k":"그 마을은 사과로 유명하다.","a":"The town is known for its apples.","h":"be known for","alt":[]},{"k":"그 정원은 꽃으로 덮여 있다.","a":"The garden is covered with flowers.","h":"be covered with","alt":[]},{"k":"그 컵은 우유로 가득 차 있다.","a":"The cup is filled with milk.","h":"be filled with","alt":["The cup is full of milk."]}],"task":{"prompt":"여러분이 관심 있는 것과 주변 사물을 소개하는 글을 써 보세요. <b>주의해야 할 수동태(be interested in, be covered with, be satisfied with, be known for 등)</b>를 활용하여 3문장 이상 써 보세요.","sample":"I am interested in science. The mountain near my house is covered with snow. I am satisfied with my new hobby.","conds":[{"label":"3문장 이상 썼어요.","minSentences":3},{"label":"'by 이외의 전치사'를 쓴 수동태 표현을 포함했어요.","regex":"(interested in|covered with|surprised at|satisfied with|known for|filled with)"},{"label":"「be동사 + 과거분사」 형태를 사용했어요.","regex":"\\b(am|is|are|was|were)\\s+\\w+ed\\b"}]},"images":""},{"id":"L3C4U1","title":"to부정사의 명사적 쓰임","explainParts":[{"t":"to부정사는 「to+동사원형」 형태로, 문장에서 명사처럼 주어·목적어·보어 역할을 해요. "},{"k":"주어 역할","n":"「To+동사원형 ...」이 문장 맨 앞에 와서 '~하는 것은'이라는 주어가 돼요. 이때 동사는 항상 단수로 받아요. 예: To learn is important.(배우는 것은 중요하다)"},{"t":"동사의 목적어나 be동사 뒤 보어로도 쓰여요. 예: I want to go.(가는 것을 원한다), My dream is to be a doctor.(내 꿈은 의사가 되는 것이다) "},{"k":"가주어 it","n":"to부정사 주어가 길면 문장 앞에 가주어 it을 쓰고, 진짜 주어인 to부정사는 문장 뒤로 보내요. It is important to learn.처럼 It이 자리만 채워요."},{"k":"의문사+to부정사","n":"「what/how/when/where+to부정사」는 '무엇을/어떻게/언제/어디서 ~할지'라는 뜻의 명사구예요. know, tell 같은 동사의 목적어로 자주 써요. 예: I know what to do.(나는 무엇을 할지 안다)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"빈칸에 알맞은 것은? ___ a foreign language is not easy.","o":["Learn","Learns","To learn","Learned","Learn to"],"a":2,"e":"주어 자리에는 '~하는 것'을 뜻하는 to부정사가 와야 한다."},{"q":"빈칸에 알맞은 것은? I don't know what ___ next.","o":["to do","do to","doing","do","to doing"],"a":0,"e":"'무엇을 할지'는 「what+to부정사」로 what to do라고 쓴다."},{"q":"빈칸에 알맞은 것은? She wants ___ a doctor.","o":["be","being","is","to be","been"],"a":3,"e":"want는 목적어로 to부정사를 취하므로 to be가 알맞다."},{"q":"빈칸에 알맞은 것은? ___ is important to eat breakfast.","o":["That","This","It","There","He"],"a":2,"e":"뒤의 to부정사가 진주어이므로 가주어 It이 필요하다."},{"q":"빈칸에 알맞은 것은? Her plan is ___ hard this year.","o":["study","studies","studied","study to","to study"],"a":4,"e":"be동사 뒤 보어 자리에 '~하는 것'을 뜻하는 to부정사가 온다."},{"q":"빈칸에 알맞은 것은? Can you tell me how ___ to the station?","o":["getting","to get","get","gets","got"],"a":1,"e":"'어떻게 갈지'는 「how+to부정사」로 how to get이라고 쓴다."},{"q":"빈칸에 알맞은 것은? It is difficult ___ this problem.","o":["solve","solving","solved","to solve","solves"],"a":3,"e":"가주어 It의 진주어로 to부정사 to solve가 온다."},{"q":"빈칸에 알맞은 것은? I'm not sure when ___ the meeting.","o":["to start","start to","starting","started","to starting"],"a":0,"e":"'언제 시작할지'는 「when+to부정사」로 when to start라고 쓴다."},{"q":"밑줄 친 부분을 바르게 고친 것은? He hopes [[become]] a scientist.","o":["become","becomes","to become","becoming","became"],"a":2,"e":"hope는 목적어로 to부정사를 취하므로 to become이 알맞다."},{"q":"빈칸에 알맞은 것은? To make new friends ___ my goal.","o":["are","is","be","being","were"],"a":1,"e":"to부정사 주어는 단수 취급하므로 is를 쓴다."}],"arrange":[{"ko":"배우는 것은 중요하다.","a":"To learn is important."},{"ko":"나는 무엇을 해야 할지 안다.","a":"I know what to do."},{"ko":"나의 꿈은 의사가 되는 것이다.","a":"My dream is to be a doctor."},{"ko":"아침을 먹는 것은 중요하다.","a":"It is important to eat breakfast."},{"ko":"그녀는 선생님이 되기를 원한다.","a":"She wants to be a teacher."},{"ko":"새 언어를 배우는 것은 쉽지 않다.","a":"To learn a new language is not easy."},{"ko":"나는 어디로 가야 할지 모른다.","a":"I don't know where to go."},{"ko":"그는 과학자가 되기를 희망한다.","a":"He hopes to become a scientist."},{"ko":"그 문제를 푸는 것은 어렵다.","a":"It is difficult to solve the problem."},{"ko":"나는 언제 시작해야 할지 모르겠다.","a":"I'm not sure when to start."},{"ko":"그녀의 계획은 열심히 공부하는 것이다.","a":"Her plan is to study hard."},{"ko":"역까지 어떻게 가는지 나에게 말해 줄 수 있니?","a":"Can you tell me how to get to the station?"},{"ko":"새 친구를 사귀는 것이 나의 목표이다.","a":"To make new friends is my goal."},{"ko":"나는 무엇을 말해야 할지 몰랐다.","a":"I didn't know what to say."},{"ko":"매일 운동하는 것은 건강에 좋다.","a":"To exercise every day is good for your health."}],"compose":[{"k":"나는 무엇을 할지 안다.","a":"I know what to do.","h":"know / 의문사+to부정사(what to do)","alt":[]},{"k":"배우는 것은 중요하다.","a":"To learn is important.","h":"주어 역할 to부정사 / 단수 동사 is","alt":["Learning is important."]},{"k":"나의 꿈은 의사가 되는 것이다.","a":"My dream is to be a doctor.","h":"보어 to부정사 / a doctor","alt":["My dream is to become a doctor."]},{"k":"영어를 공부하는 것은 중요하다.","a":"It is important to study English.","h":"가주어 It / 진주어 to부정사","alt":["To study English is important."]},{"k":"그녀는 가수가 되기를 원한다.","a":"She wants to be a singer.","h":"want+to부정사 / a singer","alt":["She wants to become a singer."]},{"k":"나는 어디로 가야 할지 모른다.","a":"I don't know where to go.","h":"where+to부정사","alt":["I do not know where to go."]},{"k":"그는 그 책을 읽기를 원한다.","a":"He wants to read the book.","h":"want+to부정사 / read","alt":[]},{"k":"언제 시작해야 할지 나에게 말해 줘.","a":"Tell me when to start.","h":"Tell me / when+to부정사","alt":[]},{"k":"그 강을 헤엄쳐 건너는 것은 위험하다.","a":"It is dangerous to swim across the river.","h":"가주어 It / dangerous","alt":["To swim across the river is dangerous."]},{"k":"나의 계획은 일찍 일어나는 것이다.","a":"My plan is to get up early.","h":"보어 to부정사 / get up early","alt":["My plan is to wake up early."]},{"k":"그것을 어떻게 사용하는지 나에게 보여 줘.","a":"Show me how to use it.","h":"Show me / how+to부정사","alt":[]},{"k":"정직해지는 것은 쉽지 않다.","a":"To be honest is not easy.","h":"주어 to부정사 / honest","alt":["It is not easy to be honest."]},{"k":"나는 무엇을 사야 할지 결정했다.","a":"I decided what to buy.","h":"decide / what+to부정사","alt":[]},{"k":"새로운 것을 배우는 것은 재미있다.","a":"It is fun to learn new things.","h":"가주어 It / fun","alt":["To learn new things is fun."]},{"k":"그녀의 목표는 시험에 합격하는 것이다.","a":"Her goal is to pass the exam.","h":"보어 to부정사 / pass the exam","alt":[]}],"task":{"prompt":"여러분이 이번 주말에 <b>하고 싶은 일</b>과 그것을 <b>어떻게 또는 무엇을 할지</b>에 대해, to부정사의 명사적 쓰임(주어·목적어·보어, 의문사+to부정사, 가주어 it)을 사용하여 영어로 3문장 이상 써 보세요.","sample":"To spend time with my family is my plan for this weekend. I want to visit a new museum in the city. Also, it is fun to try new food, so I will decide what to eat there.","conds":[{"label":"3문장 이상으로 쓰기","minSentences":3},{"label":"to부정사(to+동사원형)를 사용하기","regex":"[Tt]o\\s+[a-z]+"},{"label":"의문사+to부정사 또는 가주어 it 표현 쓰기","regex":"(?:[Ww]hat|[Hh]ow|[Ww]hen|[Ww]here)\\s+to\\s+[a-z]+|[Ii]t\\s+is\\b"}]},"images":""},{"id":"L3C4U2","title":"to부정사의 형용사적, 부사적 쓰임","explainParts":[{"t":"to부정사는 명사 뒤에 붙어 그 명사를 꾸며 주는 형용사 역할을 할 수 있어요. 예를 들어 a chance to win은 '이길 기회'라는 뜻이에요."},{"k":"형용사적 용법","n":"「명사 + to부정사」 형태로 앞의 명사를 뒤에서 수식하며 '~할, ~하는'으로 해석해요. something to eat(먹을 것), a book to read(읽을 책)처럼 쓰여요."},{"t":"또한 to부정사는 문장 안에서 동사나 형용사, 문장 전체를 꾸며 주는 부사 역할도 해요."},{"k":"부사적 용법","n":"목적(~하기 위해), 감정의 원인(~해서), 결과(~해서 결국 ~하다), 판단의 근거(~하다니) 등을 나타내요. He grew up to be a doctor(자라서 의사가 되었다)."},{"t":"목적을 분명히 하고 싶을 때는 to 대신 in order to를 쓰기도 해요."},{"k":"감정의 원인","n":"glad, sad, happy, surprised 같은 감정 형용사 뒤의 to부정사는 '~해서'라는 감정의 이유를 나타내요. I'm sad to hear the news(그 소식을 들어서 슬프다)."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I need a book ___ on the train.","o":["to read","read","reading","reads","for read"],"a":0,"e":"명사 a book을 수식하는 형용사적 용법이므로 to read가 알맞다."},{"q":"She was happy ___ the good news.","o":["hear","to hear","heard","hearing","for hearing"],"a":1,"e":"감정 형용사 happy 뒤에서 감정의 원인을 나타내는 to hear가 알맞다."},{"q":"He went to the store ___ some milk.","o":["buy","buying","to buy","bought","for buy"],"a":2,"e":"'~하기 위해'라는 목적을 나타내는 부사적 용법으로 to buy가 알맞다."},{"q":"I have a lot of homework ___ tonight.","o":["doing","do","did","does","to do"],"a":4,"e":"명사 homework를 수식하는 형용사적 용법이므로 to do가 알맞다."},{"q":"They were surprised ___ him there.","o":["seeing","see","saw","to see","for see"],"a":3,"e":"감정 형용사 surprised 뒤에서 감정의 원인을 나타내는 to see가 알맞다."},{"q":"We need a house ___ in.","o":["to live","to living","living in","live in","lived"],"a":0,"e":"명사 a house를 수식하는 형용사적 용법이며 live in a house이므로 to live in의 형태가 된다."},{"q":"He went to the store ___ some milk. (목적 강조) He went ___ ___ buy some milk.","o":["so that","because of","in order to","thanks to","instead of"],"a":2,"e":"목적을 강조할 때는 in order to를 써서 '~하기 위해'를 나타낸다."},{"q":"The boy grew up ___ a famous doctor.","o":["to become","becoming","become","became","to becoming"],"a":0,"e":"'자라서 (결국) ~가 되었다'라는 결과를 나타내는 부사적 용법으로 to become이 알맞다."},{"q":"다음 중 밑줄 친 to부정사의 쓰임이 나머지와 다른 것은?","o":["I have some water [[to drink]].","She has many friends [[to help]] her.","He studied hard [[to pass]] the exam.","Give me a pen [[to write]] with.","There is nothing [[to worry]] about."],"a":2,"e":"나머지는 앞의 명사를 꾸미는 형용사적 용법이지만 to pass는 목적을 나타내는 부사적 용법이다."},{"q":"She was foolish ___ such a mistake.","o":["making","to make","make","made","for making"],"a":1,"e":"'~하다니'라는 판단의 근거를 나타내는 부사적 용법으로 to make가 알맞다."}],"arrange":[{"ko":"나는 마실 물이 필요하다.","a":"I need some water to drink."},{"ko":"그녀는 그 소식을 들어서 슬펐다.","a":"She was sad to hear the news."},{"ko":"그는 이길 기회를 얻었다.","a":"He got a chance to win."},{"ko":"우리는 먹을 것이 좀 있다.","a":"We have something to eat."},{"ko":"나는 그를 봐서 기뻤다.","a":"I was glad to see him."},{"ko":"그들은 시험에 합격하기 위해 열심히 공부했다.","a":"They studied hard to pass the exam."},{"ko":"나에게 쓸 펜을 하나 줘.","a":"Give me a pen to write with."},{"ko":"그 소년은 자라서 의사가 되었다.","a":"The boy grew up to be a doctor."},{"ko":"그런 실수를 하다니 그녀는 어리석다.","a":"She is foolish to make such a mistake."},{"ko":"나는 오늘 밤에 할 숙제가 많다.","a":"I have a lot of homework to do tonight."},{"ko":"그는 우유를 좀 사기 위해 가게에 갔다.","a":"He went to the store to buy some milk."},{"ko":"걱정할 것은 아무것도 없다.","a":"There is nothing to worry about."},{"ko":"그 문제를 풀다니 그는 똑똑함에 틀림없다.","a":"He must be smart to solve the problem."},{"ko":"그녀는 읽을 책 한 권을 원한다.","a":"She wants a book to read."},{"ko":"우리는 앉을 의자가 필요하다.","a":"We need a chair to sit on."}],"compose":[{"k":"나는 마실 물이 필요하다.","a":"I need some water to drink.","h":"필요하다 need / 마실 물 water to drink","alt":["I need water to drink."]},{"k":"그녀는 그 소식을 들어서 슬펐다.","a":"She was sad to hear the news.","h":"슬픈 sad / 감정의 원인 to hear","alt":["She felt sad to hear the news."]},{"k":"그는 이길 기회를 얻었다.","a":"He got a chance to win.","h":"기회 chance / ~할 to win","alt":["He had a chance to win."]},{"k":"우리는 먹을 것이 좀 있다.","a":"We have something to eat.","h":"~것 something / 먹을 to eat","alt":["We've got something to eat."]},{"k":"나는 그를 봐서 기뻤다.","a":"I was glad to see him.","h":"기쁜 glad / 감정의 원인 to see","alt":["I was happy to see him.","I was glad to meet him."]},{"k":"그들은 시험에 합격하기 위해 열심히 공부했다.","a":"They studied hard to pass the exam.","h":"목적 to pass / 열심히 hard","alt":["They studied hard in order to pass the exam."]},{"k":"나에게 쓸 펜을 하나 줘.","a":"Give me a pen to write with.","h":"펜 pen / 쓸 to write with","alt":["Please give me a pen to write with."]},{"k":"그 소년은 자라서 의사가 되었다.","a":"The boy grew up to be a doctor.","h":"결과 to be / 자라다 grow up","alt":["The boy grew up to become a doctor."]},{"k":"그런 실수를 하다니 그녀는 어리석다.","a":"She is foolish to make such a mistake.","h":"판단 근거 to make / 어리석은 foolish","alt":["She is silly to make such a mistake."]},{"k":"나는 오늘 밤에 할 숙제가 많다.","a":"I have a lot of homework to do tonight.","h":"할 숙제 homework to do / 많은 a lot of","alt":["I have much homework to do tonight."]},{"k":"그는 우유를 좀 사기 위해 가게에 갔다.","a":"He went to the store to buy some milk.","h":"목적 to buy / 가게 store","alt":["He went to the shop to buy some milk."]},{"k":"걱정할 것은 아무것도 없다.","a":"There is nothing to worry about.","h":"아무것도 nothing / 걱정할 to worry about","alt":["There's nothing to worry about."]},{"k":"그 문제를 풀다니 그는 똑똑함에 틀림없다.","a":"He must be smart to solve the problem.","h":"판단 근거 to solve / ~임에 틀림없다 must be","alt":["He must be clever to solve the problem."]},{"k":"그녀는 읽을 책 한 권을 원한다.","a":"She wants a book to read.","h":"원하다 want / 읽을 책 book to read","alt":["She would like a book to read."]},{"k":"우리는 앉을 의자가 필요하다.","a":"We need a chair to sit on.","h":"의자 chair / 앉을 to sit on","alt":["We need chairs to sit on."]}],"task":{"prompt":"<b>to부정사의 형용사적·부사적 용법</b>을 사용하여, 여러분이 이루고 싶은 목표와 그것을 위한 계획에 대해 3문장 이상 영어로 써 보세요. '~할 (명사를 수식하는 to부정사)'과 '~하기 위해 / ~해서 (부사적 to부정사)'를 모두 포함하세요.","sample":"I have a big dream to become a scientist. I study hard every day to reach my goal. I am always happy to learn new things.","conds":[{"label":"3문장 이상으로 썼나요?","minSentences":3},{"label":"명사를 수식하는 to부정사(예: a dream to become)를 포함했나요?","regex":"\\b(dream|goal|plan|chance|thing|book|time|way|water|homework|something|job)\\s+to\\s+[a-z]+"},{"label":"목적·감정을 나타내는 부사적 to부정사를 포함했나요?","regex":"(to\\s+(reach|achieve|study|learn|pass|win|get|be|make|help|become)|(happy|glad|sad|proud|excited|surprised)\\s+to)"}]},"images":""},{"id":"L3C4U3","title":"목적격보어로 쓰이는 부정사","explainParts":[{"t":"목적어 뒤에서 그 목적어를 보충 설명하는 말을 목적격보어라고 해요. 어떤 동사가 쓰이느냐에 따라 목적격보어로 to부정사, 원형부정사, -ing가 옵니다."},{"k":"to부정사 목적격보어","n":"want, ask, tell, allow 같은 동사는 '목적어 + to부정사'를 씁니다. 예: I asked him to help. (나는 그에게 도와달라고 부탁했다.)"},{"t":"예를 들어 She wants me to stay.처럼 목적어(me) 뒤에 to stay가 옵니다."},{"k":"사역동사 make/let/have","n":"'~하게 하다, 시키다'라는 뜻으로 목적어 뒤에 to 없는 원형부정사를 씁니다. 예: She made me clean it. (O) / She made me to clean it. (X)"},{"t":"Let me help you., I had him call me.처럼 사역동사 뒤에서는 to를 빼는 것에 특히 주의하세요."},{"k":"지각동사 see/hear/feel","n":"보고 듣고 느끼는 감각동사는 목적어 뒤에 원형부정사나 -ing를 씁니다. 동작이 진행 중임을 강조하면 -ing를 써요. 예: I saw him run. / I saw him running."},{"t":"정리하면, 어떤 동사를 쓰느냐에 따라 목적격보어의 형태(to부정사 · 원형부정사 · -ing)가 달라집니다."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I want you ___ study hard.","o":["to study","study","studying","studied","studies"],"a":0,"e":"want는 목적어 뒤에 to부정사를 쓰므로 to study가 맞습니다."},{"q":"My mom made me ___ my room.","o":["to clean","cleaning","cleaned","cleans","clean"],"a":4,"e":"사역동사 make는 목적어 뒤에 원형부정사 clean을 씁니다."},{"q":"She asked him ___ the door for her.","o":["opens","opened","opening","to open","open"],"a":3,"e":"ask는 목적어 뒤에 to부정사를 쓰므로 to open이 맞습니다."},{"q":"Please let me ___ your bag.","o":["to carry","carry","carrying","carried","carries"],"a":1,"e":"사역동사 let은 목적어 뒤에 원형부정사 carry를 씁니다."},{"q":"I heard someone ___ my name.","o":["to call","calls","call","to calling","to called"],"a":2,"e":"지각동사 hear는 목적어 뒤에 원형부정사 call을 쓸 수 있습니다."},{"q":"The doctor told her ___ more water.","o":["to drink","drink","drinking","drank","drinks"],"a":0,"e":"tell은 목적어 뒤에 to부정사를 쓰므로 to drink가 맞습니다."},{"q":"My father let me [[to drive]] his car. 밑줄 친 부분을 바르게 고치면?","o":["to drive","drive","driving","drove","drives"],"a":1,"e":"사역동사 let 뒤에는 to 없는 원형부정사 drive를 써야 합니다."},{"q":"We allow students ___ their phones after class.","o":["use","using","used","to using","to use"],"a":4,"e":"allow는 목적어 뒤에 to부정사를 쓰므로 to use가 맞습니다."},{"q":"I felt the ground ___ during the earthquake.","o":["to shake","shakes","shook","shaking","to shaking"],"a":3,"e":"지각동사 feel은 진행 중인 동작을 강조할 때 -ing를 쓸 수 있어 shaking이 자연스럽습니다."},{"q":"다음 중 어법상 올바른 문장을 고르시오.","o":["She made me to wait an hour.","He let me to use his laptop.","I saw him enter the building.","They told me clean the floor.","We heard her sings a song."]
