<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Writing Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSans.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Firebase(실시간 연동용) — 파이어베이스 콘솔에서 받은 공개 설정값과 함께 아래 본문 스크립트 맨 앞에서
     초기화해요. compat 빌드라 firebase.xxx() 형태로 바로 쓸 수 있어요(별도 번들러 필요 없음). -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="page">
<div id="frame">
  <div id="updateBanner" style="display:none;position:sticky;top:0;z-index:9999;background:#fef3c7;color:#78350f;padding:8px 14px;font-size:13px;text-align:center;font-weight:700">
    🔄 사이트가 새 버전으로 업데이트됐어요. <button id="updateReloadBtn" style="margin-left:8px;padding:3px 10px;font-size:12.5px;border:1px solid #78350f;background:#fff;border-radius:6px;cursor:pointer;font-weight:700">지금 새로고침</button>
  </div>
  <div id="topbar"><span class="logo">English Writing Lab</span><span class="who" id="who"></span><button class="hbtn" id="homeBtn" style="display:none">← 홈</button><button class="hbtn" id="logoutBtn" style="display:none">로그아웃</button></div>
  <div id="progress"><span></span></div>
  <div id="stage"></div>
  <div id="nav"><button class="navbtn" id="prev">◀ 이전</button><div class="navmid"><div id="counter"></div><div id="studyTimer" class="study-timer"></div></div><button class="navbtn" id="next">다음 ▶</button></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
