"layer":"concl"},{"en":"From this experience, I have realized that I should never give up something just because it seems difficult.","ko":"이 경험을 통해, 나는 단지 어려워 보인다는 이유로 무언가를 절대 포기해서는 안 된다는 것을 깨달았다.","role":"cs","layer":"concl"}],"expressions":[{"en":"should have p.p. (~했어야 했는데 안 했다)","ko":"~했어야 했다 (후회)"},{"en":"should not have p.p. (~하지 말았어야 했는데 했다)","ko":"~하지 말았어야 했다"},{"en":"could have p.p. (~할 수도 있었다)","ko":"~할 수도 있었다 (하지 못한 가능성)"},{"en":"would have p.p. (~했을 텐데)","ko":"~했을 것이다 (가정)"},{"en":"might have p.p. (~했을지도 모른다)","ko":"~했을지도 모른다"},{"en":"look back on ~ (~을 되돌아보다)","ko":"~을 되돌아보다"},{"en":"make a different choice (다른 선택을 하다)","ko":"다른 선택을 하다"},{"en":"give up ~ (~을 포기하다)","ko":"~을 포기하다"},{"en":"lose touch with ~ (~와 연락이 끊기다)","ko":"~와 연락이 끊기다"},{"en":"turn back time (시간을 되돌리다)","ko":"시간을 되돌리다"}],"organizer":{"topic":"내가 다르게 선택했어야 했던 한 가지 일을 정하고, '~했어야 했다(should have p.p.)'로 주제문을 써 보세요.","s1":"① 그 선택을 하게 된 이유를 소개하세요. ② 왜 그것이 잘못이었는지 이유를 조동사+have p.p.로 설명하세요. (예: 쉽게 포기하지 말았어야 했다)","s2":"① 그 선택으로 잃게 된 것을 소개하세요. ② This is because로 그 이유·구체적 상황을 덧붙여 설명하세요. (예: 친구들과 연락이 끊김)","s3":"① 지금 느끼는 감정을 소개하세요. ② For example로 그 감정을 보여 주는 구체적 예시를 들어 설명하세요.","concl":"'시간을 되돌릴 수 있다면(would have p.p.)'과 함께 다르게 선택했을 모습을 밝히고, 이 경험에서 배운 교훈으로 마무리하세요."},"flow":{"topic":"주제 ① 축구팀을 그만둔 선택 → 다르게 선택했어야 했다(should have made)","s1":"이유 ① 지는 게 두려워 그만둠 → 쉽게 포기하지 말았어야 했고, 연습했다면 더 좋은 선수가 될 수 있었다(should not have given up / could have become)","s2":"결과 ① 친구들과 멀어짐 → 매일 함께 훈련했기 때문이며, 남았다면 우정을 지킬 수 있었다(This is because / could have kept)","s3":"감정 ① 지루하고 외로움 → 예로 동료들의 승리를 보며 '함께 있었어야 했다'고 느낌(For example / should have been)","concl":"마무리 ① 시간을 되돌리면 팀에 남았을 것(would have chosen) → 어렵다고 포기하면 안 된다는 교훈을 깨달음"},"images":""},{"id":"PW-L3C03","level":"L3","grammar":"수동태 심화","chap":3,"grammarLabel":"수동태(be + p.p.) 사용","grammarTest":"\\b(is|are|was|were|be|been|being)\\s+\\w+(ed|en)\\b","title":"Plastic Pollution Must Be Solved","genre":"설득문","note":"배운 문법 <b>수동태 심화</b>로 우리가 함께 해결해야 할 세계 문제를 주장하는 글을 써요.","sample":[{"en":"Plastic pollution is a serious global problem that must be solved by all of us.","ko":"플라스틱 오염은 우리 모두가 반드시 해결해야 할 심각한 세계 문제입니다.","role":"ts","layer":"topic"},{"en":"First, our oceans are being polluted by plastic waste every single day.","ko":"첫째, 우리 바다는 매일같이 플라스틱 쓰레기로 오염되고 있습니다.","role":"ss","layer":"s1"},{"en":"This is because millions of plastic bottles are thrown away and are washed into the sea.","ko":"이는 수백만 개의 페트병이 버려져 바다로 흘러 들어가기 때문입니다.","role":"ss","layer":"s1"},{"en":"Second, many sea animals are being harmed by this plastic.","ko":"둘째, 많은 바다 동물들이 이 플라스틱 때문에 피해를 입고 있습니다.","role":"ss","layer":"s2"},{"en":"For example, sea turtles are often killed when they are trapped in plastic bags.","ko":"예를 들어, 바다거북은 비닐봉지에 갇혀 죽는 경우가 많습니다.","role":"ss","layer":"s2"},{"en":"Third, plastic is slowly broken down into tiny pieces called microplastics.","ko":"셋째, 플라스틱은 미세플라스틱이라 불리는 아주 작은 조각으로 천천히 분해됩니다.","role":"ss","layer":"s3"},{"en":"As a result, these pieces are eaten by fish and are eventually passed on to us.","ko":"그 결과, 이 조각들은 물고기에게 먹히고 결국 우리에게까지 전달됩니다.","role":"ss","layer":"s3"},{"en":"Therefore, less plastic should be used, and more waste must be recycled.","ko":"그러므로 플라스틱은 덜 사용되어야 하고, 더 많은 쓰레기가 재활용되어야 합니다.","role":"cs","layer":"concl"},{"en":"If we act now, our beautiful planet can be saved for the future.","ko":"우리가 지금 행동한다면, 우리의 아름다운 지구는 미래를 위해 지켜질 수 있습니다.","role":"cs","layer":"concl"}],"expressions":[{"en":"be polluted by ~ (~에 의해 오염되다)","ko":"~에 의해 오염되다"},{"en":"be being harmed (피해를 입고 있다, 진행형 수동태)","ko":"피해를 입고 있다"},{"en":"be thrown away (버려지다)","ko":"버려지다"},{"en":"must be solved (반드시 해결되어야 한다)","ko":"반드시 해결되어야 한다"},{"en":"should be recycled (재활용되어야 한다)","ko":"재활용되어야 한다"},{"en":"be broken down into ~ (~으로 분해되다)","ko":"~으로 분해되다"},{"en":"be trapped in ~ (~에 갇히다)","ko":"~에 갇히다"},{"en":"be caused by ~ (~에 의해 생기다)","ko":"~에 의해 발생하다"},{"en":"be passed on to ~ (~에게 전달되다)","ko":"~에게 전달되다"},{"en":"can be saved (지켜질 수 있다)","ko":"지켜질 수 있다"}],"organizer":{"topic":"다룰 세계 문제 하나를 정하고 '반드시 해결되어야 한다'는 주제문을 수동태로 써요.","s1":"① 첫 번째 문제 현상을 소개해요 → ② This is because로 왜 그런 일이 생기는지 이유를 수동태로 설명해요.","s2":"① 두 번째 피해를 소개해요 → ② For example로 구체적인 예시를 수동태로 들어요.","s3":"① 세 번째 변화를 소개해요 → ② As a result로 이어지는 결과를 수동태로 설명해요.","concl":"우리가 해야 할 행동과 희망을 should/must/can be ~ 수동태로 정리해요."},"flow":{"topic":"플라스틱 오염 = 우리 모두가 해결해야 할 심각한 세계 문제","s1":"바다 오염 소개 → 수많은 페트병이 버려져 바다로 흘러가기 때문","s2":"바다 동물 피해 소개 → 예시: 바다거북이 비닐봉지에 갇혀 죽음","s3":"미세플라스틱으로 분해됨 소개 → 결과: 물고기가 먹고 결국 사람에게 전달됨","concl":"플라스틱을 덜 쓰고 재활용해야 하며, 지금 행동하면 지구를 지킬 수 있음"},"images":""},{"id":"PW-L3C04","level":"L3","grammar":"부정사(too~to / want O to)","chap":4,"grammarLabel":"부정사(to부정사 / too~to / enough to) 사용","grammarTest":"(\\bto\\s+\\w+\\b|too\\s+\\w+\\s+to|enough\\s+to)","title":"Advice for My Future Self","genre":"설득문","note":"배운 문법 <b>부정사(too~to / want O to)</b>를 사용해 미래의 나에게 조언하는 글을 써요.","sample":[{"en":"I want to give some honest advice to my future self.","ko":"나는 미래의 나에게 몇 가지 솔직한 조언을 해 주고 싶다.","role":"ts","layer":"topic"},{"en":"First, I want you to take good care of your health every day.","ko":"첫째, 나는 네가 매일 건강을 잘 돌보기를 바란다.","role":"ss","layer":"s1"},{"en":"This is because you will be too tired to enjoy your life if your body is not healthy.","ko":"이것은 만약 몸이 건강하지 않으면 너무 지쳐서 삶을 즐길 수 없기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, I want you to keep learning new things with an open mind.","ko":"둘째, 나는 네가 열린 마음으로 계속 새로운 것을 배우기를 바란다.","role":"ss","layer":"s2"},{"en":"For example, never say that you are too old to try something new, because learning makes life exciting.","ko":"예를 들어, 배움은 삶을 흥미롭게 만들기 때문에 새로운 것을 시도하기에 너무 나이가 많다고 절대 말하지 마라.","role":"ss","layer":"s2"},{"en":"Third, I want you to spend more time with your family and friends.","ko":"셋째, 나는 네가 가족과 친구들과 더 많은 시간을 보내기를 바란다.","role":"ss","layer":"s3"},{"en":"It is because people sometimes get too busy to call the ones they truly love.","ko":"그것은 사람들이 때때로 너무 바빠서 진심으로 사랑하는 사람들에게 전화조차 하지 못하기 때문이다.","role":"ss","layer":"s3"},{"en":"In short, I want my future self to stay healthy, keep learning, and love the people around me.","ko":"요컨대, 나는 미래의 내가 건강을 유지하고, 계속 배우며, 주변 사람들을 사랑하기를 바란다.","role":"cs","layer":"concl"},{"en":"So, dear future me, please don't wait too long to start living your best life.","ko":"그러니 사랑하는 미래의 나에게, 최고의 삶을 시작하기를 너무 오래 미루지 말기를 바란다.","role":"cs","layer":"concl"}],"expressions":[{"en":"want you to ~ (want O to 사용 가능)","ko":"네가 ~하기를 바라다"},{"en":"too ~ to ... (too~to 사용 가능)","ko":"너무 ~해서 …할 수 없다"},{"en":"give advice to ~","ko":"~에게 조언하다"},{"en":"take care of ~","ko":"~을 돌보다"},{"en":"be too busy to ~ (too~to 사용 가능)","ko":"너무 바빠서 ~할 수 없다"},{"en":"keep learning new things","ko":"새로운 것을 계속 배우다"},{"en":"spend time with ~","ko":"~와 시간을 보내다"},{"en":"stay healthy","ko":"건강을 유지하다"},{"en":"my future self","ko":"미래의 나"},{"en":"the people around me","ko":"내 주변의 사람들"}],"organizer":{"topic":"글의 주제를 한 문장으로 정해요. 미래의 나에게 어떤 조언을 하고 싶은지 want O to로 밝혀요.","s1":"① 첫 번째 조언을 소개해요(예: 건강 돌보기). ② 왜 중요한지 이유를 too~to를 써서 설명해요.","s2":"① 두 번째 조언을 소개해요(예: 계속 배우기). ② For example로 예시나 이유를 too~to와 함께 들어요.","s3":"① 세 번째 조언을 소개해요(예: 가족·친구와 시간 보내기). ② It is because로 이유를 too~to를 써서 설명해요.","concl":"세 가지 조언을 한 문장으로 정리하고, 미래의 나에게 하는 다짐이나 응원으로 마무리해요."},"flow":{"topic":"미래의 나에게 조언을 하고 싶다 (want to give advice)","s1":"건강을 돌보라 → 건강하지 않으면 너무 지쳐서 삶을 즐길 수 없기 때문 (too tired to enjoy)","s2":"계속 배우라 → 배우기에 너무 나이 많다고 말하지 말라, 배움이 삶을 흥미롭게 함 (too old to try)","s3":"가족·친구와 시간을 보내라 → 너무 바빠서 사랑하는 사람에게 전화조차 못 하기 때문 (too busy to call)","concl":"건강·배움·사랑을 정리 (want my future self to ~) → 최고의 삶을 너무 오래 미루지 말라고 응원"},"images":""},{"id":"PW-L3C05","level":"L3","grammar":"동명사 표현(give up ~ing / feel like)","chap":5,"grammarLabel":"동명사 표현(give up/keep/stop/feel like ~ing 등) 사용","grammarTest":"\\b(give up|keep|stop|avoid|feel like|look forward to|be used to|by|after|before)\\s+\\w+ing\\b","title":"A Habit I Want to Give Up","genre":"성찰문","note":"배운 문법 <b>동명사 표현(give up ~ing / feel like)</b>을 활용해 내가 고치고 싶은 습관을 소개하고 다짐하는 글을 써요.","sample":[{"en":"There is one habit I really want to give up: using my phone late at night.","ko":"내가 정말 고치고 싶은 습관이 하나 있는데, 바로 밤늦게 휴대폰을 사용하는 것이다.","role":"ts","layer":"topic"},{"en":"First, I often feel like checking my phone right before I go to sleep.","ko":"첫째, 나는 자기 바로 전에 휴대폰을 확인하고 싶은 마음이 자주 든다.","role":"ss","layer":"s1"},{"en":"It is because I don't want to miss any new messages from my friends.","ko":"그것은 내가 친구들에게서 온 새 메시지를 하나도 놓치고 싶지 않기 때문이다.","role":"ss","layer":"s1"},{"en":"As a result, I stay awake for hours and lose a lot of sleep.","ko":"그 결과, 나는 몇 시간 동안 깨어 있고 잠을 많이 설친다.","role":"ss","layer":"s1"},{"en":"Second, this habit makes it hard for me to wake up in the morning.","ko":"둘째, 이 습관은 내가 아침에 일어나기 힘들게 만든다.","role":"ss","layer":"s2"},{"en":"For example, I often feel like sleeping more, so I skip breakfast almost every day.","ko":"예를 들어, 나는 더 자고 싶은 마음이 자주 들어서 거의 매일 아침을 거른다.","role":"ss","layer":"s2"},{"en":"Third, I have decided to give up scrolling through videos in bed.","ko":"셋째, 나는 침대에서 영상을 넘겨 보는 것을 포기하기로 결심했다.","role":"ss","layer":"s3"},{"en":"This is because I want to protect my eyes and get healthy sleep.","ko":"이것은 내가 눈을 보호하고 건강한 잠을 자고 싶기 때문이다.","role":"ss","layer":"s3"},{"en":"From now on, I will give up using my phone at night and build a better habit.","ko":"이제부터 나는 밤에 휴대폰 사용하는 것을 포기하고 더 나은 습관을 만들 것이다.","role":"cs","layer":"concl"}],"expressions":[{"en":"give up ~ing (~ 사용 가능)","ko":"~하는 것을 포기하다"},{"en":"feel like ~ing (~ 사용 가능)","ko":"~하고 싶은 마음이 들다"},{"en":"stay up late","ko":"늦게까지 깨어 있다"},{"en":"break a bad habit","ko":"나쁜 습관을 고치다"},{"en":"scroll through ~","ko":"~을 넘겨 보다, 스크롤하다"},{"en":"right before ~","ko":"~하기 바로 전에"},{"en":"lose sleep","ko":"잠을 설치다"},{"en":"it is hard to ~","ko":"~하기 어렵다"},{"en":"from now on","ko":"이제부터"},{"en":"build a better habit","ko":"더 나은 습관을 만들다"}],"organizer":{"topic":"내가 고치고 싶은 습관 하나를 정해 주제문으로 소개하세요. (give up ~ing 활용)","s1":"① 그 습관이 언제·어떻게 나타나는지 소개 → ② feel like ~ing로 그 이유를 설명하세요.","s2":"① 그 습관이 주는 문제점을 소개 → ② For example로 구체적인 예시를 들어 설명하세요.","s3":"① 습관을 고치기 위한 나의 다짐을 소개 → ② This is because로 그 이유를 설명하세요.","concl":"앞으로의 결심을 give up ~ing를 넣어 한 문장으로 마무리하세요."},"flow":{"topic":"고치고 싶은 습관 → 밤늦게 휴대폰 사용하는 것을 포기하고 싶음","s1":"자기 전 휴대폰을 확인하고 싶음 → 친구 메시지를 놓치기 싫어서 → 결국 잠을 설침","s2":"아침에 일어나기 힘듦 → 더 자고 싶어 거의 매일 아침을 거름(예시)","s3":"침대에서 영상 보기를 포기하기로 결심 → 눈 보호와 건강한 수면을 위해서","concl":"이제부터 밤에 휴대폰 사용을 포기하고 더 나은 습관을 만들겠다는 다짐"},"images":""},{"id":"PW-L3C06","level":"L3","grammar":"분사·분사구문","chap":6,"grammarLabel":"분사(-ing/-ed 수식·분사구문) 사용","grammarTest":"\\b\\w+(ing|ed)\\b","title":"A Fireworks Night I'll Never Forget","genre":"묘사문","note":"배운 문법 <b>분사·분사구문</b>으로 결코 잊지 못할 장면을 생생하게 묘사하는 글을 써요.","sample":[{"en":"One scene I will never forget is the fireworks show I watched at the summer festival last year.","ko":"내가 결코 잊지 못할 장면은 작년 여름 축제에서 본 불꽃놀이예요.","role":"ts","layer":"topic"},{"en":"The fireworks, exploding high in the dark sky, looked like the most beautiful painting I had ever seen.","ko":"어두운 밤하늘 높이 터지는 불꽃은 내가 본 것 중 가장 아름다운 그림 같았어요.","role":"ss","layer":"s1"},{"en":"It is because each firework filled the sky with bright colors, shining like tiny stars.","ko":"왜냐하면 불꽃 하나하나가 작은 별처럼 빛나며 하늘을 밝은 색으로 가득 채웠기 때문이에요.","role":"ss","layer":"s1"},{"en":"Surrounded by my family, I felt warm and truly happy.","ko":"가족에게 둘러싸여 나는 따뜻하고 정말 행복했어요.","role":"ss","layer":"s2"},{"en":"For example, my little sister, holding my hand, smiled brightly at every light in the sky.","ko":"예를 들어, 내 손을 잡은 여동생은 하늘의 모든 불빛을 보며 환하게 웃었어요.","role":"ss","layer":"s2"},{"en":"The booming sounds, echoing across the river, made my heart beat fast.","ko":"강을 가로질러 울려 퍼지는 쾅쾅 소리는 내 심장을 빠르게 뛰게 했어요.","role":"ss","layer":"s3"},{"en":"As a result, I forgot all my worries and enjoyed that exciting moment with my whole heart.","ko":"그 결과 나는 모든 걱정을 잊고 온 마음으로 그 신나는 순간을 즐겼어요.","role":"ss","layer":"s3"},{"en":"Even now, closing my eyes, I can still see that shining scene in my mind.","ko":"지금도 눈을 감으면 그 빛나는 장면이 여전히 마음속에 보여요.","role":"cs","layer":"concl"},{"en":"That unforgettable night, filled with light and love, will stay in my heart forever.","ko":"빛과 사랑으로 가득했던 그 잊지 못할 밤은 영원히 내 마음에 남을 거예요.","role":"cs","layer":"concl"}],"expressions":[{"en":"a scene I will never forget (분사구 수식 활용 가능)","ko":"내가 결코 잊지 못할 장면"},{"en":"exploding in the night sky","ko":"밤하늘에서 터지는"},{"en":"lighting up the sky","ko":"하늘을 환하게 밝히는"},{"en":"surrounded by my family (분사구문)","ko":"가족에게 둘러싸여"},{"en":"holding my hand","ko":"내 손을 잡은 채"},{"en":"shining like tiny stars","ko":"작은 별처럼 빛나는"},{"en":"echoing across the river","ko":"강을 가로질러 울려 퍼지는"},{"en":"filled with light and love","ko":"빛과 사랑으로 가득 찬"},{"en":"closing my eyes, I can still see ~ (분사구문)","ko":"눈을 감으면 나는 여전히 ~을 볼 수 있다"},{"en":"an unforgettable moment","ko":"잊지 못할 순간"}],"organizer":{"topic":"결코 잊지 못할 장면 하나를 고르고, 언제·어디서 본 장면인지 한 문장으로 소개해요.","s1":"① 그 장면에서 가장 인상 깊었던 모습을 분사(-ing/-ed)로 생생히 소개해요. → ② It is because 등으로 왜 아름다웠는지 이유를 덧붙여요.","s2":"① 함께 있던 사람(가족)을 분사구문(Surrounded by ~)으로 소개해요. → ② For example로 그때의 행동이나 표정을 예시로 설명해요.","s3":"① 그 순간의 소리나 분위기를 분사로 소개해요. → ② As a result로 그 결과 내 기분이 어땠는지 써요.","concl":"눈을 감아도 떠오르는 장면이라며, 그 장면이 마음에 오래 남는다는 느낌으로 마무리해요."},"flow":{"topic":"잊지 못할 장면 = 작년 여름 축제의 불꽃놀이","s1":"밤하늘에 터지는 불꽃 → 작은 별처럼 빛나며 하늘을 색으로 가득 채웠기 때문","s2":"가족에게 둘러싸여 행복함 → 손을 잡은 여동생이 환하게 웃던 예시","s3":"강 위로 울려 퍼지는 소리 → 그 결과 걱정을 잊고 순간을 즐김","concl":"눈을 감으면 지금도 빛나는 장면이 보이고, 그 밤이 영원히 마음에 남음"},"images":""},{"id":"PW-L3C07","level":"L3","grammar":"비교 표현 심화(최상급/the 비교급)","chap":7,"grammarLabel":"비교 표현(최상급 / the 비교급 등) 사용","grammarTest":"(\\bthe\\s+\\w+est\\b|\\bmost\\b|\\bone of the\\b|\\bthan\\b)","title":"Why Health Is My Most Important Value","genre":"설득문","note":"배운 문법 <b>비교 표현 심화(최상급/the 비교급)</b>을 사용해 인생에서 가장 중요한 가치가 무엇인지 설득하는 글을 써요.","sample":[{"en":"In my opinion, health is the most important value in life.","ko":"내 생각에, 건강은 인생에서 가장 중요한 가치이다.","role":"ts","layer":"topic"},{"en":"First, good health is the most valuable treasure that we can ever have.","ko":"첫째, 좋은 건강은 우리가 가질 수 있는 가장 값진 보물이다.","role":"ss","layer":"s1"},{"en":"This is because the healthier we are, the more fully we can enjoy our daily lives.","ko":"왜냐하면 우리가 더 건강할수록, 우리는 일상을 더 온전히 즐길 수 있기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, health is even more important than success at school or work.","ko":"둘째, 건강은 학교나 일에서의 성공보다도 훨씬 더 중요하다.","role":"ss","layer":"s2"},{"en":"For example, the harder we study, the more rest and sleep our bodies need to stay strong.","ko":"예를 들어, 우리가 더 열심히 공부할수록, 우리 몸은 튼튼함을 유지하기 위해 더 많은 휴식과 잠이 필요하다.","role":"ss","layer":"s2"},{"en":"Third, staying healthy makes us happier than we ever expect.","ko":"셋째, 건강을 유지하는 것은 우리가 기대하는 것보다 우리를 더 행복하게 만든다.","role":"ss","layer":"s3"},{"en":"As a result, the more we exercise, the more energy and confidence we gain each day.","ko":"그 결과, 우리가 더 많이 운동할수록, 우리는 매일 더 많은 에너지와 자신감을 얻는다.","role":"ss","layer":"s3"},{"en":"In conclusion, nothing in our life is more important than our health.","ko":"결론적으로, 우리 삶에서 건강보다 더 중요한 것은 없다.","role":"cs","layer":"concl"},{"en":"The earlier we take care of our body, the better our whole life becomes.","ko":"우리가 더 일찍 몸을 돌볼수록, 우리의 인생 전체가 더 좋아진다.","role":"cs","layer":"concl"}],"expressions":[{"en":"the most important value in life","ko":"인생에서 가장 중요한 가치"},{"en":"the most valuable treasure","ko":"가장 값진 보물"},{"en":"more important than ~","ko":"~보다 더 중요한"},{"en":"the healthier ~, the more ~","ko":"더 건강할수록 더 ~하다"},{"en":"nothing is more important than ~","ko":"~보다 더 중요한 것은 없다"},{"en":"happier than we expect","ko":"우리가 기대하는 것보다 더 행복한"},{"en":"take care of one's body","ko":"몸을 돌보다"},{"en":"stay healthy (strong)","ko":"건강을(튼튼함을) 유지하다"},{"en":"gain energy and confidence","ko":"에너지와 자신감을 얻다"},{"en":"the earlier ~, the better ~","ko":"더 일찍 ~할수록 더 좋다"}],"organizer":{"topic":"내가 인생에서 가장 중요하다고 생각하는 가치를 최상급(the most ~)으로 한 문장에 정해 보세요.","s1":"① 그 가치가 왜 최고인지 소개하고 → ② 'the 비교급, the 비교급'으로 그 이유를 설명해 보세요.","s2":"① 그것이 다른 것(성공 등)보다 중요함을 비교급으로 소개하고 → ② 구체적인 예시(For example)로 뒷받침하세요.","s3":"① 그것이 주는 긍정적 효과를 비교급으로 소개하고 → ② 'the 비교급, the 비교급'과 As a result로 결과를 설명하세요.","concl":"'nothing is more important than ~'과 'the 비교급, the 비교급'으로 주제를 다시 강조하며 마무리하세요."},"flow":{"topic":"건강이 인생에서 가장 중요한 가치","s1":"가장 값진 보물 → 건강할수록 일상을 더 온전히 즐김","s2":"성공보다 더 중요 → 열심히 공부할수록 몸에 더 많은 휴식·잠 필요","s3":"우리를 더 행복하게 함 → 운동할수록 더 많은 에너지·자신감 얻음","concl":"건강보다 중요한 것 없음 → 일찍 몸을 돌볼수록 인생 전체가 더 좋아짐"},"images":""},{"id":"PW-L3C08","level":"L3","grammar":"상관접속사(not only but also)","chap":8,"grammarLabel":"상관접속사(not only~but also / both~and 등) 사용","grammarTest":"\\b(not only|but also|both|and|either|or|neither|nor|although|unless)\\b","title":"Both Study and Rest Are Important","genre":"설득문","note":"배운 문법 <b>상관접속사(not only but also)</b>를 사용하여 공부와 휴식이 둘 다 중요한 이유를 설득하는 글을 써요.","sample":[{"en":"Both study and rest are important for a healthy and successful life.","ko":"공부와 휴식은 둘 다 건강하고 성공적인 삶을 위해 중요하다.","role":"ts","layer":"topic"},{"en":"First, studying hard helps us not only gain knowledge but also achieve our dreams.","ko":"첫째, 열심히 공부하는 것은 우리가 지식을 얻을 뿐만 아니라 꿈도 이루도록 도와준다.","role":"ss","layer":"s1"},{"en":"This is because the more we learn, the more chances we can have in the future.","ko":"왜냐하면 더 많이 배울수록 미래에 더 많은 기회를 가질 수 있기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, rest is not only relaxing but also necessary for our brain.","ko":"둘째, 휴식은 편안할 뿐만 아니라 우리의 뇌를 위해서도 꼭 필요하다.","role":"ss","layer":"s2"},{"en":"For example, when we sleep well, we can remember what we studied much more easily.","ko":"예를 들어, 우리가 잘 자면 공부한 것을 훨씬 더 쉽게 기억할 수 있다.","role":"ss","layer":"s2"},{"en":"Third, balancing study and rest makes us not only healthier but also happier.","ko":"셋째, 공부와 휴식의 균형을 맞추는 것은 우리를 더 건강할 뿐만 아니라 더 행복하게도 만든다.","role":"ss","layer":"s3"},{"en":"As a result, students who take breaks often feel less stressed and study better.","ko":"그 결과, 자주 휴식을 취하는 학생들은 스트레스를 덜 느끼고 공부도 더 잘한다.","role":"ss","layer":"s3"},{"en":"In conclusion, both studying and resting are equally important in our daily lives.","ko":"결론적으로, 공부하는 것과 쉬는 것은 둘 다 우리의 일상에서 똑같이 중요하다.","role":"cs","layer":"concl"},{"en":"Therefore, we should value not only studying but also resting every single day.","ko":"그러므로 우리는 매일 공부뿐만 아니라 휴식도 소중히 여겨야 한다.","role":"cs","layer":"concl"}],"expressions":[{"en":"not only A but also B (A뿐만 아니라 B도)","ko":"A뿐만 아니라 B도"},{"en":"be important for ~ (~에 중요하다)","ko":"~에(게) 중요하다"},{"en":"gain knowledge","ko":"지식을 얻다"},{"en":"achieve one's dreams","ko":"꿈을 이루다"},{"en":"take a break","ko":"휴식을 취하다"},{"en":"feel less stressed","ko":"스트레스를 덜 느끼다"},{"en":"balance A and B","ko":"A와 B의 균형을 맞추다"},{"en":"remember what we studied","ko":"공부한 것을 기억하다"},{"en":"the more ~, the more ...","ko":"더 ~할수록, 더 …하다"},{"en":"value ~ every day","ko":"~을 매일 소중히 여기다"}],"organizer":{"topic":"글의 중심 생각을 한 문장으로 정하세요. (예: 공부와 휴식 둘 다 중요하다)","s1":"① 첫 번째 이유를 소개하세요 (공부의 좋은 점) → ② 그 이유를 설명하세요 (배울수록 기회가 많아짐).","s2":"① 두 번째 이유를 소개하세요 (휴식의 필요성) → ② 예시로 설명하세요 (잘 자면 기억이 잘 됨).","s3":"① 세 번째 이유를 소개하세요 (둘의 균형) → ② 결과로 설명하세요 (스트레스 감소, 공부 향상).","concl":"주제문을 다시 정리하며 공부와 휴식 둘 다 소중히 하자고 마무리하세요."},"flow":{"topic":"주제 → 공부와 휴식 둘 다 건강하고 성공적인 삶에 중요하다","s1":"공부의 장점 ① 지식과 꿈 → 더 배울수록 미래 기회가 많아지기 때문","s2":"휴식의 필요성 ① 뇌에 꼭 필요 → 예를 들어 잘 자면 배운 것을 더 잘 기억하기 때문","s3":"둘의 균형 ① 더 건강하고 행복 → 그 결과 휴식하는 학생이 스트레스가 적고 공부를 더 잘함","concl":"마무리 → 둘 다 똑같이 중요하니 매일 공부와 휴식을 소중히 하자"},"images":""},{"id":"PW-L3C09","level":"L3","grammar":"관계부사(where/when)","chap":9,"grammarLabel":"관계사(where/when/why + who/which/that) 사용","grammarTest":"\\b(where|when|why|which|who|that)\\b","title":"The Garden Where I Feel Happy","genre":"묘사문","note":"배운 문법 <b>관계부사(where/when)</b>를 사용해 내가 행복을 느끼는 장소를 소개하고 설명하는 글을 써요.","sample":[{"en":"My favorite place is my grandmother's garden, where I always feel happy and relaxed.","ko":"내가 가장 좋아하는 장소는 할머니의 정원인데, 그곳에서 나는 항상 행복하고 편안함을 느낀다.","role":"ts","layer":"topic"},{"en":"First, the garden is a place where I can enjoy many beautiful flowers.","ko":"첫째로, 정원은 내가 아름다운 꽃들을 즐길 수 있는 장소이다.","role":"ss","layer":"s1"},{"en":"It is because my grandmother grows many kinds of roses and tulips there every year.","ko":"그것은 할머니가 그곳에서 매년 여러 종류의 장미와 튤립을 기르시기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, it is also a place where I spend special time with my family.","ko":"둘째로, 그곳은 또한 내가 가족과 특별한 시간을 보내는 장소이다.","role":"ss","layer":"s2"},{"en":"For example, we often have lunch together under the big tree when the weather is warm.","ko":"예를 들어, 날씨가 따뜻할 때 우리는 종종 큰 나무 아래에서 함께 점심을 먹는다.","role":"ss","layer":"s2"},{"en":"Most of all, the garden reminds me of the days when I was a little child.","ko":"무엇보다도, 그 정원은 내가 어린아이였던 시절을 떠올리게 한다.","role":"ss","layer":"s3"},{"en":"This is because I played there happily every weekend when I was young.","ko":"이것은 내가 어렸을 때 주말마다 그곳에서 행복하게 놀았기 때문이다.","role":"ss","layer":"s3"},{"en":"As a result, the garden is a special place where I can forget all my worries.","ko":"그 결과, 그 정원은 내가 모든 걱정을 잊을 수 있는 특별한 장소이다.","role":"cs","layer":"concl"},{"en":"I really hope I can visit it more often when I have free time.","ko":"나는 시간이 날 때 그곳을 더 자주 방문할 수 있기를 정말로 바란다.","role":"cs","layer":"concl"}],"expressions":[{"en":"a place where I feel happy (~ 사용 가능)","ko":"내가 행복을 느끼는 장소"},{"en":"the place where I can relax (~ 사용 가능)","ko":"내가 쉴 수 있는 장소"},{"en":"a place where I spend time with my family (~ 사용 가능)","ko":"가족과 시간을 보내는 장소"},{"en":"the days when I was a child (~ 사용 가능)","ko":"내가 어린아이였던 시절"},{"en":"the moment when I feel calm (~ 사용 가능)","ko":"내가 차분해지는 순간"},{"en":"remind me of the days when ~ (~ 사용 가능)","ko":"~하던 시절을 떠올리게 하다"},{"en":"a place where I can forget my worries (~ 사용 가능)","ko":"걱정을 잊을 수 있는 장소"},{"en":"feel happy and relaxed (~ 사용 가능)","ko":"행복하고 편안함을 느끼다"},{"en":"spend special time (~ 사용 가능)","ko":"특별한 시간을 보내다"},{"en":"visit it more often when I have free time (~ 사용 가능)","ko":"시간이 날 때 더 자주 방문하다"}],"organizer":{"topic":"내가 행복을 느끼는 장소를 하나 정하고 '~하는 장소(a place where ~)'로 소개해요.","s1":"① 그 장소에서 즐기는 것을 소개 → ② 왜 그런지 이유나 예를 관계부사 where로 설명해요.","s2":"① 그곳에서 하는 활동을 소개 → ② For example로 구체적인 예를 들어 설명해요.","s3":"① 그곳이 떠올리게 하는 추억을 소개 → ② This is because와 관계부사 when으로 이유를 설명해요.","concl":"글을 정리하며 그 장소가 왜 특별한지 다시 강조하고 바람을 덧붙여요."},"flow":{"topic":"내가 행복한 장소 = 할머니의 정원(where 나는 행복함)","s1":"아름다운 꽃 감상 ① 꽃을 즐기는 장소 → ② 할머니가 장미·튤립을 기르시기 때문","s2":"가족과의 시간 ① 가족과 시간 보내는 장소 → ② 예: 따뜻할 때 나무 아래 점심","s3":"어린 시절 추억 ① 어릴 적을 떠올림 → ② 어렸을 때 주말마다 놀았기 때문","concl":"걱정을 잊는 특별한 장소로 정리 + 시간 날 때 자주 가고 싶다는 바람"},"images":""},{"id":"PW-L3C11","level":"L3","grammar":"화법(said/told that)","chap":11,"grammarLabel":"화법(said/told (that) 간접화법) 사용","grammarTest":"\\b(said|told|asked)\\b","title":"The Best Advice My Mother Gave Me","genre":"경험담","note":"배운 문법 <b>화법(said/told that)</b>을 사용해 누군가 나에게 준 최고의 조언을 소개하는 글을 써요.","sample":[{"en":"Everyone receives some advice at some point in their life.","ko":"누구나 인생의 어느 순간에 조언을 듣게 됩니다.","role":"ts","layer":"topic"},{"en":"The best advice someone gave me came from my mother, and I will never forget it.","ko":"누군가 나에게 준 최고의 조언은 우리 엄마에게서 나왔고, 나는 그것을 절대 잊지 못할 것입니다.","role":"ts","layer":"topic"},{"en":"One day, after I failed an important test, my mother told me that mistakes were a part of learning.","ko":"어느 날 내가 중요한 시험에서 떨어졌을 때, 엄마는 나에게 실수도 배움의 일부라고 말해 주었습니다.","role":"ss","layer":"s1"},{"en":"This is because she wanted me to see failure as a chance to grow rather than something to fear.","ko":"이것은 엄마가 내가 실패를 두려운 것이 아니라 성장할 기회로 보길 바라셨기 때문입니다.","role":"ss","layer":"s1"},{"en":"She also said that hard work was more important than natural talent.","ko":"엄마는 또한 노력이 타고난 재능보다 더 중요하다고 말했습니다.","role":"ss","layer":"s2"},{"en":"For example, she told me that she had practiced cooking every single day until she became a wonderful chef.","ko":"예를 들어, 엄마는 훌륭한 요리사가 될 때까지 매일 요리를 연습했다고 나에게 말해 주었습니다.","role":"ss","layer":"s2"},{"en":"In addition, she told me that I should always treat other people with kindness.","ko":"게다가 엄마는 내가 다른 사람들을 항상 친절하게 대해야 한다고 말해 주었습니다.","role":"ss","layer":"s3"},{"en":"It is because she believed that the kindness we give always comes back to us in the end.","ko":"그것은 우리가 베푸는 친절이 결국 우리에게 돌아온다고 엄마가 믿으셨기 때문입니다.","role":"ss","layer":"s3"},{"en":"Thanks to function matchAudience(target,val){
  const t=String(target||'').trim();
  if(!t)return true;
  const list=t.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  return list.includes(String(val||'').trim());
}
function visibleToUser(item){
  return matchAudience(item.targetSchool,USER.school)&&matchAudience(item.targetSchoolGrade,USER.schoolGrade)&&matchAudience(item.targetClass,USER.cls);
}
function toArticlePoint(g){
  const conds=(g.conds||[]).map(c=>{let test;
    if(typeof c.minSentences==='number'){const m=c.minSentences;test=t=>sc(t)>=m;}
    else if(c.regex){try{const re=new RegExp(c.regex,'i');test=t=>re.test(t);}catch(e){test=()=>true;}}
    else test=()=>true;return {label:c.label,test};});
  return {id:g.id,level:g.level,title:g.title,source:g.source||'',body:g.body||'',vocab:g.vocab||[],prompt:g.prompt||'',conds,
    targetSchool:g.targetSchool||'',targetSchoolGrade:g.targetSchoolGrade||'',targetClass:g.targetClass||'',images:g.images||''};
}
const ARTICLE={};
(function mergeArticle(){
  (typeof GENARTICLE!=='undefined'?GENARTICLE:[]).forEach(g=>{
    if(!g||!g.level)return;

   너무 자주 누르지 못하도록 클라이언트에서도 쿨다운(초읽기)을 걸어요 (서버에서도 한 번 더 막아줘요). */
const AI_COND_CHECK_COOLDOWN_SEC=20;
function addAiCondCheckButton(container,ul,getText){
  const row=el('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap';
  const aiBtn=el('button','btn ghost','🤖 AI로 조건 확인하기');aiBtn.type='button';aiBtn.style.cssText='padding:6px 14px;font-size:13px';
  const aiMsg=el('span','fx');
  row.appendChild(aiBtn);row.appendChild(aiMsg);
  container.appendChild(row);
  let cooldownTimer=null;
  const startCooldown=()=>{
    let remain=AI_COND_CHECK_COOLDOWN_SEC;
    aiBtn.disabled=true;
    const orig='🤖 AI로 조건 확인하기';
    aiBtn.textContent=orig+' ('+remain+'초)';
    cooldownTimer=setInterval(()=>{
      remain--;
      if(remain<=0){clearInterval(cooldownTimer);aiBtn.disabled=false;aiBtn.textContent=orig;}
      else aiBtn.textContent=orig+' ('+remain+'초)';
    },1000);
  };
  aiBtn.onclick=async()=>{
    const text=getText();
    if(!text||!text.trim()){aiMsg.className='fx no';aiMsg.textContent='먼저 글을 써주세요.';return;}
    const items=Array.from(ul.querySelectorAll('li'));
    const labels=items.map(li=>li._c.label);
    aiBtn.disabled=true;aiMsg.className='fx';aiMsg.textContent='AI가 확인하는 중… (몇 초 걸릴 수 있어요)';
    try{
      const res=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'checkConditionsAI',studentId:USER.id,text,conditions:labels})});
      let data=null;try{data=await res.json();}catch(e){}
      if(!data||data.ok===false)throw new Error((data&&data.error)||'AI 조건 확인 실패');
      items.forEach((li,i)=>{const ok=!!data.results[i];li.className=ok?'pass':'fail';li.querySelector('.mk').textContent=ok?'✓':'✕';});
      aiMsg.className='fx ok';aiMsg.textContent='✅ AI가 조건을 다시 확인했어요.';
    }catch(e){
      aiMsg.className='fx no';aiMsg.textContent=String(e.message||e);
    }finally{
      startCooldown();
    }
  };
}

/* ================= 임시저장 (시간 안에 다 못 쓰면 이어서 쓰기) ================= */
function debounce(fn,ms){let t=null;return(...args)=>{if(t)clearTimeout(t);t=setTimeout(()=>fn(...args),ms);};}
async function fetchDraft(chapter,point){
  if(!SUBMIT_URL)return null;
  try{
    const res=await fetch(SUBMIT_URL+'?view=draft&studentId='+encodeURIComponent(USER.id)+'&chapter='+encodeURIComponent(chapter)+'&point='+encodeURIComponent(point)+'&academy='+encodeURIComponent(USER.academy||''));
    const data=await res.json();
    if(data&&data.ok&&data.draft){
      try{return{obj:JSON.parse(data.draft),savedAt:data.savedAt||''};}catch(e){return null;}
    }
  }catch(e){}
  return null;
}
function saveDraftNow(chapter,point,stObj){
  if(!SUBMIT_URL)return;
  try{
    fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'saveDraft',id:USER.id,name:USER.name,academy:USER.academy||'',chapter:chapter,point:point,draft:JSON.stringify(stObj)})}).catch(()=>{});

}

let ROSTER=null,TEACHERS=null,rosterLoading=null;
function loadRosterCache(){try{return JSON.parse(store.get('ewl2_roster')||'{}')}catch(e){return {}}}
function saveRosterCache(students,teachers){try{store.set('ewl2_roster',JSON.stringify({students:students||[],teachers:teachers||[]}));}catch(e){}}
function fetchRoster(){
  if(rosterLoading)return rosterLoading;
  rosterLoading=(async()=>{
    if(!SUBMIT_URL)throw new Error('NO_URL');
    const res=await fetch(SUBMIT_URL,{method:'GET'});
    const data=await res.json();
    if(!data||!data.ok||!Array.isArray(data.students))throw new Error('BAD_DATA');
    ROSTER=data.students;TEACHERS=Array.isArray(data.teachers)?data.teachers:[];saveRosterCache(ROSTER,TEACHERS);
    return {students:ROSTER,teachers:TEACHERS};
  })().catch(err=>{rosterLoading=null;throw err;});
  return rosterLoading;
}
function viewLogin(){setWide(false);mountView(w=>{

  const f2=el('div','field');f2.appendChild(el('div','fl','비밀번호'));const pi=el('input','in');pi.type='password';pi.placeholder='비밀번호';pi.autocomplete='current-password';f2.appendChild(pi);
  box.appendChild(f1);box.appendChild(f2);
  const b=el('button','btn','시작하기 ▶');b.style.marginTop='14px';box.appendChild(b);const fx=el('div','fx');box.appendChild(fx);
  const go=async()=>{
    const idv=ni.value.trim(),pwv=pi.value;
    if(!idv){fx.className='fx no';fx.textContent='아이디를 입력하세요.';ni.focus();return;}
    if(!pwv){fx.className='fx no';fx.textContent='비밀번호를 입력하세요.';pi.focus();return;}
    b.disabled=true;const prevLabel=b.textContent;b.textContent='확인 중…';fx.className='fx';fx.textContent='';
    let students=null,teachers=null;
    try{const r=await fetchRoster();students=r.students;teachers=r.teachers;}
    catch(e){const c=loadRosterCache();students=c.students||[];teachers=c.teachers||[];}
    b.disabled=false;b.textContent=prevLabel;
    if((!students||!students.length)&&(!teachers||!teachers.length)){
      fx.className='fx no';fx.textContent='계정 목록을 불러올 수 없어요. 인터넷 연결을 확인하거나 선생님께 문의하세요.';return;
    }
    const tmatch=(teachers||[]).find(s=>String(s.id||'').toLowerCase()===idv.toLowerCase());
    if(tmatch){
      if(String(tmatch.pw||'')!==pwv){fx.className='fx no';fx.textContent='비밀번호가 올바르지 않아요.';pi.value='';pi.focus();return;}
      USER.id=tmatch.id;USER.name=tmatch.name||tmatch.id;USER.role='teacher';
      USER.academy=tmatch.academy||'';USER.isAdmin=!!String(tmatch.isAdmin||'').trim();
      saveSession();applySessionUI();
      fx.className='';fx.textContent='';
      viewTeacherHome();
      return;
    }
    const match=(students||[]).find(s=>String(s.id||'').toLowerCase()===idv.toLowerCase());
    if(!match){fx.className='fx no';fx.textContent='등록되지 않은 아이디예요. 선생님께 확인하세요.';return;}
    if(String(match.pw||'')!==pwv){fx.className='fx no';fx.textContent='비밀번호가 올바르지 않아요.';pi.value='';pi.focus();return;}
    USER.id=match.id;USER.name=match.name||match.id;USER.role='student';
    USER.school=match.school||'';USER.schoolGrade=match.schoolGrade||'';USER.cls=match.cls||'';USER.academy=match.academy||'';
    saveSession();applySessionUI();
    fx.className='';fx.textContent='';
    viewHome();
  };
  b.onclick=go;pi.addEventListener('keydown',e=>{if(e.key==='Enter')go();});ni.addEventListener('keydown',e=>{if(e.key==='Enter')pi.focus();});
  w.appendChild(box);
  setTimeout(()=>ni.focus(),60);
  fetchRoster().catch(()=>{});
});}

function escH(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/** 브레인스토밍·초안 쓰기 화면에서 모르는 단어를 바로 찾아볼 수 있도록 네이버 영어사전을 별도 창으로 열어주는 버튼이에요.

function renderImages(imagesText){

function splitSentences(text){
  const t=String(text||'').trim();
  if(!t)return[];
  // P.E., U.S., Mr. 같은 줄임말 뒤의 마침표를 문장 끝으로 잘못 자르지 않도록 처리해요.
  const ABBR=new Set(['mr','mrs','ms','dr','prof','st','jr','sr','vs','etc','no']);
  const out=[];let start=0;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(c==='!'||c==='?'){
      let j=i;while(j+1<t.length&&/[.!?]/.test(t[j+1]))j++;
      out.push(t.slice(start,j+1).trim());i=j;start=i+1;continue;
    }
    if(c==='.'){
      const next=t[i+1];
      // 마침표 바로 뒤에 공백/줄바꿈이 없으면(예: P.E.) 아직 문장이 안 끝난 걸로 봐요.
      if(next&&!/\s/.test(next))continue;
      const wordBefore=(t.slice(0,i).match(/([A-Za-z]+)$/)||[])[1];
      if(wordBefore&&ABBR.has(wordBefore.toLowerCase()))continue;
      // 마침표 뒤 다음 단어가 소문자로 시작하면(예: "U.S. now") 아직 문장이 안 끝난 걸로 봐요.
      let k=i+1;while(k<t.length&&/\s/.test(t[k]))k++;
      if(k<t.length&&/[a-z]/.test(t[k]))continue;
      let j=i;while(j+1<t.length&&/[.!?]/.test(t[j+1]))j++;
      out.push(t.slice(start,j+1).trim());i=j;start=i+1;
    }
  }
  const rest=t.slice(start).trim();
  if(rest)out.push(rest);
  const res=out.filter(Boolean);
  return res.length?res:[t];
}
function parseFeedback(raw){
  if(!raw)return{overall:'',sentences:{}};
  try{
    const o=JSON.parse(raw);
    if(o&&typeof o==='object'&&!Array.isArray(o))return{overall:o.overall||'',sentences:o.sentences||{}};
  }catch(e){}
  return{overall:String(raw),sentences:{}};
}
/* AI 첨삭은 문장별로 {errors:[{wrong,correct,note}], corrected} 형태라 선생님 첨삭(문자열)과 모양이 달라요. */
function parseAiFeedback(raw){
  if(!raw)return{overall:'',sentences:{}};
  try{
    const o=JSON.parse(raw);
    if(o&&typeof o==='object'&&!Array.isArray(o))return{overall:o.overall||'',sentences:o.sentences||{}};
  }catch(e){}
  return{overall:'',sentences:{}};
}
/** 선생님 화면에서 문장별 AI 첨삭(errors[]+corrected)을 보여주고, "✏️ 수정" 버튼으로 그 문장의
 *  AI 첨삭 내용을 직접 고쳐 쓸 수 있게 해요. 저장하면 같은 문장 번호(idx)의 내용만 덮어쓰고
 *  나머지 문장·총평은 그대로 유지돼요(editAiFeedback은 항상 전체 JSON을 통째로 덮어쓰기 때문에
 *  fbObj.sentences를 통째로 들고 있다가 그 자리에서만 바꿔서 다시 보내요). */
function mountEditableAiSentenceBlock(row,aiEntry,provider,idx,fbObj,accent,s){
  if(!aiEntry||typeof aiEntry!=='object')return; // 옛날 문자열 형태 코멘트는 수정 UI 없이 그대로 보여줘요(호출부에서 처리).
  const wrap=el('div');
  const showView=()=>{
    wrap.innerHTML='';
    const html=renderAiSentenceBlock(aiEntry,'',accent);
    if(html){const box=el('div');box.innerHTML=html;wrap.appendChild(box);}
    const editBtn=el('button','btn ghost','✏️ 수정');editBtn.type='button';editBtn.style.cssText='margin-top:2px;padding:2px 8px;font-size:11px';
    wrap.appendChild(editBtn);
    editBtn.onclick=showEdit;
  };
  const showEdit=()=>{
    wrap.innerHTML='';
    const errors=Array.isArray(aiEntry.errors)?aiEntry.errors:[];
    const errTa=el('textarea','in');errTa.value=errors.map(e=>[e.wrong||'',e.correct||'',e.note||''].join(' | ')).join('\n');
    errTa.placeholder='틀린 부분 | 고친 부분 | 설명(선택) — 한 줄에 하나씩';errTa.style.cssText='min-height:60px;font-size:12.5px';
    const corrInput=el('input','in');corrInput.type='text';corrInput.placeholder='고친 문장 전체 (✔, 선택)';corrInput.value=aiEntry.corrected||'';corrInput.style.cssText='font-size:12.5px;margin-top:4px';
    const btnRow=el('div');btnRow.style.cssText='display:flex;gap:6px;margin-top:6px;align-items:center';
    const saveBtn=el('button','btn blue','저장');saveBtn.type='button';saveBtn.style.cssText='padding:3px 10px;font-size:11px';
    const cancelBtn=el('button','btn ghost','취소');cancelBtn.type='button';cancelBtn.style.cssText='padding:3px 10px;font-size:11px';
    const msg=el('span','fx');
    btnRow.appendChild(saveBtn);btnRow.appendChild(cancelBtn);btnRow.appendChild(msg);
    wrap.appendChild(errTa);wrap.appendChild(corrInput);wrap.appendChild(btnRow);
    cancelBtn.onclick=showView;
    saveBtn.onclick=async()=>{
      if(!s.subId){msg.className='fx no';msg.textContent='이 제출물은 지원하지 않는 예전 형식이에요.';return;}
      saveBtn.disabled=true;const prev=saveBtn.textContent;saveBtn.textContent='저장 중…';
      const newErrors=errTa.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
        const p=l.split('|').map(x=>x.trim());
        return {wrong:p[0]||'',correct:p[1]||'',note:p[2]||''};
      }).filter(e=>e.wrong);
      const newEntry={errors:newErrors,corrected:corrInput.value};
      fbObj.sentences=fbObj.sentences||{};
      fbObj.sentences[idx]=newEntry;
      const aiFeedbackStr=JSON.stringify({overall:fbObj.overall||'',sentences:fbObj.sentences});
      try{
        const res=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'editAiFeedback',subId:s.subId,provider:provider,aiFeedback:aiFeedbackStr,academy:s.academy||''})});
        let data=null;try{data=await res.json();}catch(e){}
        if(!data||!data.ok)throw new Error((data&&data.error)||'저장하지 못했어요.');
        aiEntry=newEntry;showView();
      }catch(e){
        msg.className='fx no';msg.textContent=String(e.message||e);saveBtn.disabled=false;saveBtn.textContent=prev;
      }
    };
  };
  showView();
  row.appendChild(wrap);
}
/* '오류 문장 바르게 고쳐 쓰기' 답안지 스타일(• 틀린 부분 → 고친 부분   설명 / ✔ 고친 문장)로 AI 첨삭 한 문장분을 그려요.
   label/accent로 어느 AI인지(Claude·GPT) 구분해서 보여줘요. */
function renderAiSentenceBlock(aiEntry,label,accent){
  label=label||'선생님 첨삭';accent=accent||'#4338ca';
  if(!aiEntry)return '';
  if(typeof aiEntry==='string'){
    return aiEntry?('<div style="margin-top:4px;color:'+accent+';font-size:13px">👩‍🏫 '+escH(aiEntry)+'</div>'):'';
  }
  const errors=Array.isArray(aiEntry.errors)?aiEntry.errors:[];
  if(!errors.length)return '';
  // 문장마다 "👩‍🏫 선생님 첨삭"이라는 같은 글자가 반복돼서 지저분해 보였던 부분 — 라벨은 빼고
  // 왼쪽 색깔 띠(accent)로만 어느 AI인지 구분해요. 전체 요약 박스 쪽엔 라벨이 그대로 남아있어요.
  let html='<div style="margin-top:4px;background:#eef0ff;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.7;border-left:3px solid '+accent+'">';
  errors.forEach(e=>{
    html+='<div style="color:#374151">• '+escH(e.wrong)+' → <b style="color:'+accent+'">'+escH(e.correct)+'</b>'+(e.note?('&nbsp;&nbsp;'+escH(e.note)):'')+'</div>';
  });
  if(aiEntry.corrected){
    html+='<div style="margin-top:4px;color:#15803d">✔ '+escH(aiEntry.corrected)+'</div>';
  }
  html+='</div>';
  return html;
}

/** 문장 안에서 틀린 부분(errors[].wrong)만 찾아 그 자리에만 취소선을 긋고 바로 옆에 고친 표현을 붙여요.
 *  (문장 전체를 긋지 않고, 나머지 부분은 그대로 둬요.) 여러 개의 오류가 있으면 문장에서 나온 순서대로 처리해요. */
function renderInlineDiff(sentence,errors,color){
  if(!errors||!errors.length)return escH(sentence);
  const found=errors.map(e=>({e,idx:(e&&e.wrong)?sentence.indexOf(e.wrong):-1})).filter(x=>x.idx>-1).sort((a,b)=>a.idx-b.idx);
  if(!found.length)return escH(sentence);
  let out='',pos=0;
  found.forEach(({e,idx})=>{
    if(idx<pos)return; // 겹치는 위치는 건너뛰어요 (이미 앞 오류가 그 자리를 덮었어요)
    out+=escH(sentence.slice(pos,idx));
    out+='<s style="color:#dc2626">'+escH(e.wrong)+'</s> <b style="color:'+color+'">'+escH(e.correct||'')+'</b>'+(e.note?(' <span style="color:#7c3aed;font-size:12px">('+escH(e.note)+')</span>'):'');
    pos=idx+e.wrong.length;
  });
  out+=escH(sentence.slice(pos));
  return out;
}

  if(aifbGpt.overall){
    const b2=el('div');b2.style.cssText='background:#e6f6f3;border-radius:12px;padding:14px 16px;margin-top:10px;font-size:14px;line-height:1.7;white-space:pre-line';
    b2.innerHTML='<b>👩‍🏫 선생님 첨삭</b><br>'+escH(aifbGpt.overall);
    leftScroll.appendChild(b2);
  }
  if(fb.overall){
    const b3=el('div');b3.style.cssText='background:var(--green-soft);border-radius:12px;padding:14px 16px;margin-top:10px;font-size:14px;line-height:1.7;white-space:pre-line';
    b3.innerHTML='<b>👩‍🏫 선생님 첨삭</b><br>'+escH(fb.overall);
    leftScroll.appendChild(b3);
  }
  // 문장별로 별도 목록을 아래에 다시 나열하지 않고, 원문 안 틀린 부분(빨간 줄)에만 줄을 긋고 바로 옆에 고친 표현을 붙여서 보여줘요.
  // (수정된 적 없는 문장·부분은 그대로 보여요.) 이 참고자료 영역은 자체 스크롤이 있어서, 길어져도 오른쪽 다시쓰기 칸을 안 가려요.
  const rewriteConds=[];
  const seenCorrect=new Set();
  if(sub.text){
    const sents=splitSentences(sub.text);
    const listWrap=el('div');listWrap.style.marginTop='14px';
    listWrap.appendChild(el('div','fl','✍️ 원래 쓴 글 (틀린 부분은 빨간 줄, 고친 표현·해설을 옆에 표시했어요)'));
    sents.forEach((sent,i)=>{
      const ai=aifb.sentences[i]||aifb.sentences[String(i)];
      const aiGpt=aifbGpt.sentences[i]||aifbGpt.sentences[String(i)];
      const c=fb.sentences[i]||fb.sentences[String(i)];
      const aiObj=(ai&&typeof ai==='object')?ai:null;
      const aiGptObj=(aiGpt&&typeof aiGpt==='object')?aiGpt:null;
      const row=el('div');row.style.cssText='border:1px solid rgba(0,0,0,.06);border-radius:8px;padding:8px 10px;margin-top:6px;background:#faf9fb;font-size:14px;line-height:1.7';
      let mainLine='';
      if(aiObj&&Array.isArray(aiObj.errors)&&aiObj.errors.length)mainLine+='<div>'+renderInlineDiff(sent,aiObj.errors,'#4338ca')+'</div>';
      if(aiGptObj&&Array.isArray(aiGptObj.errors)&&aiGptObj.errors.length)mainLine+='<div'+(mainLine?' style="margin-top:4px"':'')+'>'+renderInlineDiff(sent,aiGptObj.errors,'#0f766e')+'</div>';
      if(!mainLine)mainLine=escH(sent);
      [aiObj,aiGptObj].forEach(entry=>{
        if(!entry||!Array.isArray(entry.errors))return;
        entry.errors.forEach(e=>{
          const key=norm(e.correct);
          if(e.correct&&key&&!seenCorrect.has(key)){seenCorrect.add(key);rewriteConds.push({label:'"'+e.correct+'"로 고쳐 쓰기',test:t=>norm(t).includes(key)});}
        });
      });
      let detail='';
      if(c)detail+='<div style="margin-top:2px;color:#b45309;font-size:13px">💬 '+escH(c)+'</div>';
      row.innerHTML=mainLine+(detail?('<div style="margin-top:4px">'+detail+'</div>'):'');
      listWrap.appendChild(row);
    });
    leftScroll.appendChild(listWrap);
  }
  wmid.appendChild(el('div','fl','✍️ 다시 쓰기'));
  const ta=el('textarea','in');ta.placeholder='고쳐진 내용을 참고해서 전체를 처음부터 다시 써보세요.';ta.style.cssText='flex:1;min-height:420px;resize:vertical';
  wmid.appendChild(ta);
  let rewriteUl=null;
  if(rewriteConds.length){
    wright.appendChild(el('div','fl','고쳐진 대로 반영했는지 확인 (입력하는 동안 실시간으로 확인돼요)'));
    rewriteUl=el('ul','conds');
    rewriteConds.forEach(cn=>{const li=el('li',null,'<span class="mk">·</span>'+escH(cn.label));li._c=cn;rewriteUl.appendChild(li);});
    wright.appendChild(rewriteUl);
    const checkRewriteConds=()=>{rewriteUl.querySelectorAll('li').forEach(li=>{const ok=li._c.test(ta.value);li.className=ok?'pass':'fail';li.querySelector('.mk').textContent=ok?'✓':'✕';});};
    ta.addEventListener('input',checkRewriteConds);
    checkRewriteConds();
    addAiCondCheckButton(wright,rewriteUl,()=>ta.value);
  }
  const fx=el('div','fx');wmid.appendChild(fx);
  const subBtn=el('button','btn green','다시 쓴 글 제출하기');subBtn.type='button';subBtn.style.marginTop='10px';
  wmid.appendChild(subBtn);
  subBtn.onclick=async()=>{
    if(!ta.value.trim()){fx.className='fx no';fx.textContent='다시 쓴 글을 입력해주세요.';return;}
    subBtn.disabled=true;const prev=subBtn.textContent;subBtn.textContent='제출 중…';
    const now=new Date(),z=x=>String(x).padStart(2,'0');
    const dt=now.getFullYear()+'-'+z(now.getMonth()+1)+'-'+z(now.getDate())+' '+z(now.getHours())+':'+z(now.getMinutes());
    const payload={book:'',chapter:'Rewriting',point:sub.point||sub.chapter||'',name:USER.name,id:USER.id,school:USER.school||'',schoolGrade:USER.schoolGrade||'',cls:USER.cls||'',academy:USER.academy||'',subId:genSubId(),datetime:dt,
      final:ta.value,progress:'원본 제출: '+(sub.datetime||'')};
    let sent=false;
    if(SUBMIT_URL){try{await fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});sent=true;}catch(e){}}
    subBtn.disabled=false;subBtn.textContent=sent?'제출 완료!':prev;
    if(sent){
      fx.className='fx ok';fx.textContent='제출했어요! 선생님이 다시 확인할 수 있어요.';
      const hb=el('button','btn ghost','← 목록으로');hb.style.marginTop='10px';hb.onclick=viewRewriteList;wmid.appendChild(hb);
    } else {
      fx.className='fx no';fx.textContent='제출하지 못했어요. 인터넷 연결을 확인하세요.';
    }
  };
});}

function uniqSorted(arr){return Array.from(new Set(arr.filter(v=>v!=null&&v!=='').map(v=>String(v)))).sort((a,b)=>a.localeCompare(b,'ko'));}
const EXAM_TYPE_OPTS=[['','전체'],['문법드릴','문법드릴'],['글쓰기','글쓰기'],['기사요약','기사요약'],['수행평가','수행평가'],['Re-Writing','Re-Writing']];
function viewTeacherHome(){setWide(false);mountView(w=>{

  aiChatBotBtn.onclick=()=>viewAiContentChatBot();

  // 선생님이 직접 사이트에서 고칠 수 있어야 해서예요. 학생 명단 관리는 계정 관리라 관리자 전용으로 남겨둬요.

  if(USER.isAdmin){

    manageLevelsBtn.onclick=()=>viewLevelManage();
    titleRow.appendChild(manageLevelsBtn);
    const manageStudentsBtn=el('button','btn ghost','👥 학생 명단 관리');manageStudentsBtn.type='button';manageStudentsBtn.style.cssText='padding:10px 18px;font-size:14px';
    manageStudentsBtn.onclick=()=>viewStudentManage();

  w.appendChild(titleRow);
  w.appendChild(el('div','hint',USER.isAdmin?'모든 학원의 학생을 볼 수 있어요. 학원·학교·학년·반·컨텐츠로 좁혀보고, 학생을 선택하면 제출한 글과 점수를 보고 첨삭을 남길 수 있어요.':'학교·학년·반·컨텐츠로 좁혀보고, 학생을 선택하면 제출한 글과 점수를 보고 첨삭을 남길 수 있어요.'));
  const filterBox=el('div');filterBox.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin:14px 0';
  w.appendChild(filterBox);
  const box=el('div','chapter');box.appendChild(el('div','ch-h','학생 목록'));
  const loading=el('div','hint','불러오는 중…');box.appendChild(loading);
  w.appendChild(box);
  const mkSelect=(label)=>{const wrap=el('div');wrap.style.cssText='display:flex;flex-direction:column;gap:4px;min-width:110px';
    const lb=el('div','hint',label);lb.style.fontSize='12px';wrap.appendChild(lb);
    const sel=el('select','in');sel.style.cssText='padding:8px 10px;font-size:14px;border-radius:10px';wrap.appendChild(sel);
    return{wrap,sel};};
  const fAcademy=USER.isAdmin?mkSelect('학원'):null;
  const fSchool=mkSelect('학교'),fGrade=mkSelect('학년'),fCls=mkSelect('반'),fType=mkSelect('컨텐츠');
  if(fAcademy)filterBox.appendChild(fAcademy.wrap);
  [fSchool,fGrade,fCls,fType].forEach(f=>filterBox.appendChild(f.wrap));
  EXAM_TYPE_OPTS.forEach(([v,label])=>{const o=el('option');o.value=v;o.textContent=label;fType.sel.appendChild(o);});
  filterBox.style.display='none';
  (async()=>{
    let all=[];
    try{
      const res=await fetch(SUBMIT_URL+'?view=all_submissions&academy='+encodeURIComponent(USER.academy||'')+'&admin='+(USER.isAdmin?'1':'0')+'&_t='+Date.now(),{cache:'no-store'});
      const data=await res.json();
      if(data&&data.ok)all=data.submissions||[];
    }catch(e){}
    if(!USER.isAdmin)all=all.filter(s=>String(s.academy||'')===String(USER.academy||''));
    loading.remove();
    if(!all.length){box.appendChild(el('div','hint','아직 제출된 내역이 없어요.'));return;}
    const opt0=(sel,label)=>{const o=el('option');o.value='';o.textContent=label;sel.appendChild(o);};
    if(fAcademy){opt0(fAcademy.sel,'학원 전체');uniqSorted(all.map(s=>s.academy)).forEach(v=>{const o=el('option');o.value=v;o.textContent=v||'(학원 미지정)';fAcademy.sel.appendChild(o);});}
    opt0(fSchool.sel,'학교 전체');uniqSorted(all.map(s=>s.school)).forEach(v=>{const o=el('option');o.value=v;o.textContent=v;fSchool.sel.appendChild(o);});
    opt0(fGrade.sel,'학년 전체');uniqSorted(all.map(s=>s.schoolGrade)).forEach(v=>{const o=el('option');o.value=v;o.textContent=v;fGrade.sel.appendChild(o);});
    opt0(fCls.sel,'반 전체');uniqSorted(all.map(s=>s.cls)).forEach(v=>{const o=el('option');o.value=v;o.textContent=v;fCls.sel.appendChild(o);});
    filterBox.style.display='flex';
    const render=()=>{
      Array.from(box.children).slice(1).forEach(c=>c.remove());
      const fa=fAcademy?fAcademy.sel.value:'',fs=fSchool.sel.value,fg=fGrade.sel.value,fc=fCls.sel.value,ft=fType.sel.value;
      const filtered=all.filter(s=>(!fa||s.academy===fa)&&(!fs||s.school===fs)&&(!fg||s.schoolGrade===fg)&&(!fc||s.cls===fc)&&(!ft||s.type===ft));
      const counts={};
      filtered.forEach(s=>{
        if(!s.id)return;
        if(!counts[s.id])counts[s.id]={id:s.id,name:s.name,academy:s.academy,school:s.school,schoolGrade:s.schoolGrade,cls:s.cls,count:0,lastAt:''};
        counts[s.id].count++;
        if(String(s.datetime||'')>counts[s.id].lastAt)counts[s.id].lastAt=String(s.datetime||'');
      });
      const studentsOut=Object.values(counts).sort((a,b)=>b.lastAt<a.lastAt?-1:1);
      if(!studentsOut.length){box.appendChild(el('div','hint','조건에 맞는 제출 내역이 없어요.'));return;}
      studentsOut.forEach(s=>{
        const row=el('div','point');

        const ctx=[USER.isAdmin?s.academy:'',s.school,s.schoolGrade&&(s.schoolGrade+'학년'),s.cls].filter(Boolean).join(' · ');

        row.appendChild(el('div','meta',s.count+'건 제출 · 최근 '+String(s.lastAt||'').slice(0,16)));
        row.onclick=()=>viewTeacherStudent(s.id,s.name||s.id);
        box.appendChild(row);
      });
    };
    (fAcademy?[fAcademy.sel,fSchool.sel,fGrade.sel,fCls.sel,fType.sel]:[fSchool.sel,fGrade.sel,fCls.sel,fType.sel]).forEach(sel=>sel.addEventListener('change',render));
    render();
  })();
});}

/** 컨텐츠 추가/수정 화면의 "👀 미리보기"에서 씀 — 저장하기 전에 지금 입력된 값(또는 AI와 대화해서 나온 값)으로
 *  학생 화면과 비슷한 느낌을 간단히 보여줘요. 실제 학생 화면 로직(퀴즈·단어배열 등 인터랙션)을 그대로 재현하진 않고,
 *  제목·설명·조건·이미지처럼 핵심 내용 위주로 정적으로 흉내낸 미리보기예요. */
function buildContentPreview(type, vals, imgUrls){
  const wrap=el('div');wrap.style.cssText='display:flex;flex-direction:column;gap:12px';
  const imgsHtml=(imgUrls&&imgUrls.length)?renderImages(imgUrls.join('\n')):null;
  const title=el('div');title.style.cssText='font-size:19px;font-weight:800';title.textContent=vals.title||'(제목 없음)';
  wrap.appendChild(title);
  if(imgsHtml)wrap.appendChild(imgsHtml);
  let blockCount=0;
  const addBlock=(label,html)=>{
    if(!html)return;
    blockCount++;
    const b=el('div');
    b.innerHTML='<div style="font-weight:700;font-size:12.5px;color:#6b7684;margin-bottom:4px">'+escH(label)+'</div><div style="font-size:14px;line-height:1.7;white-space:pre-wrap">'+html+'</div>';
    wrap.appendChild(b);
  };
  const linesToHtml=(text)=>String(text||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>'- '+escH(x)).join('<br>');
  if(type==='pattern'){
    addBlock('설명 노트', vals.explainNote?escH(vals.explainNote):'');
    const parts=String(vals.explainPartsText||'').split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{
      const m=line.match(/^텍스트\s*:\s*(.*)$/);
      if(m)return escH(m[1]);
      const m2=line.match(/^키워드\s*:\s*(.*)$/);
      const rest=m2?m2[1]:line;
      const pp=rest.split('|').map(x=>x.trim());
      return '<b>'+escH(pp[0]||'')+'</b>'+(pp[1]?' — '+escH(pp[1]):'');
    }).join('<br><br>');
    addBlock('개념 설명', parts);
    addBlock('과제 프롬프트', vals.taskPrompt?escH(vals.taskPrompt):'');
    addBlock('과제 조건', linesToHtml(vals.taskCondText));
  } else if(type==='paragraph'){
    const samples=String(vals.sampleText||'').split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{
      const pp=line.split('|').map(x=>x.trim());
      return escH(pp[0]||'')+(pp[1]?' <span style="color:#6b7684">('+escH(pp[1])+')</span>':'');
    }).join('<br>');
    addBlock('예시 문단', samples);
    const outline=['orgTopic','orgS1','orgS2','orgS3','orgConcl'].map(k=>vals[k]).filter(Boolean).map(escH).join('<br>');
    addBlock('개요짜기', outline);
  } else if(type==='article'){
    addBlock('출처', vals.source?escH(vals.source):'');
    addBlock('기사 본문', vals.body?escH(vals.body):'');
    addBlock('과제 프롬프트', vals.prompt?escH(vals.prompt):'');
    addBlock('단어 목록', linesToHtml(vals.vocabText));
    addBlock('조건', linesToHtml(vals.condText));
  } else if(type==='exam'){
    addBlock('과제 프롬프트', vals.prompt?escH(vals.prompt):'');
    if(vals.evalAreaText){ blockCount++; addBlock('평가 영역', renderEvalAreas(vals.evalAreaText)); }
  }
  if(!blockCount && !imgsHtml){
    wrap.appendChild(el('div','hint','아직 미리볼 내용이 없어요. 위 입력 칸을 채우거나 AI와 대화해서 채운 뒤 다시 눌러보세요.'));
  }
  return wrap;
}
/** 평가 영역 텍스트("영역명 | 영역만점 | 요소1; 요소2 ...", 한 줄에 하나)를 학생이 보기 좋은 HTML로 바꿔줘요.
 *  형식을 안 지킨 줄(구분자 없는 옛날 자유 서술형 평가 기준)도 앞에 "- "를 붙여 목록처럼 보여줘요. */
function renderEvalAreas(text){
  if(!text)return '';
  return String(text).split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{
    const parts=line.split('|').map(x=>x.trim());
    if(parts.length>=2){
      const area=parts[0],maxScore=parts[1],factors=(parts[2]||'').split(';').map(x=>x.trim()).filter(Boolean);
      let html='<div style="margin-top:8px"><b>'+escH(area)+'</b>'+(maxScore?' <span style="color:#6b7684;font-weight:600">(만점 '+escH(maxScore)+'점)</span>':'')+'</div>';
      html+=factors.length?factors.map(f=>'<div style="padding-left:6px">- '+escH(f)+'</div>').join(''):(parts[2]?'<div style="padding-left:6px">- '+escH(parts[2])+'</div>':'');
      return html;
    }
    return '<div>- '+escH(line)+'</div>';
  }).join('');
}

/* ---- 종류 구분 없이 한 번에 대화하는 AI 챗봇 — 대화로 내용을 다 만든 뒤 "이어서 만들기"로 해당 종류의
 *      추가 화면으로 넘어가면, 거기서 이미지 추가·최종 저장까지 마무리해요. ---- */
function viewAiContentChatBot(){setWide(true);mountView(w=>{
  const bk=el('button','backbtn','◀ 홈으로');bk.onclick=()=>viewTeacherHome();w.appendChild(bk);
  w.appendChild(el('h1','title','🤖 AI 챗봇으로 컨텐츠 만들기'));
  w.appendChild(el('div','hint','문법 드릴·문단 쓰기·기사 요약·수행평가 중 어떤 종류인지 먼저 고르지 않아도 돼요 — 그냥 원하는 걸 편하게 말하면 AI가 알아서 종류를 판단하고 내용을 채워가요. 다 됐으면 오른쪽의 "이어서 만들기"를 눌러 해당 종류의 추가 화면으로 넘어가서 이미지 추가와 최종 저장을 마무리하면 돼요.'));

  const cols=el('div');cols.style.cssText='display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-top:14px';
  const leftCol=el('div');leftCol.style.cssText='flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:10px';
  const rightCol=el('div');rightCol.style.cssText='flex:1 1 380px;min-width:280px;display:flex;flex-direction:column;gap:10px';
  cols.appendChild(leftCol);cols.appendChild(rightCol);
  w.appendChild(cols);

  const chatBox=el('div');chatBox.style.cssText='background:#eef0ff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px';
  const chatLog=el('div');chatLog.style.cssText='display:flex;flex-direction:column;gap:8px;min-height:200px;max-height:460px;overflow-y:auto;padding-right:4px';
  chatBox.appendChild(chatLog);
  const chatInputRow=el('div');chatInputRow.style.cssText='display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap';
  const chatInput=el('textarea','in');chatInput.rows=2;chatInput.placeholder='예: 현재완료 문법 드릴 하나 만들어줘 / 환경 오염 주제로 수행평가 글쓰기 만들어줘';chatInput.style.cssText='flex:1;min-width:200px;padding:10px;font-size:14px;border-radius:10px;font-family:var(--sans)';
  const chatPhotoBtn=el('button','btn ghost','📷 사진 첨부');chatPhotoBtn.type='button';chatPhotoBtn.style.cssText='padding:9px 12px;font-size:13px';
  const chatSendBtn=el('button','btn blue','보내기');chatSendBtn.type='button';chatSendBtn.style.cssText='padding:9px 16px;font-size:14px';
  const chatPhotoInput=el('input');chatPhotoInput.type='file';chatPhotoInput.accept='image/*';chatPhotoInput.style.display='none';
  chatInputRow.appendChild(chatInput);chatInputRow.appendChild(chatPhotoBtn);chatInputRow.appendChild(chatSendBtn);
  chatBox.appendChild(chatInputRow);chatBox.appendChild(chatPhotoInput);
  const chatMsg=el('div','fx');chatBox.appendChild(chatMsg);
  leftCol.appendChild(chatBox);

  const statusBox=el('div');statusBox.style.cssText='background:#fff;border:1.5px solid #e2e2ee;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px';
  const typeBadge=el('div');typeBadge.style.cssText='font-size:13px;font-weight:700;color:#4338ca';
  statusBox.appendChild(typeBadge);
  const previewContent=el('div');previewContent.style.cssText='background:#f7f7fb;border-radius:10px;padding:14px';
  statusBox.appendChild(previewContent);
  const continueBtn=el('button','btn green','✅ 이 내용으로 이어서 만들기');continueBtn.type='button';continueBtn.style.cssText='display:none;align-self:flex-start';
  statusBox.appendChild(continueBtn);
  rightCol.appendChild(statusBox);

  let chatHistory=[];
  let chatType='';
  let fieldsAccum={};
  let chatPendingImage=null;

  function chatBubble(role,text){
    const b=el('div');
    const isUser=role==='user';
    b.style.cssText='max-width:85%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;'+(isUser?'align-self:flex-end;background:#4338ca;color:#fff':'align-self:flex-start;background:#fff;color:#1c1c28;border:1px solid #e2e2ee');
    b.textContent=text;
    return b;
  }
  function renderChatLog(){
    chatLog.innerHTML='';
    chatHistory.forEach(m=>{ chatLog.appendChild(chatBubble(m.role,m.content)); });
    chatLog.scrollTop=chatLog.scrollHeight;
  }
  function refreshStatus(){
    if(chatType){
      const spec=CONTENT_FORMS[chatType];
      typeBadge.textContent='감지된 종류: '+spec.emoji+' '+spec.label;
      previewContent.innerHTML='';
      previewContent.appendChild(buildContentPreview(chatType, fieldsAccum, []));
      continueBtn.style.display=fieldsAccum.title?'inline-block':'none';
    } else {
      typeBadge.textContent='아직 종류를 판단하지 못했어요 — 대화를 시작해보세요.';
      previewContent.innerHTML='';
      continueBtn.style.display='none';
    }
  }
  continueBtn.onclick=()=>{
    try{
      localStorage.setItem('ewlDraft_'+(USER.id||'anon')+'_'+chatType+'_new', JSON.stringify({fields:fieldsAccum, imageUrls:[], chatHistory:[], savedAt:Date.now()}));
    }catch(e){}
    viewAddContentForm(chatType);
  };
  chatPhotoBtn.onclick=()=>chatPhotoInput.click();
  chatPhotoInput.onchange=async()=>{
    const file=chatPhotoInput.files&&chatPhotoInput.files[0];
    if(!file)return;
    try{
      const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
      const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=dataUrl;});
      const maxDim=1600;let w2=img.width,h2=img.height;
      if(w2>maxDim||h2>maxDim){const scale=maxDim/Math.max(w2,h2);w2=Math.round(w2*scale);h2=Math.round(h2*scale);}
      const canvas=document.createElement('canvas');canvas.width=w2;canvas.height=h2;
      canvas.getContext('2d').drawImage(img,0,0,w2,h2);
      const jpegUrl=canvas.toDataURL('image/jpeg',0.82);
      chatPendingImage={mediaType:'image/jpeg',data:jpegUrl.split(',')[1]};
      chatMsg.className='fx ok';chatMsg.textContent='📎 사진을 첨부했어요. 메시지를 보내면 같이 전달돼요.';
    }catch(e){
      chatMsg.className='fx no';chatMsg.textContent='사진을 처리하지 못했어요.';
    }finally{
      chatPhotoInput.value='';
    }
  };
  async function sendChatMsg(){
    const text=chatInput.value.trim();
    if(!text&&!chatPendingImage)return;
    chatHistory.push({role:'user',content:text||'(사진 첨부)'});
    renderChatLog();
    chatInput.value='';
    chatSendBtn.disabled=true;chatMsg.className='fx';chatMsg.textContent='AI가 답하는 중… (몇 초 걸릴 수 있어요)';
    const fieldsByType={};
    Object.keys(CONTENT_FORMS).forEach(t=>{ fieldsByType[t]=CONTENT_FORMS[t].fields.map(f=>({key:f.key,label:f.label,hint:f.ph||''})); });
    const body={ action:'chatContentAny', fieldsByType, lockedType:chatType, messages:chatHistory };
    if(chatPendingImage)body.image=chatPendingImage;
    chatPendingImage=null;
    try{
      const res=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
      let data=null;try{data=await res.json();}catch(e){}
      if(!data||data.ok===false)throw new Error((data&&data.error)||'AI 응답 실패');
      chatHistory.push({role:'assistant',content:data.reply||'(응답 없음)'});
      renderChatLog();
      if(data.contentType)chatType=data.contentType;
      Object.keys(data.fields||{}).forEach(k=>{ fieldsAccum[k]=data.fields[k]; });
      refreshStatus();
      chatMsg.className='fx ok';chatMsg.textContent=chatType?'✅ 답을 받았어요. 오른쪽에서 확인해보세요.':'✅ 답을 받았어요.';
    }catch(e){
      chatMsg.className='fx no';chatMsg.textContent=String(e.message||e);
      chatHistory.pop();
      renderChatLog();
    }finally{
      chatSendBtn.disabled=false;
    }
  }
  chatSendBtn.onclick=sendChatMsg;
  chatInput.onkeydown=(e)=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChatMsg(); } };
  refreshStatus();
});}

        const preview=el('div');preview.style.cssText='font-size:12.5px;color:#6b7684;margin-top:6px;white-space:pre-wrap;max-height:160px;overflow:auto';
        preview.textContent=Object.keys(r.fields).map(k=>{
          const f=spec.fields.find(x=>x.key===k);
          return '['+(f?f.label:k)+']\n'+r.fields[k];
        }).join('\n\n')||'(채울 내용이 없었어요)';
        card.appendChild(preview);
      }
      compareBox.appendChild(card);
    });
    compareBox.style.display=any?'flex':'none';
  };
  const runAiFill=async(extra,btn,msgEl,busyText)=>{
    const seed={};spec.fields.forEach(f=>{const v=refs[f.key].value;if(v&&v.trim())seed[f.key]=v.trim();});
    btn.disabled=true;msgEl.className='fx';msgEl.textContent=busyText;compareBox.style.display='none';
    try{
      const res=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({
        action:'generateContent',contentType:type,seed,
        fields:spec.fields.map(f=>({key:f.key,label:f.label,hint:f.ph||''}))
      },extra))});
      let data=null;try{data=await res.json();}catch(e){}
      if(!data||data.ok===false)throw new Error((data&&data.error)||'AI 자동 채우기 실패');
      renderCompare(data.results);
      const provCount=Object.keys(data.results||{}).length;
      msgEl.className='fx ok';msgEl.textContent=provCount?('✅ 결과를 받았어요. 아래에서 비교해보고 원하는 쪽을 적용하세요.'):'채울 빈 칸이 없었어요.';
    }catch(e){
      msgEl.className='fx no';msgEl.textContent=String(e.message||e);
    }finally{
      btn.disabled=false;
    }
  };
  genBtn.onclick=()=>{
    const titleVal=(refs.title&&refs.title.value||'').trim();
    if(!titleVal){genMsg.className='fx no';genMsg.textContent='제목(주제)을 먼저 입력해주세요.';return;}
    runAiFill({},genBtn,genMsg,'AI가 채우는 중… (몇 초 걸릴 수 있어요)');
  };
  imgBtn.onclick=()=>imgInput.click();
  imgInput.onchange=async()=>{
    const file=imgInput.files&&imgInput.files[0];
    if(!file)return;
    imgMsg.className='fx';imgMsg.textContent='사진을 준비하는 중…';
    try{
      const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
      const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=dataUrl;});
      const maxDim=1600;
      let w2=img.width,h2=img.height;
      if(w2>maxDim||h2>maxDim){const scale=maxDim/Math.max(w2,h2);w2=Math.round(w2*scale);h2=Math.round(h2*scale);}
      const canvas=document.createElement('canvas');canvas.width=w2;canvas.height=h2;
      canvas.getContext('2d').drawImage(img,0,0,w2,h2);
      const jpegUrl=canvas.toDataURL('image/jpeg',0.82);
      const base64=jpegUrl.split(',')[1];
      await runAiFill({image:{mediaType:'image/jpeg',data:base64}},imgBtn,imgMsg,'사진을 읽는 중… (몇 초 걸릴 수 있어요)');
    }catch(e){
      imgMsg.className='fx no';imgMsg.textContent='사진을 처리하지 못했어요. 다른 사진으로 시도해주세요.';
    }finally{
      imgInput.value='';
    }
  };
  const msg=el('div','fx');
  const btnRow=el('div');btnRow.style.cssText='display:flex;gap:10px';
  const saveBtn=el('button','btn green',isEdit?'수정 저장하기':'저장하기');saveBtn.type='button';
  const back=el('button','btn ghost','← 목록으로');back.type='button';back.onclick=()=>isEdit?viewContentEditList(type):viewContentAdd();
  btnRow.appendChild(saveBtn);btnRow.appendChild(back);
  leftCol.appendChild(btnRow);
  leftCol.appendChild(msg);
  saveBtn.onclick=async()=>{
    const payload={action:isEdit?'editContent':'addContent',contentType:type};
    if(isEdit)payload.id=editId;
    spec.fields.forEach(f=>{payload[f.key]=refs[f.key].value||'';});
    payload.imagesText=imageUrls.join('\n');
    if(!payload.title){msg.className='fx no';msg.textContent='제목을 입력해주세요.';return;}
    if(type==='pattern'&&!isEdit){
      if(!payload.unitId||!payload.unitId.trim()){msg.className='fx no';msg.textContent='유닛 아이디를 입력해주세요. "🏷️ 레벨 관리 > Pattern Drill 챕터/유닛"에서 먼저 만들 수 있어요.';return;}
      payload.id=payload.unitId.trim();
    }
    saveBtn.disabled=true;msg.className='fx';msg.textContent='저장 중…';
    try{
      const res=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
      let data=null;try{data=await res.json();}catch(e){}
      if(data&&data.ok===false)throw new Error(data.error||'저장 실패');
      clearDraftLocal();
      msg.className='fx ok';msg.textContent='✅ '+(isEdit?'수정했어요!':'저장했어요!')+' 스프레드시트 담당 선생님이 "🔄 사이트에 반영하기"를 누르면 사이트에 보여요.';
      if(!isEdit)spec.fields.forEach(f=>{refs[f.key].value='';});
    }catch(e){
      msg.className='fx no';msg.textContent='저장 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.';
    }finally{
      saveBtn.disabled=false;
    }
  };
});}

    saveBtn.disabled=true;msg.className='fx';msg.textContent='저장 중…';

function viewTeacherStudent(studentId,studentName){setWide(true);mountView(w=>{
  const bk=el('button','backbtn','◀ 학생 목록');bk.onclick=viewTeacherHome;w.appendChild(bk);
  const titleEl=el('h1','title',studentName+' 학생의 제출 내역');w.appendChild(titleEl);
  const box=el('div');box.style.marginTop='14px';
  const loading=el('div','hint','불러오는 중…');box.appendChild(loading);
  w.appendChild(box);
  (async()=>{
    let subs=[];
    try{
      const res=await fetch(SUBMIT_URL+'?view=submissions&studentId='+encodeURIComponent(studentId)+'&academy='+encodeURIComponent(USER.academy||'')+'&admin='+(USER.isAdmin?'1':'0')+'&role=teacher&_t='+Date.now(),{cache:'no-store'});
      const data=await res.json();
      if(data&&data.ok&&(data.submissions||[]).length){
        const first=data.submissions[0];

        if(ctx)titleEl.textContent=studentName+' 학생의 제출 내역 ('+ctx+')';
      }
      if(data&&data.ok)subs=data.submissions||[];
    }catch(e){}
    loading.remove();
    if(!subs.length){box.appendChild(el('div','hint','제출 내역이 없어요.'));return;}
    // 제출물이 많아지면 한 학생 화면이 계속 길어지기만 해서, 컨텐츠 종류(문법드릴/글쓰기/기사요약/수행평가/Re-Writing)로
    // 좁혀볼 수 있는 필터를 추가했어요. 기본은 전체(최신순 그대로) 보기예요.
    const types=Array.from(new Set(subs.map(s=>s.type).filter(Boolean)));
    if(types.length>1){
      const filterRow=el('div');filterRow.style.cssText='margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap';
      filterRow.appendChild(el('span','fl','컨텐츠:'));
      const sel=el('select','in');sel.style.cssText='padding:6px 10px;font-size:13px;width:auto';
      ['전체'].concat(types).forEach(t=>{const opt=document.createElement('option');opt.value=t;opt.textContent=t;sel.appendChild(opt);});
      filterRow.appendChild(sel);
      box.appendChild(filterRow);
      sel.onchange=()=>renderList(sel.value==='전체'?subs:subs.filter(x=>x.type===sel.value));
    }
    const cardsBox=el('div');box.appendChild(cardsBox);
    // 예전엔 학생을 누르면 모든 제출물이 한 화면에 통째로(글+첨삭칸까지) 다 펼쳐져서 스크롤이 너무 길어졌어요.
    // 이제는 목록(제목만)을 한 번 더 거치고, 그중 하나를 눌러야 그 글의 전체 내용이 보여요.
    const renderList=(list)=>{
      cardsBox.innerHTML='';
      if(!list.length){cardsBox.appendChild(el('div','hint','해당 컨텐츠의 제출물이 없어요.'));return;}
      list.forEach(s=>{
        const row=el('button','btn ghost');
        row.type='button';row.style.cssText='display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:12px';
        row.innerHTML='<div style="font-weight:800">'+escH(s.point||s.chapter||'')+' <span style="font-weight:600;color:#6b7684;font-size:13px">('+escH(s.type||'')+' · '+escH(s.datetime||'')+')</span></div>'+
          '<div style="margin-top:4px;color:#6b7684;font-size:13px">점수: '+escH(String(s.total||'-'))+(s.grade?(' · '+escH(s.grade)+'등급'):'')+(s.feedback?' · 첨삭 있음':'')+'</div>';
        row.onclick=()=>viewTeacherSubmissionDetail(s,studentId,studentName);
        cardsBox.appendChild(row);
      });
    };
    renderList(subs);
  })();
});}

/* 학생 목록에서 제출물 하나를 골랐을 때 보여주는 상세 화면 — 글 전체, 문장별 코멘트,
   AI 첨삭, 종합 의견 저장까지 여기서 다 해요. */
/** AI 첨삭 전체 총평 박스를 그리는데, "✏️ 수정" 버튼을 누르면 textarea로 바뀌어서
 *  선생님이 내용을 직접 고쳐 쓰고 저장할 수 있어요(문장별 첨삭은 그대로 두고 총평만 덮어써요). */
function mountAiOverallBox(card,beforeNode,boxStyle,overallText,s,provider,fbObj){
  const box=el('div');box.style.cssText=boxStyle;
  const showView=()=>{
    box.innerHTML='';
    const row=el('div');row.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;gap:8px';
    const textEl=el('div');textEl.style.flex='1';textEl.innerHTML='<b>👩‍🏫 선생님 첨삭</b><br>'+escH(overallText);
    const editBtn=el('button','btn ghost','✏️ 수정');editBtn.type='button';editBtn.style.cssText='padding:3px 8px;font-size:11px;white-space:nowrap';
    row.appendChild(textEl);row.appendChild(editBtn);
    box.appendChild(row);
    editBtn.onclick=showEdit;
  };
  const showEdit=()=>{
    box.innerHTML='';
    const ta=el('textarea','in');ta.value=overallText;ta.style.cssText='min-height:70px;font-size:13px;white-space:pre-wrap';
    const btnRow=el('div');btnRow.style.cssText='display:flex;gap:6px;margin-top:6px;align-items:center';
    const saveBtn=el('button','btn blue','저장');saveBtn.type='button';saveBtn.style.cssText='padding:4px 10px;font-size:12px';
    const cancelBtn=el('button','btn ghost','취소');cancelBtn.type='button';cancelBtn.style.cssText='padding:4px 10px;font-size:12px';
    const msg=el('span','fx');
    btnRow.appendChild(saveBtn);btnRow.appendChild(cancelBtn);btnRow.appendChild(msg);
    box.appendChild(ta);box.appendChild(btnRow);
    cancelBtn.onclick=showView;
    saveBtn.onclick=async()=>{
      if(!s.subId){msg.className='fx no';msg.textContent='이 제출물은 지원하지 않는 예전 형식이에요.';return;}
      saveBtn.disabled=true;const prev=saveBtn.textContent;saveBtn.textContent='저장 중…';
      const aiFeedbackStr=JSON.stringify({overall:ta.value,sentences:(fbObj&&fbObj.sentences)||{}});
      try{
        const res=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'editAiFeedback',subId:s.subId,provider:provider,aiFeedback:aiFeedbackStr,academy:s.academy||''})});
        let data=null;try{data=await res.json();}catch(e){}
        if(!data||!data.ok)throw new Error((data&&data.error)||'저장하지 못했어요.');
        overallText=ta.value;showView();
      }catch(e){
        msg.className='fx no';msg.textContent=String(e.message||e);saveBtn.disabled=false;saveBtn.textContent=prev;
      }
    };
  };
  showView();
  if(beforeNode)card.insertBefore(box,beforeNode);else card.appendChild(box);
  return box;
}
function viewTeacherSubmissionDetail(s,studentId,studentName){setWide(true);mountView(w=>{

      const card=el('div');

          const existing=fb.sentences[i]||fb.sentences[String(i)]||'';
          const aiEntry=aifb.sentences[i]||aifb.sentences[String(i)];
          const aiEntryGpt=aifbGpt.sentences[i]||aifbGpt.sentences[String(i)];
          const row=el('div');row.style.cssText='border:1px solid rgba(0,0,0,.06);border-radius:8px;padding:8px 10px;margin-top:6px;background:#faf9fb';

          row.appendChild(sentLine);
          if(aiEntry&&typeof aiEntry==='object'){
            mountEditableAiSentenceBlock(row,aiEntry,'claude',i,aifb,'#4338ca',s);
          } else {

          }

          toggle.onclick=()=>{const show=inputWrap.style.display==='none';inputWrap.style.display=show?'block':'none';if(show)setTimeout(()=>input.focus(),30);};
          sentInputs.push(input);

        });
        card.appendChild(listWrap);
      } else {
        const noTextEl=el('div','hint','(작성한 글 없음)');noTextEl.style.marginTop='10px';card.appendChild(noTextEl);

      }
      if(s.text){
        const nowWrap=el('div');nowWrap.style.cssText='margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap';
        const nowBtn=el('button','btn ghost','⚡ AI 첨삭 지금 생성하기');nowBtn.type='button';nowBtn.style.cssText='padding:6px 12px;font-size:13px';
        const nowMsg=el('div','fx');
        nowWrap.appendChild(nowBtn);nowWrap.appendChild(nowMsg);
        card.appendChild(nowWrap);
        nowBtn.onclick=async()=>{
          nowBtn.disabled=true;const prevT=nowBtn.textContent;nowBtn.textContent='생성 중… (몇 초 걸릴 수 있어요)';

            let data=null;try{data=await res.json();}catch(e){}
            if(!data||!data.ok)throw new Error((data&&data.error)||'AI 첨삭 생성에 실패했어요.');
            // 지연시간과 상관없이 방금 만든 결과를 바로 보여줘요(선생님이 직접 지금 만든 거니까요).

/* ================= SLIDE DECK (drill & paragraph) ================= */
let slides=[],idx=0;
function deckInit(){clearStage();slides=[];idx=0;nav.classList.add('on');}
/* ---- 실시간 학습 시간 표시 (nav 바에 계속 보임) ---- */
let studyTimerId=null,studyTimerBase=null,studyTimerLabel='';
function setStudyTimer(base,label){if(studyTimerId){clearInterval(studyTimerId);studyTimerId=null;}
  studyTimerBase=base;studyTimerLabel=label;
  const tick=()=>{const el=document.getElementById('studyTimer');if(el&&studyTimerBase!=null)el.textContent=studyTimerLabel+' '+fmtDur(Date.now()-studyTimerBase);};
  tick();studyTimerId=setInterval(tick,1000);}
function freezeStudyTimer(){if(studyTimerId){clearInterval(studyTimerId);studyTimerId=null;}}
function clearStudyTimer(){freezeStudyTimer();studyTimerBase=null;const el=document.getElementById('studyTimer');if(el)el.textContent='';}
function slideAdd(build,opts){const s=el('div','slide');const b=el('div','inner');s.appendChild(b);build(b);if(opts){if(opts.onEnter)s._onEnter=opts.onEnter;if(opts.collect)s._collect=opts.collect;if(opts.focus)s._focusSel=opts.focus;if(opts.wide)b.style.maxWidth='1120px';if(opts.lock)s._lock=opts.lock;}s._box=b;stage.appendChild(s);slides.push(s);return s;}
function deckShow(i){const cur=slides[idx];
  if(cur&&i>idx&&!!cur._lock&&cur._lock())return; // 잠금 상태에서는 다음으로 넘어갈 수 없음
  if(cur&&cur._collect)try{cur._collect();}catch(e){}
  if(cur)cur.classList.remove('active');idx=Math.max(0,Math.min(slides.length-1,i));const s=slides[idx];s.classList.add('active');
  prog.style.width=(idx/(slides.length-1||1)*100)+'%';counter.innerHTML=`<b>${idx+1}</b> / ${slides.length}`;
  prevB.disabled=idx===0;nextB.disabled=(idx===slides.length-1)|| !!s._lock&&s._lock();
  if(s._onEnter)try{s._onEnter();}catch(e){}
  if(s._focusSel){const f=s.querySelector(s._focusSel);if(f)setTimeout(()=>f.focus(),60);}}
function deckStart(){prevB.onclick=()=>deckShow(idx-1);nextB.onclick=()=>deckShow(idx+1);deckShow(0);}
document.addEventListener('keydown',e=>{if(document.getElementById('exprModal'))return;const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;if(!nav.classList.contains('on'))return;
  if(e.key==='Enter'){const s=slides[idx];if(s&&s._box&&s._box._enterKey){e.preventDefault();s._box._enterKey();}return;}
  if(e.key==='ArrowRight')deckShow(idx+1);else if(e.key==='ArrowLeft')deckShow(idx-1);});
homeBtn.onclick=()=>{nav.classList.remove('on');clearStudyTimer();if(USER.role==='teacher')viewTeacherHome();else viewHome();};
logoutBtn.onclick=()=>{nav.classList.remove('on');clearStudyTimer();USER={id:'',name:'',role:'student',school:'',schoolGrade:'',cls:'',academy:'',isAdmin:false};clearSession();whoEl.textContent='';homeBtn.style.display='none';logoutBtn.style.display='none';viewLogin();};

/* ================= DRILL RUNNER ================= */
function runDrill(P){setWide(false);deckInit();
  const drillStart=Date.now();setStudyTimer(drillStart,'⏱ 학습 시간');
  const RES={quiz:{ok:0,tot:P.quiz.length},arrange:{ok:0,tot:P.arrange.length},compose:{ok:0,tot:P.compose.length},wrong:[],taskDone:false,taskText:'',startTime:drillStart,finishTime:null};
  // 0 설명 (노란 부분을 모두 눌러야 다음으로 이동 가능)
  let expTotal=0,expClicked=0;
  slideAdd(b=>{b.appendChild(el('span','badge blue','설명 · '+P.title));
    b.appendChild(el('h1','title',P.title));
    const piImgs=renderImages(P.images);if(piImgs)b.appendChild(piImgs);
    const p=el('div','lead');const note=el('div','notebox',P.explain.note);
    P.explain.lead.forEach(seg=>{if(seg.t)p.appendChild(document.createTextNode(seg.t));else{expTotal++;const k=el('span','key',seg.k);
      k.onclick=()=>{if(!k.classList.contains('clicked')){k.classList.add('clicked');expClicked++;}note.innerHTML='<b>'+seg.k+'</b> — '+seg.n;
        nextB.disabled=(idx===slides.length-1)||expClicked<expTotal;};
