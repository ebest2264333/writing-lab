맞다."},{"q":"The car ___ by my father is new.","o":["drive","driving","drove","drives","driven"],"a":4,"e":"차는 '운전되는' 수동 관계이고 by가 뒤따르므로 과거분사 driven이 알맞다."},{"q":"밑줄 친 분사의 쓰임이 어법상 <틀린> 것은?","o":["the book [[written]] by him","a [[crying]] baby","the man [[stealing]] a bag","a [[break]] cup","the leaves [[falling]] from the tree"],"a":3,"e":"컵은 '깨진' 수동 관계이므로 [[break]]가 아니라 과거분사 broken이 되어야 한다."},{"q":"The scientist ___ the new medicine won a prize.","o":["developing","develop","developed","to develop","develops"],"a":0,"e":"과학자가 약을 '개발한' 능동 관계이고 목적어가 뒤따르므로 현재분사 developing이 알맞다."},{"q":"다음 중 어법상 옳은 문장은?","o":["The boy playing the piano are my cousin.","I have a friend live in Canada.","The window broken yesterday is fixed now.","The children played in the park is happy.","A man wore a hat came in."],"a":2,"e":"broken이 뒤에서 window를 수식하며 '어제 깨진'이라는 수동 관계를 바르게 나타낸다."},{"q":"The woman ___ over there is the teacher ___ by all students.","o":["standing / loving","stood / loved","standing / love","standing / loved","standed / loving"],"a":3,"e":"'서 있는'은 능동이므로 현재분사 standing, '사랑받는'은 수동이므로 과거분사 loved가 알맞다."}],"arrange":[{"ko":"축구를 하고 있는 그 소년은 내 남동생이다.","a":"The boy playing soccer is my brother."},{"ko":"영어로 쓰인 그 편지는 읽기 어렵다.","a":"The letter written in English is hard to read."},{"ko":"자고 있는 아기를 봐라.","a":"Look at the sleeping baby."},{"ko":"나는 깨진 창문을 고쳤다.","a":"I fixed the broken window."},{"ko":"피아노를 치고 있는 그 소녀는 내 사촌이다.","a":"The girl playing the piano is my cousin."},{"ko":"저 나무 아래 서 있는 그 남자는 나의 삼촌이다.","a":"The man standing under that tree is my uncle."},{"ko":"나의 아버지에 의해 운전되는 그 차는 새것이다.","a":"The car driven by my father is new."},{"ko":"나는 프랑스에서 만들어진 가방을 원한다.","a":"I want a bag made in France."},{"ko":"울고 있는 그 아기는 배가 고프다.","a":"The crying baby is hungry."},{"ko":"버스를 기다리고 있는 그 사람들은 피곤해 보였다.","a":"The people waiting for the bus looked tired."},{"ko":"그녀는 떨어진 잎들을 모았다.","a":"She collected the fallen leaves."},{"ko":"벤치에 앉아 있는 그 여자는 나의 선생님이다.","a":"The woman sitting on the bench is my teacher."},{"ko":"모두에게 사랑받는 그 노래는 유명하다.","a":"The song loved by everyone is famous."},{"ko":"빨간 드레스를 입고 있는 그 소녀는 미나이다.","a":"The girl wearing a red dress is Mina."},{"ko":"중국어로 말해진 그 단어들을 나는 이해할 수 없었다.","a":"I couldn't understand the words spoken in Chinese."}],"compose":[{"k":"축구를 하고 있는 그 소년은 키가 크다.","a":"The boy playing soccer is tall.","h":"playing / 뒤에서 수식","alt":["The boy who is playing soccer is tall."]},{"k":"스페인어로 쓰인 그 책은 어렵다.","a":"The book written in Spanish is difficult.","h":"written / 과거분사","alt":["The book which is written in Spanish is difficult."]},{"k":"나는 우는 그 아기를 안았다.","a":"I held the crying baby.","h":"crying / 앞에서 수식","alt":["I held a crying baby."]},{"k":"그들은 도난당한 그 차를 발견했다.","a":"They found the stolen car.","h":"stolen / 과거분사 / 앞에서 수식","alt":["They found a stolen car."]},{"k":"문 앞에 서 있는 그 남자는 경찰관이다.","a":"The man standing at the door is a police officer.","h":"standing / 뒤에서 수식","alt":["The man who is standing at the door is a police officer."]},{"k":"그가 만든 그 케이크는 맛있었다.","a":"The cake made by him was delicious.","h":"made / 과거분사 / by","alt":["The cake that was made by him was delicious."]},{"k":"나는 프랑스에서 만들어진 시계를 샀다.","a":"I bought a watch made in France.","h":"made / 뒤에서 수식","alt":["I bought a watch which was made in France."]},{"k":"강에서 수영하고 있는 그 아이들은 즐거워 보인다.","a":"The children swimming in the river look happy.","h":"swimming / 뒤에서 수식","alt":["The children who are swimming in the river look happy."]},{"k":"깨진 유리를 조심해라.","a":"Be careful of the broken glass.","h":"broken / 앞에서 수식","alt":["Be careful of broken glass."]},{"k":"저기서 춤추고 있는 그 소녀는 내 여동생이다.","a":"The girl dancing over there is my sister.","h":"dancing / 뒤에서 수식","alt":["The girl who is dancing over there is my sister."]},{"k":"나는 한국어로 말해진 그 이야기를 이해했다.","a":"I understood the story told in Korean.","h":"told / 과거분사","alt":["I understood the story which was told in Korean."]},{"k":"낙엽으로 덮인 그 길은 아름답다.","a":"The road covered with leaves is beautiful.","h":"covered / 과거분사 / 뒤에서 수식","alt":["The road which is covered with leaves is beautiful."]},{"k":"편지를 쓰고 있는 그 여자는 나의 어머니이다.","a":"The woman writing a letter is my mother.","h":"writing / 뒤에서 수식","alt":["The woman who is writing a letter is my mother."]},{"k":"나는 잠긴 그 문을 열 수 없었다.","a":"I couldn't open the locked door.","h":"locked / 앞에서 수식","alt":["I could not open the locked door."]},{"k":"무대 위에서 노래하고 있는 그 남자는 유명한 가수이다.","a":"The man singing on the stage is a famous singer.","h":"singing / 뒤에서 수식","alt":["The man who is singing on the stage is a famous singer."]}],"task":{"prompt":"분사를 사용하여 자신의 주변 사람이나 사물을 묘사하는 글을 3문장으로 쓰세요. <b>명사를 수식하는 현재분사(-ing)와 과거분사</b>를 각각 한 번 이상 사용하세요.","sample":"The boy playing basketball in the park is my best friend. I have a bike made in Japan. The girl wearing glasses is reading a book written by a famous writer.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"명사를 수식하는 현재분사(-ing)를 사용했나요?","regex":"\\b\\w+ing\\b"},{"label":"명사를 수식하는 과거분사를 사용했나요?","regex":"\\b(made|written|spoken|broken|stolen|locked|covered|told|driven|painted|used|called|taken|given|built|found|worn|hidden)\\b"}]},"images":""},{"id":"L3C6U2","title":"분사의 보어 역할","explainParts":[{"t":"분사는 명사를 앞뒤에서 꾸미기도 하지만, 문장에서 "},{"k":"보어","n":"주어나 목적어의 상태·동작을 보충 설명하는 자리예요. 주어를 설명하면 주격보어, 목적어를 설명하면 목적격보어랍니다."},{"t":" 자리에 와서 상태를 설명하기도 해요. 이때 "},{"k":"현재분사 vs 과거분사","n":"대상이 동작을 '하는 중'이면 현재분사(-ing), 동작을 '당하는' 관계면 과거분사(p.p.)를 써요. I saw him running.(그가 달리는 중) / I heard my name called.(이름이 불리는)"},{"t":" 중 알맞은 것을 골라야 해요. 특히 "},{"k":"지각·사역동사 + 분사","n":"see, hear, watch, feel 같은 지각동사와 keep, leave, have, get 같은 동사는 '목적어 + 분사' 형태를 취해요. She kept me waiting.(나를 계속 기다리게 함) / I had my hair cut.(머리를 자름=잘리게 함)"},{"t":" 뒤에서는 분사가 목적격보어로 아주 자주 쓰인답니다."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"She kept me ___ in the rain for an hour.","o":["waiting","wait","waited","to wait","waits"],"a":0,"e":"keep+목적어 뒤에는 능동·진행을 나타내는 현재분사 waiting을 써요."},{"q":"The exam results were really ___.","o":["disappoint","disappoints","disappointed","to disappoint","disappointing"],"a":4,"e":"결과가 실망감을 '주는' 능동 의미이므로 주격보어로 현재분사 disappointing이 알맞아요."},{"q":"I heard my name ___ across the room.","o":["call","calling","called","to call","calls"],"a":2,"e":"이름은 '불리는' 대상이므로 수동을 나타내는 과거분사 called를 써요."},{"q":"He left the window ___ during the storm.","o":["break","broken","broke","breaking","breaks"],"a":1,"e":"창문이 '깨진' 상태로 남겨졌으므로 과거분사 broken이 목적격보어로 와요."},{"q":"Don't leave the tap ___; we should save water.","o":["run","ran","to run","running","runs"],"a":3,"e":"수도꼭지가 '흐르고 있는' 능동·진행이므로 현재분사 running을 써요."},{"q":"I had my photo ___ by a professional last week.","o":["take","took","taking","taken","takes"],"a":3,"e":"사진은 '찍히는' 대상이므로 have+목적어 뒤에 수동의 과거분사 taken을 써요."},{"q":"He was sitting quietly with his arms ___.","o":["fold","folds","folding","to fold","folded"],"a":4,"e":"팔은 '포개어진' 수동 상태이므로 「with+명사+과거분사」로 folded를 써요."},{"q":"She got her car ___ at the garage yesterday.","o":["washed","wash","washing","to wash","washes"],"a":0,"e":"차는 '세차되는' 대상이므로 get+목적어 뒤에 과거분사 washed를 써요."},{"q":"다음 밑줄 친 부분을 바르게 고친 것은? My brother stood there [[frightening]] by the loud noise.","o":["frightening","frightened","frighten","to frighten","frightens"],"a":1,"e":"동생이 소리에 '겁먹은' 수동 상태이므로 과거분사 frightened로 고쳐야 해요."},{"q":"I saw a boy ___ a ball, and I heard a window ___ by it.","o":["kick – breaking","kicking – breaking","kicking – broken","kicked – broken","kicked – breaking"],"a":2,"e":"소년은 공을 '차는' 능동이므로 kicking, 창문은 돌에 의해 '깨지는' 수동이므로 broken이에요."}],"arrange":[{"ko":"나는 그가 길을 달리는 것을 보았다.","a":"I saw him running down the street."},{"ko":"그녀는 나를 계속 기다리게 했다.","a":"She kept me waiting."},{"ko":"나는 내 이름이 불리는 것을 들었다.","a":"I heard my name called."},{"ko":"그는 문을 잠그지 않은 채로 두었다.","a":"He left the door unlocked."},{"ko":"그 소식은 정말 충격적이었다.","a":"The news was really shocking."},{"ko":"나는 어제 머리를 잘랐다.","a":"I had my hair cut yesterday."},{"ko":"우리는 해가 지는 것을 지켜보았다.","a":"We watched the sun setting."},{"ko":"그녀는 자전거를 수리받았다.","a":"She got her bike repaired."},{"ko":"나는 누군가 내 어깨를 만지는 것을 느꼈다.","a":"I felt someone touching my shoulder."},{"ko":"그는 팔짱을 낀 채 앉아 있었다.","a":"He was sitting with his arms folded."},{"ko":"물을 틀어 놓은 채로 두지 마라.","a":"Don't leave the water running."},{"ko":"그 영화는 지루했다.","a":"The movie was boring."},{"ko":"나는 유리가 깨지는 소리를 들었다.","a":"I heard the glass breaking."},{"ko":"그녀는 눈을 감은 채로 서 있었다.","a":"She stood with her eyes closed."},{"ko":"나는 사진을 찍혔다.","a":"I had my picture taken."}],"compose":[{"k":"나는 그가 노래하고 있는 것을 들었다.","a":"I heard him singing.","h":"heard / 현재분사 / 진행","alt":["I heard him sing."]},{"k":"그녀는 나를 계속 기다리게 했다.","a":"She kept me waiting.","h":"keep+목적어 / -ing","alt":[]},{"k":"그 결과는 실망스러웠다.","a":"The result was disappointing.","h":"주격보어 / 감정을 줌 / -ing","alt":["The results were disappointing."]},{"k":"나는 내 차를 세차받았다.","a":"I got my car washed.","h":"get+목적어 / 수동 / p.p.","alt":["I had my car washed."]},{"k":"그는 창문을 깨진 채로 두었다.","a":"He left the window broken.","h":"leave / 수동 / p.p.","alt":[]},{"k":"우리는 아이들이 놀고 있는 것을 보았다.","a":"We saw the children playing.","h":"see / -ing","alt":["We watched the children playing."]},{"k":"나는 내 이름이 불리는 것을 들었다.","a":"I heard my name called.","h":"heard / 수동 / p.p.","alt":[]},{"k":"그 이야기는 흥미진진했다.","a":"The story was exciting.","h":"주격보어 / -ing","alt":[]},{"k":"수도를 틀어 놓은 채로 두지 마라.","a":"Don't leave the tap running.","h":"leave / -ing","alt":["Don't leave the water running."]},{"k":"그녀는 머리를 잘랐다.","a":"She had her hair cut.","h":"have+목적어 / p.p.","alt":["She got her hair cut."]},{"k":"나는 누군가 나를 지켜보고 있는 것을 느꼈다.","a":"I felt someone watching me.","h":"feel / -ing","alt":[]},{"k":"그는 다리를 꼰 채 앉아 있었다.","a":"He sat with his legs crossed.","h":"with+명사+p.p.","alt":["He was sitting with his legs crossed."]},{"k":"나는 유리가 깨지는 소리를 들었다.","a":"I heard the glass breaking.","h":"heard / -ing","alt":[]},{"k":"그녀는 눈을 감은 채로 누워 있었다.","a":"She lay with her eyes closed.","h":"with+명사+p.p.","alt":["She was lying with her eyes closed."]},{"k":"나는 지갑을 도난당했다.","a":"I had my wallet stolen.","h":"have+목적어 / 수동 / p.p.","alt":["I got my wallet stolen."]}],"task":{"prompt":"다음 조건에 맞춰 <b>분사가 보어로 쓰인</b> 문장을 넣어 자신의 하루 경험을 3문장으로 써 보세요. 지각동사(see, hear, feel 등)나 <b>keep / leave / have / get</b> 뒤에 분사를 활용해 보세요.","sample":"Yesterday I saw my friend running to school. I kept him waiting at the gate for ten minutes. Later I had my bike fixed at the shop.","conds":[{"label":"3문장 이상으로 썼나요?","minSentences":3},{"label":"현재분사(-ing)가 보어로 쓰였나요? (예: running, waiting)","regex":"\\b\\w+ing\\b"},{"label":"과거분사(p.p.)로 수동 표현을 썼나요? (예: fixed, cut, taken)","regex":"\\b(fixed|cut|taken|washed|repaired|broken|stolen|closed|called|done|made|painted)\\b"}]},"images":""},{"id":"L3C6U3","title":"분사구문","explainParts":[{"t":"분사구문은 "},{"k":"분사구문","n":"「접속사+주어+동사」로 된 부사절을 분사(-ing/-ed)로 시작하는 짧은 구로 줄인 것이에요. 시간·이유·조건·동시동작 등의 의미를 나타냅니다."},{"t":"의 형태입니다. 예를 들어 When I walked home, I met her.는 "},{"k":"접속사·주어 생략","n":"주절과 부사절의 주어가 같을 때, 접속사와 주어를 없애고 동사를 -ing 형태로 바꿉니다. When I walked home → Walking home 처럼요."},{"t":"의 과정을 거쳐 Walking home, I met her.가 됩니다. 형용사나 과거분사 앞에 오는 "},{"k":"being 생략","n":"Being tired, he went to bed.처럼 being으로 시작하는 분사구문에서는 being을 생략할 수 있어요. → Tired, he went to bed. 로도 씁니다."},{"t":"은 자주 생략되어 Tired, he went to bed.처럼 쓰기도 합니다."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"___ home, I met an old friend.","o":["Walking","Walked","To walk","Walks","Walk"],"a":0,"e":"「집에 걸어가다가」라는 동시동작을 나타내는 분사구문이므로 -ing 형태인 Walking이 알맞습니다."},{"q":"___ tired, he went to bed early.","o":["To be","Been","Being","Be","Was"],"a":2,"e":"「피곤해서」라는 이유를 나타내는 분사구문으로 be동사의 분사형인 Being이 알맞습니다."},{"q":"___ sick, she stayed home all day.","o":["Feels","Feeling","Felt","To feel","Feel"],"a":1,"e":"「아파서」라는 이유를 나타내는 분사구문이므로 동사원형에 -ing를 붙인 Feeling이 알맞습니다."},{"q":"Because I had no money, I couldn't buy it. → ___ no money, I couldn't buy it.","o":["Have","Had","To have","Having","Having had"],"a":3,"e":"부사절의 동사 had를 분사구문으로 바꾸면 -ing 형태인 Having이 됩니다."},{"q":"___ this medicine, you will feel better.","o":["Take","Took","To take","Taken","Taking"],"a":4,"e":"「이 약을 먹으면」이라는 조건을 나타내는 분사구문으로 Taking이 알맞습니다."},{"q":"밑줄 친 부분을 분사구문으로 바르게 바꾼 것은? [[As it was written]] in English, the book was hard to read.","o":["Written","Writing","To write","Write","Wrote"],"a":0,"e":"수동의 의미이므로 Being written에서 being이 생략된 과거분사 Written이 알맞습니다."},{"q":"Not ___ the answer, I asked the teacher.","o":["know","known","knowing","to know","knew"],"a":2,"e":"부정 분사구문은 「Not+분사」 형태이므로 knowing이 알맞습니다."},{"q":"___ what to say, she remained silent.","o":["Know not","Knowing not","Don't knowing","Not knowing","No knowing"],"a":3,"e":"분사구문의 부정은 분사 앞에 Not을 붙여 Not knowing으로 씁니다."},{"q":"___ her homework, she went out to play.","o":["Finishing","Having finished","Finish","To finish","Finished"],"a":1,"e":"숙제를 끝낸 것이 나간 것보다 먼저 일어난 일이므로 완료 분사구문 Having finished가 알맞습니다."},{"q":"Turning to the right, you will see the station. 이 분사구문의 의미로 가장 알맞은 것은?","o":["~하면서 (동시동작)","~때문에 (이유)","~한 후에 (시간)","~에도 불구하고 (양보)","~하면 (조건)"],"a":4,"e":"주절에 미래시제 will이 쓰였고 문맥상 「오른쪽으로 돌면」이라는 조건의 의미가 알맞습니다."}],"arrange":[{"ko":"집에 걸어가다가, 나는 그녀를 만났다.","a":"Walking home, I met her."},{"ko":"피곤해서, 그는 잠자리에 들었다.","a":"Being tired, he went to bed."},{"ko":"아파서, 그녀는 집에 머물렀다.","a":"Feeling sick, she stayed home."},{"ko":"음악을 들으면서, 나는 공부했다.","a":"Listening to music, I studied."},{"ko":"무엇을 해야 할지 몰라서, 나는 그에게 전화했다.","a":"Not knowing what to do, I called him."},{"ko":"왼쪽으로 돌면, 너는 그 가게를 찾을 것이다.","a":"Turning left, you will find the store."},{"ko":"그 소식을 듣고, 그녀는 울기 시작했다.","a":"Hearing the news, she began to cry."},{"ko":"시간이 없어서, 우리는 서둘렀다.","a":"Having no time, we hurried."},{"ko":"창가에 앉아서, 그는 책을 읽었다.","a":"Sitting by the window, he read a book."},{"ko":"숙제를 끝낸 후에, 그녀는 나갔다.","a":"Having finished her homework, she went out."},{"ko":"매우 추워서, 우리는 안에 머물렀다.","a":"Being very cold, we stayed inside."},{"ko":"웃으면서, 그녀는 나에게 손을 흔들었다.","a":"Smiling, she waved at me."},{"ko":"영어로 쓰여 있어서, 그 편지는 읽기 어려웠다.","a":"Written in English, the letter was hard to read."},{"ko":"그를 길에서 보고, 나는 인사했다.","a":"Seeing him on the street, I said hello."},{"ko":"최선을 다했기 때문에, 그녀는 후회하지 않았다.","a":"Having done her best, she had no regrets."}],"compose":[{"k":"집에 걸어가다가, 나는 그녀를 만났다.","a":"Walking home, I met her.","h":"분사구문/Walking/과거시제","alt":[]},{"k":"피곤해서, 그는 일찍 잤다.","a":"Being tired, he went to bed early.","h":"이유/Being","alt":["Tired, he went to bed early."]},{"k":"아파서, 그녀는 학교에 가지 않았다.","a":"Feeling sick, she didn't go to school.","h":"이유/Feeling","alt":[]},{"k":"텔레비전을 보면서, 나는 저녁을 먹었다.","a":"Watching TV, I ate dinner.","h":"동시동작/Watching","alt":["Watching TV, I had dinner."]},{"k":"무엇을 말해야 할지 몰라서, 그는 조용히 있었다.","a":"Not knowing what to say, he kept silent.","h":"부정 분사구문/Not+분사","alt":["Not knowing what to say, he remained silent."]},{"k":"오른쪽으로 돌면, 너는 그 병원을 볼 것이다.","a":"Turning right, you will see the hospital.","h":"조건/Turning","alt":[]},{"k":"그 편지를 읽고, 그녀는 미소 지었다.","a":"Reading the letter, she smiled.","h":"시간/Reading","alt":[]},{"k":"돈이 없어서, 나는 그것을 살 수 없었다.","a":"Having no money, I couldn't buy it.","h":"이유/Having","alt":[]},{"k":"음악을 들으면서, 그들은 걸었다.","a":"Listening to music, they walked.","h":"동시동작/Listening","alt":[]},{"k":"숙제를 끝낸 후에, 그는 게임을 했다.","a":"Having finished his homework, he played games.","h":"완료 분사구문/Having p.p.","alt":[]},{"k":"매우 피곤해서, 나는 일찍 잠들었다.","a":"Being very tired, I fell asleep early.","h":"이유/Being","alt":["Very tired, I fell asleep early."]},{"k":"프랑스어로 쓰여 있어서, 그 책은 이해하기 어려웠다.","a":"Written in French, the book was hard to understand.","h":"being 생략/Written","alt":["Being written in French, the book was hard to understand."]},{"k":"버스를 기다리면서, 우리는 이야기했다.","a":"Waiting for the bus, we talked.","h":"동시동작/Waiting","alt":[]},{"k":"그 뉴스를 듣고, 그들은 놀랐다.","a":"Hearing the news, they were surprised.","h":"시간·이유/Hearing","alt":[]},{"k":"창문을 열면, 너는 신선한 공기를 느낄 것이다.","a":"Opening the window, you will feel fresh air.","h":"조건/Opening","alt":[]}],"task":{"prompt":"<b>분사구문</b>을 사용하여 여러분의 하루 일과나 경험을 <b>3문장 이상</b>으로 써 보세요. 시간·이유·조건·동시동작 중 하나 이상의 의미가 드러나도록 하고, 적어도 한 문장에는 <b>Being</b>이나 <b>-ed</b> 형태의 분사구문을 넣어 보세요.","sample":"Walking to school, I saw my best friend. Being tired, I drank a cup of coffee. Feeling excited, I started my first class.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"-ing로 시작하는 분사구문을 사용했나요?","regex":"\\b[A-Za-z]+ing\\b[^.!?]*,"},{"label":"Being 또는 -ed 형태의 분사구문을 포함했나요?","regex":"(\\bBeing\\b|\\b[A-Za-z]+ed\\b)[^.!?]*,"}]},"images":""},{"id":"L3C7U1","title":"원급을 이용한 표현","explainParts":[{"t":"원급은 두 대상의 정도가 같음을 나타낼 때 「as + 형용사/부사 원급 + as」 형태로 써요. '~만큼 …한/하게'라는 뜻이에요. 예: He is as tall as me.(그는 나만큼 키가 크다.)"},{"k":"as ~ as possible","n":"'가능한 한 ~하게'라는 뜻이에요. 「as ~ as + 주어 + can」으로 바꿔 쓸 수 있어요. 예: Run as fast as possible. = Run as fast as you can.(가능한 한 빨리 달려라.)"},{"k":"배수사 + as ~ as","n":"twice(2배), three times(3배)처럼 배수를 나타내는 말을 as 앞에 붙이면 '몇 배만큼 ~한'이라는 뜻이 돼요. 예: twice as big as(두 배만큼 큰)."},{"k":"not as[so] ~ as","n":"'~만큼 …하지 않은'이라는 부정 표현이에요. not as와 not so 둘 다 쓸 수 있어요. 예: not so big as = not as big as."},{"t":"예를 들어 This box is twice as big as that one.은 '이 상자는 저것보다 두 배 크다'라는 뜻이에요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"My bag is ___ heavy as yours.","o":["as","so","more","very","too"],"a":0,"e":"'~만큼 …한'은 「as + 원급 + as」이므로 앞의 as가 알맞아요."},{"q":"She can run ___ fast as a horse.","o":["so","than","as","more","most"],"a":2,"e":"「as fast as」 형태여야 하므로 빈칸에는 as가 알맞아요."},{"q":"This box is twice ___ big as that one.","o":["so","than","more","as","very"],"a":3,"e":"「배수사 + as ~ as」 구조이므로 twice as big as가 되어야 해요."},{"q":"This movie is not ___ interesting as the book.","o":["so","more","very","too","most"],"a":0,"e":"부정은 not so[as] ~ as 형태이므로 so가 알맞아요."},{"q":"He answered the question as quickly as ___.","o":["possibly","can","soon","able","possible"],"a":4,"e":"'가능한 한'은 as ~ as possible이므로 possible이 알맞아요."},{"q":"This car is three ___ as expensive as mine.","o":["time","times","twice","double","many"],"a":1,"e":"'세 배'는 three times이므로 times가 알맞아요."},{"q":"Please finish it as fast as you ___.","o":["possible","will","can","able","do"],"a":2,"e":"as ~ as possible은 「as ~ as + 주어 + can」으로 바꿔 쓸 수 있어요."},{"q":"다음 문장의 밑줄 친 부분을 바르게 고친 것은? He is not [[as tall than]] his father.","o":["as taller as","as tall as","so tall than","tall as as","as tall so"],"a":1,"e":"원급 비교는 「as + 원급 + as」이므로 as tall as가 옳아요."},{"q":"I have twice ___ much money as you.","o":["so","as","than","very","more"],"a":1,"e":"「배수사 + as much as」 구조이므로 as가 알맞아요."},{"q":"다음 중 'This river is twice as long as that one'과 의미가 같은 것은?","o":["This river is twice the length of that one.","That river is twice the length of this one.","This river is the same length as that one.","This river is shorter than that one.","That river is longer than this one."],"a":0,"e":"twice as long as는 '두 배의 길이'이므로 twice the length of가 같은 의미예요."}],"arrange":[{"ko":"그는 나만큼 키가 크다.","a":"He is as tall as I am."},{"ko":"이 상자는 저것만큼 무겁다.","a":"This box is as heavy as that one."},{"ko":"가능한 한 빨리 오세요.","a":"Please come as fast as possible."},{"ko":"그녀는 나만큼 빨리 달릴 수 있다.","a":"She can run as fast as I can."},{"ko":"이 건물은 저것보다 두 배 크다.","a":"This building is twice as big as that one."},{"ko":"이 영화는 그 책만큼 재미있지 않다.","a":"This movie is not as interesting as the book."},{"ko":"나는 너만큼 많은 책을 가지고 있다.","a":"I have as many books as you do."},{"ko":"그는 가능한 한 열심히 공부했다.","a":"He studied as hard as possible."},{"ko":"내 방은 네 방만큼 크지 않다.","a":"My room is not so big as yours."},{"ko":"그녀는 가능한 한 조용히 말했다.","a":"She spoke as quietly as possible."},{"ko":"이 차는 저 차보다 세 배 비싸다.","a":"This car is three times as expensive as that one."},{"ko":"오늘은 어제만큼 춥다.","a":"Today is as cold as yesterday."},{"ko":"그는 가능한 한 많이 먹었다.","a":"He ate as much as possible."},{"ko":"이 강은 저 강만큼 길다.","a":"This river is as long as that one."},{"ko":"나는 너만큼 열심히 일한다.","a":"I work as hard as you do."}],"compose":[{"k":"그는 나만큼 키가 크다.","a":"He is as tall as I am.","h":"as ~ as / tall","alt":["He is as tall as me."]},{"k":"이 상자는 저것만큼 무겁다.","a":"This box is as heavy as that one.","h":"as ~ a her singer.","h":"비교급 than any other / singer / famous","alt":[]},{"k":"그것은 우리 도시에서 가장 높은 건물 중 하나이다.","a":"It is one of the tallest buildings in our city.","h":"one of the 최상급 복수명사 / tallest / buildings","alt":["It's one of the tallest buildings in our city."]},{"k":"어떤 산도 이 산보다 높지 않다.","a":"No other mountain is higher than this one.","h":"No other / 비교급 than / higher","alt":[]}],"task":{"prompt":"여러분이 가장 좋아하는 것(영화, 장소, 사람 등)에 대해 <b>최상급을 이용한 표현</b>을 사용하여 영어로 3문장 이상 써 보세요. <b>one of the 최상급 복수명사</b> 표현과 <b>No other ~ as ... as ~</b>(또는 비교급 than) 표현을 각각 한 번 이상 포함하세요.","sample":"My favorite movie is one of the best movies I have ever seen. No other movie is as exciting as this one. It is also the most famous movie in my country.","conds":[{"label":"영어로 3문장 이상 썼나요?","minSentences":3},{"label":"'one of the 최상급 복수명사' 표현을 사용했나요?","regex":"one of the (most |[a-z]+est |best |worst )"},{"label":"'No other ~ as ... as' 또는 '비교급 than' 최상급 표현을 사용했나요?","regex":"[Nn]o other .+ (as \\w+ as|\\w+er than|more \\w+ than)"}]},"images":""},{"id":"L3C8U1","title":"and/but/or가 이루는 구조(상관접속사)","explainParts":[{"t":"두 개의 어구를 짝지어 하나의 의미로 이어주는 접속사를 상관접속사라고 해요. 짝이 정해져 있어서 반드시 함께 써요."},{"k":"both A and B","n":"'A와 B 둘 다'라는 뜻이에요. 항상 복수로 취급해서 동사도 복수형을 써요. Both Tom and I are ready.(톰과 나는 둘 다 준비됐다.)"},{"t":"반대로 둘 다 부정하거나 둘 중 하나를 고를 때 쓰는 짝도 있어요."},{"k":"either A or B / neither A nor B","n":"either A or B는 'A나 B 둘 중 하나', neither A nor B는 'A도 B도 아닌'. 동사는 가까운 주어(B)에 맞춰요. Either you or he is right."},{"t":"'A뿐만 아니라 B도'를 강조할 때는 또 다른 짝을 써요."},{"k":"not only A but also B","n":"'A뿐만 아니라 B도'라는 뜻이며, B as well as A로 바꿔 쓸 수 있어요(순서 주의!). He is not only smart but also kind. = He is kind as well as smart."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"___ Tom ___ Jerry like soccer. They play it together every day.","o":["Both / and","Either / or","Neither / nor","Not only / but","Both / or"],"a":0,"e":"둘 다를 뜻하는 both A and B가 알맞다."},{"q":"You can have ___ juice ___ milk, but not both.","o":["both / and","either / or","neither / nor","not only / but also","either / nor"],"a":1,"e":"둘 중 하나를 뜻하는 either A or B가 알맞다."},{"q":"Both my brother and my sister ___ good at sports.","o":["is","was","am","are","has"],"a":3,"e":"both A and B는 항상 복수 취급하므로 are가 알맞다."},{"q":"He is ___ a singer ___ an actor. He does both jobs.","o":["either / or","neither / nor","not only / but also","both / but","not only / and"],"a":2,"e":"A뿐만 아니라 B도를 뜻하는 not only A but also B가 알맞다."},{"q":"She is not only smart ___ kind.","o":["and","or","nor","as well as","but also"],"a":4,"e":"not only A but also B 구문이므로 but also가 알맞다."},{"q":"I like ___ summer ___ winter. I hate both seasons.","o":["both / and","either / or","not only / but also","neither / nor","both / nor"],"a":3,"e":"둘 다 아님을 뜻하는 neither A nor B가 알맞다."},{"q":"Either you or she ___ responsible for the mistake.","o":["are","is","were","be","am"],"a":1,"e":"either A or B는 가까운 주어(she)에 동사를 일치시키므로 is가 알맞다."},{"q":"'He is not only tall but also strong.'와 같은 뜻의 문장은?","o":["He is tall as well as strong.","He is strong as well as tall.","He is neither tall nor strong.","He is either tall or strong.","He is both weak and strong."],"a":1,"e":"not only A but also B는 B as well as A와 같으므로 strong as well as tall이 알맞다."},{"q":"Neither the boys nor their teacher ___ in the classroom now.","o":["are","were","is","have","do"],"a":2,"e":"neither A nor B는 가까운 주어(teacher)에 동사를 일치시키므로 is가 알맞다."},{"q":"Both Mina [[or]] Sujin are talented dancers. 밑줄 친 부분을 바르게 고친 것은?","o":["and","nor","but","as well as","either"],"a":0,"e":"both는 and와 짝을 이루므로 or를 and로 고쳐야 한다."}],"arrange":[{"ko":"톰과 제리는 둘 다 축구를 좋아한다.","a":"Both Tom and Jerry like soccer."},{"ko":"그녀는 똑똑할 뿐만 아니라 친절하다.","a":"She is not only smart but also kind."},{"ko":"너 또는 내가 가야 한다.","a":"Either you or I have to go."},{"ko":"그도 나도 틀리지 않았다.","a":"Neither he nor I am wrong."},{"ko":"그는 의사일 뿐만 아니라 작가이다.","a":"He is not only a doctor but also a writer."},{"ko":"민수와 지나는 둘 다 학생이다.","a":"Both Minsu and Jina are students."},{"ko":"나는 커피도 차도 마시지 않는다.","a":"I drink neither coffee nor tea."},{"ko":"너는 버스나 지하철 중 하나를 탈 수 있다.","a":"You can take either the bus or the subway."},{"ko":"그 영화는 재미있을 뿐만 아니라 감동적이다.","a":"The movie is not only fun but also moving."},{"ko":"나뿐만 아니라 그녀도 바쁘다.","a":"She as well as I is busy."},{"ko":"개도 고양이도 여기 없다.","a":"Neither the dog nor the cat is here."},{"ko":"우리는 둘 다 피곤하고 배고프다.","a":"We are both tired and hungry."},{"ko":"너나 그녀 둘 중 하나가 옳다.","a":"Either you or she is right."},{"ko":"그는 영어뿐만 아니라 중국어도 말한다.","a":"He speaks not only English but also Chinese."},{"ko":"그들은 노래뿐만 아니라 춤도 잘 춘다.","a":"They are good at not only singing but also dancing."}],"compose":[{"k":"나는 사과와 바나나 둘 다 좋아한다.","a":"I like both apples and bananas.","h":"both A and B / 둘 다","alt":["I like both bananas and apples."]},{"k":"그녀는 예쁠 뿐만 아니라 똑똑하다.","a":"She is not only pretty but also smart.","h":"not only A but also B","alt":["She is smart as well as pretty."]},{"k":"너는 빨강이나 파랑 중 하나를 고를 수 있다.","a":"You can choose either red or blue.","h":"either A or B / 둘 중 하나","alt":["You can choose either blue or red."]},{"k":"나는 시간도 돈도 없다.","a":"I have neither time nor money.","h":"neither A nor B / 둘 다 아님","alt":["I have neither money nor time."]},{"k":"나의 부모님은 두 분 다 선생님이다.","a":"Both my parents are teachers.","h":"both A and B / 복수 동사","alt":["Both of my parents are teachers."]},{"k":"그는 똑똑할 뿐만 아니라 친절하다.","a":"He is not only smart but also kind.","h":"#ERROR!","alt":["He is kind as well as smart."]},{"k":"너나 그 중 하나가 거짓말을 하고 있다.","a":"Either you or he is lying.","h":"either or / 가까운 주어(he)","alt":["Either he or you are lying."]},{"k":"그녀도 나도 피곤하지 않다.","a":"Neither she nor I am tired.","h":"neither nor / 가까운 주어(I)","alt":["Neither I nor she is tired."]},{"k":"우리는 서울과 부산 둘 다 방문했다.","a":"We visited both Seoul and Busan.","h":"both A and B","alt":["We visited both Busan and Seoul."]},{"k":"그 책은 길 뿐만 아니라 지루하다.","a":"The book is not only long but also boring.","h":"not only but also","alt":["The book is boring as well as long."]},{"k":"이 펜이나 저 펜 중 하나를 가져가라.","a":"Take either this pen or that one.","h":"either A or B","alt":["Take either that pen or this one."]},{"k":"선생님도 학생들도 늦지 않았다.","a":"Neither the teacher nor the students were late.","h":"neither nor / 가까운 주어(students)","alt":["Neither the teacher nor the students came late."]},{"k":"그녀는 가수이자 무용수이다.","a":"She is both a singer and a dancer.","h":"both A and B","alt":["She is both a dancer and a singer."]},{"k":"그는 노래할 뿐만 아니라 피아노도 칠 수 있다.","a":"He can not only sing but also play the piano.","h":"not only but also / 동사 병렬","alt":["He can play the piano as well as sing."]},{"k":"수진의 친구들뿐만 아니라 수진도 수학을 좋아한다.","a":"Sujin as well as her friends likes math.","h":"B as well as A / 주어(Sujin)","alt":["Not only her friends but also Sujin likes math."]}],"task":{"prompt":"자신이 좋아하는 것이나 자신에 대해 <b>상관접속사</b>(both A and B, not only A but also B, either A or B, neither A nor B)를 사용하여 3문장 이상으로 소개해 보세요.","sample":"I like both music and movies. My best friend is not only funny but also kind. On weekends, I can either read books or watch dramas.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"상관접속사 표현 포함 (both/either/neither/not only)","regex":"(both|Both|either|Either|neither|Neither|not only|Not only)"},{"label":"짝을 이루는 접속사 완성 (and/or/nor/but also/as well as)","regex":"\\b(and|or|nor|but also|as well as)\\b"}]},"images":""},{"id":"L3C8U2","title":"부사절을 이끄는 접속사","explainParts":[{"t":"부사절은 시간·이유·조건·양보 등을 나타내며, 접속사가 이끄는 「접속사 + 주어 + 동사」 형태입니다."},{"k":"시간·이유 접속사","n":"as(~할 때·~함에 따라), since(~한 이후로·~ 때문에), while(~하는 동안), as soon as(~하자마자)의 의미로 쓰입니다."},{"t":"예: As soon as I got home, it started to rain. (집에 오자마자 비가 내리기 시작했다.)"},{"k":"조건 unless","n":"unless는 'if ... not(~하지 않으면)'의 의미로, 이미 부정의 뜻이 있어 unless 뒤에는 긍정문을 씁니다."},{"t":"예: You'll miss the bus unless you hurry. (서두르지 않으면 버스를 놓칠 것이다.)"},{"k":"양보·대조 though / while","n":"though(=although)는 '비록 ~이지만', while은 '~하는 반면에'라는 대조의 의미로도 쓰입니다."},{"t":"예: Though it was hard, he never gave up. (비록 힘들었지만, 그는 결코 포기하지 않았다.)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"너는 서두르지 않으면 늦을 거야.  You will be late ___ you hurry.","o":["unless","if","because","though","while"],"a":0,"e":"'~하지 않으면'의 의미는 unless로 나타낸다."},{"q":"___ it was raining, we stayed home. (비가 왔기 때문에 우리는 집에 있었다.)","o":["Unless","Though","While","As soon as","Since"],"a":4,"e":"이유를 나타내는 '~ 때문에'는 Since로 나타낸다."},{"q":"___ I saw the dog, I ran away. (그 개를 보자마자 나는 도망쳤다.)","o":["Unless","While","As soon as","Though","Since"],"a":2,"e":"'~하자마자'는 as soon as로 나타낸다."},{"q":"___ he was very tired, he finished his homework. (그는 매우 피곤했지만 숙제를 끝냈다.)","o":["Because","As soon as","Unless","Though","Since"],"a":3,"e":"'비록 ~이지만'의 양보는 Though로 나타낸다."},{"q":"___ my sister was sleeping, I watched TV quietly. (여동생이 자는 동안 나는 조용히 TV를 봤다.)","o":["Since","While","Unless","Though","As soon as"],"a":1,"e":"'~하는 동안'의 의미는 While로 나타낸다."},{"q":"밑줄 친 부분과 의미가 같은 것은?  You will fail the exam [[unless]] you study hard.","o":["if you study hard","because you study hard","though you study hard","while you study hard","if you don't study hard"],"a":4,"e":"unless는 'if ... not(~하지 않으면)'의 의미이다."},{"q":"___ I was walking home, I met my teacher. (집에 걸어가고 있을 때 나는 선생님을 만났다.)","o":["As","Unless","Though","As soon as","Because"],"a":0,"e":"as는 '~할 때, ~하는 동안'의 뜻으로 시간을 나타낸다."},{"q":"다음 중 어법상 옳은 문장은?","o":["Unless you will hurry, you'll miss it.","Unless you don't try, you can't win.","You can't enter unless you have a ticket.","Though of the rain, we went out.","As soon as he will arrive, call me."],"a":2,"e":"unless절에는 미래 대신 현재시제를 쓰고, 이미 부정의 의미가 있어 not을 쓰지 않는다."},{"q":"___ some people like winter, others prefer summer. (어떤 사람들은 겨울을 좋아하는 반면, 다른 사람들은 여름을 더 좋아한다.)","o":["As soon as","Unless","Since","While","Because"],"a":3,"e":"while은 '~하는 반면에'라는 대조의 의미로도 쓰인다."},{"q":"다음 우리말과 같도록 빈칸에 알맞은 것은?  '네가 사과하지 않으면 나는 너를 용서하지 않을 것이다.' → I won't forgive you ___ you apologize.","o":["if","because","though","while","unless"],"a":4,"e":"'~하지 않으면'은 unless로 나타내며 뒤에 긍정문을 쓴다."}],"arrange":[{"ko":"서두르지 않으면 너는 늦을 것이다.","a":"You will be late unless you hurry."},{"ko":"비록 힘들었지만, 그녀는 미소 지었다.","a":"Though it was hard, she smiled."},{"ko":"집에 도착하자마자 나는 잠들었다.","a":"As soon as I got home, I fell asleep."},{"ko":"비가 오고 있었기 때문에 우리는 집에 머물렀다.","a":"Since it was raining, we stayed home."},{"ko":"내가 요리하는 동안 남동생은 방을 청소했다.","a":"While I was cooking, my brother cleaned the room."},{"ko":"나이가 들면서 나는 더 신중해졌다.","a":"As I grew older, I became more careful."},{"ko":"공부하지 않으면 너는 시험에 통과하지 못할 것이다.","a":"Unless you study, you won't pass the test."},{"ko":"그는 피곤했지만 계속 일했다.","a":"Though he was tired, he kept working."},{"ko":"종이 울리자마자 학생들은 떠났다.","a":"As soon as the bell rang, the students left."},{"ko":"네가 여기 있으니 회의를 시작하자.","a":"Since you are here, let's start the meeting."},{"ko":"언니는 커피를 좋아하는 반면 나는 차를 더 좋아한다.","a":"While my sister likes coffee, I prefer tea."},{"ko":"비가 그치지 않으면 우리는 나갈 수 없다.","a":"Unless it stops raining, we can't go out."},{"ko":"그녀가 방에 들어오자 모두가 일어섰다.","a":"As she entered the room, everyone stood up."},{"ko":"그 음식은 비쌌지만 맛있었다.","a":"Though the food was expensive, it was delicious."},{"ko":"나는 돈이 없었기 때문에 그 책을 살 수 없었다.","a":"Since I had no money, I couldn't buy the book."}],"compose":[{"k":"서두르지 않으면 너는 늦을 것이다.","a":"You will be late unless you hurry.","h":"unless / 종속절은 현재시제","alt":["You'll be late unless you hurry."]},{"k":"비록 힘들었지만, 그녀는 미소 지었다.","a":"Though it was hard, she smiled.","h":"though / 과거시제","alt":["Although it was hard, she smiled."]},{"k":"집에 도착하자마자 나는 잠들었다.","a":"As soon as I got home, I fell asleep.","h":"as soon as","alt":[]},{"k":"비가 오고 있었기 때문에 우리는 집에 머물렀다.","a":"Since it was raining, we stayed home.","h":"since(이유)","alt":["Because it was raining, we stayed home.","As it was raining, we stayed home."]},{"k":"내가 요리하는 동안 남동생은 방을 청소했다.","a":"While I was cooking, my brother cleaned the room.","h":"while(~하는 동안)","alt":[]},{"k":"나이가 들면서 나는 더 신중해졌다.","a":"As I grew older, I became more careful.","h":"as(~함에 따라)","alt":[]},{"k":"공부하지 않으면 너는 시험에 통과하지 못할 것이다.","a":"Unless you study, you won't pass the test.","h":"unless / not 금지","alt":["Unless you study, you will not pass the test.","If you don't study, you won't pass the test."]},{"k":"그는 피곤했지만 계속 일했다.","a":"Though he was tired, he kept working.","h":"though","alt":["Although he was tired, he kept working."]},{"k":"종이 울리자마자 학생들은 떠났다.","a":"As soon as the bell rang, the students left.","h":"as soon as / 과거","alt":[]},{"k":"네가 여기 있으니 회의를 시작하자.","a":"Since you are here, let's start the meeting.","h":"since(이유)","alt":[]},{"k":"언니는 커피를 좋아하는 반면 나는 차를 더 좋아한다.","a":"While my sister likes coffee, I prefer tea.","h":"while(대조)","alt":[]},{"k":"비가 그치지 않으면 우리는 나갈 수 없다.","a":"Unless it stops raining, we can't go out.","h":"unless","alt":["Unless it stops raining, we cannot go out.","If it doesn't stop raining, we can't go out."]},{"k":"그녀가 방에 들어오자 모두가 일어섰다.","a":"As she entered the room, everyone stood up.","h":"as(~할 때)","alt":["When she entered the room, everyone stood up."]},{"k":"그 음식은 비쌌지만 맛있었다.","a":"Though the food was expensive, it was delicious.","h":"though","alt":["Although the food was expensive, it was delicious."]},{"k":"나는 돈이 없었기 때문에 그 책을 살 수 없었다.","a":"Since I had no money, I couldn't buy the book.","h":"since(이유)","alt":["Because I had no money, I couldn't buy the book.","As I had no money, I couldn't buy the book."]}],"task":{"prompt":"<b>as, since, unless, though, while, as soon as</b> 중에서 알맞은 접속사를 사용하여, 여러분의 하루나 경험에 대해 영어로 3문장 이상 쓰세요.","sample":"As soon as I woke up, I checked my phone. Though I was very tired, I went to school. I can't focus on studying unless the room is quiet.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"unless 또는 though(although) 사용하기","regex":"\\b([Uu]nless|[Tt]hough|[Aa]lthough)\\b"},{"label":"as, since, while, as soon as 중 하나 사용하기","regex":"\\b([Aa]s soon as|[Ss]ince|[Ww]hile|[Aa]s)\\b"}]},"images":""},{"id":"L3C8U3","title":"명사절을 이끄는 접속사","explainParts":[{"t":"명사절은 문장에서 주어, 목적어, 보어 역할을 하는 절이에요."},{"k":"that절","n":"「that+주어+동사」로 '~라는 것'이라는 뜻이며, 확실한 사실을 나타내요. 목적어로 쓰일 때는 that을 생략할 수 있어요. (예: I know (that) she is honest.)"},{"t":"확실하지 않은 일에는 whether나 if를 써요."},{"k":"whether/if절","n":"'~인지 아닌지'라는 뜻으로 불확실한 내용을 나타내요. whether 뒤에는 or not을 붙일 수 있고, if는 주로 동사의 목적어 자리에 써요. (예: I wonder whether it is true.)"},{"t":"의문문이 다른 문장의 일부로 들어가면 간접의문문이 돼요."},{"k":"간접의문문","n":"「의문사+주어+동사」 어순으로 써요. 일반 의문문과 달리 주어와 동사를 도치하지 않아요. (예: Do you know where he lives?)"},{"t":"의문사가 없을 때는 「whether/if+주어+동사」 어순으로 나타내요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"Everyone knows ___ the earth is round.","o":["that","if","what","who","which"],"a":0,"e":"확실한 사실을 나타내는 명사절은 접속사 that으로 이끌어요."},{"q":"I'm not sure ___ she likes me.","o":["that","which","if","what","who"],"a":2,"e":"'~인지 아닌지' 불확실한 내용은 if나 whether로 나타내요."},{"q":"Do you know where ___?","o":["does he live","he lives","lives he","he does live","is he"],"a":1,"e":"간접의문문은 「의문사+주어+동사」 어순으로 도치하지 않아요."},{"q":"I asked him ___ he could help me.","o":["that","what","who","whether","which"],"a":3,"e":"'~인지 아닌지'를 뜻하는 명사절은 whether로 이끌어요."},{"q":"I wonder ___ she is at home now.","o":["that","whether","what","who","which"],"a":1,"e":"확실하지 않은 사실은 whether(~인지)로 이끌어요."},{"q":"Please tell me ___.","o":["what is your name","what your name is","your name what is","is what your name","what does your name"],"a":1,"e":"간접의문문은 「의문사+주어+동사」 어순이므로 what your name is가 맞아요."},{"q":"She wants to know ___ the store is open.","o":["that","what","which","who","if"],"a":4,"e":"'~인지'를 뜻하는 명사절 목적어는 if로 나타낼 수 있어요."},{"q":"다음 밑줄 친 부분을 바르게 고친 것은? Do you know when [[does the movie start]]?","o":["the movie starts","the movie start","does the movie starts","start the movie","the movie is start"],"a":0,"e":"간접의문문은 「의문사+주어+동사」 어순이므로 the movie starts로 고쳐야 해요."},{"q":"___ we will win the game depends on our effort.","o":["If","That","Whether","What","Which"],"a":2,"e":"주어 자리에서 '~인지 아닌지'는 if 대신 whether를 써요."},{"q":"I'm not sure ___.","o":["who is that man","who that man is","that man who is","is who that man","who does that man"],"a":1,"e":"간접의문문은 「의문사+주어+동사」 어순이므로 who that man is가 맞아요."}],"arrange":[{"ko":"나는 그가 정직하다고 믿는다.","a":"I believe that he is honest."},{"ko":"그것이 사실인지 궁금하다.","a":"I wonder whether it is true."},{"ko":"그가 어디에 사는지 아니?","a":"Do you know where he lives?"},{"ko":"나는 그녀가 올지 안 올지 모른다.","a":"I don't know whether she will come or not."},{"ko":"모두가 지구가 둥글다는 것을 안다.","a":"Everyone knows that the earth is round."},{"ko":"그 가게가 문을 열었는지 궁금하다.","a":"I wonder if the store is open."},{"ko":"네 이름이 무엇인지 말해줘.","a":"Please tell me what your name is."},{"ko":"그가 시험에 합격한 것은 놀랍다.","a":"That he passed the exam is surprising."},{"ko":"나는 그녀가 집에 있는지 확신하지 못한다.","a":"I'm not sure whether she is at home."},{"ko":"그 영화가 언제 시작하는지 아니?","a":"Do you know when the movie starts?"},{"ko":"우리가 이길지는 우리의 노력에 달려 있다.","a":"Whether we will win depends on our effort."},{"ko":"나는 그가 나를 도와줄 수 있는지 물었다.","a":"I asked him whether he could help me."},{"ko":"저 남자가 누구인지 모르겠다.","a":"I don't know who that man is."},{"ko":"나는 그녀가 나를 좋아하는지 아닌지 모른다.","a":"I don't know whether she likes me or not."},{"ko":"그가 왜 화가 났는지 아니?","a":"Do you know why he is angry?"}],"compose":[{"k":"나는 그것이 사실이라고 생각한다.","a":"I think that it is true.","h":"that절 / ~라고 생각하다","alt":["I think it is true."]},{"k":"그가 어디에 사는지 아니?","a":"Do you know where he lives?","h":"간접의문문 / 의문사+주어+동사","alt":[]},{"k":"나는 그녀가 올지 궁금하다.","a":"I wonder whether she will come.","h":"whether / ~인지","alt":["I wonder if she will come."]},{"k":"그가 정직하다는 것을 나는 안다.","a":"I know that he is honest.","h":"that절","alt":["I know he is honest."]},{"k":"그 가게가 문을 열었는지 아니?","a":"Do you know if the store is open?","h":"if / ~인지","alt":["Do you know whether the store is open?"]},{"k":"네 이름이 무엇인지 말해줘.","a":"Please tell me what your name is.","h":"간접의문문 / 의문사+주어+동사","alt":["Tell me what your name is."]},{"k":"나는 그것이 사실인지 궁금하다.","a":"I wonder whether it is true.","h":"whether / ~인지","alt":["I wonder if it is true."]},{"k":"그가 시험에 합격한 것은 놀랍다.","a":"That he passed the exam is surprising.","h":"that 주어절","alt":[]},{"k":"저 남자가 누구인지 모르겠다.","a":"I don't know who that man is.","h":"간접의문문 / who+주어+동사","alt":["I have no idea who that man is."]},{"k":"그 영화가 언제 시작하는지 아니?","a":"Do you know when the movie starts?","h":"의문사+주어+동사","alt":[]},{"k":"나는 그녀가 나를 좋아하는지 아닌지 모른다.","a":"I don't know whether she likes me or not.","h":"whether ... or not","alt":["I don't know if she likes me or not."]},{"k":"그가 왜 화가 났는지 궁금하다.","a":"I wonder why he is angry.","h":"간접의문문 / why","alt":["I wonder why he got angry."]},{"k":"나는 그가 옳다고 생각한다.","a":"I think that he is right.","h":"that절","alt":["I think he is right."]},{"k":"우리가 이길지는 확실하지 않다.","a":"Whether we will win is not certain.","h":"whether 주어절","alt":["It is not certain whether we will win."]},{"k":"그녀가 집에 있는지 물어봐라.","a":"Ask her whether she is at home.","h":"whether / ~인지","alt":["Ask her if she is at home."]}],"task":{"prompt":"여러분이 궁금해하는 친구에 대해 <b>명사절을 이끄는 접속사</b>(that/whether/if)와 <b>간접의문문</b>(의문사+주어+동사)을 사용하여 영어로 3문장 써 보세요.","sample":"I wonder whether my new friend likes music. I don't know where she lives. I think that she is very kind.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"that / whether / if 접속사 사용","regex":"\\b(that|whether|if)\\b"},{"label":"간접의문문(의문사+주어+동사) 사용","regex":"\\b(where|what|who|when|why|how)\\s+\\w+\\s+\\w+"}]},"images":""},{"id":"L3C9U1","title":"관계대명사","explainParts":[{"t":"관계대명사는 두 문장을 하나로 이어 주며, 앞에 있는 명사를 꾸며 주는 역할을 합니다."},{"k":"선행사","n":"관계대명사 바로 앞에 오는 명사로, 관계대명사절이 꾸며 주는 대상입니다. 선행사가 사람인지 사물인지에 따라 쓰는 관계대명사가 달라져요."},{"t":"선행사가 사람이면 who, 사물이나 동물이면 which를 쓰고, that은 사람·사물 모두에 쓸 수 있습니다."},{"k":"격에 따른 형태","n":"주격은 who/which/that, 목적격은 whom(who)/which/that, 소유격은 사람·사물 구분 없이 모두 whose를 씁니다. 관계대명사가 절에서 하는 역할에 따라 형태가 정해져요."},{"t":"예를 들어 the man who helped me(나를 도와준 그 남자), the book which I bought(내가 산 그 책)처럼 씁니다."},{"k":"소유격 whose","n":"'~의'라는 뜻으로 선행사가 사람이든 사물이든 모두 whose를 쓰며, 바로 뒤에는 명사가 옵니다. 예: a friend whose father is a doctor(아버지가 의사인 친구)."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I know a boy ___ can speak French.","o":["who","which","what","where","when"],"a":0,"e":"선행사 a boy가 사람이고 주격이므로 who를 씁니다."},{"q":"This is the book ___ I read yesterday.","o":["who","which","whose","when","why"],"a":1,"e":"선행사 the book이 사물이고 목적격이므로 which를 씁니다."},{"q":"I have a friend ___ father is a doctor.","o":["who","which","whose","that","whom"],"a":2,"e":"'친구의 아버지'라는 소유 관계이므로 소유격 whose를 씁니다."},{"q":"Look at the boy and his cat ___ are on the sofa.","o":["who","which","whose","that","what"],"a":3,"e":"선행사가 사람과 동물이 함께이므로 둘 다 쓸 수 있는 that이 알맞습니다."},{"q":"The car ___ is parked outside is mine.","o":["who","whose","whom","what","which"],"a":4,"e":"선행사 the car가 사물이고 주격이므로 which를 씁니다."},{"q":"The woman ___ lives here is a nurse.","o":["who","which","whose","what","whom"],"a":0,"e":"선행사 the woman이 사람이고 주격이므로 who를 씁니다."},{"q":"다음 중 밑줄 친 관계대명사가 어법상 틀린 것은?","o":["I met a man [[who]] lives next door.","This is the pen [[which]] I lost.","She is the girl [[whose]] name is Mina.","Do you know the boy [[which]] is singing?","The house [[that]] we bought is old."],"a":3,"e":"선행사 the boy가 사람이므로 which가 아니라 who(또는 that)를 써야 합니다."},{"q":"This is the house ___ roof is red.","o":["who","whom","whose","which","what"],"a":2,"e":"'집의 지붕'이라는 소유 관계이므로 소유격 whose를 씁니다."},{"q":"The teacher ___ teaches us science is kind.","o":["which","who","whose","whom","what"],"a":1,"e":"선행사 the teacher가 사람이고 주격이므로 who를 씁니다."},{"q":"I have a friend ___ hobby is painting.","o":["who","which","that","what","whose"],"a":4,"e":"'친구의 취미'라는 소유 관계이므로 사람 선행사의 소유격 whose를 씁니다."}],"arrange":[{"ko":"나를 도와준 그 남자는 친절하다.","a":"The man who helped me is kind."},{"ko":"내가 산 그 책은 재미있다.","a":"The book which I bought is interesting."},{"ko":"나는 프랑스어를 할 수 있는 소년을 안다.","a":"I know a boy who can speak French."},{"ko":"이것은 지붕이 빨간 집이다.","a":"This is the house whose roof is red."},{"ko":"그녀는 아버지가 의사인 친구가 있다.","a":"She has a friend whose father is a doctor."},{"ko":"저기서 노래하고 있는 그 소녀는 내 여동생이다.","a":"The girl who is singing over there is my sister."},{"ko":"우리가 어제 만난 그 남자는 유명하다.","a":"The man whom we met yesterday is famous."},{"ko":"나는 꼬리가 긴 고양이를 기른다.","a":"I have a cat whose tail is long."},{"ko":"밖에 주차된 그 차는 새것이다.","a":"The car which is parked outside is new."},{"ko":"그가 쓴 그 편지는 짧았다.","a":"The letter which he wrote was short."},{"ko":"나는 영어를 가르치는 선생님을 좋아한다.","a":"I like the teacher who teaches English."},{"ko":"그것은 내가 본 가장 좋은 영화다.","a":"It is the best movie that I have ever seen."},{"ko":"여기 사는 그 여자는 간호사다.","a":"The woman who lives here is a nurse."},{"ko":"벽에 걸린 그 그림은 아름답다.","a":"The picture which is on the wall is beautiful."},{"ko":"이름이 미나인 그 소녀는 똑똑하다.","a":"The girl whose name is Mina is smart."}],"compose":[{"k":"나를 도와준 그 남자는 친절하다.","a":"The man who helped me is kind.","h":"관계대명사 who / 주격 / 선행사 사람","alt":["The man that helped me is kind."]},{"k":"내가 산 그 책은 재미있다.","a":"The book which I bought is interesting.","h":"관계대명사 which / 목적격 / 선행사 사물","alt":["The book that I bought is interesting."]},{"k":"이것은 지붕이 빨간 집이다.","a":"This is the house whose roof is red.","h":"소유격 whose / 선행사 the house","alt":[]},{"k":"나는 프랑스어를 할 수 있는 소년을 안다.","a":"I know a boy who can speak French.","h":"who / 주격 / 사람","alt":["I know a boy that can speak French."]},{"k":"그녀는 아버지가 의사인 친구가 있다.","a":"She has a friend whose father is a doctor.","h":"whose / 소유격","alt":[]},{"k":"밖에 주차된 그 차는 새것이다.","a":"The car which is parked outside is new.","h":"which / 주격 / 사물","alt":["The car that is parked outside is new."]},{"k":"우리가 어제 만난 그 남자는 유명하다.","a":"The man whom we met yesterday is famous.","h":"whom / 목적격 / 사람","alt":["The man who we met yesterday is famous.","The man that we met yesterday is famous."]},{"k":"저기서 노래하는 그 소녀는 내 여동생이다.","a":"The girl who is singing over there is my sister.","h":"who / 주격 / 사람","alt":["The girl that is singing over there is my sister."]},{"k":"그것은 내가 본 최고의 영화다.","a":"It is the best movie that I have ever seen.","h":"that / 최상급 선행사","alt":["It is the best movie which I have ever seen."]},{"k":"여기 사는 그 여자는 간호사다.","a":"The woman who lives here is a nurse.","h":"who / 주격 / 사람","alt":["The woman that lives here is a nurse."]},{"k":"그가 쓴 그 편지는 짧았다.","a":"The letter which he wrote was short.","h":"which / 목적격 / 사물","alt":["The letter that he wrote was short."]},{"k":"나는 꼬리가 긴 고양이를 기른다.","a":"I have a cat whose tail is long.","h":"whose / 소유격","alt":[]},{"k":"이름이 미나인 그 소녀는 똑똑하다.","a":"The girl whose name is Mina is smart.","h":"whose / 소유격","alt":[]},{"k":"벽에 걸린 그 그림은 아름답다.","a":"The picture which is on the wall is beautiful.","h":"which / 주격 / 사물","alt":["The picture that is on the wall is beautiful."]},{"k":"영어를 가르치는 그 선생님은 친절하다.","a":"The teacher who teaches English is kind.","h":"who / 주격 / 사람","alt":["The teacher that teaches English is kind."]}],"task":{"prompt":"여러분이 좋아하는 사람이나 물건을 <b>관계대명사(who, which, whose, that)</b>를 사용하여 세 문장 이상으로 소개하는 글을 써 보세요.","sample":"I have a friend who is very kind. She has a dog whose fur is white. The book which she gave me is my favorite.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"관계대명사(who/which/whose/that) 사용하기","regex":"\\b(who|which|whose|that)\\b"},{"label":"선행사(명사) 뒤에 관계대명사 쓰기","regex":"\\b(man|woman|friend|book|dog|cat|teacher|house|car|girl|boy|picture|letter|thing|person|people|movie|student)\\s+(who|which|whose|that)\\b"}]},"images":""},{"id":"L3C9U2","title":"주의해야 할 관계대명사의 쓰임","explainParts":[{"t":"관계대명사에는 특별히 주의해야 할 세 가지 쓰임이 있어요."},{"k":"관계대명사 what","n":"선행사를 그 안에 포함하여 '~하는 것'이라는 뜻을 나타내요. the thing(s) that[which]로 바꿔 쓸 수 있어요. That is what I need.(그것이 내가 필요한 것이다.) what이 이끄는 절은 문장에서 주어·목적어·보어 역할을 해요."},{"t":"둘째로 콤마와 함께 쓰는 계속적 용법이 있어요."},{"k":"계속적 용법 (, which/who)","n":"콤마(,) 뒤에 which(사물)나 who(사람)를 써서 선행사에 대한 부가 정보를 덧붙여요. that은 계속적 용법으로 쓸 수 없어요. Seoul, which is the capital, is big.(수도인 서울은 크다.) which는 앞 문장 전체를 선행사로 받을 수도 있어요."},{"t":"셋째로 전치사가 관계대명사 앞에 오는 형태가 있어요."},{"k":"전치사 + 관계대명사","n":"관계대명사가 전치사의 목적어일 때 전치사를 관계대명사 바로 앞에 둘 수 있어요. This is the house in which I live. = This is the house which I live in. 이때 전치사 뒤에는 that이나 who를 쓸 수 없고 which/whom을 써요."},{"t":"세 가지 쓰임의 차이를 구별하는 것이 핵심이에요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"That is ___ I want to buy.","o":["what","which","that","who","whose"],"a":0,"e":"선행사를 포함해 '~하는 것'을 뜻하는 관계대명사는 what이다."},{"q":"This is ___ makes me happy.","o":["that","which","who","whose","what"],"a":4,"e":"'나를 행복하게 하는 것'은 선행사를 포함하는 what으로 나타낸다."},{"q":"Seoul, ___ is the capital of Korea, is big.","o":["that","which","what","where","who"],"a":1,"e":"콤마 뒤 사물 선행사를 받는 계속적 용법에는 which를 쓰고 that은 쓸 수 없다."},{"q":"My teacher, ___ lives in Busan, is very kind.","o":["which","that","who","what","it"],"a":2,"e":"콤마 뒤 사람 선행사를 받는 계속적 용법에는 who를 쓴다."},{"q":"This is the house in ___ I live.","o":["that","who","whom","which","what"],"a":3,"e":"전치사 뒤에는 that·who를 쓸 수 없고 사물 선행사이므로 which를 쓴다."},{"q":"The man to ___ I spoke was a doctor.","o":["who","which","that","what","whom"],"a":4,"e":"전치사 뒤에 오는 사람 관계대명사는 whom이다."},{"q":"다음 중 밑줄 친 부분이 어법상 틀린 것은?","o":["That is [[what]] I bought.","Tell me [[that]] you saw.","He passed the exam, [[which]] surprised us.","This is the pen with [[which]] I wrote.","She has a dog, [[which]] is cute."],"a":1,"e":"선행사 없이 '~한 것'을 나타내려면 that이 아니라 what을 써야 한다."},{"q":"___ he said was not true.","o":["What","Which","That","It","Who"],"a":0,"e":"'그가 말한 것'이 주어 자리에 오며 선행사를 포함하므로 What을 쓴다."},{"q":"He was late, ___ made his boss angry.","o":["what","that","who","which","it"],"a":3,"e":"앞 문장 전체를 선행사로 받는 계속적 용법에는 which를 쓴다."},{"q":"Do you know the reason for ___ he left?","o":["that","which","what","why","who"],"a":1,"e":"전치사 for 뒤에 오며 사물 선행사(reason)를 받으므로 which를 쓴다."}],"arrange":[{"ko":"그것이 내가 필요한 것이다.","a":"That is what I need."},{"ko":"이것이 나를 행복하게 하는 것이다.","a":"This is what makes me happy."},{"ko":"나는 그가 말한 것을 믿는다.","a":"I believe what he said."},{"ko":"수도인 서울은 크다.","a":"Seoul, which is the capital, is big."},{"ko":"부산에 사는 나의 삼촌은 친절하다.","a":"My uncle, who lives in Busan, is kind."},{"ko":"이것이 내가 사는 집이다.","a":"This is the house in which I live."},{"ko":"내가 말을 걸었던 그 남자는 의사였다.","a":"The man to whom I spoke was a doctor."},{"ko":"그가 원하는 것은 새 자전거이다.","a":"What he wants is a new bike."},{"ko":"그는 시험에 합격했고, 그것은 우리를 놀라게 했다.","a":"He passed the exam, which surprised us."},{"ko":"그녀는 개를 한 마리 키우는데, 그것은 매우 귀엽다.","a":"She has a dog, which is very cute."},{"ko":"나는 네가 의미하는 것을 이해하지 못한다.","a":"I don't understand what you mean."},{"ko":"내가 앉았던 그 의자는 낡았다.","a":"The chair on which I sat was old."},{"ko":"그는 늦었고, 그것은 그의 상사를 화나게 했다.","a":"He was late, which made his boss angry."},{"ko":"이것이 내가 찾던 것이다.","a":"This is what I was looking for."},{"ko":"내 친구인 Tom은 캐나다에서 왔다.","a":"Tom, who is my friend, is from Canada."}],"compose":[{"k":"그것이 내가 원하는 것이다.","a":"That is what I want.","h":"관계대명사 what / '~하는 것'","alt":["That's what I want."]},{"k":"이것이 내게 필요한 것이다.","a":"This is what I need.","h":"선행사 포함 what","alt":["What I need is this."]},{"k":"나는 그가 말한 것을 믿는다.","a":"I believe what he said.","h":"what / believe","alt":["I trust what he said."]},{"k":"수도인 서울은 크다.","a":"Seoul, which is the capital, is big.","h":"계속적 용법 , which","alt":["Seoul, which is the capital, is large."]},{"k":"부산에 사는 나의 삼촌은 친절하다.","a":"My uncle, who lives in Busan, is kind.","h":", who / 사람 선행사","alt":["My uncle, who lives in Busan, is nice."]},{"k":"이것이 내가 사는 집이다.","a":"This is the house in which I live.","h":"전치사+관계대명사 in which","alt":["This is the house which I live in.","This is the house that I live in."]},{"k":"내가 말을 걸었던 그 남자는 의사였다.","a":"The man to whom I spoke was a doctor.","h":"to whom","alt":["The man whom I spoke to was a doctor.","The man who I spoke to was a doctor."]},{"k":"그가 원하는 것은 새 자전거이다.","a":"What he wants is a new bike.","h":"주어 자리 What","alt":["What he wants is a new bicycle."]},{"k":"그는 시험에 합격했고, 그것은 우리를 놀라게 했다.","a":"He passed the exam, which surprised us.","h":", which(앞 문장 전체)","alt":["He passed the test, which surprised us."]},{"k":"그녀는 개를 키우는데, 그것은 귀엽다.","a":"She has a dog, which is cute.","h":", which / 사물 선행사","alt":["She has a dog, which is very cute."]},{"k":"나는 네가 의미하는 것을 이해하지 못한다.","a":"I don't understand what you mean.","h":"what you mean","alt":["I do not understand what you mean."]},{"k":"내가 앉았던 그 의자는 낡았다.","a":"The chair on which I sat was old.","h":"on which","alt":["The chair which I sat on was old.","The chair that I sat on was old."]},{"k":"이것이 내가 찾던 것이다.","a":"This is what I was looking for.","h":"what / 과거진행","alt":["This is what I was searching for."]},{"k":"내 친구인 Tom은 캐나다에서 왔다.","a":"Tom, who is my friend, is from Canada.","h":", who","alt":["Tom, who is my friend, comes from Canada."]},{"k":"그가 필요한 것은 휴식이다.","a":"What he needs is rest.","h":"주어 자리 What","alt":["What he needs is some rest.","What he needs is a rest."]}],"task":{"prompt":"관계대명사 <b>what</b>, 계속적 용법(<b>, which</b> 또는 <b>, who</b>), 그리고 <b>전치사+관계대명사</b>를 각각 활용하여 자신에 관한 영어 문장을 3개 써 보세요.","sample":"What I want most is a long vacation. My mother, who works at a hospital, is always busy. This is the city in which I was born.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"관계대명사 what 사용하기","regex":"[Ww]hat"},{"label":"계속적 용법(, which / , who) 사용하기","regex":",\\s*(which|who)"}]},"images":""},{"id":"L3C9U3","title":"관계부사","explainParts":[{"t":"관계부사는 「접속사 + 부사」 역할을 하며, 앞의 선행사를 꾸며 두 문장을 하나로 이어줍니다."},{"k":"where","n":"장소를 나타내는 선행사(the place, the house, the city 등) 뒤에 써요. 예: This is the house where I live."},{"t":"시간을 나타내는 선행사 뒤에는 관계부사 when을 써요."},{"k":"when","n":"the day, the time, the season처럼 시간을 나타내는 선행사 뒤에 써요. 예: I remember the day when we met."},{"t":"이유를 말할 때는 선행사 the reason 뒤에 why를 써요."},{"k":"why","n":"the reason(이유) 뒤에 쓰여요. 예: Tell me the reason why you were late."},{"t":"방법을 나타내는 how는 the way와 함께 쓰지 않고 둘 중 하나만 써요. (the way how X)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"This is the house ___ I live.","o":["where","when","why","which","who"],"a":0,"e":"장소를 나타내는 선행사 the house 뒤에는 관계부사 where를 써요."},{"q":"I remember the day ___ we met.","o":["why","when","where","how","who"],"a":1,"e":"시간을 나타내는 선행사 the day 뒤에는 관계부사 when을 써요."},{"q":"Tell me the reason ___ you cried.","o":["when","where","why","how","which"],"a":2,"e":"이유를 나타내는 선행사 the reason 뒤에는 관계부사 why를 써요."},{"q":"This is the city ___ I studied abroad.","o":["who","which","when","why","where"],"a":4,"e":"장소를 나타내는 선행사 the city 뒤에는 관계부사 where를 써요."},{"q":"Spring is the season ___ flowers bloom.","o":["where","why","whose","when","how"],"a":3,"e":"시간(계절)을 나타내는 선행사 the season 뒤에는 관계부사 when을 써요."},{"q":"I don't know the reason ___ she smiled.","o":["how","why","where","when","which"],"a":1,"e":"이유를 나타내는 선행사 the reason 뒤에는 관계부사 why를 써요."},{"q":"밑줄 친 부분을 바르게 고친 것은? This is the reason [[when]] he left.","o":["how","why","where","that","which"],"a":1,"e":"선행사가 the reason이므로 관계부사 why로 고쳐야 해요."},{"q":"That is ___ he fixed the car.","o":["which","when","how","where","why"],"a":2,"e":"방법을 나타낼 때는 선행사 없이 관계부사 how를 써요."},{"q":"다음 두 문장을 바르게 연결한 것은? I remember the day. + I met her on that day.","o":["I remember the day when I met her.","I remember the day which I met her.","I remember the day where I met her.","I remember the day why I met her.","I remember the day who I met her."],"a":0,"e":"시간을 나타내는 the day 뒤에는 관계부사 when을 써서 연결해요."},{"q":"다음 중 어법상 옳은 문장은?","o":["This is the park where we played there.","I know the reason why did she leave.","Tell me the way how you did it.","Do you remember the place where we first talked?","That is the day which we got married."],"a":3,"e":"장소 선행사 the place 뒤에 관계부사 where가 바르게 쓰인 문장이에요."}],"arrange":[{"ko":"이곳은 내가 사는 집이다.","a":"This is the house where I live."},{"ko":"나는 우리가 처음 만난 날을 기억한다.","a":"I remember the day when we first met."},{"ko":"그것이 그녀가 화난 이유이다.","a":"That is the reason why she is angry."},{"ko":"여기가 내가 태어난 도시이다.","a":"This is the city where I was born."},{"ko":"봄은 꽃이 피는 계절이다.","a":"Spring is the season when flowers bloom."},{"ko":"나에게 네가 늦은 이유를 말해줘.","a":"Tell me the reason why you were late."},{"ko":"이곳은 그가 일하는 사무실이다.","a":"This is the office where he works."},{"ko":"나는 그가 그것을 어떻게 고쳤는지 안다.","a":"I know how he fixed it."},{"ko":"그날은 우리가 이사한 날이었다.","a":"That was the day when we moved."},{"ko":"이곳이 우리가 처음 만난 장소이다.","a":"This is the place where we first met."},{"ko":"여름은 사람들이 바다에 가는 계절이다.","a":"Summer is the season when people go to the sea."},{"ko":"그것이 내가 그 책을 좋아하는 이유이다.","a":"That is the reason why I like the book."},{"ko":"나는 그녀가 사는 마을을 방문했다.","a":"I visited the town where she lives."},{"ko":"이것이 내가 그 문제를 푼 방법이다.","a":"This is how I solved the problem."},{"ko":"나는 우리가 헤어진 날을 잊지 못한다.","a":"I can't forget the day when we broke up."}],"compose":[{"k":"이곳은 내가 자란 집이다.","a":"This is the house where I grew up.","h":"house / where","alt":[]},{"k":"나는 우리가 처음 만난 날을 기억한다.","a":"I remember the day when we first met.","h":"day / when","alt":[]},{"k":"그것이 그가 떠난 이유이다.","a":"That is the reason why he left.","h":"reason / why","alt":["That is why he left."]},{"k":"여기가 내가 태어난 병원이다.","a":"This is the hospital where I was born.","h":"hospital / where","alt":[]},{"k":"가을은 잎이 떨어지는 계절이다.","a":"Fall is the season when leaves fall.","h":"season / when","alt":["Autumn is the season when leaves fall."]},{"k":"나에게 네가 우는 이유를 말해줘.","a":"Tell me the reason why you are crying.","h":"reason / why","alt":[]},{"k":"이곳은 우리가 공부하는 도서관이다.","a":"This is the library where we study.","h":"library / where","alt":[]},{"k":"나는 그녀가 그것을 어떻게 만들었는지 안다.","a":"I know how she made it.","h":"how","alt":[]},{"k":"월요일은 학교가 시작하는 날이다.","a":"Monday is the day when school starts.","h":"day / when","alt":[]},{"k":"이곳이 우리가 만난 장소이다.","a":"This is the place where we met.","h":"place / where","alt":[]},{"k":"그것이 내가 그를 믿는 이유이다.","a":"That is the reason why I trust him.","h":"reason / why","alt":["That is why I trust him."]},{"k":"나는 그가 사는 나라를 방문했다.","a":"I visited the country where he lives.","h":"country / where","alt":[]},{"k":"이것이 내가 영어를 배운 방법이다.","a":"This is how I learned English.","h":"how","alt":[]},{"k":"여름은 낮이 긴 계절이다.","a":"Summer is the season when the days are long.","h":"season / when","alt":[]},{"k":"나는 우리가 만난 카페를 좋아한다.","a":"I like the cafe where we met.","h":"cafe / where","alt":[]}],"task":{"prompt":"관계부사(where/when/why/how)를 사용하여 자신에게 특별한 <b>장소</b>나 <b>시간</b>에 대해 영어로 3문장 이상 쓰세요. <b>where, when, why</b> 중 적어도 하나를 반드시 포함하세요.","sample":"This is the park where I often play with my friends. I still remember the day when we first came here together. That is the reason why this place is so special to me.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"관계부사(where/when/why/how)를 사용했나요?","regex":"\\b(where|when|why|how)\\b"},{"label":"선행사(place/time/reason 등)와 함께 썼나요?","regex":"\\b(place|time|reason|day|house|city|season|park|year|moment|town)\\b"}]},"images":""},{"id":"L3C10U1","title":"if 가정법 과거·과거완료","explainParts":[{"t":"가정법은 실제 사실과 반대되거나 실현 가능성이 낮은 일을 가정할 때 써요."},{"k":"가정법 과거","n":"「If+주어+동사 과거형, 주어+would/could+동사원형」 형태로 '현재 사실의 반대'를 가정해요. be동사는 인칭과 상관없이 were를 쓰는 것이 원칙이에요."},{"t":"예: If I were rich, I would travel the world. (내가 부자라면 세계를 여행할 텐데.)"},{"k":"가정법 과거완료","n":"「If+주어+had p.p., 주어+would/could+have p.p.」 형태로 '과거 사실의 반대'를 가정해요. 이미 지나간 일에 대한 후회나 아쉬움을 나타내요."},{"t":"예: If I had studied harder, I would have passed the exam. (더 열심히 공부했더라면 시험에 합격했을 텐데.)"},{"k":"시제가 핵심","n":"가정법 과거는 '현재'의 반대, 가정법 과거완료는 '과거'의 반대예요. 실제 시제보다 한 단계 과거로 옮겨 표현하는 것이 가장 중요한 포인트예요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"If I ___ a bird, I would fly to you.","o":["were","am","be","been","being"],"a":0,"e":"가정법 과거에서 be동사는 주어에 관계없이 were를 쓴다."},{"q":"If it were sunny, we ___ go on a picnic.","o":["will","would","must","can","have to"],"a":1,"e":"가정법 과거의 주절은 「would+동사원형」을 쓴다."},{"q":"If I had known the truth, I ___ you.","o":["will tell","would tell","told","would have told","have told"],"a":3,"e":"가정법 과거완료의 주절은 「would have p.p.」를 쓴다."},{"q":"If she ___ harder, she would have passed the test.","o":["studies","study","had studied","has studied","will study"],"a":2,"e":"가정법 과거완료의 if절은 「had p.p.」를 쓴다."},{"q":"If I ___ enough money, I could buy that laptop.","o":["have","had","had had","will have","having"],"a":1,"e":"현재 사실의 반대를 나타내는 가정법 과거는 if절에 과거동사를 쓴다."},{"q":"밑줄 친 부분을 어법에 맞게 고친 것은? If I [[will be]] you, I wouldn't do that.","o":["were","am","will be","would be","being"],"a":0,"e":"가정법 과거의 if절에는 미래형이 아닌 과거동사 were를 쓴다."},{"q":"If we had left earlier, we ___ the train.","o":["catch","caught","would catch","had caught","would have caught"],"a":4,"e":"과거 사실의 반대이므로 가정법 과거완료 「would have p.p.」를 쓴다."},{"q":"다음 중 어법상 옳은 문장은?","o":["If I was you, I will help him.","If I were you, I would help him.","If I am you, I would help him.","If I were you, I will help him.","If I had been you, I help him."],"a":1,"e":"가정법 과거는 「If+were, would+동사원형」 형태로 쓴다."},{"q":"If they had not missed the bus, they ___ late.","o":["are not","were not","would not be","would not have been","had not been"],"a":3,"e":"과거 사실의 반대이므로 「would not have p.p.」를 쓴다."},{"q":"\"만약 내가 그때 더 조심했더라면, 그 사고를 피했을 텐데.\"를 바르게 옮긴 것은?","o":["If I am more careful, I avoid the accident.","If I were more careful, I would avoid the accident.","If I had been more careful, I would have avoided the accident.","If I was more careful, I will avoid the accident.","If I have been more careful, I would avoid the accident."],"a":2,"e":"과거의 일에 대한 후회이므로 가정법 과거완료를 쓴다."}],"arrange":[{"ko":"내가 부자라면, 나는 세계를 여행할 텐데.","a":"If I were rich, I would travel the world."},{"ko":"내가 새라면, 나는 너에게 날아갈 텐데.","a":"If I were a bird, I would fly to you."},{"ko":"내가 더 열심히 공부했더라면, 나는 시험에 합격했을 텐데.","a":"If I had studied harder, I would have passed the exam."},{"ko":"날씨가 맑다면, 우리는 소풍을 갈 텐데.","a":"If it were sunny, we would go on a picnic."},{"ko":"내가 너라면, 나는 그에게 사과할 텐데.","a":"If I were you, I would apologize to him."},{"ko":"내가 그 진실을 알았더라면, 나는 너에게 말했을 텐데.","a":"If I had known the truth, I would have told you."},{"ko":"우리가 더 일찍 떠났더라면, 우리는 기차를 탔을 텐데.","a":"If we had left earlier, we would have caught the train."},{"ko":"내가 돈이 충분하다면, 나는 저 노트북을 살 수 있을 텐데.","a":"If I had enough money, I could buy that laptop."},{"ko":"그가 버스를 놓치지 않았더라면, 그는 늦지 않았을 텐데.","a":"If he had not missed the bus, he would not have been late."},{"ko":"그녀가 여기 있다면, 그녀는 우리를 도와줄 텐데.","a":"If she were here, she would help us."},{"ko":"내가 더 조심했더라면, 나는 그 사고를 피했을 텐데.","a":"If I had been more careful, I would have avoided the accident."},{"ko":"그가 시간이 있다면, 그는 우리와 함께 갈 텐데.","a":"If he had time, he would come with us."},{"ko":"그들이 우리를 초대했더라면, 우리는 그 파티에 갔을 텐데.","a":"If they had invited us, we would have gone to the party."},{"ko":"내가 그 답을 안다면, 나는 너에게 말해 줄 텐데.","a":"If I knew the answer, I would tell you."},{"ko":"비가 오지 않았더라면, 우리는 축구를 했을 텐데.","a":"If it had not rained, we would have played soccer."}],"compose":[{"k":"내가 키가 더 크다면, 나는 농구선수가 될 텐데.","a":"If I were taller, I would be a basketball player.","h":"가정법 과거 / were / would+원형","alt":["If I were taller, I could be a basketball player."]},{"k":"내가 그 소식을 들었더라면, 나는 너에게 전화했을 텐데.","a":"If I had heard the news, I would have called you.","h":"가정법 과거완료 / had p.p. / would have p.p.","alt":["If I had heard the news, I would have phoned you."]},{"k":"내가 지금 한가하다면, 나는 너를 도와줄 텐데.","a":"If I were free now, I would help you.","h":"were / would+원형","alt":["If I were free now, I could help you."]},{"k":"그가 더 일찍 일어났더라면, 그는 버스를 놓치지 않았을 텐데.","a":"If he had woken up earlier, he would not have missed the bus.","h":"had p.p. / would not have p.p.","alt":["If he had gotten up earlier, he would not have missed the bus."]},{"k":"내가 그의 주소를 안다면, 나는 그에게 편지를 보낼 텐데.","a":"If I knew his address, I would send him a letter.","h":"과거동사 / would+원형","alt":["If I knew his address, I would write him a letter."]},{"k":"우리가 지도를 가져왔더라면, 우리는 길을 잃지 않았을 텐데.","a":"If we had brought a map, we would not have gotten lost.","h":"had p.p. / would not have p.p.","alt":["If we had brought a map, we would not have been lost."]},{"k":"그녀가 아프지 않다면, 그녀는 학교에 올 텐데.","a":"If she were not sick, she would come to school.","h":"were not / would+원형","alt":["If she were not ill, she would come to school."]},{"k":"내가 열심히 연습했더라면, 나는 그 경기에서 이겼을 텐데.","a":"If I had practiced hard, I would have won the game.","h":"had p.p. / would have p.p.","alt":["If I had practiced hard, I could have won the game."]},{"k":"내가 날개가 있다면, 나는 하늘을 날 수 있을 텐데.","a":"If I had wings, I could fly in the sky.","h":"had / could+원형","alt":["If I had wings, I would fly in the sky."]},{"k":"그가 진실을 말했더라면, 우리는 그를 믿었을 텐데.","a":"If he had told the truth, we would have believed him.","h":"had p.p. / would have p.p.","alt":["If he had told the truth, we could have believed him."]},{"k":"내가 너라면, 나는 그 제안을 받아들일 텐데.","a":"If I were you, I would accept the offer.","h":"were / would+원형","alt":["If I were you, I would take the offer."]},{"k":"우리가 표를 예매했더라면, 우리는 그 콘서트를 봤을 텐데.","a":"If we had booked the tickets, we would have seen the concert.","h":"had p.p. / would have p.p.","alt":["If we had reserved the tickets, we would have seen the concert."]},{"k":"그녀가 시간이 더 있다면, 그녀는 그림을 그릴 텐데.","a":"If she had more time, she would paint.","h":"과거동사 / would+원형","alt":["If she had more time, she would draw."]},{"k":"내가 우산을 가져왔더라면, 나는 젖지 않았을 텐데.","a":"If I had brought an umbrella, I would not have gotten wet.","h":"had p.p. / would not have p.p.","alt":["If I had brought an umbrella, I would not have been wet."]},{"k":"그가 부지런하다면, 그는 그 일을 끝낼 텐데.","a":"If he were diligent, he would finish the work.","h":"were / would+원형","alt":["If he were diligent, he could finish the work."]}],"task":{"prompt":"만약 여러분에게 <b>초능력</b>이 생긴다면 무엇을 하고 싶은지, 그리고 <b>과거에 다르게 행동했더라면</b> 지금 어땠을지 상상하여 영어로 3문장 이상 써 보세요. <b>가정법 과거</b>와 <b>가정법 과거완료</b>를 모두 사용해야 합니다.","sample":"If I had a superpower, I would help people in need. If I could fly, I would travel around the world for free. If I had studied English harder last year, I would have gotten a better grade.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"가정법 과거(If + 과거동사, would/could + 동사원형)를 사용했나요?","regex":"[Ii]f\\b[^.]*\\b(would|could)\\b"},{"label":"가정법 과거완료(If + had p.p., would/could have p.p.)를 사용했나요?","regex":"[Ii]f\\b[^.]*\\bhad\\b[^.]*(would|could)\\s+have\\b"}]},"images":""},{"id":"L3C10U2","title":"I wish / as if 가정법","explainParts":[{"t":"현재 이룰 수 없는 소망이나 사실과 반대되는 상황을 표현할 때 가정법을 사용해요."},{"k":"I wish + 가정법 과거","n":"「I wish+주어+동사의 과거형」은 '~라면 좋을 텐데'라는 뜻으로, 현재 이룰 수 없는 소망을 나타내요. 예: I wish I could fly. (내가 날 수 있다면 좋을 텐데.)"},{"t":"be동사는 주어에 상관없이 were를 쓰는 것이 원칙이에요."},{"k":"as if + 가정법 과거","n":"「as if+주어+동사의 과거형」은 '마치 ~인 것처럼'이라는 뜻으로, 현재 사실과 반대되는 내용을 나타내요. 예: He talks as if he knew everything. (그는 마치 모든 것을 아는 것처럼 말해요.) 실제로는 모두 알지 못한다는 의미가 담겨 있어요."},{"t":"이렇게 말하면 실제 사실과 반대되는 상황을 강조할 수 있어요."},{"k":"시제에 주의하기","n":"현재 사실의 반대는 동사의 과거형(가정법 과거), 과거 사실의 반대는 과거완료형(가정법 과거완료)을 써요. 예: She looks as if she had seen a ghost. (그녀는 마치 유령을 본 것처럼 보인다.)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I wish I ___ a bird.","o":["were","am","be","is","been"],"a":0,"e":"가정법에서 be동사는 주어와 상관없이 were를 쓰므로 were가 알맞아요."},{"q":"I wish I ___ play the piano.","o":["can","will","could","do","am"],"a":2,"e":"'~할 수 있다면 좋을 텐데'는 조동사의 과거형 could를 써요."},{"q":"He speaks as if he ___ a native speaker.","o":["is","were","be","are","been"],"a":1,"e":"as if 가정법에서는 be동사로 were를 쓰므로 were가 알맞아요."},{"q":"She acts as if she ___ the answer.","o":["know","knows","to know","knew","knowing"],"a":3,"e":"현재 사실의 반대를 나타내는 as if 가정법은 동사의 과거형 knew를 써요."},{"q":"I wish it ___ raining now.","o":["weren't","isn't","aren't","were","not"],"a":0,"e":"현재 사실과 반대인 소망은 가정법 과거를 쓰고 be동사는 weren't를 써요."},{"q":"다음 밑줄 친 부분이 의미하는 바로 알맞은 것은? He talks as if he [[knew]] everything.","o":["그는 실제로 모든 것을 안다","그는 사실 모든 것을 알지 못한다","그는 곧 모든 것을 알게 될 것이다","그는 예전에 모든 것을 알았다","그는 모든 것을 알고 싶어 한다"],"a":1,"e":"as if 가정법은 현재 사실의 반대를 뜻하므로 실제로는 알지 못한다는 의미예요."},{"q":"I wish I ___ studied harder for the test.","o":["have","has","did","had","would"],"a":3,"e":"과거 사실과 반대되는 소망은 가정법 과거완료 had studied를 써요."},{"q":"She looks as if she ___ seen a ghost.","o":["have","has","did","was","had"],"a":4,"e":"과거에 일어난 일을 나타내는 as if 가정법 과거완료는 had seen을 써요."},{"q":"I wish I ___ born in Paris.","o":["had been","was","were","have been","am"],"a":0,"e":"과거 사실과 반대되는 소망이므로 가정법 과거완료 had been을 써요."},{"q":"다음 중 어법상 올바른 문장은?","o":["I wish I can fly.","I wish I could flew.","He acts as if he were tired.","She talks as if she is a teacher.","I wish I am a doctor."],"a":2,"e":"as if 가정법은 동사의 과거형을 쓰므로 He acts as if he were tired.가 올바른 문장이에요."}],"arrange":[{"ko":"내가 새라면 좋을 텐데.","a":"I wish I were a bird."},{"ko":"내가 피아노를 칠 수 있다면 좋을 텐데.","a":"I wish I could play the piano."},{"ko":"그는 마치 왕인 것처럼 행동한다.","a":"He acts as if he were a king."},{"ko":"그녀는 마치 모든 것을 아는 것처럼 말한다.","a":"She talks as if she knew everything."},{"ko":"내가 날 수 있다면 좋을 텐데.","a":"I wish I could fly."},{"ko":"내가 키가 더 크면 좋을 텐데.","a":"I wish I were taller."},{"ko":"그는 마치 원어민인 것처럼 영어를 말한다.","a":"He speaks English as if he were a native speaker."},{"ko":"그녀는 마치 유령을 본 것처럼 보인다.","a":"She looks as if she had seen a ghost."},{"ko":"내가 더 열심히 공부했다면 좋을 텐데.","a":"I wish I had studied harder."},{"ko":"그는 마치 나를 아는 것처럼 미소 지었다.","a":"He smiled as if he knew me."},{"ko":"지금 비가 오지 않으면 좋을 텐데.","a":"I wish it weren't raining now."},{"ko":"내가 그곳에 있다면 좋을 텐데.","a":"I wish I were there."},{"ko":"그녀는 마치 아픈 것처럼 말한다.","a":"She talks as if she were sick."},{"ko":"내가 그의 이름을 안다면 좋을 텐데.","a":"I wish I knew his name."},{"ko":"그는 마치 부자인 것처럼 돈을 쓴다.","a":"He spends money as if he were rich."}],"compose":[{"k":"내가 부자라면 좋을 텐데.","a":"I wish I were rich.","h":"I wish / were / 가정법 과거","alt":["I wish I was rich.","I wish that I were rich."]},{"k":"그는 마치 그것을 아는 것처럼 말한다.","a":"He talks as if he knew it.","h":"as if / knew / 마치 ~처럼","alt":["He speaks as if he knew it.","He talks as though he knew it."]},{"k":"내가 더 어리면 좋을 텐데.","a":"I wish I were younger.","h":"I wish / were","alt":["I wish I was younger.","I wish that I were younger."]},{"k":"그녀는 마치 선생님인 것처럼 행동한다.","a":"She acts as if she were a teacher.","h":"as if / were","alt":["She behaves as if she were a teacher.","She acts as though she were a teacher."]},{"k":"내가 수영을 할 수 있다면 좋을 텐데.","a":"I wish I could swim.","h":"I wish / could","alt":["I wish that I could swim."]},{"k":"그는 마치 나를 이해하는 것처럼 고개를 끄덕였다.","a":"He nodded as if he understood me.","h":"as if / understood","alt":["He nodded as though he understood me."]},{"k":"내가 그 답을 안다면 좋을 텐데.","a":"I wish I knew the answer.","h":"I wish / knew","alt":["I wish that I knew the answer."]},{"k":"그녀는 마치 유령을 본 것처럼 창백해 보였다.","a":"She looked as if she had seen a ghost.","h":"as if / had seen / 가정법 과거완료","alt":["She looked as though she had seen a ghost."]},{"k":"내가 그때 더 조심했다면 좋을 텐데.","a":"I wish I had been more careful then.","h":"I wish / had been / 과거완료","alt":["I wish that I had been more careful then."]},{"k":"그는 마치 아무 일도 없었던 것처럼 웃었다.","a":"He smiled as if nothing had happened.","h":"as if / had happened","alt":["He smiled as though nothing had happened."]},{"k":"내가 파리에 산다면 좋을 텐데.","a":"I wish I lived in Paris.","h":"I wish / lived","alt":["I wish that I lived in Paris."]},{"k":"그녀는 마치 그 이야기를 믿는 것처럼 들었다.","a":"She listened as if she believed the story.","h":"as if / believed","alt":["She listened as though she believed the story."]},{"k":"내가 너와 함께 갈 수 있다면 좋을 텐데.","a":"I wish I could go with you.","h":"I wish / could go","alt":["I wish that I could go with you."]},{"k":"그는 마치 그곳에 가 본 적이 있는 것처럼 말한다.","a":"He talks as if he had been there.","h":"as if / had been","alt":["He speaks as if he had been there.","He talks as though he had been there."]},{"k":"지금 방학이면 좋을 텐데.","a":"I wish it were vacation now.","h":"I wish / were / now","alt":["I wish it was vacation now.","I wish that it were vacation now."]}],"task":{"prompt":"여러분이 지금 바라는 이룰 수 없는 소망이나 상상을 세 문장 이상 영어로 써 보세요. 최소 한 문장에는 <b>I wish 가정법</b>을, 다른 한 문장에는 <b>as if 가정법</b>을 반드시 사용하세요.","sample":"I wish I could travel around the world. My little brother acts as if he were an adult. I wish I were better at speaking English.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"I wish 가정법을 사용했나요?","regex":"I wish"},{"label":"as if 가정법을 사용했나요?","regex":"as if"}]},"images":""},{"id":"L3C10U3","title":"주의해야 할 가정법","explainParts":[{"t":"가정법에는 if 없이 조건을 나타내거나 형태가 바뀌는 특별한 경우가 있어요."},{"k":"Without / But for","n":"'~이 없다면(없었다면)'이라는 뜻으로, If it were not for(현재)나 If it had not been for(과거)를 대신해요. 예: Without water, we could not live."},{"t":"또, 과거의 일이 지금에 영향을 주는 경우가 있어요."},{"k":"혼합가정법","n":"if절은 과거완료(had p.p.), 주절은 현재(would+동사원형+now)로 써서 '(과거에) ~했다면 (지금) ~할 텐데'를 나타내요. 예: If I had studied harder, I would be a doctor now."},{"t":"마지막으로 조건절의 if를 생략할 수도 있어요."},{"k":"if 생략 도치","n":"if를 없애고 were, had, should를 주어 앞으로 보내요. If I were you → Were I you, If I had known → Had I known, If you should need → Should you need."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"___ the sun, all living things would die.","o":["Without","With","Within","Wide","Withdraw"],"a":0,"e":"'~이 없다면'은 Without으로 나타낸다."},{"q":"Without water, we ___ live.","o":["can","could","could not","will","must"],"a":2,"e":"물이 없다면 살 수 없을 것이라는 가정이므로 could not를 쓴다."},{"q":"___ I you, I would go there right now.","o":["Am","Was","Been","Were","Be"],"a":3,"e":"If I were you에서 if를 생략하고 were를 주어 앞으로 도치한다."},{"q":"___ your advice, I would have failed the exam.","o":["But","But for","For","Except","Besides"],"a":1,"e":"But for는 '~이 없었다면'의 뜻으로 Without과 같다."},{"q":"If I had taken the medicine, I ___ better now.","o":["would have felt","will feel","felt","have felt","would feel"],"a":4,"e":"과거의 일이 현재에 영향을 주는 혼합가정법이므로 주절은 would feel(현재)을 쓴다."},{"q":"___ known the truth, I would have told you at once.","o":["Did I","Have I","Had I","If I only","Were I"],"a":2,"e":"If I had known에서 if를 생략하고 Had I로 도치한다."},{"q":"Without your support = ___ your support.","o":["If it is not for","If it were not for","If there were not","Unless it were","If not it were"],"a":1,"e":"Without은 If it were not for로 바꿔 쓸 수 있다."},{"q":"___ you need any help, please call me anytime.","o":["Would","Could","Might","Should","Must"],"a":3,"e":"If you should need에서 if를 생략하고 Should you로 도치한다."},{"q":"다음 밑줄 친 부분과 바꿔 쓸 수 있는 것은? [[Without]] his help, I could not have succeeded.","o":["But for","But of","In spite of","Because of","Except that"],"a":0,"e":"Without은 But for와 같은 '~이 없었다면'의 뜻이다."},{"q":"If he had not wasted his money, he ___ rich now.","o":["would have been","will be","is","had been","would be"],"a":4,"e":"과거에 낭비하지 않았다면 지금 부자일 텐데 — 혼합가정법이므로 주절은 would be를 쓴다."}],"arrange":[{"ko":"물이 없다면 우리는 살 수 없을 것이다.","a":"Without water, we could not live."},{"ko":"내가 너라면 나는 그곳에 갈 텐데.","a":"Were I you, I would go there."},{"ko":"태양이 없다면 모든 생물이 죽을 것이다.","a":"Without the sun, all living things would die."},{"ko":"너의 도움이 없었다면 나는 실패했을 것이다.","a":"But for your help, I would have failed."},{"ko":"내가 진실을 알았더라면 너에게 말했을 텐데.","a":"Had I known the truth, I would have told you."},{"ko":"공기가 없다면 어떤 생물도 살아남을 수 없을 것이다.","a":"Without air, no living thing could survive."},{"ko":"내가 그 약을 먹었더라면 지금 기분이 나을 텐데.","a":"If I had taken the medicine, I would feel better now."},{"ko":"당신이 도움이 필요하다면 저에게 전화하세요.","a":"Should you need help, please call me."},{"ko":"너의 조언이 없었다면 나는 길을 잃었을 것이다.","a":"Without your advice, I would have been lost."},{"ko":"그가 돈을 낭비하지 않았더라면 지금 부자일 텐데.","a":"If he had not wasted his money, he would be rich now."},{"ko":"내가 부자라면 그 집을 살 텐데.","a":"Were I rich, I would buy that house."},{"ko":"물과 공기가 없다면 우리는 존재할 수 없을 것이다.","a":"Without water and air, we could not exist."},{"ko":"내가 더 열심히 공부했더라면 지금 의사일 텐데.","a":"If I had studied harder, I would be a doctor now."},{"ko":"너의 지지가 없었다면 나는 포기했을 것이다.","a":"But for your support, I would have given up."},{"ko":"그 사고가 없었다면 그는 지금 살아 있을 텐데.","a":"But for the accident, he would be alive now."}],"compose":[{"k":"물이 없다면 우리는 살 수 없을 것이다.","a":"Without water, we could not live.","h":"~이 없다면 Without / could not","alt":["If it were not for water, we could not live."]},{"k":"내가 너라면 나는 그곳에 갈 텐데.","a":"Were I you, I would go there.","h":"if 생략 도치 Were I / would","alt":["If I were you, I would go there."]},{"k":"내가 진실을 알았더라면 너에게 말했을 텐데.","a":"Had I known the truth, I would have told you.","h":"if 생략 Had I / would have p.p.","alt":["If I had known the truth, I would have told you."]},{"k":"너의 도움이 없었다면 나는 실패했을 것이다.","a":"But for your help, I would have failed.","h":"~이 없었다면 But for","alt":["Without your help, I would have failed.","If it had not been for your help, I would have failed."]},{"k":"내가 그 약을 먹었더라면 지금 기분이 나을 텐데.","a":"If I had taken the medicine, I would feel better now.","h":"혼합가정법 had p.p. / would 동사원형 now","alt":[]},{"k":"당신이 도움이 필요하다면 저에게 전화하세요.","a":"Should you need help, please call me.","h":"if 생략 Should you","alt":["If you should need help, please call me."]},{"k":"태양이 없다면 모든 생물이 죽을 것이다.","a":"Without the sun, all living things would die.","h":"Without / would","alt":["If it were not for the sun, all living things would die."]},{"k":"그가 돈을 낭비하지 않았더라면 지금 부자일 텐데.","a":"If he had not wasted his money, he would be rich now.","h":"혼합가정법 / would be ... now","alt":[]},{"k":"내가 부자라면 그 집을 살 텐데.","a":"Were I rich, I would buy that house.","h":"if 생략 도치 Were I","alt":["If I were rich, I would buy that house."]},{"k":"공기가 없다면 어떤 생물도 살아남을 수 없을 것이다.","a":"Without air, no living thing could survive.","h":"Without / could","alt":["If it were not for air, no living thing could survive."]},{"k":"내가 더 열심히 공부했더라면 지금 의사일 텐데.","a":"If I had studied harder, I would be a doctor now.","h":"혼합가정법 / would be now","alt":[]},{"k":"너의 지지가 없었다면 나는 포기했을 것이다.","a":"But for your support, I would have given up.","h":"But for / would have p.p.","alt":["Without your support, I would have given up."]},{"k":"내가 그것을 알았더라면 다르게 행동했을 텐데.","a":"Had I known it, I would have acted differently.","h":"if 생략 Had I","alt":["If I had known it, I would have acted differently."]},{"k":"물이 없다면 지구에 생명체가 없을 것이다.","a":"Without water, there would be no life on Earth.","h":"Without / there would be","alt":["If it were not for water, there would be no life on Earth."]},{"k":"그 사고가 없었다면 그는 지금 살아 있을 텐데.","a":"But for the accident, he would be alive now.","h":"But for / would be now","alt":["Without the accident, he would be alive now."]}],"task":{"prompt":"<b>주의해야 할 가정법</b>을 사용하여, 만약 내가 과거에 다른 선택을 했다면 지금 내 삶이 어떻게 달라졌을지 상상하는 글을 영어로 세 문장 이상 쓰세요. <b>Without/But for(~이 없다면)</b>, <b>혼합가정법</b>, <b>if 생략 도치</b> 중 두 가지 이상을 반드시 활용하세요.","sample":"Without my parents' support, I would not be who I am today. If I had chosen a different school, I would have very different friends now. Had I studied harder in the past, I would be more confident about my future.","conds":[{"label":"세 문장 이상 썼나요?","minSentences":3},{"label":"Without 또는 But for를 사용했나요?","regex":"\\b(Without|But for)\\b"},{"label":"if 생략 도치(Were/Had/Should+주어) 또는 혼합가정법(would+동사원형+now)을 사용했나요?","regex":"\\b(Were|Had|Should)\\s+(I|you|he|she|we|they)\\b|would\\s+\\w+\\b[^.]*\\bnow\\b"}]},"images":""},{"id":"L3C11U1","title":"수일치","explainParts":[{"t":"주어가 여러 단어로 길어져도, 동사는 '진짜 주어' 하나에 수를 맞춰야 해요. "},{"k":"each / every","n":"each와 every 뒤에는 항상 단수명사가 오고 동사도 단수예요. (Each student has ~ / Every room has ~)"},{"t":"또한 "},{"k":"one of + 복수명사","n":"'~중 하나'라는 뜻으로 진짜 주어는 one(단수)이에요. 그래서 동사는 단수! (One of them is ~)"},{"t":"그리고 "},{"k":"either A or B","n":"'A 또는 B'는 동사와 가까운 쪽(B)에 수를 맞춰요. neither A nor B도 똑같이 B에 맞춥니다."},{"t":"참고로 the number of(~의 수)는 단수, a number of(많은 ~)는 복수 취급이에요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"Each student ___ a textbook.","o":["has","have","having","are having","have got"],"a":0,"e":"each 뒤에는 단수명사와 단수동사가 오므로 has가 맞아요."},{"q":"Every room ___ a window.","o":["have","having","are","has","were"],"a":3,"e":"every 뒤 주어는 단수 취급이라 단수동사 has를 써요."},{"q":"One of my friends ___ from Canada.","o":["are","is","were","be","being"],"a":1,"e":"one of + 복수명사에서 진짜 주어는 one(단수)이라 is가 맞아요."},{"q":"The number of students ___ increasing.","o":["have","are","were","being","is"],"a":4,"e":"the number of(~의 수)는 단수 취급이므로 is를 써요."},{"q":"Either you or she [[have]] to clean the room. 밑줄 친 부분을 바르게 고친 것은?","o":["have","has","are","having","to have"],"a":1,"e":"either A or B는 가까운 주어 she에 맞춰 단수동사 has가 맞아요."},{"q":"Each of the boys ___ a uniform.","o":["wear","are wearing","wears","have","were"],"a":2,"e":"each of + 복수명사도 진짜 주어는 each(단수)라 단수동사 wears를 써요."},{"q":"A number of people ___ waiting outside.","o":["is","was","has","are","waits"],"a":3,"e":"a number of(많은 ~)는 복수 취급이므로 복수동사 are를 써요."},{"q":"Either Tom or his brothers ___ going to help.","o":["are","is","was","has","am"],"a":0,"e":"either A or B는 가까운 주어 his brothers(복수)에 맞춰 are를 써요."},{"q":"Neither the teacher nor the students ___ ready.","o":["is","has","was","am","are"],"a":4,"e":"neither A nor B는 가까운 주어 the students(복수)에 맞춰 are를 써요."},{"q":"Neither of the answers ___ correct.","o":["are","were","is","have","seem"],"a":2,"e":"neither of + 복수명사는 단수 취급이므로 단수동사 is를 써요."}],"arrange":[{"ko":"각 학생은 책을 한 권 가지고 있다.","a":"Each student has a book."},{"ko":"그들 중 한 명이 늦었다.","a":"One of them is late."},{"ko":"모든 방에는 창문이 있다.","a":"Every room has a window."},{"ko":"학생들의 수가 증가하고 있다.","a":"The number of students is increasing."},{"ko":"내 친구들 중 한 명은 캐나다 출신이다.","a":"One of my friends is from Canada."},{"ko":"각각의 소년은 교복을 입는다.","a":"Each boy wears a uniform."},{"ko":"톰이나 그의 형제들이 도울 것이다.","a":"Either Tom or his brothers are going to help."},{"ko":"선생님도 학생들도 준비가 되지 않았다.","a":"Neither the teacher nor the students are ready."},{"ko":"많은 사람들이 밖에서 기다리고 있다.","a":"A number of people are waiting outside."},{"ko":"그 답들 중 어느 것도 맞지 않다.","a":"Neither of the answers is correct."},{"ko":"모든 학생은 이름표를 가지고 있다.","a":"Every student has a name tag."},{"ko":"그 상자들 중 하나가 비어 있다.","a":"One of the boxes is empty."},{"ko":"너나 그녀가 방을 청소해야 한다.","a":"Either you or she has to clean the room."},{"ko":"각각의 팀은 다섯 명의 선수를 가지고 있다.","a":"Each team has five players."},{"ko":"그 문제들의 수가 너무 많다.","a":"The number of problems is too big."}],"compose":[{"k":"각 학생은 책을 한 권 가지고 있다.","a":"Each student has a book.","h":"each / 단수동사 / has","alt":[]},{"k":"그들 중 한 명이 늦었다.","a":"One of them is late.","h":"one of / 단수동사 / is",
