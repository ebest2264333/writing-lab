속절의 동사도 보통 그에 맞춰 과거나 과거완료로 바꿔야 해요."},{"k":"시제 일치","n":"주절이 과거일 때 종속절의 현재는 과거로, 과거·현재완료는 과거완료로 바꾸는 규칙이에요. 예: He said that he is busy. → He said that he was busy."},{"t":"예를 들어 'He says that he is busy.'가 주절이 과거가 되면 'He said that he was busy.'가 되고, 미래 will은 would로 바뀌어요."},{"k":"시제 일치의 예외","n":"불변의 진리, 과학적 사실, 현재의 습관, 속담 등은 주절이 과거여도 항상 현재시제로 써요. 예: She learned that water boils at 100 degrees."},{"t":"또한 역사적 사실은 주절이 무엇이든 언제나 과거시제를 그대로 유지해요."},{"k":"역사적 사실","n":"한국 전쟁이나 세계대전 같은 역사적 사건은 항상 과거시제로 써요. 예: We learned that the Korean War broke out in 1950."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"He said that he ___ hungry.","o":["is","was","were","be","been"],"a":1,"e":"주절 said가 과거이므로 종속절도 과거 was로 시제를 일치시켜요."},{"q":"My mom said that she ___ me at the station.","o":["will meet","meets","meeting","would meet","met"],"a":3,"e":"주절이 과거이므로 미래 will은 would로 바뀌어요."},{"q":"I thought that you ___ already left.","o":["had","has","have","having","will have"],"a":0,"e":"주절 과거보다 더 이전에 일어난 일이므로 과거완료 had를 써요."},{"q":"The teacher taught us that the earth ___ around the sun.","o":["moved","was moving","move","has moved","moves"],"a":4,"e":"불변의 진리는 주절이 과거여도 항상 현재시제로 써요."},{"q":"We learned that the Korean War ___ out in 1950.","o":["breaks","has broken","broke","was breaking","break"],"a":2,"e":"역사적 사실은 주절이 무엇이든 항상 과거시제로 써요."},{"q":"She learned that water ___ at 100 degrees Celsius.","o":["boiled","boils","was boiling","has boiled","boil"],"a":1,"e":"과학적 진리는 항상 현재시제 boils로 표현해요."},{"q":"When I met her, she said that she [[will]] call me later. 밑줄 친 부분을 알맞게 고친 것은?","o":["will","shall","is going to","would","won't"],"a":3,"e":"주절이 과거(said)이므로 미래 will은 would로 고쳐야 해요."},{"q":"The scientist said that light ___ faster than sound.","o":["travels","traveled","was traveling","has traveled","travel"],"a":0,"e":"과학적 사실(불변의 진리)은 항상 현재시제로 써요."},{"q":"I didn't know that he ___ the exam the week before.","o":["passes","has passed","had passed","passing","will pass"],"a":2,"e":"주절 과거보다 이전에 일어난 일이므로 과거완료 had passed를 써요."},{"q":"다음 중 어법상 옳은 문장은?","o":["He said that he will come tomorrow.","She learned that water boiled at 100 degrees.","I thought that he is already home.","They knew that the sun rose in the west.","We were taught that World War II ended in 1945."],"a":4,"e":"역사적 사실(2차 세계대전)은 항상 과거시제로 쓰므로 이 문장이 옳아요."}],"arrange":[{"ko":"그는 자신이 바쁘다고 말했다.","a":"He said that he was busy."},{"ko":"그녀는 물이 100도에서 끓는다는 것을 배웠다.","a":"She learned that water boils at 100 degrees."},{"ko":"나는 그가 아프다고 생각했다.","a":"I thought that he was sick."},{"ko":"우리는 지구가 태양 주위를 돈다고 배웠다.","a":"We learned that the earth moves around the sun."},{"ko":"그는 자신이 그녀를 나중에 만날 것이라고 말했다.","a":"He said that he would meet her later."},{"ko":"나는 그가 이미 떠났다는 것을 몰랐다.","a":"I didn't know that he had already left."},{"ko":"그녀는 자신이 피곤하다고 말했다.","a":"She said that she was tired."},{"ko":"우리는 한국 전쟁이 1950년에 일어났다고 배웠다.","a":"We learned that the Korean War broke out in 1950."},{"ko":"선생님은 태양이 동쪽에서 뜬다고 말씀하셨다.","a":"The teacher said that the sun rises in the east."},{"ko":"나는 네가 그 시험에 합격했다고 들었다.","a":"I heard that you had passed the exam."},{"ko":"그는 자신이 다음 날 돌아올 것이라고 말했다.","a":"He said that he would come back the next day."},{"ko":"그녀는 빛이 소리보다 빠르다는 것을 알았다.","a":"She knew that light travels faster than sound."},{"ko":"그들은 그 사고가 그 전날 밤에 일어났다고 말했다.","a":"They said that the accident had happened the night before."},{"ko":"우리는 2차 세계대전이 1945년에 끝났다고 배웠다.","a":"We learned that World War II ended in 1945."},{"ko":"나는 그녀가 정직하다고 믿었다.","a":"I believed that she was honest."}],"compose":[{"k":"그는 자신이 바쁘다고 말했다.","a":"He said that he was busy.","h":"said / that / was","alt":["He said he was busy."]},{"k":"그녀는 물이 100도에서 끓는다는 것을 배웠다.","a":"She learned that water boils at 100 degrees.","h":"불변의 진리 / boils / 현재시제","alt":["She learned water boils at 100 degrees."]},{"k":"나는 그가 아프다고 생각했다.","a":"I thought that he was sick.","h":"thought / was","alt":["I thought he was sick.","I thought that he was ill."]},{"k":"우리는 지구가 태양 주위를 돈다고 배웠다.","a":"We learned that the earth moves around the sun.","h":"진리 / moves / 현재","alt":["We learned the earth moves around the sun."]},{"k":"나는 그가 이미 떠났다는 것을 몰랐다.","a":"I didn't know that he had already left.","h":"과거완료 / had left","alt":["I didn't know he had already left."]},{"k":"그는 자신이 그녀를 나중에 만날 것이라고 말했다.","a":"He said that he would meet her later.","h":"will→would / meet","alt":["He said he would meet her later."]},{"k":"우리는 한국 전쟁이 1950년에 일어났다고 배웠다.","a":"We learned that the Korean War broke out in 1950.","h":"역사적 사실 / 과거시제","alt":["We learned the Korean War broke out in 1950."]},{"k":"그녀는 자신이 피곤하다고 말했다.","a":"She said that she was tired.","h":"said / was","alt":["She said she was tired."]},{"k":"선생님은 빛이 소리보다 빠르다고 가르치셨다.","a":"The teacher taught us that light travels faster than sound.","h":"진리 / travels","alt":["The teacher taught that light travels faster than sound."]},{"k":"나는 네가 그 시험에 합격했다고 들었다.","a":"I heard that you had passed the exam.","h":"과거완료 / had passed","alt":["I heard you had passed the exam."]},{"k":"그는 자신이 다음 날 돌아올 것이라고 말했다.","a":"He said that he would come back the next day.","h":"would / the next day","alt":["He said he would come back the next day."]},{"k":"우리는 2차 세계대전이 1945년에 끝났다고 배웠다.","a":"We learned that World War II ended in 1945.","h":"역사적 사실 / ended","alt":["We learned World War II ended in 1945."]},{"k":"그녀는 자신이 최선을 다했다고 말했다.","a":"She said that she had done her best.","h":"과거완료 / had done","alt":["She said she had done her best."]},{"k":"나는 그녀가 정직하다고 믿었다.","a":"I believed that she was honest.","h":"believed / was","alt":["I believed she was honest."]},{"k":"그들은 그가 그 소식을 이미 안다고 생각했다.","a":"They thought that he already knew the news.","h":"thought / knew / 과거","alt":["They thought he already knew the news."]}],"task":{"prompt":"자신이 최근에 알게 된 사실이나 누군가에게 들었던 말을 <b>시제 일치</b> 규칙을 사용하여 영어로 3문장 이상 써 보세요. 주절을 <b>과거시제</b>(said, thought, learned 등)로 시작하고, 종속절의 시제를 알맞게 맞추세요.","sample":"I said that I was really tired after the long exam. My teacher taught us that water boils at 100 degrees Celsius. I also learned that the Korean War broke out in 1950.","conds":[{"label":"3문장 이상 썼어요","minSentences":3},{"label":"과거시제 주절 동사(said, thought, learned 등)를 사용했어요","regex":"\\b(said|thought|learned|knew|told|believed|taught|heard)\\b"},{"label":"that절(종속절)을 사용했어요","regex":"\\bthat\\b"}]},"images":""},{"id":"L3C11U3","title":"화법 전환","explainParts":[{"t":"직접화법은 큰따옴표로 남의 말을 그대로 전하고, 간접화법은 전달동사 뒤에 그 내용을 풀어서 전합니다. 바꿀 때 인칭·시제·시간표현이 함께 변합니다."},{"k":"평서문 전환","n":"전달동사(say/said) 뒤에 that을 쓰고, 주절이 과거이면 종속절 시제를 한 단계 과거로 옮깁니다 (am→was, like→liked). 인칭도 전달자 기준으로 바꿉니다."},{"t":"예: He said, \"I am tired.\" → He said that he was tired."},{"k":"의문문 전환","n":"전달동사를 ask로 바꾸고, 의문사가 없으면 if/whether를, 있으면 그 의문사를 그대로 씁니다. 그리고 어순은 「주어+동사」의 평서문 어순으로 바꿉니다."},{"t":"예: She asked, \"Where do you live?\" → She asked where I lived."},{"k":"명령문 전환","n":"전달동사를 tell/ask/order 등으로 바꾸고, 동사원형을 to부정사로 만듭니다. 부정 명령문은 「not to + 동사원형」으로 씁니다."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"He said, \"I am tired.\" → He said that he ___ tired.","o":["is","was","am","were","been"],"a":1,"e":"주절이 과거(said)이므로 종속절의 am은 was로 시제를 일치시킵니다."},{"q":"She said, \"I like coffee.\" → She said that she ___ coffee.","o":["likes","like","liking","liked","has liked"],"a":3,"e":"주절이 과거이므로 현재 like는 과거 liked로 바꿉니다."},{"q":"He said to me, \"Open the door.\" → He told me ___ the door.","o":["open","opening","to open","opened","opens"],"a":2,"e":"명령문을 간접화법으로 바꿀 때 동사원형은 to부정사(to open)로 바꿉니다."},{"q":"She asked me, \"Do you know him?\" → She asked me ___ I knew him.","o":["if","that","what","which","do"],"a":0,"e":"의문사가 없는 의문문은 if(또는 whether)로 연결합니다."},{"q":"He asked, \"Where do you live?\" → He asked where ___.","o":["did I live","do I live","I live","lived I","I lived"],"a":4,"e":"간접화법의 의문문은 「의문사+주어+동사」 어순이 되고 시제도 과거로 일치시켜 I lived가 됩니다."},{"q":"The teacher said, \"Don't be late.\" → The teacher told us ___ late.","o":["to not be","not to be","don't be","not being","to be not"],"a":1,"e":"부정 명령문은 「not to + 동사원형」 형태인 not to be로 바꿉니다."},{"q":"He said, \"I will call you tomorrow.\" → He said that he ___ me the next day.","o":["will call","called","calls","would call","would called"],"a":3,"e":"주절이 과거이므로 will은 would로 바뀌고 tomorrow는 the next day로 바뀝니다."},{"q":"밑줄 친 부분을 어법에 맞게 고친 것은? He said that he [[meet]] her the week before.","o":["met","meets","had met","have met","meeting"],"a":2,"e":"직접화법의 과거(met)는 간접화법에서 대과거 had met으로 바꿉니다."},{"q":"He asked me, \"What are you doing?\" → He asked me what ___.","o":["I was doing","was I doing","I am doing","am I doing","did I do"],"a":0,"e":"의문사 뒤는 「주어+동사」 어순이 되고 현재진행은 과거진행 I was doing으로 일치시킵니다."},{"q":"He said, \"Can you help me?\" 를 간접화법으로 바르게 바꾼 것은?","o":["He asked if you can help me.","He asked that I can help him.","He asked can I help him.","He said if I could help him.","He asked if I could help him."],"a":4,"e":"전달동사 asked, if로 연결, 인칭(you→I, me→him), 시제(can→could)를 모두 바꿔야 합니다."}],"arrange":[{"ko":"그는 피곤하다고 말했다.","a":"He said that he was tired."},{"ko":"그녀는 커피를 좋아한다고 말했다.","a":"She said that she liked coffee."},{"ko":"그는 나에게 문을 열라고 말했다.","a":"He told me to open the door."},{"ko":"선생님은 우리에게 늦지 말라고 말씀하셨다.","a":"The teacher told us not to be late."},{"ko":"그녀는 나에게 그를 아는지 물었다.","a":"She asked me if I knew him."},{"ko":"그는 내가 어디에 사는지 물었다.","a":"He asked where I lived."},{"ko":"그는 다음 날 나에게 전화하겠다고 말했다.","a":"He said that he would call me the next day."},{"ko":"그녀는 새 전화기를 샀다고 말했다.","a":"She said that she had bought a new phone."},{"ko":"그는 나에게 무엇을 하고 있는지 물었다.","a":"He asked me what I was doing."},{"ko":"나는 그에게 조용히 하라고 말했다.","a":"I told him to be quiet."},{"ko":"그녀는 내가 도와줄 수 있는지 물었다.","a":"She asked if I could help her."},{"ko":"그는 그 영화를 이미 봤다고 말했다.","a":"He said that he had already seen the movie."},{"ko":"엄마는 나에게 방을 청소하라고 하셨다.","a":"My mother told me to clean my room."},{"ko":"그들은 배가 고프다고 말했다.","a":"They said that they were hungry."},{"ko":"그는 나에게 몇 시냐고 물었다.","a":"He asked me what time it was."}],"compose":[{"k":"그는 자신이 아프다고 말했다.","a":"He said that he was sick.","h":"said that / 시제일치 / was","alt":["He said he was sick."]},{"k":"그녀는 영어를 공부한다고 말했다.","a":"She said that she studied English.","h":"said that / studied","alt":["She said she studied English."]},{"k":"그는 나에게 창문을 닫으라고 말했다.","a":"He told me to close the window.","h":"told + 목적어 / to부정사","alt":["He asked me to close the window."]},{"k":"그녀는 나에게 서두르지 말라고 말했다.","a":"She told me not to hurry.","h":"not to + 동사원형","alt":["She told me not to rush."]},{"k":"그는 내가 바쁜지 물었다.","a":"He asked if I was busy.","h":"asked if / 어순","alt":["He asked whether I was busy."]},{"k":"나는 그녀에게 어디 가는지 물었다.","a":"I asked her where she was going.","h":"의문사 + 주어 + 동사","alt":[]},{"k":"그는 다음 날 떠나겠다고 말했다.","a":"He said that he would leave the next day.","h":"would / the next day","alt":["He said he would leave the next day."]},{"k":"그녀는 열쇠를 잃어버렸다고 말했다.","a":"She said that she had lost her key.","h":"had + p.p.","alt":["She said she had lost her key."]},{"k":"그는 나에게 무엇을 원하는지 물었다.","a":"He asked me what I wanted.","h":"what + 주어 + 동사","alt":["He asked what I wanted."]},{"k":"선생님은 우리에게 조용히 하라고 하셨다.","a":"The teacher told us to be quiet.","h":"told us / to be","alt":["The teacher asked us to be quiet."]},{"k":"그녀는 그 책을 읽었다고 말했다.","a":"She said that she had read the book.","h":"had read","alt":["She said she had read the book."]},{"k":"그는 내가 그 답을 아는지 물었다.","a":"He asked if I knew the answer.","h":"asked if / knew","alt":["He asked whether I knew the answer."]},{"k":"나는 그에게 걱정하지 말라고 말했다.","a":"I told him not to worry.","h":"not to worry","alt":["I told him not to worry about it."]},{"k":"그들은 축구를 좋아한다고 말했다.","a":"They said that they liked soccer.","h":"said that / liked","alt":["They said they liked soccer."]},{"k":"그녀는 나에게 그 소식을 들었는지 물었다.","a":"She asked me if I had heard the news.","h":"asked if / had heard","alt":["She asked me whether I had heard the news."]}],"task":{"prompt":"친구가 나에게 한 말을 <b>간접화법</b>으로 바꿔 세 문장으로 써 보세요. 평서문, 의문문, 명령문을 각각 하나씩 포함하세요.","sample":"My friend said that he was hungry. He asked me if I wanted to eat lunch. He told me to choose a restaurant.","conds":[{"label":"세 문장 이상 쓰기","minSentences":3},{"label":"전달동사(said/told/asked) 사용하기","regex":"\\b(said|told|asked)\\b"},{"label":"that절·to부정사·if/의문사 중 하나 이상 포함하기","regex":"\\b(that|to|if|whether|what|where|when|why|how)\\b"}]},"images":""},{"id":"L3C12U1","title":"강조 / 도치","explainParts":[{"t":"문장의 특정 부분을 강조하고 싶을 때 여러 가지 방법을 쓸 수 있어요. 먼저 "},{"k":"It is/was ~ that 강조구문","n":"강조하고 싶은 말을 It is/was와 that 사이에 넣어요. '바로 ~이다'라는 느낌을 줘요. 예: It was Tom that broke it. (그것을 깬 건 바로 Tom이었다.) 사람은 who, 사물은 which도 쓸 수 있어요."},{"t":"을 쓰면 특정 대상을 콕 집어 강조할 수 있어요. 다음으로 "},{"k":"동사 강조 do/does/did","n":"일반동사 앞에 do/does/did를 붙이고 동사는 원형으로 써요. '정말, 진짜'의 뜻을 더해요. 예: I do believe you. / She did pass the exam. 주어와 시제에 맞춰 do/does/did를 골라요."},{"t":"으로 동사의 의미를 강하게 만들 수 있어요. 마지막으로, 부정어가 문장 맨 앞에 오면 어순이 뒤바뀌는 "},{"k":"부정어 도치 (Never/Not only)","n":"Never, Not only 같은 부정어가 문두에 오면 뒤가 '조동사+주어' 순서로 도치돼요. 예: Never did I see such a thing. / Not only does he sing, but he also dances. 조동사가 없으면 do/does/did를 넣어 도치시켜요."},{"t":"가 일어나요. 세 가지 표현을 상황에 맞게 골라 써 보세요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I ___ love this song! (나는 이 노래를 정말 좋아해!)","o":["do","does","did","have","am"],"a":0,"e":"현재시제 1인칭 주어의 동사를 강조할 때는 동사원형 앞에 do를 쓴다."},{"q":"She ___ pass the exam, so we were all happy. (그녀는 정말 그 시험에 합격했다.)","o":["does","did","do","was","has"],"a":1,"e":"과거의 동작을 강조할 때는 동사원형 앞에 did를 쓴다."},{"q":"It was Tom ___ broke the window. (창문을 깬 건 바로 Tom이었다.)","o":["which","what","that","whose","when"],"a":2,"e":"It is/was ~ that 강조구문에서 강조 대상 뒤에는 that을 쓴다."},{"q":"It was yesterday ___ I met him. (내가 그를 만난 건 바로 어제였다.)","o":["when","which","who","that","what"],"a":3,"e":"시간을 강조하는 강조구문에서도 that을 쓴다."},{"q":"Never ___ I imagine that it would happen. (나는 그런 일이 일어날 거라곤 결코 상상하지 못했다.)","o":["do","was","have","does","did"],"a":4,"e":"부정어 Never가 문두에 오고 조동사가 없는 과거 동사이므로 did로 도치한다."},{"q":"Never ___ he told a lie in his life. (그는 평생 결코 거짓말을 한 적이 없다.)","o":["has","have","did","was","does"],"a":0,"e":"현재완료(told)이고 주어가 3인칭 단수이므로 Never has he told로 도치한다."},{"q":"Not only ___ sing well, but he also dances. (그는 노래를 잘할 뿐만 아니라 춤도 춘다.)","o":["he does","does he","did he","he did","does"],"a":1,"e":"Not only이 문두에 오면 '조동사+주어' 어순으로 도치되어 does he가 된다."},{"q":"밑줄 친 부분을 어법에 맞게 고치면? Never [[I saw]] such a thing before.","o":["saw I","I have seen","have I seen","seen have I","I saw"],"a":2,"e":"Never가 문두에 오면 '조동사+주어'로 도치되고, 경험을 나타내므로 현재완료 have I seen이 알맞다."},{"q":"Not only ___ late, but he also lost the tickets. (그는 늦었을 뿐만 아니라 표도 잃어버렸다.)","o":["he was","was","he did","was he","did he"],"a":3,"e":"Not only 뒤는 be동사와 주어의 순서가 바뀌어 was he가 된다."},{"q":"It was his kindness ___ impressed everyone. (모두를 감동시킨 건 바로 그의 친절함이었다.)","o":["who","what","whom","whose","that"],"a":4,"e":"추상적인 사물을 강조하는 강조구문에서는 that을 쓴다."}],"arrange":[{"ko":"창문을 깬 사람은 바로 Tom이었다.","a":"It was Tom that broke the window."},{"ko":"나는 정말 그를 믿는다.","a":"I do believe him."},{"ko":"그녀는 정말 그 시험에 합격했다.","a":"She did pass the exam."},{"ko":"나는 그런 것을 결코 본 적이 없다.","a":"Never have I seen such a thing."},{"ko":"내가 그를 만난 곳은 바로 그 도서관이었다.","a":"It was in the library that I met him."},{"ko":"그는 노래를 잘할 뿐만 아니라 춤도 잘 춘다.","a":"Not only does he sing well, but he also dances well."},{"ko":"나는 그 사실을 결코 잊지 않을 것이다.","a":"Never will I forget the fact."},{"ko":"우리가 처음 만난 것은 바로 2020년이었다.","a":"It was in 2020 that we first met."},{"ko":"그는 정말 열심히 일한다.","a":"He does work hard."},{"ko":"나는 그런 일이 일어날 거라고 결코 상상하지 못했다.","a":"Never did I imagine that it would happen."},{"ko":"그녀가 원하는 것은 바로 너의 도움이다.","a":"It is your help that she wants."},{"ko":"그는 늦었을 뿐만 아니라 표도 잃어버렸다.","a":"Not only was he late, but he also lost the tickets."},{"ko":"나는 어제 그에게 정말 전화했다.","a":"I did call him yesterday."},{"ko":"그 편지를 쓴 사람은 바로 나였다.","a":"It was I that wrote the letter."},{"ko":"나는 그렇게 아름다운 일몰을 결코 본 적이 없다.","a":"Never have I seen such a beautiful sunset."}],"compose":[{"k":"그것을 깬 사람은 바로 Tom이었다.","a":"It   LEVELS.forEach(l=>l.chapters.forEach(c=>{c.points=c.points.map(p=>(p&&p.soon&&M[p.id])?toPoint(M[p.id]):p);}));})();

/* 개념 퀴즈 정답 위치를 ①~⑤ 균등 분배 (특정 번호 쏠림 방지) */
function balanceQuiz(quiz){const n=quiz.length;if(!n)return;let targets=[];for(let i=0;i<n;i++)targets.push(i%5);targets=shuffle(targets);
  quiz.forEach((q,i)=>{if(!q.o||q.o.length<2)return;const a=(q.a==null?0:q.a);const correct=q.o[a];const others=q.o.filter((_,j)=>j!==a);
    const pos=Math.min(targets[i],q.o.length-1);const newo=[];let oi=0;for(let p=0;p<q.o.length;p++){newo[p]=(p===pos)?correct:others[oi++];}q.o=newo;q.a=pos;});}
(function balanceAll(){LEVELS.forEach(l=>l.chapters.forEach(c=>c.points.forEach(p=>{if(p&&p.quiz)balanceQuiz(p.quiz);})));})();

"숙제를 일찍 끝낸 덕분에, 나는 저녁 전에 친구들과 축구를 하고 만화책을 읽는다.","role":"ss","layer":"s3"},{"en":"In short, I follow the same routine every day, and it keeps me healthy and happy.","ko":"요컨대, 나는 매일 같은 일과를 지키고, 그것은 나를 건강하고 행복하게 해 준다.","role":"cs","layer":"concl"},{"en":"I really love my simple daily life.","ko":"나는 나의 소박한 하루하루를 정말 사랑한다.","role":"cs","layer":"concl"}],"expressions":[{"en":"get up early (일찍 일어나다)","ko":"일찍 일어나다"},{"en":"eat breakfast with my family (가족과 아침을 먹다)","ko":"가족과 아침을 먹다"},{"en":"brush my teeth (이를 닦다)","ko":"이를 닦다"},{"en":"go to school (학교에 가다)","ko":"학교에 가다"},{"en":"take notes in class (수업 시간에 필기하다)","ko":"수업 시간에 필기하다"},{"en":"do my homework (숙제를 하다)","ko":"숙제를 하다"},{"en":"play soccer with my friends (친구들과 축구를 하다)","ko":"친구들과 축구를 하다"},{"en":"help my mom at home (집에서 엄마를 돕다)","ko":"집에서 엄마를 돕다"},{"en":"go to bed at ten (열 시에 잠자리에 들다)","ko":"열 시에 잠자리에 들다"},{"en":"every day / on weekdays (매일 / 평일에)","ko":"매일 / 평일에"}],"organizer":{"topic":"내 하루 일과를 한 문장으로 요약해요. (예: 바쁘지만 행복한 하루)","s1":"① 아침에 무엇을 하는지 소개해요. → ② 왜 그렇게 하는지 이유를 덧붙여요.","s2":"① 학교에서 무엇을 하는지 소개해요. → ② 구체적인 예시를 들어 설명해요.","s3":"① 방과 후에 무엇을 하는지 소개해요. → ② 그 활동을 하게 된 이유나 예시를 덧붙여요.","concl":"하루 일과가 나에게 주는 좋은 점으로 글을 마무리해요."},"flow":{"topic":"주제문: 바쁘지만 행복한 나의 하루 일과","s1":"아침 ① 일찍 하루 시작 → ② 아침 먹고 학교 갈 시간이 충분하기 때문(This is because)","s2":"학교 ① 매일 열심히 공부 → ② 듣기·필기·질문의 예시(For example)","s3":"방과 후 ① 친구들과 휴식·놀이 → ② 숙제를 일찍 끝낸 결과 축구·만화(As a result)","concl":"마무리: 같은 일과가 나를 건강하고 행복하게 하며, 소박한 하루를 사랑함"},"images":""},{"id":"PW-L1C03","level":"L1","grammar":"미래 표현(will / be going to)","chap":3,"grammarLabel":"미래 표현(will / be going to) 사용","grammarTest":"\\b(will|going to)\\b","title":"My Fun Plan for the Weekend","genre":"설명문","note":"배운 문법 <b>미래 표현(will / be going to)</b>으로 나의 주말 계획을 소개하는 글을 써요.","sample":[{"en":"This weekend, I am going to have a lot of fun with my family and friends.","ko":"이번 주말에 나는 가족, 친구들과 함께 아주 즐거운 시간을 보낼 예정이다.","role":"ts","layer":"topic"},{"en":"First, I am going to go camping with my family on Saturday.","ko":"첫째로, 나는 토요일에 가족과 함께 캠핑을 하러 갈 것이다.","role":"ss","layer":"s1"},{"en":"It is because we love spending time together in nature.","ko":"왜냐하면 우리는 자연 속에서 함께 시간을 보내는 것을 정말 좋아하기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, I will meet my best friend on Sunday morning.","ko":"둘째로, 나는 일요일 아침에 나의 가장 친한 친구를 만날 것이다.","role":"ss","layer":"s2"},{"en":"For example, we are going to watch a new movie and eat pizza together.","ko":"예를 들어, 우리는 새 영화를 보고 함께 피자를 먹을 예정이다.","role":"ss","layer":"s2"},{"en":"Finally, I am going to finish my science homework in the evening.","ko":"마지막으로, 나는 저녁에 과학 숙제를 끝낼 것이다.","role":"ss","layer":"s3"},{"en":"This is because I want to relax without any worries next week.","ko":"이것은 내가 다음 주에 아무 걱정 없이 편하게 쉬고 싶기 때문이다.","role":"ss","layer":"s3"},{"en":"As a result, I will make many happy memories this weekend.","ko":"그 결과, 나는 이번 주말에 많은 행복한 추억을 만들 것이다.","role":"cs","layer":"concl"},{"en":"I really can't wait for the weekend to come!","ko":"나는 주말이 오기를 정말 기다릴 수가 없다!","role":"cs","layer":"concl"}],"expressions":[{"en":"be going to + 동사원형 (~할 예정이다)","ko":"~할 예정이다, ~할 것이다"},{"en":"will + 동사원형 (~할 것이다)","ko":"~할 것이다"},{"en":"plan to + 동사원형 (~할 계획이다)","ko":"~할 계획이다"},{"en":"go camping (캠핑하러 가다)","ko":"캠핑하러 가다"},{"en":"spend time with ~ (~와 시간을 보내다)","ko":"~와 시간을 보내다"},{"en":"hang out with friends (친구들과 어울리다)","ko":"친구들과 어울려 놀다"},{"en":"make happy memories (행복한 추억을 만들다)","ko":"행복한 추억을 만들다"},{"en":"can't wait to ~ (~하는 게 정말 기대되다)","ko":"~하는 것이 몹시 기다려지다"},{"en":"relax at home (집에서 쉬다)","ko":"집에서 편하게 쉬다"},{"en":"It is because ~ (그것은 ~때문이다)","ko":"그것은 ~때문이다"}],"organizer":{"topic":"주말에 무엇을 할지 전체 계획을 한 문장으로 소개해 보세요. (미래 표현 will / be going to 사용)","s1":"① 주말 계획 첫 번째 활동을 소개하고 → ② 왜 그 활동을 하는지 이유를 적어요. (It is because ~)","s2":"① 주말 계획 두 번째 활동을 소개하고 → ② 예시를 들어 자세히 설명해요. (For example ~)","s3":"① 주말 계획 세 번째 활동을 소개하고 → ② 그 활동을 하는 이유를 적어요. (This is because ~)","concl":"주말 계획에 대한 기대나 느낌으로 글을 마무리해요. (As a result ~ / can't wait)"},"flow":{"topic":"주제문: 이번 주말에 가족·친구와 즐거운 시간을 보낼 ~ 사용 가능)","ko":"예를 들어, ~"},{"en":"This is because ~ (~ 사용 가능)","ko":"이는 ~ 때문이다"},{"en":"As a result, ~ (~ 사용 가능)","ko":"그 결과, ~"},{"en":"I can find ~ on the shelves (~ 사용 가능)","ko":"나는 선반에서 ~를 찾을 수 있다"},{"en":"next to the window (~ 사용 가능)","ko":"창문 옆에"},{"en":"For these reasons, ~ (~ 사용 가능)","ko":"이러한 이유들로, ~"}],"organizer":{"topic":"내가 가장 좋아하는 장소 한 곳을 정해 주제문으로 써요. (예: 학교 도서관)","s1":"① 그 장소에 무엇이 있는지 소개해요 (There are ~). → ② 예를 들어 어떤 것들이 있는지 구체적으로 설명해요.","s2":"① 그 장소의 특징을 하나 더 소개해요 (예: 조용함). → ② 왜 그런지 이유를 설명해요 (This is because ~).","s3":"① 내가 특히 좋아하는 공간을 소개해요 (There is a ~). → ② 그곳을 좋아하는 이유와 그 결과를 설명해요 (As a result ~).","concl":"앞의 내용을 정리하며 그 장소가 나에게 어떤 의미인지 마무리해요."},"flow":{"topic":"내가 좋아하는 장소 = 학교 도서관","s1":"① 많은 책이 있음(There are) → 만화·소설·역사책 예시(For example)","s2":"② 조용한 장소임 → 모두 소음 없이 읽고 공부하기 때문(This is because)","s3":"③ 창가의 아늑한 독서 코너(There is a) → 푹신한 소파와 햇빛 때문에 좋아함, 그 결과 오래 편히 읽음(As a result)","concl":"이러한 이유들로 학교 도서관이 나에게 최고의 장소"},"images":""},{"id":"PW-L1C06","level":"L1","grammar":"대명사(he/she/his/her/them)","chap":6,"grammarLabel":"대명사(he/she/his/her 등) 사용","grammarTest":"\\b(he|she|his|her|him|they|them|we|us|our)\\b","title":"My Best Friend Mina and Her Kind Heart","genre":"설명문","note":"배운 문법 <b>대명사(he/she/his/her/them)</b>를 사용해서 나의 가장 친한 친구를 소개하는 글을 써요.","sample":[{"en":"My best friend is a girl named Mina, and she is very special to me.","ko":"내 가장 친한 친구는 미나라는 여자아이인데, 그녀는 나에게 아주 특별해요.","role":"ts","layer":"topic"},{"en":"First, Mina is very kind to everyone around her.","ko":"첫째로, 미나는 자기 주변의 모든 사람에게 아주 친절해요.","role":"ss","layer":"s1"},{"en":"For example, when her classmates are sad, she always talks to them and cheers them up.","ko":"예를 들어, 반 친구들이 슬퍼할 때, 그녀는 항상 그들에게 말을 걸고 기운을 북돋아 줘요.","role":"ss","layer":"s1"},{"en":"Second, she is really good at drawing.","ko":"둘째로, 그녀는 그림을 정말 잘 그려요.","role":"ss","layer":"s2"},{"en":"This is because she practices every day, so her pictures are always beautiful.","ko":"이것은 그녀가 매일 연습하기 때문인데, 그래서 그녀의 그림들은 항상 아름다워요.","role":"ss","layer":"s2"},{"en":"Third, Mina has a funny older brother, and he makes us laugh a lot.","ko":"셋째로, 미나에게는 웃긴 오빠가 있는데, 그는 우리를 많이 웃게 해요.","role":"ss","layer":"s3"},{"en":"His jokes are so funny that I really love visiting her house.","ko":"그의 농담이 너무 웃겨서 나는 그녀의 집에 놀러 가는 것을 정말 좋아해요.","role":"ss","layer":"s3"},{"en":"As a result, I feel lucky to have Mina as my best friend.","ko":"그 결과, 나는 미나를 가장 친한 친구로 두게 되어 운이 좋다고 느껴요.","role":"cs","layer":"concl"},{"en":"I hope she and I stay close friends forever.","ko":"나는 그녀와 내가 영원히 가까운 친구로 지내기를 바라요.","role":"cs","layer":"concl"}],"expressions":[{"en":"My best friend is ~ (내 가장 친한 친구는 ~이다)","ko":"내 가장 친한 친구는 ~예요"},{"en":"She is very special to me. (그녀는 나에게 특별하다)","ko":"그녀는 나에게 아주 특별해요."},{"en":"He/She is good at ~ing (그/그녀는 ~을 잘한다)","ko":"그/그녀는 ~을 잘해요"},{"en":"She is kind to everyone. (그녀는 모두에게 친절하다)","ko":"그녀는 모두에게 친절해요."},{"en":"He always makes us laugh. (그는 항상 우리를 웃게 한다)","ko":"그는 항상 우리를 웃게 해요."},{"en":"She cheers them up. (그녀는 그들을 기운 나게 한다)","ko":"그녀는 그들의 기운을 북돋아 줘요."},{"en":"His jokes are so funny. (그의 농담은 아주 웃기다)","ko":"그의 농담은 아주 웃겨요."},{"en":"Her pictures are beautiful. (그녀의 그림은 아름답다)","ko":"그녀의 그림은 아름다워요."},{"en":"I feel lucky to have ~ (~가 있어서 운이 좋다고 느낀다)","ko":"~가 있어서 운이 좋다고 느껴요"},{"en":"I hope we stay close forever. (우리가 영원히 가깝길 바란다)","ko":"우리가 영원히 가깝게 지내길 바라요."}],"organizer":{"topic":"내 가장 친한 친구가 누구인지, 그리고 그 친구를 대명사(she/he)로 한 문장으로 소개해요.","s1":"① 친구의 첫 번째 좋은 점(예: 성격)을 소개하고 → ② For example로 그것을 보여 주는 예시를 they/them을 넣어 설명해요.","s2":"① 친구의 두 번째 좋은 점(예: 잘하는 것)을 소개하고 → ② This is because로 그 이유를 her/his와 함께 설명해요.","s3":"① 친구와 관련된 세 번째 특징(예: 가족)을 소개하고 → ② his/he를 사용해 구체적인 예시나 이유를 덧붙여요.","concl":"As a result / I hope 등으로 친구에 대한 나의 느낌과 바람을 대명사로 마무리해요."},"flow":{"topic":"소개 - 가장 친한 친구는 미나(she), 나에게 특별한 존재","s1":"성격 ① 모두에게 친절함 → For example, 슬픈 반 친구들(them)에게 말 걸고 기운 북돋아 줌","s2":"능력 ① 그림을 잘 그림 → This is because 매일 연습해서(she) 그녀의 그림(her)이 아름다움","s3":"가족 ① 웃긴 오빠(he)가 있음 → 그의 농담(his)이 웃겨서 그녀의 집(her)에 놀러 가는 걸 좋아함","concl":"마무리 - As a result 미나가 친구라서 운이 좋고, 그녀(she)와 영원히 가깝길 바람"},"images":""},{"id":"PW-L1C07","level":"L1","grammar":"비교급·최상급","chap":7,"grammarLabel":"비교급/최상급 사용","grammarTest":"(\\b\\w+er\\b[\\s\\S]*\\bthan\\b|\\bmore\\b|\\bthe\\s+\\w+est\\b|\\bthe\\s+most\\b|\\bbetter\\b|\\bbest\\b)","title":"Why Autumn Is the Best Season","genre":"설명문","note":"배운 문법 <b>비교급·최상급</b>으로 가장 좋아하는 계절을 다른 계절과 비교하며 소개하는 글을 써요.","sample":[{"en":"My favorite season is autumn, because it is the most comfortable season of the whole year.","ko":"내가 가장 좋아하는 계절은 가을인데, 왜냐하면 일 년 중 가장 편안한 계절이기 때문이다.","role":"ts","layer":"topic"},{"en":"First, the weather in autumn is nicer than in any other season.","ko":"첫째로, 가을의 날씨는 다른 어떤 계절보다 더 좋다.","role":"ss","layer":"s1"},{"en":"It is because the air is cooler than in summer and warmer than in winter, so I feel great outside.","ko":"그 이유는 공기가 여름보다는 더 시원하고 겨울보다는 더 따뜻해서, 밖에 있으면 기분이 아주 좋기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, autumn has more delicious food than the other seasons.","ko":"둘째로, 가을에는 다른 계절들보다 더 맛있는 음식이 많다.","role":"ss","layer":"s2"},{"en":"For example, apples and sweet potatoes taste better in fall, and they are the freshest at this time.","ko":"예를 들어, 사과와 고구마는 가을에 더 맛있고, 이 시기에 가장 신선하다.","role":"ss","layer":"s2"},{"en":"As a result, my family enjoys bigger and happier meals in autumn.","ko":"그 결과, 우리 가족은 가을에 더 푸짐하고 더 행복한 식사를 즐긴다.","role":"ss","layer":"s2"},{"en":"Third, autumn is the most colorful season of all.","ko":"셋째로, 가을은 모든 계절 중에서 가장 색이 화려한 계절이다.","role":"ss","layer":"s3"},{"en":"This is because the leaves turn red and yellow, so the mountains look prettier than a painting.","ko":"이것은 나뭇잎이 빨갛고 노랗게 물들어서, 산이 그림보다 더 예뻐 보이기 때문이다.","role":"ss","layer":"s3"},{"en":"For these reasons, autumn is much better than any other season for me.","ko":"이러한 이유들로, 나에게 가을은 다른 어떤 계절보다 훨씬 더 좋다.","role":"cs","layer":"concl"},{"en":"I believe it is the best season in the world.","ko":"나는 가을이 세상에서 가장 좋은 계절이라고 믿는다.","role":"cs","layer":"concl"}],"expressions":[{"en":"My favorite season is ~ (가장 좋아하는 계절 소개)","ko":"내가 가장 좋아하는 계절은 ~이다"},{"en":"~ is nicer than any other season (다른 어떤 계절보다 더 ~한)","ko":"~은 다른 어떤 계절보다 더 좋다"},{"en":"the most comfortable season of the year (최상급 표현)","ko":"일 년 중 가장 편안한 계절"},{"en":"cooler than summer / warmer than winter (두 계절 비교)","ko":"여름보다 시원한 / 겨울보다 따뜻한"},{"en":"more delicious than ~ (더 맛있는)","ko":"~보다 더 맛있는"},{"en":"the freshest at this time (최상급으로 신선함 강조)","ko":"이 시기에 가장 신선한"},{"en":"It is because ~ (이유 설명)","ko":"그 이유는 ~이기 때문이다"},{"en":"For example, ~ (예시 들기)","ko":"예를 들어, ~"},{"en":"As a result, ~ (결과 말하기)","ko":"그 결과, ~"},{"en":"much better than any other season (비교급 강조)","ko":"다른 어떤 계절보다 훨씬 더 좋은"}],"organizer":{"topic":"가장 좋아하는 계절 하나를 정하고, 최상급(the most ~)으로 '왜 그 계절이 최고인지'를 한 문장으로 밝혀요.","s1":"① 첫 번째 이유(예: 날씨)를 소개해요. ② 비교급(cooler/warmer than)으로 다른 계절과 비교하며 이유를 설명해요.","s2":"① 두 번째 이유(예: 음식)를 소개해요. ② For example로 예시를 들고 비교급·최상급(more delicious/freshest)으로 설명해요.","s3":"① 세 번째 이유(예: 풍경·색깔)를 소개해요. ② This is because로 이유를 대고 비교급(prettier than)으로 설명해요.","concl":"앞의 세 이유를 정리하고, 최상급(the best)으로 '역시 이 계절이 최고'라고 마무리해요."},"flow":{"topic":"주제문: 가을이 가장 좋아하는 계절 → 일 년 중 가장 편안한(the most comfortable) 계절이기 때문","s1":"이유① 날씨 → 여름보다 시원하고 겨울보다 따뜻해서(cooler/warmer than) 밖이 좋음","s2":"이유② 음식 → 사과·고구마가 더 맛있고(more delicious/better) 가장 신선해서(freshest) 식사가 즐거움","s3":"이유③ 풍경 → 가장 색이 화려하고(most colorful) 산이 그림보다 예뻐서(prettier than)","concl":"마무리: 세 이유로 가을이 다른 계절보다 훨씬 좋고(much better) 세상에서 가장 좋은(the best) 계절"},"images":""},{"id":"PW-L1C08","level":"L1","grammar":"명령문·제안문(Let's)","chap":8,"grammarLabel":"명령문/제안문(Let's / 동사원형) 사용","grammarTest":"(\\blet's\\b|\\bdon't\\b|\\bplease\\b|\\bshould\\b)","title":"Smart Advice for New First-Graders","genre":"설득문","note":"배운 문법 <b>명령문·제안문(Let's)</b>으로 신입생에게 따뜻한 조언을 건네는 글을 써요.","sample":[{"en":"Welcome to middle school, and let's get ready with some helpful advice!","ko":"중학교에 온 것을 환영해, 그럼 몇 가지 유용한 조언으로 함께 준비해 보자!","role":"ts","layer":"topic"},{"en":"First, make many new friends.","ko":"첫째, 새로운 친구를 많이 사귀어.","role":"ss","layer":"s1"},{"en":"This is because good friends help you feel happy and safe at school.","ko":"왜냐하면 좋은 친구는 네가 학교에서 행복하고 안전하다고 느끼도록 도와주기 때문이야.","role":"ss","layer":"s1"},{"en":"Second, listen to your teachers carefully.","ko":"둘째, 선생님 말씀을 주의 깊게 들어.","role":"ss","layer":"s2"},{"en":"For example, write down your homework and ask questions when you don't understand.","ko":"예를 들어, 숙제를 적어 두고 이해되지 않을 때는 질문을 해.","role":"ss","layer":"s2"},{"en":"Third, don't be afraid of your mistakes.","ko":"셋째, 실수를 두려워하지 마.","role":"ss","layer":"s3"},{"en":"It is because we all learn and grow from our mistakes every day.","ko":"왜냐하면 우리 모두는 매일 실수를 통해 배우고 성장하기 때문이야.","role":"ss","layer":"s3"},{"en":"So keep these three tips in your heart every day.","ko":"그러니 이 세 가지 조언을 매일 마음속에 간직해.","role":"cs","layer":"concl"},{"en":"Let's start our new middle school life with courage and a big smile!","ko":"용기와 큰 미소를 가지고 우리의 새로운 중학교 생활을 시작하자!","role":"cs","layer":"concl"}],"expressions":[{"en":"Welcome to ~ (~에 온 것을 환영해)","ko":"~에 온 것을 환영해"},{"en":"Let's get ready with ~ (~으로 준비하자)","ko":"~으로 준비하자"},{"en":"make new friends (새 친구를 사귀다)","ko":"새로운 친구를 사귀다"},{"en":"listen to ~ carefully (~을 주의 깊게 듣다)","ko":"~을 주의 깊게 듣다"},{"en":"write down ~ (~을 적어 두다)","ko":"~을 적어 두다"},{"en":"ask questions (질문을 하다)","ko":"질문을 하다"},{"en":"Don't be afraid of ~ (~을 두려워하지 마)","ko":"~을 두려워하지 마"},{"en":"learn from mistakes (실수에서 배우다)","ko":"실수에서 배우다"},{"en":"keep ~ in your heart (~을 마음속에 간직하다)","ko":"~을 마음속에 간직하다"},{"en":"Let's start ~ with courage (~을 용기를 가지고 시작하자)","ko":"~을 용기를 가지고 시작하자"}],"organizer":{"topic":"글의 주제를 정해요: 신입생에게 어떤 조언을 해 줄지 한 문장으로 소개해요. (제안문 Let's로 시작해 보기)","s1":"① 첫 번째 조언을 명령문으로 소개해요. ② 그 조언이 왜 중요한지 이유를 덧붙여요 (This is because ~).","s2":"① 두 번째 조언을 명령문으로 소개해요. ② 구체적인 예시로 뒷받침해요 (For example ~).","s3":"① 세 번째 조언을 명령문으로 소개해요. ② 그 조언이 필요한 이유를 설명해요 (It is because ~).","concl":"지금까지의 세 가지 조언을 정리하고, 격려의 말로 마무리해요. (제안문 Let's로 끝맺기)"},"flow":{"topic":"환영 인사 + 조언 준비 → Let's로 함께 준비하자고 제안","s1":"조언① 친구 사귀기 → 좋은 친구가 행복·안전을 주기 때문 (This is because)","s2":"조언② 선생님 말씀 듣기 → 숙제 적기·질문하기 예시로 뒷받침 (For example)","s3":"조언③ 실수 두려워 말기 → 실수로 배우고 성장하기 때문 (It is because)","concl":"세 조언을 마음에 간직하기 → 용기와 미소로 중학교 생활 시작하자 (Let's)"},"images":""},{"id":"PW-L1C09","level":"L1","grammar":"수여동사 4형식(give/show/send)","chap":9,"grammarLabel":"수여동사(give/show/send/make 등) 사용","grammarTest":"\\b(gave|give|gives|showed|show|shows|sent|send|made|make|makes|bought|buy|told|tell)\\b","title":"The Diary My Grandmother Gave Me","genre":"경험담","note":"배운 문법 <b>수여동사 4형식(give/show/send)</b>으로 내가 주고받은 특별한 선물에 대해 이야기하는 글을 써요.","sample":[{"en":"Last year, my grandmother gave me a special gift, and I will never forget it.","ko":"작년에 우리 할머니는 나에게 특별한 선물을 주셨고, 나는 그것을 절대 잊지 못할 거예요.","role":"ts","layer":"topic"},{"en":"On my birthday, she gave me an old blue diary.","ko":"내 생일에 할머니는 나에게 오래된 파란색 일기장을 주셨어요.","role":"ss","layer":"s1"},{"en":"It is because she wanted me to write down my dreams every day.","ko":"왜냐하면 할머니는 내가 매일 내 꿈을 적기를 바라셨기 때문이에요.","role":"ss","layer":"s1"},{"en":"Inside the diary, she showed me some old photos of us.","ko":"일기장 안에서 할머니는 나에게 우리의 오래된 사진 몇 장을 보여 주셨어요.","role":"ss","layer":"s2"},{"en":"For example, there was a picture of us baking cookies together.","ko":"예를 들어, 우리가 함께 쿠키를 굽는 사진이 있었어요.","role":"ss","layer":"s2"},{"en":"A week later, she sent me a sweet letter, too.","ko":"일주일 후에, 할머니는 나에게 다정한 편지도 보내 주셨어요.","role":"ss","layer":"s3"},{"en":"This is because she lived far away and missed me a lot.","ko":"이것은 할머니가 멀리 사셔서 나를 많이 그리워하셨기 때문이에요.","role":"ss","layer":"s3"},{"en":"As a result, this special gift gave me many warm memories.","ko":"그 결과, 이 특별한 선물은 나에게 많은 따뜻한 추억을 주었어요.","role":"ss","layer":"concl"},{"en":"So it will always be precious to me.","ko":"그래서 그것은 나에게 언제나 소중할 거예요.","role":"cs","layer":"concl"}],"expressions":[{"en":"give someone a gift","ko":"~에게 선물을 주다"},{"en":"show someone a photo","ko":"~에게 사진을 보여 주다"},{"en":"send someone a letter","ko":"~에게 편지를 보내다"},{"en":"on my birthday","ko":"내 생일에"},{"en":"will never forget","ko":"절대 잊지 못할 것이다"},{"en":"write down one's dreams","ko":"~의 꿈을 적다"},{"en":"far away","ko":"멀리 떨어져"},{"en":"miss someone a lot","ko":"~를 많이 그리워하다"},{"en":"warm memories","ko":"따뜻한 추억"},{"en":"precious to me","ko":"나에게 소중한"}],"organizer":{"topic":"내가 주고받은 특별한 선물이 무엇이고 누가 주었는지 한 문장으로 소개해요.","s1":"① 어떤 선물을 받았는지 소개하기 → ② 왜 그 선물을 주었는지 이유 쓰기","s2":"① 선물과 관련해 무엇을 보여 주었는지 소개하기 → ② 구체적인 예시 들기","s3":"① 그 후에 무엇을 보내 주었는지 소개하기 → ② 그렇게 한 이유 설명하기","concl":"그 선물이 나에게 어떤 의미인지 마무리 문장으로 정리해요."},"flow":{"topic":"작년에 할머니가 준 특별한 선물 소개","s1":"소개 ① 생일에 준 파란 일기장 → 이유 ② 매일 꿈을 적으라는 마음","s2":"소개 ① 일기장 안에 보여 준 오래된 사진들 → 예시 ② 함께 쿠키를 굽던 사진","s3":"소개 ① 일주일 후 보낸 다정한 편지 → 이유 ② 멀리 살아 나를 그리워해서","concl":"그 선물이 준 따뜻한 추억, 그래서 언제나 소중함"},"images":""},{"id":"PW-L1C10","level":"L1","grammar":"to부정사·동명사","chap":10,"grammarLabel":"to부정사/동명사 사용","grammarTest":"(\\b(want|like|love|hope|need|decide|start|begin|enjoy|finish|keep)\\s+to\\b|\\b(enjoy|finish|keep|love|like)\\s+\\w+ing\\b)","title":"The Hobbies That Make Me Happy","genre":"설명문","note":"배운 문법 <b>to부정사·동명사</b>를 사용해서 내가 좋아하는 취미들을 소개하는 글을 써요.","sample":[{"en":"I love to spend my free time doing many fun hobbies.","ko":"나는 여러 가지 재미있는 취미를 하며 여가 시간을 보내는 것을 아주 좋아한다.","role":"ts","layer":"topic"},{"en":"One of my favorite hobbies is riding a bicycle.","ko":"내가 가장 좋아하는 취미 중 하나는 자전거를 타는 것이다.","role":"ss","layer":"s1"},{"en":"It is because riding my bike helps me to feel free and healthy.","ko":"왜냐하면 자전거를 타는 것은 내가 자유롭고 건강하다고 느끼도록 도와주기 때문이다.","role":"cs","layer":"s1"},{"en":"I also enjoy reading books in my quiet room.","ko":"나는 또한 조용한 방에서 책 읽는 것을 즐긴다.","role":"ss","layer":"s2"},{"en":"For example, reading fantasy novels allows me to imagine exciting new worlds.","ko":"예를 들어, 판타지 소설을 읽는 것은 내가 신나는 새로운 세계를 상상하도록 해 준다.","role":"cs","layer":"s2"},{"en":"Finally, I like to cook simple food for my family.","ko":"마지막으로, 나는 가족을 위해 간단한 음식을 요리하는 것을 좋아한다.","role":"ss","layer":"s3"},{"en":"This is because cooking makes me happy, and my family loves to eat my dishes.","ko":"이것은 요리하는 것이 나를 행복하게 하고, 우리 가족이 내 음식을 먹는 것을 아주 좋아하기 때문이다.","role":"cs","layer":"s3"},{"en":"In conclusion, doing these hobbies makes my daily life happy and exciting.","ko":"결론적으로, 이러한 취미들을 하는 것은 내 일상을 행복하고 신나게 만든다.","role":"cs","layer":"concl"},{"en":"I hope to keep enjoying them for a long time.","ko":"나는 이 취미들을 오랫동안 계속 즐기기를 바란다.","role":"cs","layer":"concl"}],"expressions":[{"en":"love to spend time ~ing (~하며 시간 보내기를 좋아하다)","ko":"~하며 시간 보내는 것을 좋아하다"},{"en":"One of my favorite hobbies is ~ing","ko":"내가 가장 좋아하는 취미 중 하나는 ~하는 것이다"},{"en":"enjoy ~ing","ko":"~하는 것을 즐기다"},{"en":"like to + 동사원형","ko":"~하는 것을 좋아하다"},{"en":"help + 목적어 + to + 동사원형","ko":"~가 …하도록 돕다"},{"en":"allow + 목적어 + to + 동사원형","ko":"~가 …하도록 해 주다"},{"en":"be good at ~ing","ko":"~하는 것을 잘하다"},{"en":"decide to + 동사원형","ko":"~하기로 결심하다"},{"en":"start ~ing / start to + 동사원형","ko":"~하기 시작하다"},{"en":"hope to keep ~ing","ko":"계속 ~하기를 바라다"}],"organizer":{"topic":"내가 어떤 취미들을 즐기는지 한 문장으로 소개해요. (to부정사·동명사 활용)","s1":"① 첫 번째 취미를 소개해요(예: 자전거 타기) → ② 그 취미를 좋아하는 이유를 It is because로 설명해요.","s2":"① 두 번째 취미를 소개해요(예: 책 읽기) → ② For example로 구체적인 예시를 들어 설명해요.","s3":"① 세 번째 취미를 소개해요(예: 요리하기) → ② This is because로 좋아하는 이유를 설명해요.","concl":"전체 취미들이 내 삶에 주는 의미를 정리하고, 앞으로의 바람으로 마무리해요."},"flow":{"topic":"여러 취미를 즐기며 여가를 보내는 것을 좋아함(글 전체 주제 제시)","s1":"취미 ① 자전거 타기 → 자유롭고 건강하게 느끼도록 도와주기 때문","s2":"취미 ② 책 읽기 → 예를 들어 판타지 소설로 새로운 세계를 상상하게 해 줌","s3":"취미 ③ 요리하기 → 나를 행복하게 하고 가족이 좋아하기 때문","concl":"이 취미들이 일상을 행복하게 만들며, 앞으로도 계속 즐기고 싶음"},"images":""},{"id":"PW-L1C11","level":"L1","grammar":"전치사(in/on/at/to)","chap":11,"grammarLabel":"전치사(in/on/at/to 등) 사용","grammarTest":"\\b(in|on|at|to|under|behind|near|between)\\b","title":"The Fun Way to My School","genre":"설명문","note":"배운 문법 <b>전치사(in/on/at/to)</b>를 사용해서 매일 학교 가는 길을 순서대로 설명하는 글을 써요.","sample":[{"en":"The way to my school is short but always fun.","ko":"학교로 가는 길은 짧지만 언제나 재미있어요.","role":"ts","layer":"topic"},{"en":"First, I leave home at seven thirty in the morning.","ko":"먼저, 저는 아침 7시 30분에 집을 나서요.","role":"ss","layer":"s1"},{"en":"This is because my first class begins at eight o'clock.","ko":"이것은 저의 첫 수업이 8시 정각에 시작하기 때문이에요.","role":"ss","layer":"s1"},{"en":"Next, I walk to the bus stop on my street.","ko":"그다음, 저는 우리 동네 길에 있는 버스 정류장까지 걸어가요.","role":"ss","layer":"s2"},{"en":"For example, I often meet my best friend on the way.","ko":"예를 들어, 저는 가는 길에 자주 저의 가장 친한 친구를 만나요.","role":"ss","layer":"s2"},{"en":"Then, I take the bus and get off at the big park.","ko":"그러고 나서, 저는 버스를 타고 큰 공원에서 내려요.","role":"ss","layer":"s3"},{"en":"It is because my school stands right in front of the park.","ko":"이것은 저의 학교가 그 공원 바로 앞에 있기 때문이에요.","role":"ss","layer":"s3"},{"en":"In this way, I get to school on time every day.","ko":"이렇게 해서, 저는 매일 제시간에 학교에 도착해요.","role":"cs","layer":"concl"},{"en":"The short trip to school always puts me in a good mood.","ko":"학교까지의 짧은 여정은 언제나 저를 기분 좋게 만들어요.","role":"cs","layer":"concl"}],"expressions":[{"en":"leave home at ~ (~시에 집을 나서다)","ko":"~시에 집을 나서다"},{"en":"on my way to school (학교 가는 길에)","ko":"학교 가는 길에"},{"en":"walk to the bus stop (버스 정류장까지 걸어가다)","ko":"버스 정류장까지 걸어가다"},{"en":"get on / get off the bus (버스를 타다 / 내리다)","ko":"버스를 타다 / 버스에서 내리다"},{"en":"arrive at school (학교에 도착하다)","ko":"학교에 도착하다"},{"en":"get to school (학교에 도착하다, 가다)","ko":"학교에 도착하다"},{"en":"in the morning (아침에)","ko":"아침에"},{"en":"on time (제시간에)","ko":"제시간에"},{"en":"in front of ~ (~ 앞에)","ko":"~ 앞에"},{"en":"at the bus stop (버스 정류장에서)","ko":"버스 정류장에서"}],"organizer":{"topic":"학교 가는 길이 어떤 길인지 한 문장으로 소개해 보세요. (예: 짧지만 재미있는 길)","s1":"① 첫 번째 단계를 소개하기: 아침 몇 시에 집을 나서는지 쓰기 → ② 이유·예시: 왜 그 시간에 나서는지 설명하기 (예: 수업 시작 시간).","s2":"① 두 번째 단계를 소개하기: 어디까지 어떻게 이동하는지 쓰기 → ② 이유·예시: 가는 길에 생기는 일 소개하기 (예: 친구 만나기).","s3":"① 세 번째 단계를 소개하기: 어디서 버스를 내리는지 쓰기 → ② 이유·예시: 왜 거기서 내리는지 설명하기 (예: 학교 위치).","concl":"글을 마무리하기: 이렇게 학교에 도착한다는 것과, 그 길에 대한 나의 느낌을 정리해 보세요."},"flow":{"topic":"학교 가는 길은 짧지만 언제나 재미있다 (주제 제시)","s1":"① 아침 7시 30분에 집을 나선다 → 첫 수업이 8시에 시작하기 때문","s2":"① 동네 길에 있는 버스 정류장까지 걸어간다 → 예를 들어 가는 길에 친한 친구를 만남","s3":"① 버스를 타고 큰 공원에서 내린다 → 학교가 공원 바로 앞에 있기 때문","concl":"그래서 매일 제시간에 학교에 도착하고, 그 짧은 길이 나를 기분 좋게 만든다"},"images":""},{"id":"PW-L1C12","level":"L1","grammar":"접속사(and/but/because/so)","chap":12,"grammarLabel":"접속사(and/but/because/so 등) 사용","grammarTest":"\\b(and|but|or|because|so|when|if)\\b","title":"Why I Really Love My Town","genre":"설명문","note":"배운 문법 <b>접속사(and/but/because/so)</b>를 사용하여 우리 동네를 좋아하는 이유를 설명하는 글을 써요.","sample":[{"en":"I really like my town because it is a great place to live.","ko":"우리 동네는 살기 좋은 곳이기 때문에 나는 우리 동네를 정말 좋아한다.","role":"ts","layer":"topic"},{"en":"First, my town has a beautiful park.","ko":"첫째, 우리 동네에는 아름다운 공원이 있다.","role":"ss","layer":"s1"},{"en":"I like it because there are many trees and flowers, and I often walk there with my family.","ko":"나무와 꽃이 많기 때문에 나는 그곳을 좋아하고, 가족과 함께 그곳에서 자주 산책한다.","role":"ss","layer":"s1"},{"en":"Second, the people in my town are very kind.","ko":"둘째, 우리 동네 사람들은 매우 친절하다.","role":"ss","layer":"s2"},{"en":"For example, my neighbors always say hello to me, so I feel happy and safe every day.","ko":"예를 들어, 이웃들이 항상 나에게 인사를 해서, 나는 매일 행복하고 안전하다고 느낀다.","role":"ss","layer":"s2"},{"en":"Third, there are many good restaurants near my home.","ko":"셋째, 우리 집 근처에는 좋은 식당이 많다.","role":"ss","layer":"s3"},{"en":"The food is cheap but very delicious, and this is because the owners use fresh ingredients.","ko":"음식은 싸지만 아주 맛있는데, 이것은 주인들이 신선한 재료를 사용하기 때문이다.","role":"ss","layer":"s3"},{"en":"As a result, I always have a good time in my town.","ko":"그 결과, 나는 우리 동네에서 항상 즐거운 시간을 보낸다.","role":"ss","layer":"concl"},{"en":"For these reasons, I love my town, and I want to live here for a long time.","ko":"이러한 이유로, 나는 우리 동네를 사랑하고, 이곳에서 오래 살고 싶다.","role":"cs","layer":"concl"}],"expressions":[{"en":"I like my town because ~ (~하기 때문에 우리 동네가 좋다)","ko":"나는 ~하기 때문에 우리 동네를 좋아한다"},{"en":"It is a great place to live (살기 좋은 곳이다)","ko":"그곳은 살기 좋은 곳이다"},{"en":"There are many ~, and ~ (~이 많고, 그리고 ~)","ko":"~이 많이 있고, 그리고 ~하다"},{"en":"The people are kind, so I feel safe (사람들이 친절해서 안전하다고 느낀다)","ko":"사람들이 친절해서 나는 안전하다고 느낀다"},{"en":"It is cheap but delicious (싸지만 맛있다)","ko":"그것은 싸지만 맛있다"},{"en":"This is because ~ (이것은 ~하기 때문이다)","ko":"이것은 ~하기 때문이다"},{"en":"For example, ~ (예를 들어, ~)","ko":"예를 들어, ~"},{"en":"As a result, ~ (그 결과, ~)","ko":"그 결과, ~"},{"en":"I often walk there with my family (가족과 자주 산책한다)","ko":"나는 가족과 함께 그곳에서 자주 산책한다"},{"en":"I want to live here for a long time (오래 살고 싶다)","ko":"나는 이곳에서 오래 살고 싶다"}],"organizer":{"topic":"우리 동네를 좋아한다는 주제와 그 큰 이유를 한 문장으로 정해요. (because로 이유 연결)","s1":"① 첫 번째 좋은 점을 소개해요(예: 아름다운 공원). ② 왜 좋은지 이유나 예시를 덧붙여요(because/and 사용).","s2":"① 두 번째 좋은 점을 소개해요(예: 친절한 사람들). ② For example로 예시를 들고, so로 내 느낌을 연결해요.","s3":"① 세 번째 좋은 점을 소개해요(예: 맛있는 식당). ② but으로 대비하고, this is because로 이유를 설명해요.","concl":"세 가지 이유를 정리하며 우리 동네를 사랑한다는 마음을 다시 한 번 강조해요. (and로 마무리)"},"flow":{"topic":"주제문 — 우리 동네를 좋아함 → 살기 좋은 곳이기 때문(because)","s1":"이유① 아름다운 공원 → 나무·꽃이 많아서 좋아하고 가족과 산책함(because/and)","s2":"이유② 친절한 사람들 → 이웃이 인사해서 행복·안전함을 느낌(For example/so)","s3":"이유③ 맛있는 식당 → 싸지만 맛있음, 신선한 재료 때문(but/this is because)","concl":"마무리 — 그 결과 즐거움, 세 이유로 동네를 사랑하고 오래 살고 싶음(As a result/and)"},"images":""},{"id":"PW-L2C01","level":"L2","grammar":"문장의 형식(5형식 make me happy)","chap":1,"grammarLabel":"5형식(make/keep + 목적어 + 보어) 사용","grammarTest":"\\b(make|makes|made|keep|keeps|kept|call|calls|called|find|found)\\s+\\w+\\s+\\w+","title":"The Little Things That Make Me Happy","genre":"설명문","note":"배운 문법 <b>문장의 형식(5형식 make me happy)</b>으로 나를 행복하게 하는 것들을 소개하는 글을 써요.","sample":[{"en":"A lot of small things make me happy every day.","ko":"많은 작은 것들이 매일 나를 행복하게 합니다.","role":"ts","layer":"topic"},{"en":"First, listening to music makes me happy.","ko":"첫째로, 음악을 듣는 것은 나를 행복하게 합니다.","role":"ss","layer":"s1"},{"en":"It is because my favorite songs make me feel calm and relaxed.","ko":"그것은 내가 가장 좋아하는 노래들이 나를 차분하고 편안하게 느끼게 하기 때문입니다.","role":"ss","layer":"s1"},{"en":"Second, playing with my dog makes me happy.","ko":"둘째로, 내 강아지와 노는 것은 나를 행복하게 합니다.","role":"ss","layer":"s2"},{"en":"For example, when he runs to me after school, his smile makes me cheerful.","ko":"예를 들어, 학교가 끝나고 강아지가 나에게 달려올 때, 그 미소는 나를 기분 좋게 합니다.","role":"ss","layer":"s2"},{"en":"Third, eating delicious food makes me happy.","ko":"셋째로, 맛있는 음식을 먹는 것은 나를 행복하게 합니다.","role":"ss","layer":"s3"},{"en":"This is because a warm meal makes my stomach and my heart full.","ko":"이것은 따뜻한 한 끼 식사가 내 배와 마음을 가득 채워 주기 때문입니다.","role":"ss","layer":"s3"},{"en":"As a result, these little things make my life bright.","ko":"그 결과, 이런 작은 것들이 내 삶을 밝게 만듭니다.","role":"cs","layer":"concl"},{"en":"They truly make me happy every single day.","ko":"그것들은 정말로 매일매일 나를 행복하게 합니다.","role":"cs","layer":"concl"}],"expressions":[{"en":"make me happy (사용 가능)","ko":"나를 행복하게 하다"},{"en":"make me feel calm (사용 가능)","ko":"나를 차분하게 느끼게 하다"},{"en":"make me relaxed (사용 가능)","ko":"나를 편안하게 하다"},{"en":"make me cheerful (사용 가능)","ko":"나를 기분 좋게 하다"},{"en":"make me smile (사용 가능)","ko":"나를 미소 짓게 하다"},{"en":"make my day bright (사용 가능)","ko":"내 하루를 밝게 만들다"},{"en":"cheer me up (사용 가능)","ko":"나를 기운 나게 하다"},{"en":"put me in a good mood (사용 가능)","ko":"나를 좋은 기분으로 만들다"},{"en":"It is because ~ (사용 가능)","ko":"그것은 ~이기 때문이다"},{"en":"For example, ~ (사용 가능)","ko":"예를 들어, ~"}],"organizer":{"topic":"나를 행복하게 하는 것들이 여러 가지 있다는 큰 주제를 한 문장으로 정해 보세요.","s1":"① 첫 번째로 행복하게 하는 것을 소개하고 ② 그것이 왜 행복하게 하는지 이유(It is because)를 써요.","s2":"① 두 번째 대상을 소개하고 ② 예시(For example)를 들어 어떻게 행복하게 하는지 설명해요.","s3":"① 세 번째 대상을 소개하고 ② 그 이유(This is because)를 덧붙여 설명해요.","concl":"앞의 세 가지 내용을 정리하며 이런 작은 것들이 나를 행복하게 한다고 마무리해요."},"flow":{"topic":"일상 속 많은 작은 것들이 나를 행복하게 함","s1":"음악 듣기 → 좋아하는 노래가 나를 차분하고 편안하게 하기 때문","s2":"강아지와 놀기 → 학교 끝나고 달려오는 미소가 나를 기분 좋게 함(예시)","s3":"맛있는 음식 먹기 → 따뜻한 밥이 배와 마음을 가득 채우기 때문","concl":"이런 작은 것들이 삶을 밝게 하고 매일 나를 행복하게 함"},"images":""},{"id":"PW-L2C03","level":"L2","grammar":"조동사(must/should/have to)","chap":3,"grammarLabel":"조동사(must/should/have to) 사용","grammarTest":"\\b(must|should|have to|has to|had to)\\b","title":"School Rules I Think Are Important","genre":"설득문","note":"배운 문법 <b>조동사(must/should/have to)</b>를 사용해서 중요하다고 생각하는 학교 규칙을 설득하는 글을 써요.","sample":[{"en":"There are several school rules that I think are really important for everyone.","ko":"내가 생각하기에 모두에게 정말 중요한 학교 규칙이 몇 가지 있다.","role":"ts","layer":"topic"},{"en":"First, students must not use their smartphones during class.","ko":"첫째, 학생들은 수업 시간에 스마트폰을 사용해서는 안 된다.","role":"ss","layer":"s1"},{"en":"This is because phones can easily distract us from the teacher's lesson.","ko":"이는 스마트폰이 우리를 선생님의 수업으로부터 쉽게 산만하게 만들 수 있기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, we should always be kind and polite to our classmates.","ko":"둘째, 우리는 항상 반 친구들에게 친절하고 예의 바르게 대해야 한다.","role":"ss","layer":"s2"},{"en":"For example, we have to listen carefully when others are speaking.","ko":"예를 들어, 우리는 다른 사람이 말할 때 주의 깊게 들어야 한다.","role":"ss","layer":"s2"},{"en":"Third, students must keep the classroom clean and tidy every day.","ko":"셋째, 학생들은 매일 교실을 깨끗하고 깔끔하게 유지해야 한다.","role":"ss","layer":"s3"},{"en":"As a result, everyone can study in a comfortable and pleasant place.","ko":"그 결과, 모두가 편안하고 쾌적한 공간에서 공부할 수 있다.","role":"ss","layer":"s3"},{"en":"In conclusion, I believe these rules should be followed by all students.","ko":"결론적으로, 나는 이 규칙들이 모든 학생에게 지켜져야 한다고 생각한다.","role":"cs","layer":"concl"},{"en":"If we all respect them, our school will become a much better place.","ko":"우리가 모두 그 규칙들을 존중한다면, 우리 학교는 훨씬 더 좋은 곳이 될 것이다.","role":"cs","layer":"concl"}],"expressions":[{"en":"must not ~","ko":"~해서는 안 된다"},{"en":"should ~","ko":"~하는 것이 좋다, ~해야 한다"},{"en":"have to ~","ko":"~해야 한다"},{"en":"follow the rules","ko":"규칙을 따르다"},{"en":"be polite to ~","ko":"~에게 예의 바르게 대하다"},{"en":"keep the classroom clean","ko":"교실을 깨끗하게 유지하다"},{"en":"distract A from B","ko":"A를 B로부터 산만하게 하다"},{"en":"respect each other","ko":"서로 존중하다"},{"en":"be on time","ko":"제시간에 오다"},{"en":"be kind to ~","ko":"~에게 친절하게 대하다"}],"organizer":{"topic":"어떤 학교 규칙이 중요하다고 생각하는지 전체 주제를 한 문장으로 밝혀요.","s1":"① 첫 번째 규칙을 소개해요(예: 수업 중 스마트폰 금지). → ② 그 이유를 조동사를 써서 설명해요(예: 수업에 집중을 방해하기 때문).","s2":"① 두 번째 규칙을 소개해요(예: 친구에게 친절·예의). → ② For example로 예시를 들어 설명해요(예: 남이 말할 때 잘 들어야 함).","s3":"① 세 번째 규칙을 소개해요(예: 교실 청결 유지). → ② As a result로 그 효과를 설명해요(예: 쾌적하게 공부 가능).","concl":"세 규칙이 왜 중요한지 정리하며 지켜야 한다는 다짐·주장으로 마무리해요."},"flow":{"topic":"중요한 학교 규칙 여러 개가 있다는 주제 제시","s1":"규칙① 수업 중 스마트폰 금지(must not) → 수업 집중을 방해하기 때문(This is because)","s2":"규칙② 친구에게 친절·예의(should) → 남이 말할 때 잘 들어야 함(For example, have to)","s3":"규칙③ 교실 청결 유지(must) → 편안·쾌적하게 공부 가능(As a result)","concl":"이 규칙들은 모두 지켜야 하며(should) 존중하면 학교가 더 좋아진다는 마무리"},"images":""},{"id":"PW-L2C04","level":"L2","grammar":"수동태(be + p.p.)","chap":4,"grammarLabel":"수동태(be + p.p.) 사용","grammarTest":"\\b(is|are|was|were)\\s+\\w+(ed|en)\\b","title":"Gyeongbokgung: A Famous Palace in Korea","genre":"설명문","note":"배운 문법 <b>수동태(be + p.p.)</b>를 사용해 한국의 유명한 장소를 소개하는 글을 써요.","sample":[{"en":"Gyeongbokgung is one of the most famous places in Korea.","ko":"경복궁은 한국에서 가장 유명한 장소 중 하나예요.","role":"ts","layer":"topic"},{"en":"It was built in 1395 during the Joseon Dynasty.","ko":"그것은 조선 시대인 1395년에 지어졌어요.","role":"ss","layer":"s1"},{"en":"It is also known as the largest of the five grand palaces in Seoul.","ko":"그곳은 또한 서울의 5대 궁궐 중 가장 큰 곳으로 알려져 있어요.","role":"ss","layer":"s1"},{"en":"Many beautiful buildings can be seen inside the palace.","ko":"궁궐 안에서는 많은 아름다운 건물들을 볼 수 있어요.","role":"ss","layer":"s2"},{"en":"This is because they were carefully rebuilt after they were destroyed long ago.","ko":"이는 그 건물들이 오래전에 파괴된 후 정성스럽게 다시 지어졌기 때문이에요.","role":"ss","layer":"s2"},{"en":"Traditional events are held at the palace every day.","ko":"전통 행사들이 매일 궁궐에서 열려요.","role":"ss","layer":"s3"},{"en":"For example, the royal guard-changing ceremony is performed at the main gate.","ko":"예를 들어, 왕궁 수문장 교대식이 정문에서 펼쳐져요.","role":"ss","layer":"s3"},{"en":"For these reasons, Gyeongbokgung is visited by millions of people every year.","ko":"이러한 이유로, 경복궁은 해마다 수백만 명의 사람들에게 방문받아요.","role":"cs","layer":"concl"},{"en":"It is truly loved by both Koreans and foreign tourists.","ko":"그곳은 한국인과 외국인 관광객 모두에게 진심으로 사랑받고 있어요.","role":"cs","layer":"concl"}],"expressions":[{"en":"be built in ~ (~에 지어지다)","ko":"~에 지어지다"},{"en":"be known as ~ (~로 알려져 있다)","ko":"~로 알려져 있다"},{"en":"be located in ~ (~에 위치해 있다)","ko":"~에 위치해 있다"},{"en":"be visited by ~ (~에 의해 방문되다)","ko":"~에 의해 방문되다"},{"en":"be loved by ~ (~에게 사랑받다)","ko":"~에게 사랑받다"},{"en":"be held (열리다, 개최되다)","ko":"열리다, 개최되다"},{"en":"be performed (공연되다, 펼쳐지다)","ko":"공연되다, 펼쳐지다"},{"en":"be rebuilt (다시 지어지다)","ko":"다시 지어지다"},{"en":"can be seen (볼 수 있다)","ko":"볼 수 있다"},{"en":"be famous for ~ (~로 유명하다)","ko":"~로 유명하다"}],"organizer":{"topic":"소개할 한국의 유명한 장소 하나를 정하고, '이곳은 유명한 장소이다'라는 주제문을 써 보세요.","s1":"① 그 장소가 언제/어떻게 만들어졌는지 소개 → ② 그것이 왜 특별한지(무엇으로 알려져 있는지)를 수동태로 설명해요.","s2":"① 그곳에서 무엇을 볼 수 있는지 소개 → ② 그 건물이나 볼거리가 어떻게 만들어졌는지 이유를 수동태로 설명해요.","s3":"① 그곳에서 열리는 행사나 볼거리 소개 → ② For example로 구체적인 예시를 수동태로 설명해요.","concl":"For these reasons로 시작해 그 장소가 많은 사람에게 방문되고 사랑받는다고 마무리해요."},"flow":{"topic":"주제 → 경복궁은 한국에서 가장 유명한 장소 중 하나이다","s1":"소개 ① 1395년 조선 시대에 지어짐 → ② 서울 5대 궁궐 중 가장 큰 곳으로도 알려져 있음","s2":"소개 ① 아름다운 건물들을 볼 수 있음 → ② 오래전 파괴된 후 정성스럽게 다시 지어졌기 때문","s3":"소개 ① 전통 행사가 매일 열림 → ② 예시로 정문에서 수문장 교대식이 펼쳐짐","concl":"마무리 → 이런 이유로 경복궁은 매년 수백만 명에게 방문되고 모두에게 사랑받음"},"images":""},{"id":"PW-L2C05","level":"L2","grammar":"to부정사","chap":5,"grammarLabel":"to부정사(want to/hope to 등) 사용","grammarTest":"\\bto\\s+\\w+\\b","title":"My Dream Job: To Become a Vet","genre":"설명문","note":"배운 문법 <b>to부정사</b>를 활용해 나의 장래 희망을 소개하는 글을 써요.","sample":[{"en":"My dream job is to become a veterinarian.","ko":"나의 장래 희망은 수의사가 되는 것이다.","role":"ts","layer":"topic"},{"en":"First, I want to help sick animals get better.","ko":"첫째로, 나는 아픈 동물들이 나아지도록 돕고 싶다.","role":"ss","layer":"s1"},{"en":"This is because I love animals and hate to see them in pain.","ko":"이는 내가 동물을 사랑하고 그들이 아파하는 것을 보기 싫어하기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, I need to study science very hard.","ko":"둘째로, 나는 과학을 아주 열심히 공부해야 한다.","role":"ss","layer":"s2"},{"en":"For example, I read many books to learn about animal bodies.","ko":"예를 들어, 나는 동물의 몸에 대해 배우기 위해 많은 책을 읽는다.","role":"ss","layer":"s2"},{"en":"Third, it is exciting to meet many different animals every day.","ko":"셋째로, 매일 다양한 동물들을 만나는 것은 신나는 일이다.","role":"ss","layer":"s3"},{"en":"As a result, I will never get bored and will always have something new to do.","ko":"그 결과, 나는 결코 지루하지 않을 것이고 언제나 새롭게 할 일이 있을 것이다.","role":"ss","layer":"s3"},{"en":"To sum up, I will do my best to make my dream come true.","ko":"요컨대, 나는 내 꿈을 이루기 위해 최선을 다할 것이다.","role":"cs","layer":"concl"},{"en":"I truly hope to care for animals as a kind veterinarian someday.","ko":"나는 언젠가 친절한 수의사로서 동물들을 돌보기를 진심으로 바란다.","role":"cs","layer":"concl"}],"expressions":[{"en":"want to be ~ (~이 되고 싶다)","ko":"~이 되고 싶다"},{"en":"My dream is to + 동사 (나의 꿈은 ~하는 것이다)","ko":"나의 꿈은 ~하는 것이다"},{"en":"I hope to + 동사 (~하기를 바라다)","ko":"~하기를 바라다"},{"en":"in order to + 동사 (~하기 위해)","ko":"~하기 위해"},{"en":"It is important to + 동사 (~하는 것은 중요하다)","ko":"~하는 것은 중요하다"},{"en":"I decided to + 동사 (~하기로 결심했다)","ko":"~하기로 결심했다"},{"en":"work hard to + 동사 (~하기 위해 열심히 노력하다)","ko":"~하기 위해 열심히 노력하다"},{"en":"I would like to + 동사 (~하고 싶다)","ko":"~하고 싶다"},{"en":"to make my dream come true (나의 꿈을 이루기 위해)","ko":"나의 꿈을 이루기 위해"},{"en":"plan to + 동사 (~할 계획이다)","ko":"~할 계획이다"}],"organizer":{"topic":"내가 되고 싶은 장래 희망을 'My dream job is to ~' 형태로 한 문장에 정해요.","s1":"① 그 직업으로 하고 싶은 일을 소개해요 → ② 왜 그 일을 하고 싶은지 이유(감정·마음)를 to부정사를 넣어 설명해요.","s2":"① 그 꿈을 위해 지금 해야 할 준비를 소개해요 → ② 구체적인 예시(무엇을 배우려고 무엇을 하는지)를 들어 설명해요.","s3":"① 그 직업의 좋은 점·매력을 소개해요 → ② 그래서 생기는 결과(왜 즐거운지)를 이유·결과로 설명해요.","concl":"글을 마무리하며 꿈을 이루기 위한 나의 다짐을 'to make my dream come true'처럼 정리해요."},"flow":{"topic":"장래 희망 → 수의사가 되는 것(to become)","s1":"하고 싶은 일 ① 아픈 동물 돕기(to help) → ② 동물을 사랑하고 아파하는 걸 보기 싫어서(This is because, to see)","s2":"준비 ① 과학을 열심히 공부(to study) → ② 동물의 몸을 배우려고 책을 읽음(For example, to learn)","s3":"매력 ① 매일 다양한 동물을 만나는 즐거움(it is exciting to meet) → ② 그래서 지루하지 않고 새 할 일이 있음(As a result, to do)","concl":"다짐 → 꿈을 이루기 위해 최선을 다하고(to make my dream come true) 친절한 수의사로 동물을 돌보기를 바람(to care for)"},"images":""},{"id":"PW-L2C06","level":"L2","grammar":"동명사(enjoy ~ing)","chap":6,"grammarLabel":"동명사(~ing) 사용","grammarTest":"\\b(enjoy|love|like|finish|keep|start|stop|good at|interested in)\\s+\\w+ing\\b","title":"Why I Love Reading in My Free Time","genre":"설명문","note":"배운 문법 <b>동명사(enjoy ~ing)</b>를 사용해 내가 즐기는 여가 활동을 소개하는 글을 써요.","sample":[{"en":"Everyone has a favorite way to spend their free time.","ko":"누구나 여가 시간을 보내는 자기가 좋아하는 방법이 있어요.","role":"ts","layer":"topic"},{"en":"As for me, I really enjoy reading books whenever I have a chance.","ko":"저로 말하자면, 기회가 있을 때마다 책 읽는 것을 정말 즐겨요.","role":"ts","layer":"topic"},{"en":"First, I enjoy reading because it helps me relax.","ko":"첫째, 저는 독서가 긴장을 풀어 주기 때문에 책 읽는 것을 즐겨요.","role":"ss","layer":"s1"},{"en":"This is because I can forget my worries while I read exciting stories.","ko":"이는 신나는 이야기를 읽는 동안 제 걱정들을 잊을 수 있기 때문이에요.","role":"ss","layer":"s1"},{"en":"Second, reading teaches me many new things.","ko":"둘째, 독서는 저에게 많은 새로운 것을 가르쳐 줘요.","role":"ss","layer":"s2"},{"en":"For example, I enjoy reading science books, and they tell me about space and animals.","ko":"예를 들어, 저는 과학책 읽는 것을 즐기는데, 그 책들은 우주와 동물에 대해 알려 줘요.","role":"ss","layer":"s2"},{"en":"Finally, I can enjoy reading almost anywhere I want.","ko":"마지막으로, 저는 원하는 거의 어디에서나 책 읽는 것을 즐길 수 있어요.","role":"ss","layer":"s3"},{"en":"It is because books are easy to carry, so I read them on the bus or in bed.","ko":"이는 책이 들고 다니기 쉬워서, 버스 안에서나 침대에서도 읽기 때문이에요.","role":"ss","layer":"s3"},{"en":"For these reasons, reading is my favorite free-time activity.","ko":"이러한 이유들로, 독서는 제가 가장 좋아하는 여가 활동이에요.","role":"cs","layer":"concl"},{"en":"I will keep enjoying reading every single day.","ko":"저는 매일매일 책 읽는 것을 계속 즐길 거예요.","role":"cs","layer":"concl"}],"expressions":[{"en":"enjoy reading books (사용 가능)","ko":"책 읽는 것을 즐기다"},{"en":"in my free time (사용 가능)","ko":"나의 여가 시간에"},{"en":"whenever I have a chance (사용 가능)","ko":"기회가 있을 때마다"},{"en":"enjoy listening to music (사용 가능)","ko":"음악 듣는 것을 즐기다"},{"en":"a great way to relax (사용 가능)","ko":"긴장을 푸는 좋은 방법"},{"en":"spend time ~ing (사용 가능)","ko":"~하면서 시간을 보내다"},{"en":"help me learn new things (사용 가능)","ko":"내가 새로운 것을 배우도록 돕다"},{"en":"keep ~ing (사용 가능)","ko":"계속 ~하다"},{"en":"for these reasons (사용 가능)","ko":"이러한 이유들로"},{"en":"enjoy playing sports (사용 가능)","ko":"운동하는 것을 즐기다"}],"organizer":{"topic":"내가 여가 시간에 즐겨 하는 활동이 무엇인지 한두 문장으로 소개해요.","s1":"① 첫 번째 좋은 점(예: 긴장 풀기)을 소개 → ② 왜 그런지 이유나 상황으로 설명해요.","s2":"① 두 번째 좋은 점(예: 배움)을 소개 → ② For example로 구체적인 예시를 들어 설명해요.","s3":"① 세 번째 좋은 점(예: 장소에 상관없음)을 소개 → ② It is because로 그 이유를 설명해요.","concl":"앞의 세 가지 이유를 정리하고, 앞으로도 계속 즐기겠다는 다짐으로 마무리해요."},"flow":{"topic":"여가 활동 소개 → 나는 책 읽는 것을 즐김","s1":"이유① 휴식 → 신나는 이야기를 읽으며 걱정을 잊기 때문","s2":"이유② 배움 → 과학책이 우주·동물을 알려 주기 때문(예시)","s3":"이유③ 어디서나 가능 → 책은 들고 다니기 쉬워 버스·침대에서 읽기 때문","concl":"세 이유 정리 → 독서가 최애 여가 활동, 매일 계속 즐기겠다는 다짐"},"images":""},{"id":"PW-L2C07","level":"L2","grammar":"감정분사(exciting/excited)","chap":7,"grammarLabel":"감정분사(exciting/excited 등) 사용","grammarTest":"\\b(interesting|interested|exciting|excited|boring|bored|surprising|surprised|amazing|amazed|touching|touched)\\b","title":"The Most Exciting Movie I Have Ever Seen","genre":"감상문","note":"배운 문법 <b>감정분사(exciting/excited)</b>를 활용해 인상 깊었던 책이나 영화의 감상을 소개하는 글을 써요.","sample":[{"en":"The most exciting movie I have ever seen is Harry Potter.","ko":"내가 지금까지 본 것 중 가장 흥미진진한 영화는 해리포터이다.","role":"ts","layer":"topic"},{"en":"First, the story of the movie is really exciting.","ko":"첫째, 이 영화의 이야기는 정말 흥미진진하다.","role":"ss","layer":"s1"},{"en":"This is because a young boy learns magic and fights against evil wizards.","ko":"이는 한 어린 소년이 마법을 배우고 사악한 마법사들과 맞서 싸우기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, I was excited about the amazing magical world in the movie.","ko":"둘째, 나는 영화 속 놀라운 마법 세계에 신이 났다.","role":"ss","layer":"s2"},{"en":"For example, the students fly on broomsticks and learn spells at Hogwarts School.","ko":"예를 들어, 학생들은 빗자루를 타고 날아다니며 호그와트 학교에서 마법 주문을 배운다.","role":"ss","layer":"s2"},{"en":"As a result, I felt like I was living in that exciting world, too.","ko":"그 결과, 나도 그 흥미진진한 세계에 살고 있는 것처럼 느껴졌다.","role":"ss","layer":"s2"},{"en":"Third, the ending is the most exciting part of the whole movie.","ko":"셋째, 결말은 영화 전체에서 가장 흥미진진한 부분이다.","role":"ss","layer":"s3"},{"en":"It is because Harry bravely defeats the villain and saves his friends.","ko":"이는 해리가 용감하게 악당을 물리치고 친구들을 구하기 때문이다.","role":"ss","layer":"s3"},{"en":"For these reasons, this exciting movie always makes me excited whenever I watch it.","ko":"이러한 이유로, 이 흥미진진한 영화는 볼 때마다 항상 나를 신나게 만든다.","role":"cs","layer":"concl"}],"expressions":[{"en":"the most exciting movie/book (가장 흥미진진한 영화/책)","ko":"가장 흥미진진한 영화/책"},{"en":"I was excited about ~ (~에 신이 났다)","ko":"나는 ~에 신이 났다"},{"en":"The story is exciting. (이야기가 흥미진진하다.)","ko":"이야기가 흥미진진하다."},{"en":"make me excited (나를 신나게 만들다)","ko":"나를 신나게 만들다"},{"en":"This is because ~ (이는 ~ 때문이다)","ko":"이는 ~ 때문이다"},{"en":"For example, ~ (예를 들어, ~)","ko":"예를 들어, ~"},{"en":"As a result, ~ (그 결과, ~)","ko":"그 결과, ~"},{"en":"the most exciting part (가장 흥미진진한 부분)","ko":"가장 흥미진진한 부분"},{"en":"I have ever seen/read (내가 지금까지 본/읽은)","ko":"내가 지금까지 본/읽은"},{"en":"For these reasons, ~ (이러한 이유로, ~)","ko":"이러한 이유로, ~"}],"organizer":{"topic":"가장 인상 깊었던 책이나 영화 하나를 정하고, '가장 흥미진진한 ~은 …이다'로 주제문을 써 보세요.","s1":"① 이야기(줄거리)를 소개하고 → ② 왜 흥미진진한지 이유를 설명하세요. (This is because 활용)","s2":"① 특히 신났던 장면이나 배경을 소개하고 → ② 구체적인 예시를 들어 설명하세요. (For example / As a result 활용)","s3":"① 가장 인상 깊은 부분(예: 결말)을 소개하고 → ② 그 이유를 설명하세요. (It is because 활용)","concl":"감정분사(exciting/excited)를 넣어 이 작품에 대한 전체 감상을 한 문장으로 마무리하세요."},"flow":{"topic":"가장 흥미진진한 영화 = 해리포터라고 소개","s1":"이야기가 흥미진진함 ① 줄거리 → 소년이 마법을 배우고 악당과 싸우기 때문","s2":"마법 세계에 신남 ① 놀라운 마법 세계 → 예: 빗자루 비행·주문 학습 → 결과: 그 세계에 사는 느낌","s3":"결말이 가장 흥미진진 ① 영화의 결말 → 해리가 악당을 물리치고 친구를 구하기 때문","concl":"이러한 이유로 이 흥미진진한 영화가 볼 때마다 나를 신나게 함"},"images":""},{"id":"PW-L2C08","level":"L2","grammar":"부정대명사(one/each other)","chap":8,"grammarLabel":"부정대명사(one/another/each other 등) 사용","grammarTest":"\\b(one|another|the other|others|each other|someone|everyone|something)\\b","title":"Three Ways to Be a Good Friend","genre":"설득문","note":"배운 문법 <b>부정대명사(one/each other)</b>를 사용해 좋은 친구가 되는 법을 설득하는 글을 써요.","sample":[{"en":"Everyone wants friends, but not everyone knows how to become a good one.","ko":"모든 사람이 친구를 원하지만, 좋은 친구가 되는 법을 아는 사람은 많지 않아요.","role":"ts","layer":"topic"},{"en":"First, good friends always listen to each other.","ko":"첫째, 좋은 친구는 항상 서로의 말을 들어줍니다.","role":"ss","layer":"s1"},{"en":"This is because everyone wants someone who truly understands their feelings.","ko":"이는 모두가 자신의 감정을 진심으로 이해해 주는 누군가를 원하기 때문입니다.","role":"ss","layer":"s1"},{"en":"Second, real friends help each other in difficult times.","ko":"둘째, 진정한 친구는 힘든 시기에 서로를 돕습니다.","role":"ss","layer":"s2"},{"en":"For example, when one of them is sad, the other one gives warm comfort.","ko":"예를 들어, 한 명이 슬퍼하면 다른 한 명이 따뜻한 위로를 건네줍니다.","role":"ss","layer":"s2"},{"en":"Third, good friends are always honest with each other.","ko":"셋째, 좋은 친구는 항상 서로에게 정직합니다.","role":"ss","layer":"s3"},{"en":"This is because trust grows only when two people never lie to one another.","ko":"이는 두 사람이 서로에게 결코 거짓말하지 않을 때에만 신뢰가 자라기 때문입니다.","role":"ss","layer":"s3"},{"en":"In short, good friends listen to, help, and trust each other every day.","ko":"요컨대, 좋은 친구는 매일 서로의 말을 듣고, 돕고, 믿어줍니다.","role":"cs","layer":"concl"},{"en":"If we do these things, each of us can become a good friend.","ko":"우리가 이런 것들을 한다면, 우리 각자는 좋은 친구가 될 수 있습니다.","role":"cs","layer":"concl"}],"expressions":[{"en":"listen to each other","ko":"서로의 말을 들어주다"},{"en":"help each other","ko":"서로를 돕다"},{"en":"be honest with each other","ko":"서로에게 정직하다"},{"en":"trust one another","ko":"서로를 믿다"},{"en":"one of them / the other one","ko":"그들 중 한 명 / 다른 한 명"},{"en":"understand each other's feelings","ko":"서로의 감정을 이해하다"},{"en":"each of us","ko":"우리 각자"},{"en":"become a good one","ko":"좋은 친구가 되다"},{"en":"care about each other","ko":"서로를 아끼다"},{"en":"spend time with one another","ko":"서로 함께 시간을 보내다"}],"organizer":{"topic":"이 글의 주제를 한 문장으로 정하세요. (예: 노력하면 누구나 좋은 친구(a good one)가 될 수 있다는 생각)","s1":"① 좋은 친구의 첫 번째 특징을 소개하세요(예: 서로의 말을 들어주기 listen to each other). → ② 왜 그것이 중요한지 이유를 적으세요.","s2":"① 두 번째 특징을 소개하세요(예: 힘들 때 서로 돕기 help each other). → ② 구체적인 예시를 들어보세요(one of them / the other one 활용).","s3":"① 세 번째 특징을 소개하세요(예: 서로에게 정직하기 be honest with each other). → ② 그 이유를 설명하세요.","concl":"세 가지 특징을 요약하고, 우리 각자(each of us)가 좋은 친구가 될 수 있다고 마무리하세요."},"flow":{"topic":"좋은 친구가 되는 법 - 누구나 노력하면 좋은 친구(a good one)가 될 수 있음","s1":"경청 ① 서로의 말을 들어줌(each other) → 모두가 이해받길 원하기 때문","s2":"도움 ① 힘든 때 서로 도움(each other) → 예시: 한 명(one)이 슬프면 다른 한 명(the other one)이 위로","s3":"정직 ① 서로에게 정직(each other) → 서로(one another)에게 거짓말하지 않을 때 신뢰가 생기기 때문","concl":"경청·도움·신뢰를 실천하면 우리 각자(each of us)가 좋은 친구가 됨"},"images":""},{"id":"PW-L2C09","level":"L2","grammar":"형용사·부사","chap":9,"grammarLabel":"형용사·부사 사용","grammarTest":"\\b(very|really|so|too|always|usually|often|carefully|hard|well|kind|honest|brave)\\b","title":"The Person I Respect the Most","genre":"설명문","note":"배운 문법 <b>형용사·부사</b>를 활용해 내가 존경하는 사람을 소개하고 설명하는 글을 써요.","sample":[{"en":"The person I respect the most is my grandmother.","ko":"내가 가장 존경하는 사람은 나의 할머니이다.","role":"ts","layer":"topic"},{"en":"First, she is a very kind person.","ko":"첫째, 그녀는 매우 친절한 사람이다.","role":"ss","layer":"s1"},{"en":"For example, she always helps our neighbors warmly and never asks for anything back.","ko":"예를 들어, 그녀는 항상 이웃들을 따뜻하게 도와주고 결코 대가를 바라지 않는다.","role":"cs","layer":"s1"},{"en":"Second, she is also really diligent.","ko":"둘째, 그녀는 또한 정말 부지런하다.","role":"ss","layer":"s2"},{"en":"This is because she wakes up early every morning and works hard in her small garden.","ko":"이는 그녀가 매일 아침 일찍 일어나 작은 정원에서 열심히 일하기 때문이다.","role":"cs","layer":"s2"},{"en":"Most of all, she is a wise woman.","ko":"무엇보다도, 그녀는 지혜로운 여성이다.","role":"ss","layer":"s3"},{"en":"For example, she calmly gives me good advice whenever I feel sad or worried.","ko":"예를 들어, 그녀는 내가 슬프거나 걱정될 때마다 차분하게 좋은 조언을 해 준다.","role":"cs","layer":"s3"},{"en":"As a result, I always feel safe and happy when I am with her.","ko":"그 결과, 나는 그녀와 함께 있을 때 항상 안전하고 행복하다고 느낀다.","role":"cs","layer":"s3"},{"en":"For these reasons, I truly respect my grandmother and hope to become as warm as her someday.","ko":"이런 이유로, 나는 할머니를 진심으로 존경하며 언젠가 그녀만큼 따뜻한 사람이 되고 싶다.","role":"cs","layer":"concl"}],"expressions":[{"en":"The person I respect the most is ~ (핵심 표현)","ko":"내가 가장 존경하는 사람은 ~이다"},{"en":"a very kind person (형용사)","ko":"매우 친절한 사람"},{"en":"be really diligent (형용사)","ko":"정말 부지런하다"},{"en":"a wise woman/man (형용사)","ko":"지혜로운 여성/남성"},{"en":"help ~ warmly (부사)","ko":"~을 따뜻하게 돕다"},{"en":"work hard every day (부사)","ko":"매일 열심히 일하다"},{"en":"wake up early (부사)","ko":"일찍 일어나다"},{"en":"calmly give advice (부사)","ko":"차분하게 조언하다"},{"en":"I truly respect ~ (부사)","ko":"나는 ~을 진심으로 존경한다"},{"en":"want to become as ~ as him/her (원급 비교)","ko":"그/그녀만큼 ~한 사람이 되고 싶다"}],"organizer":{"topic":"내가 존경하는 사람이 누구인지 한 문장으로 밝혀요. (예: 할머니, 아버지, 선생님)","s1":"① 그 사람의 첫 번째 성격·특징을 형용사로 소개해요. → ② 그렇게 생각하는 이유나 예시를 부사를 넣어 설명해요.","s2":"① 두 번째 특징을 형용사로 소개해요. → ② 왜 그런지 이유(This is because)나 예시로 뒷받침해요.","s3":"① 세 번째 특징을 형용사로 소개해요. → ② 구체적 예시(For example)와 그 결과(As a result)를 부사와 함께 써요.","concl":"앞의 내용을 정리하며 그 사람을 존경하는 마음과 다짐을 한 문장으로 마무리해요."},"flow":{"topic":"존경하는 사람 → 나의 할머니","s1":"특징 ① 친절함(kind) → 이웃을 따뜻하게(warmly) 도와주기 때문","s2":"특징 ② 부지런함(diligent) → 매일 일찍(early) 일어나 열심히(hard) 일하기 때문","s3":"특징 ③ 지혜로움(wise) → 슬플 때 차분하게(calmly) 조언해 주어 늘 행복함을 느끼기 때문","concl":"세 가지 이유로 진심으로(truly) 존경하며 할머니처럼 따뜻한 사람이 되고 싶음"},"images":""},{"id":"PW-L2C10","level":"L2","grammar":"비교 표현(as~as / -er than / the -est)","chap":10,"grammarLabel":"비교 표현(as~as / 비교급 / 최상급) 사용","grammarTest":"(\\bas\\s+\\w+\\s+as\\b|\\b\\w+er\\b[\\s\\S]*\\bthan\\b|\\bthe\\s+\\w+est\\b|\\bmore\\b|\\bmost\\b)","title":"City Life or Country Life: Which Is Better?","genre":"설득문","note":"배운 문법 <b>비교 표현(as~as / -er than / the -est)</b>을 활용해 도시 생활과 시골 생활을 비교하며 내 생각을 설득하는 글을 써요.","sample":[{"en":"I think city life is better than country life for young people.","ko":"나는 젊은 사람들에게는 도시 생활이 시골 생활보다 더 좋다고 생각한다.","role":"ts","layer":"topic"},{"en":"First, cities have more job opportunities than the countryside.","ko":"첫째, 도시는 시골보다 더 많은 일자리를 가지고 있다.","role":"ss","layer":"s1"},{"en":"This is because most big companies are located in cities, so it is easier to find a good job there.","ko":"이것은 대부분의 큰 회사들이 도시에 있어서, 그곳에서 좋은 직업을 찾기가 더 쉽기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, life in a city is more convenient than life in the country.","ko":"둘째, 도시에서의 생활은 시골에서의 생활보다 더 편리하다.","role":"ss","layer":"s2"},{"en":"For example, subways in a city are faster than buses in the country, and stores stay open as late as midnight.","ko":"예를 들어, 도시의 지하철은 시골의 버스보다 더 빠르고, 가게들은 자정만큼 늦게까지 문을 연다.","role":"ss","layer":"s2"},{"en":"Third, cities offer the most exciting things to do.","ko":"셋째, 도시는 가장 신나는 즐길 거리들을 제공한다.","role":"ss","layer":"s3"},{"en":"This is because they have the biggest shopping malls and the most famous museums in the nation.","ko":"이것은 도시에 나라에서 가장 큰 쇼핑몰과 가장 유명한 박물관들이 있기 때문이다.","role":"ss","layer":"s3"},{"en":"In conclusion, city life is not always as peaceful as country life.","ko":"결론적으로, 도시 생활이 항상 시골 생활만큼 평화롭지는 않다.","role":"cs","layer":"concl"},{"en":"However, for young people, I believe the city is the best place to live and grow.","ko":"하지만 젊은 사람들에게는 도시가 살고 성장하기에 가장 좋은 곳이라고 나는 믿는다.","role":"cs","layer":"concl"}],"expressions":[{"en":"better than ~ (~보다 더 좋은)","ko":"~보다 더 좋은"},{"en":"more convenient than ~ (~보다 더 편리한)","ko":"~보다 더 편리한"},{"en":"as ~ as ... (…만큼 ~한)","ko":"…만큼 ~한"},{"en":"the most exciting (가장 신나는)","ko":"가장 신나는"},{"en":"job opportunities (일자리, 취업 기회)","ko":"일자리, 취업 기회"},{"en":"cheaper than ~ (~보다 더 싼)","ko":"~보다 더 싼"},{"en":"the biggest (가장 큰)","ko":"가장 큰"},{"en":"fresh air (신선한 공기)","ko":"신선한 공기"},{"en":"cost of living (생활비)","ko":"생활비"},{"en":"quality of life (삶의 질)","ko":"삶의 질"}],"organizer":{"topic":"도시 생활과 시골 생활 중 어느 쪽이 더 좋은지 내 주장을 한 문장으로 정해요. (예: 도시가 더 좋다 vs 시골이 더 좋다)","s1":"① 첫 번째 이유(예: 일자리)를 소개해요. → ② 왜 그런지 이유나 예시로 설명해요. (This is because ~ 사용)","s2":"① 두 번째 이유(예: 편리함)를 소개해요. → ② For example로 구체적인 예시를 들어요.","s3":"① 세 번째 이유(예: 즐길 거리)를 소개해요. → ② This is because로 근거를 덧붙여요. (the -est 표현 활용)","concl":"내 주장을 다시 정리하며 마무리해요. 반대편의 장점도 인정한 뒤(as~as) 내 결론을 강조해요."},"flow":{"topic":"주장: 젊은 사람에게는 도시 생활이 시골보다 더 좋다 (better than)","s1":"이유① 일자리 → 도시에 큰 회사가 많아 취업이 더 쉽기 때문 (more ~ than)","s2":"이유② 편리함 → 지하철이 버스보다 빠르고 가게가 자정만큼 늦게까지 열기 때문 (faster than / as~as)","s3":"이유③ 즐길 거리 → 나라에서 가장 큰 쇼핑몰과 가장 유명한 박물관이 있기 때문 (the -est)","concl":"도시가 시골만큼 평화롭진 않지만, 젊은이에겐 도시가 가장 좋은 곳이라고 마무리 (as~as / the best)"},"images":""},{"id":"PW-L2C11","level":"L2","grammar":"접속사(because/although/if)","chap":11,"grammarLabel":"접속사(because/although/if/when 등) 사용","grammarTest":"\\b(because|although|though|if|when|while|so that|unless)\\b","title":"Why I Support Wearing School Uniforms","genre":"설득문","note":"배운 문법 <b>접속사(because/although/if)</b>를 활용해 교복에 대한 내 의견을 논리적으로 주장하는 글을 써요.","sample":[{"en":"I think wearing school uniforms is a good idea, although some students do not like them.","ko":"비록 몇몇 학생들은 좋아하지 않지만, 나는 교복을 입는 것이 좋은 생각이라고 생각한다.","role":"ts","layer":"topic"},{"en":"First, uniforms help students save time in the morning.","ko":"첫째, 교복은 학생들이 아침에 시간을 절약하도록 도와준다.","role":"ss","layer":"s1"},{"en":"This is because they do not have to spend time choosing clothes if they wear the same uniform every day.","ko":"이는 매일 같은 교복을 입으면 옷을 고르는 데 시간을 쓸 필요가 없기 때문이다.","role":"ss","layer":"s1"},{"en":"Second, uniforms make all students feel equal.","ko":"둘째, 교복은 모든 학생이 평등하다고 느끼게 해 준다.","role":"ss","layer":"s2"},{"en":"For example, no one is judged by expensive clothes, because everyone wears the same thing.","ko":"예를 들어, 모두가 같은 것을 입기 때문에 아무도 비싼 옷으로 판단받지 않는다.","role":"ss","layer":"s2"},{"en":"Third, uniforms give students a strong sense of belonging.","ko":"셋째, 교복은 학생들에게 강한 소속감을 준다.","role":"ss","layer":"s3"},{"en":"This is because students feel proud of their school when they wear the uniform, although it is not always comfortable.","ko":"이는 비록 항상 편하지는 않더라도, 학생들이 교복을 입을 때 자신의 학교를 자랑스럽게 느끼기 때문이다.","role":"ss","layer":"s3"},{"en":"For these reasons, I believe that school uniforms are helpful.","ko":"이러한 이유들로, 나는 교복이 도움이 된다고 믿는다.","role":"cs","layer":"concl"},{"en":"Although they limit our freedom to choose clothes, they make our school life simpler and fairer.","ko":"비록 교복이 옷을 고를 자유를 제한하지만, 우리의 학교생활을 더 단순하고 공정하게 만들어 준다.","role":"cs","layer":"concl"}],"expressions":[{"en":"I think (that) ~ (~ 사용 가능)","ko":"나는 ~라고 생각한다"},{"en":"although some students disagree (~ 사용 가능)","ko":"비록 몇몇 학생들은 동의하지 않지만"},{"en":"save time in the morning (~ 사용 가능)","ko":"아침에 시간을 절약하다"},{"en":"This is because ~ (~ 사용 가능)","ko":"이것은 ~하기 때문이다"},{"en":"if they wear the same uniform (~ 사용 가능)","ko":"만약 그들이 같은 교복을 입는다면"},{"en":"feel equal (~ 사용 가능)","ko":"평등하다고 느끼다"},{"en":"judge someone by ~ (~ 사용 가능)","ko":"~로 누군가를 판단하다"},{"en":"a sense of belonging (~ 사용 가능)","ko":"소속감"},{"en":"be proud of ~ (~ 사용 가능)","ko":"~을 자랑스러워하다"},{"en":"limit one's freedom to ~ (~ 사용 가능)","ko":"~할 자유를 제한하다"}],"organizer":{"topic":"교복에 대한 나의 입장을 한 문장으로 정하세요. (although을 써서 반대 의견도 살짝 인정하며 시작하면 좋아요.)","s1":"① 첫 번째 이유를 소개하세요(예: 시간 절약). ② if/because로 그 이유를 설명하거나 예시를 드세요.","s2":"① 두 번째 이유를 소개하세요(예: 평등함). ② because나 For example로 뒷받침 설명을 쓰세요.","s3":"① 세 번째 이유를 소개하세요(예: 소속감). ② because/although로 이유를 자세히 설명하세요.","concl":"세 가지 이유를 정리하며 내 의견을 다시 강조하세요. (although/if로 반대 의견을 인정하며 마무리하면 설득력이 높아져요.)"},"flow":{"topic":"입장 → 교복 찬성 (although 반대 의견 인정)","s1":"이유① 시간 절약 → if 같은 교복을 입으면 옷 고를 필요 없기 때문","s2":"이유② 평등함 → because 모두 같은 옷을 입어 비싼 옷으로 판단받지 않음 (For example)","s3":"이유③ 소속감 → because 학교가 자랑스럽기 때문 (although 항상 편하지는 않음)","concl":"세 이유 정리 → although 자유는 제한되지만 더 단순하고 공정한 학교생활"},"images":""},{"id":"PW-L2C12","level":"L2","grammar":"관계대명사(who/which/that)","chap":12,"grammarLabel":"관계대명사(who/which/that) 사용","grammarTest":"\\b(who|which|that|whose)\\b","title":"The Person Who Inspires Me the Most","genre":"설명문","note":"배운 문법 <b>관계대명사(who/which/that)</b>를 사용해 나에게 영감을 주는 사람을 소개하는 글을 써요.","sample":[{"en":"The person who inspires me the most is my grandmother.","ko":"나에게 가장 큰 영감을 주는 사람은 우리 할머니이다.","role":"ts","layer":"topic"},{"en":"My grandmother is someone who never gives up on anything.","ko":"우리 할머니는 어떤 일에도 절대 포기하지 않는 분이다.","role":"ss","layer":"s1"},{"en":"This is because she started learning English at the age of seventy.","ko":"왜냐하면 그녀는 일흔 살의 나이에 영어를 배우기 시작했기 때문이다.","role":"ss","layer":"s1"},{"en":"She is also a person who always thinks of others first.","ko":"그녀는 또한 항상 다른 사람들을 먼저 생각하는 사람이다.","role":"ss","layer":"s2"},{"en":"For example, she often cooks warm meals for the neighbors who live alone.","ko":"예를 들어, 그녀는 혼자 사는 이웃들을 위해 자주 따뜻한 식사를 요리해 준다.","role":"ss","layer":"s2"},{"en":"The quality that I admire most is her positive attitude.","ko":"내가 가장 존경하는 점은 그녀의 긍정적인 태도이다.","role":"ss","layer":"s3"},{"en":"It is because she always finds hope in situations that seem difficult.","ko":"그것은 그녀가 어려워 보이는 상황에서도 항상 희망을 찾기 때문이다.","role":"ss","layer":"s3"},{"en":"As a result, my grandmother, who teaches me many lessons, has become the person that I want to be like.","ko":"그 결과, 나에게 많은 교훈을 주는 우리 할머니는 내가 닮고 싶은 사람이 되었다.","role":"cs","layer":"concl"},{"en":"I hope that someday I can become someone who inspires others, just like her.","ko":"나도 언젠가 그녀처럼 다른 사람들에게 영감을 주는 사람이 되기를 바란다.","role":"cs","layer":"concl"}],"expressions":[{"en":"the person who inspires me (~ 사용 가능)","ko":"나에게 영감을 주는 사람"},{"en":"someone who never gives up (~ 사용 가능)","ko":"절대 포기하지 않는 사람"},{"en":"a person who always thinks of others (~ 사용 가능)","ko":"항상 다른 사람을 생각하는 사람"},{"en":"the quality that I admire most (~ 사용 가능)","ko":"내가 가장 존경하는 점"},{"en":"situations that seem difficult (~ 사용 가능)","ko":"어려워 보이는 상황들"},{"en":"the person that I want to be like (~ 사용 가능)","ko":"내가 닮고 싶은 사람"},{"en":"a role model who I look up to (~ 사용 가능)","ko":"내가 존경하는 롤모델"},{"en":"words which encourage me (~ 사용 가능)","ko":"나를 격려해 주는 말들"},{"en":"the moment that changed my mind (~ 사용 가능)","ko":"내 생각을 바꾼 순간"},{"en":"a teacher who always believes in me (~ 사용 가능)","ko":"나를 항상 믿어 주는 선생님"}],"organizer":{"topic":"글 전체의 주인공을 정해요. '나에게 영감을 주는 사람은 누구인가?'를 관계대명사(who)로 한 문장에 소개해요.","s1":"① 그 사람이 어떤 사람인지 관계대명사로 소개해요 (예: never gives up). → ② 그렇게 생각하는 이유나 예시를 This is because 등으로 덧붙여요.","s2":"① 그 사람의 또 다른 특징을 관계대명사로 소개해요 (예: thinks of others). → ② For example로 구체적인 예시를 들어요.","s3":"① 내가 가장 존경하는 점을 관계대명사(that)로 소개해요. → ② It is because로 그 이유를 설명해요.","concl":"앞의 내용을 정리하며, 그 사람이 나에게 어떤 의미인지와 나의 다짐을 관계대명사로 마무리해요."},"flow":{"topic":"영감을 주는 사람 → 우리 할머니 (who)","s1":"특징① 포기하지 않는 사람(who) → 일흔에 영어를 시작했기 때문(This is because)","s2":"특징② 남을 먼저 생각하는 사람(who) → 혼자 사는 이웃에게 요리해 줌(For example, who)","s3":"존경하는 점 긍정적 태도(that) → 어려운 상황에서도 희망을 찾기 때문(It is because, that)","concl":"정리: 많은 교훈을 주는 할머니는 닮고 싶은 사람(As a result, who/that) → 나도 영감을 주는 사람이 되고 싶다(who)"},"images":""},{"id":"PW-L3C01","level":"L3","grammar":"완료시제(현재완료/과거완료)","chap":1,"grammarLabel":"완료시제(have/has/had + p.p.) 사용","grammarTest":"\\b(have|has|had)\\s+\\w+(ed|en)\\b","title":"How I Have Changed Over Time","genre":"성찰문","note":"배운 문법 <b>완료시제(현재완료/과거완료)</b>를 사용해서 내가 지금까지 어떻게 변해 왔는지 되돌아보는 글을 써요.","sample":[{"en":"I have changed a lot since I started middle school.","ko":"나는 중학교에 들어간 이후로 많이 변했다.","role":"ts","layer":"topic"},{"en":"First, I have become much more confident than before.","ko":"첫째, 나는 예전보다 훨씬 더 자신감 있는 사람이 되었다.","role":"ss","layer":"s1"},{"en":"This is because I have joined the school debate club and spoken in front of many people.","ko":"이것은 내가 학교 토론 동아리에 가입해서 많은 사람들 앞에서 말해 왔기 때문이다.","role":"ss","layer":"s1"},{"en":"Before I joined the club, I had been too shy to raise my hand, but now I enjoy sharing my opinions.","ko":"동아리에 가입하기 전에 나는 너무 부끄러워서 손을 들지 못했지만, 지금은 내 의견을 나누는 것을 즐긴다.","role":"ss","layer":"s1"},{"en":"Second, my study habits have improved a lot.","ko":"둘째, 나의 공부 습관이 많이 나아졌다.","role":"ss","layer":"s2"},{"en":"For example, I have made a daily plan every morning, and as a result, my grades have gone up.","ko":"예를 들어, 나는 매일 아침 하루 계획을 세워 왔고, 그 결과 내 성적이 올랐다.","role":"ss","layer":"s2"},{"en":"Third, I have learned how important my health is.","ko":"셋째, 나는 내 건강이 얼마나 소중한지 깨닫게 되었다.","role":"ss","layer":"s3"},{"en":"Before I entered middle school, I had never exercised regularly, but now I have run every morning for a year.","ko":"중학교에 들어가기 전에는 규칙적으로 운동한 적이 한 번도 없었지만, 지금은 1년 동안 매일 아침 달려 왔다.","role":"ss","layer":"s3"},{"en":"This is because I had gotten sick so often that I decided to take better care of my body.","ko":"이것은 내가 예전에 너무 자주 아파서 내 몸을 더 잘 돌보기로 결심했기 때문이다.","role":"ss","layer":"s3"},{"en":"In these ways, I have grown into a better person than I used to be.","ko":"이런 점들에서, 나는 예전의 나보다 더 나은 사람으로 성장해 왔다.","role":"cs","layer":"concl"}],"expressions":[{"en":"have changed a lot (많이 변해 왔다)","ko":"많이 변해 왔다"},{"en":"since I started middle school (중학교에 들어간 이후로)","ko":"중학교에 들어간 이후로"},{"en":"have become more confident (더 자신감 있게 되었다)","ko":"더 자신감 있게 되었다"},{"en":"This is because ~ (이것은 ~ 때문이다)","ko":"이것은 ~ 때문이다"},{"en":"For example, ~ (예를 들어)","ko":"예를 들어"},{"en":"As a result, ~ (그 결과)","ko":"그 결과"},{"en":"had never + 과거분사 (한 번도 ~한 적이 없었다)","ko":"한 번도 ~한 적이 없었다"},{"en":"have + 과거분사 for + 기간 (~ 동안 계속 ~해 왔다)","ko":"~ 동안 계속 ~해 왔다"},{"en":"than I used to be (예전의 나보다)","ko":"예전의 나보다"},{"en":"have grown into ~ (~로 성장해 왔다)","ko":"~로 성장해 왔다"}],"organizer":{"topic":"내가 지금까지 어떻게 변해 왔는지 한 문장으로 정하세요. (예: 중학교 이후 많이 변했다)","s1":"① 첫 번째 변화를 소개하세요. (예: 더 자신감 있어졌다) → ② 그 이유나 예시를 완료시제로 설명하세요. (예: 동아리 활동을 해 왔기 때문)","s2":"① 두 번째 변화를 소개하세요. (예: 공부 습관이 나아졌다) → ② 이유·예시를 부연설명 표현과 함께 쓰세요. (예: 매일 계획을 세워서 성적이 올랐다)","s3":"① 세 번째 변화를 소개하세요. (예: 건강을 챙기게 되었다) → ② 과거완료로 예전 모습과 비교해 설명하세요. (예: 전에는 운동한 적이 없었다)","concl":"세 가지 변화를 한 문장으로 정리하며 마무리하세요. (예: 예전보다 더 나은 사람이 되었다)"},"flow":{"topic":"중학교 이후 나는 많이 변해 왔다 (전체 주제 제시)","s1":"변화① 자신감 → 토론 동아리 활동을 해 왔기 때문 / 예전엔 부끄러웠지만(과거완료) 지금은 의견을 나눔","s2":"변화② 공부 습관 → 매일 계획을 세워 와서 그 결과 성적이 오름","s3":"변화③ 건강 → 전에는 운동한 적 없었지만(과거완료) 1년간 달려 옴 / 자주 아팠어서 몸을 챙기기로 함","concl":"이런 변화들로 예전보다 더 나은 사람으로 성장해 왔다 (마무리 정리)"},"images":""},{"id":"PW-L3C02","level":"L3","grammar":"조동사+have p.p.","chap":2,"grammarLabel":"조동사(should/could/must + have p.p. 등) 사용","grammarTest":"\\b(should|could|must|might|would|will|can)\\b","title":"The Team I Should Have Stayed On","genre":"성찰문","note":"배운 문법 <b>조동사+have p.p.</b>을 사용해 과거의 선택을 되돌아보고 후회를 표현하는 글을 써요.","sample":[{"en":"Looking back, I believe I should have made a different choice about quitting the school soccer team.","ko":"돌이켜보면, 나는 학교 축구팀을 그만둔 일에 대해 다른 선택을 했어야 했다고 생각한다.","role":"ts","layer":"topic"},{"en":"First, I quit the team because I was afraid of losing games.","ko":"첫째, 나는 경기에서 지는 것이 두려워서 팀을 그만두었다.","role":"ss","layer":"s1"},{"en":"However, I should not have given up so easily, and I could have become a much better player if I had kept practicing.","ko":"하지만 나는 그렇게 쉽게 포기하지 말았어야 했고, 계속 연습했다면 훨씬 더 좋은 선수가 될 수도 있었다.","role":"ss","layer":"s1"},{"en":"Second, I lost touch with many close friends after I left the team.","ko":"둘째, 나는 팀을 떠난 후 많은 친한 친구들과 연락이 끊겼다.","role":"ss","layer":"s2"},{"en":"This is because we used to train together every afternoon, and I could have kept those friendships if I had stayed.","ko":"이것은 우리가 매일 오후에 함께 훈련하곤 했기 때문인데, 내가 남았더라면 그 우정을 지킬 수도 있었다.","role":"ss","layer":"s2"},{"en":"Finally, I have felt bored and lonely without the sport I truly loved.","ko":"마지막으로, 나는 내가 진정으로 사랑했던 운동 없이 지루하고 외로움을 느껴 왔다.","role":"ss","layer":"s3"},{"en":"For example, last month I watched my old teammates win an important match, and I thought, \"I should have been there with them.\"","ko":"예를 들어, 지난달 나는 옛 팀 동료들이 중요한 경기에서 이기는 것을 보며 '나도 그들과 함께 그 자리에 있었어야 했는데'라고 생각했다.","role":"ss","layer":"s3"},{"en":"If I could turn back time, I would have chosen to stay on the team no matter how hard it felt.","ko":"만약 시간을 되돌릴 수 있다면, 아무리 힘들게 느껴졌더라도 나는 팀에 남는 것을 선택했을 것이다.","role":"cs",
