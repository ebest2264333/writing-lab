onds":[{"label":"세 문장 이상 쓰기","minSentences":3},{"label":"one과 the other(또는 another) 함께 사용하기","regex":"[Oo]ne\\b[\\s\\S]*\\b(the other|another|others|the others)\\b"},{"label":"some 또는 any 사용하기","regex":"\\b([Ss]ome|[Aa]ny)\\b"}]},"images":""},{"id":"L2C8U2","title":"부정대명사 II","explainParts":[{"t":"부정대명사는 정해지지 않은 사람이나 사물을 가리켜요. 수 일치와 어순에 특히 주의해야 해요. "},{"k":"each / every + 단수","n":"each(각각)와 every(모든) 뒤에는 단수명사가 오고, 동사도 단수로 써요. 예: Every child is happy. / Each student has a book."},{"t":"반대로 "},{"k":"both / all + 복수","n":"both(둘 다)와 all(모두, 셋 이상) 뒤에는 복수명사가 오고 동사도 복수로 써요. 예: Both are good. / All the books are new."},{"t":"none은 '아무도/하나도 ~아니다'라는 부정의 뜻이에요. "},{"k":"-thing/-body/-one + 형용사","n":"something, someone, anybody처럼 -thing/-body/-one으로 끝나는 말은 형용사가 뒤에 붙어요. 예: something special(특별한 무언가), someone kind(친절한 누군가)."},{"t":"어순과 수 일치만 기억하면 어렵지 않아요!"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"________ is ready for the test.","o":["Everyone","Every","Both","All friend","Many student"],"a":0,"e":"Everyone은 단수 취급이라 단수동사 is와 어울려요."},{"q":"그녀는 예쁜 무언가를 사고 싶어 한다. She wants to buy ________.","o":["pretty something","a pretty something","something pretty","something prettily","prettily something"],"a":2,"e":"-thing으로 끝나는 말은 형용사가 뒤에 오므로 something pretty가 맞아요."},{"q":"________ are my best friends.","o":["Each","Both","Every","Everyone","Nobody"],"a":1,"e":"Both(둘 다)는 복수라서 복수동사 are와 함께 써요."},{"q":"Each student ________ a locker.","o":["have","are","were","has","having"],"a":3,"e":"Each+단수명사는 단수 취급이라 단수동사 has를 써요."},{"q":"________ child needs love.","o":["Every","All","Both","Many of","Some of"],"a":0,"e":"Every 뒤에는 단수명사가 오므로 Every child가 맞아요."},{"q":"________ are on the desk.","o":["Every book","Each book","Everything","Something","All the books"],"a":4,"e":"복수동사 are와 어울리는 것은 복수명사를 이끄는 All the books예요."},{"q":"Is there ________ in the room?","o":["important anybody","anybody importantly","anybody important","important anyone's","anyone importantly"],"a":2,"e":"-body로 끝나는 말은 형용사가 뒤에 오므로 anybody important가 맞아요."},{"q":"________ of them were late, so we could start on time.","o":["Both","Each","Every","None","All one"],"a":3,"e":"아무도 늦지 않았다는 문맥이므로 None(아무도 ~않다)이 알맞아요."},{"q":"There are three books. ________ of them are interesting.","o":["Both","Every","All","Each other","None's"],"a":2,"e":"셋 이상일 때는 both가 아니라 all을 써요."},{"q":"Every student [[have]] a dream. 밑줄 친 부분을 바르게 고친 것은?","o":["have","has","are having","have got","having"],"a":1,"e":"Every+단수명사는 단수 취급이므로 has로 고쳐야 해요."}],"arrange":[{"ko":"모두가 여기 있다.","a":"Everyone is here."},{"ko":"둘 다 좋다.","a":"Both are good."},{"ko":"나는 특별한 무언가를 원한다.","a":"I want something special."},{"ko":"모든 학생은 교복을 입는다.","a":"Every student wears a uniform."},{"ko":"각각의 방에는 창문이 있다.","a":"Each room has a window."},{"ko":"모든 책이 책상 위에 있다.","a":"All the books are on the desk."},{"ko":"그들 중 아무도 늦지 않았다.","a":"None of them were late."},{"ko":"두 소년 모두 축구를 좋아한다.","a":"Both boys like soccer."},{"ko":"새로운 무언가를 배우자.","a":"Let's learn something new."},{"ko":"누군가 유명한 사람이 왔다.","a":"Someone famous came."},{"ko":"모든 사람이 그 이야기를 안다.","a":"Everybody knows the story."},{"ko":"각 학생은 이름표를 가지고 있다.","a":"Each student has a name tag."},{"ko":"나는 차가운 것을 마시고 싶다.","a":"I want to drink something cold."},{"ko":"모든 아이가 행복하다.","a":"Every child is happy."},{"ko":"우리 둘 다 그 영화를 봤다.","a":"Both of us watched the movie."}],"compose":[{"k":"모두가 준비되었다.","a":"Everyone is ready.","h":"Everyone / 단수동사 is","alt":["Everybody is ready."]},{"k":"둘 다 내 친구다.","a":"Both are my friends.","h":"Both / 복수동사 are","alt":["They are both my friends."]},{"k":"나는 재미있는 무언가를 읽고 싶다.","a":"I want to read something interesting.","h":"something + 형용사","alt":["I want to read something fun."]},{"k":"모든 학생은 규칙을 지켜야 한다.","a":"Every student must follow the rules.","h":"Every + 단수명사 / must","alt":["Each student must follow the rules."]},{"k":"각각의 답이 맞다.","a":"Each answer is correct.","h":"Each + 단수 / is","alt":["Every answer is correct."]},{"k":"모든 물이 사라졌다.","a":"All the water is gone.","h":"All + 불가산 / is","alt":["All of the water is gone."]},{"k":"그들 중 아무도 그것을 몰랐다.","a":"None of them knew it.","h":"None of","alt":["Nobody knew it."]},{"k":"두 답 모두 맞다.","a":"Both answers are correct.","h":"Both + 복수명사 / are","alt":["Both of the answers are correct."]},{"k":"나는 새로운 사람을 만났다.","a":"I met someone new.","h":"someone + 형용사","alt":["I met somebody new."]},{"k":"누군가 특별한 사람이 여기 있다.","a":"Someone special is here.","h":"someone special / is","alt":["Somebody special is here."]},{"k":"모든 사람이 그를 사랑한다.","a":"Everyone loves him.","h":"Everyone / 단수동사 loves","alt":["Everybody loves him."]},{"k":"각 아이가 풍선을 가지고 있다.","a":"Each child has a balloon.","h":"Each + 단수 / has","alt":["Every child has a balloon."]},{"k":"나는 뜨거운 것을 원한다.","a":"I want something hot.","h":"something + 형용사","alt":["I want something warm."]},{"k":"모든 창문이 열려 있다.","a":"All the windows are open.","h":"All + 복수 / are","alt":["All of the windows are open."]},{"k":"우리 둘 다 늦었다.","a":"Both of us were late.","h":"Both of us / were","alt":["We were both late."]}],"task":{"prompt":"여러분의 반 친구들이나 가족을 소개하는 글을 3문장 이상 써 보세요. <b>every / both / all / each</b> 중 하나와, <b>-thing/-one/-body + 형용사</b> 표현(예: something special)을 꼭 사용하세요.","sample":"Everyone in my class is kind. Both of my best friends like music. We always do something fun together.","conds":[{"label":"3문장 이상 썼어요","minSentences":3},{"label":"every/both/all/each/none 중 하나를 사용했어요","regex":"\\b([Ee]very|[Bb]oth|[Aa]ll|[Ee]ach|[Nn]one)\\b"},{"label":"-thing/-one/-body + 형용사 표현을 썼어요","regex":"\\b([Ss]ome|[Aa]ny|[Nn]o|[Ee]very)(thing|one|body)\\s+[a-zA-Z]+"}]},"images":""},{"id":"L2C8U3","title":"재귀대명사","explainParts":[{"t":"재귀대명사는 '~자신'이라는 뜻으로, 주어와 목적어가 같은 대상을 가리킬 때 씁니다."},{"k":"재귀용법","n":"주어가 한 행동이 다시 주어 자신에게 돌아올 때 목적어로 쓰는 용법이에요. I hurt myself.(나는 나 자신을 다치게 했다)처럼 이때는 생략할 수 없어요."},{"t":"인칭에 따라 myself, yourself, himself, herself, itself, ourselves, yourselves, themselves로 형태가 달라집니다."},{"k":"강조용법","n":"'직접, 스스로'라는 뜻으로 주어나 목적어를 강조해요. 문장에서 빼도 문장이 성립하는 것이 특징이에요. I made it myself.(내가 그것을 직접 만들었다)"},{"k":"by oneself","n":"'혼자서, 스스로'라는 뜻의 표현이에요. I did it by myself.(나는 그것을 혼자서 했다)로, alone과 바꿔 쓸 수 있어요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"I looked at ___ in the mirror this morning.","o":["myself","me","my","mine","I"],"a":0,"e":"주어 I와 목적어가 같은 대상이므로 재귀대명사 myself를 씁니다."},{"q":"She taught ___ how to swim.","o":["himself","herself","yourself","itself","themselves"],"a":1,"e":"주어 She와 같은 대상이므로 herself를 씁니다."},{"q":"The dog hid ___ under the table.","o":["himself","herself","myself","itself","ourselves"],"a":3,"e":"동물 주어 The dog와 같은 대상이므로 itself를 씁니다."},{"q":"We enjoyed ___ at the beach.","o":["ourself","myself","yourselves","themselves","ourselves"],"a":4,"e":"주어 We와 같은 대상이므로 복수형 재귀대명사 ourselves를 씁니다."},{"q":"Tom and Jerry introduced ___ to the class.","o":["himself","themselves","yourselves","ourselves","herself"],"a":1,"e":"주어가 복수(Tom and Jerry)이므로 themselves를 씁니다."},{"q":"I finished my homework by ___.","o":["me","mine","myself","I","my"],"a":2,"e":"'혼자서'라는 뜻의 by oneself 표현이므로 myself를 씁니다."},{"q":"She cooked dinner by [[herself]]. 밑줄 친 부분과 의미가 가장 가까운 것은?","o":["alone","together","with help","for her","by her mother"],"a":0,"e":"by oneself는 '혼자서(alone)'라는 뜻입니다."},{"q":"The queen ___ opened the new hospital.","o":["her","herself","she","hers","itself"],"a":1,"e":"주어 The queen을 '직접'이라고 강조하는 강조용법으로 herself를 씁니다."},{"q":"다음 중 어법상 올바른 문장은?","o":["He hurt himself.","He hurt hisself.","He hurt him self.","He hurt heself.","He hurt themself."],"a":0,"e":"3인칭 남성 단수 재귀대명사는 himself가 올바른 형태입니다."},{"q":"Kids, help ___ to some cookies!","o":["yourself","yourselves","themselves","ourselves","himself"],"a":1,"e":"여러 명(Kids)에게 말하고 있으므로 복수형 yourselves를 씁니다."}],"arrange":[{"ko":"나는 실수로 나 자신을 다치게 했다.","a":"I hurt myself by accident."},{"ko":"그녀는 거울 속의 자신을 보았다.","a":"She looked at herself in the mirror."},{"ko":"우리는 파티에서 즐거운 시간을 보냈다.","a":"We enjoyed ourselves at the party."},{"ko":"그는 그 일을 혼자서 했다.","a":"He did it by himself."},{"ko":"조심해, 다치지 않게!","a":"Be careful, don't hurt yourself!"},{"ko":"그 고양이는 스스로 몸을 깨끗이 했다.","a":"The cat cleaned itself."},{"ko":"너 자신을 믿어라.","a":"Believe in yourself."},{"ko":"그들은 스스로를 자랑스러워한다.","a":"They are proud of themselves."},{"ko":"나는 그 케이크를 직접 만들었다.","a":"I made the cake myself."},{"ko":"그 아이들은 혼자 힘으로 텐트를 세웠다.","a":"The children set up the tent by themselves."},{"ko":"그녀는 프랑스어를 독학했다.","a":"She taught herself French."},{"ko":"편하게 음식을 드세요.","a":"Help yourself to the food."},{"ko":"그는 자신을 소개했다.","a":"He introduced himself."},{"ko":"우리는 스스로 결정해야 한다.","a":"We must decide by ourselves."},{"ko":"그 문이 저절로 닫혔다.","a":"The door closed by itself."}],"compose":[{"k":"나는 나 자신을 다치게 했다.","a":"I hurt myself.","h":"hurt / myself","alt":[]},{"k":"그는 그 일을 혼자서 했다.","a":"He did it by himself.","h":"by oneself / himself","alt":["He did it alone.","He did it on his own."]},{"k":"그녀는 거울 속의 자신을 보았다.","a":"She looked at herself in the mirror.","h":"look at / herself","alt":["She saw herself in the mirror."]},{"k":"우리는 즐거운 시간을 보냈다.","a":"We enjoyed ourselves.","h":"enjoy oneself / ourselves","alt":["We had a good time."]},{"k":"너 자신을 믿어라.","a":"Believe in yourself.","h":"believe in / yourself","alt":["Trust yourself."]},{"k":"그 고양이는 스스로 몸을 깨끗이 했다.","a":"The cat cleaned itself.","h":"clean / itself","alt":[]},{"k":"그들은 스스로를 자랑스러워한다.","a":"They are proud of themselves.","h":"be proud of / themselves","alt":[]},{"k":"나는 그 케이크를 직접 만들었다.","a":"I made the cake myself.","h":"강조용법 / myself","alt":["I made the cake by myself."]},{"k":"그는 자신을 소개했다.","a":"He introduced himself.","h":"introduce / himself","alt":[]},{"k":"편하게 드세요.","a":"Help yourself.","h":"help oneself / yourself","alt":["Help yourself to the food."]},{"k":"그녀는 프랑스어를 독학했다.","a":"She taught herself French.","h":"teach oneself / herself","alt":["She learned French by herself."]},{"k":"그 문이 저절로 닫혔다.","a":"The door closed by itself.","h":"by itself / 저절로","alt":["The door closed on its own."]},{"k":"우리는 스스로 결정해야 한다.","a":"We must decide by ourselves.","h":"by ourselves","alt":["We have to decide by ourselves.","We must decide for ourselves."]},{"k":"그 아이들은 혼자 힘으로 텐트를 세웠다.","a":"The children set up the tent by themselves.","h":"set up / by themselves","alt":["The children put up the tent by themselves."]},{"k":"조심해, 다치지 마!","a":"Be careful, don't hurt yourself!","h":"hurt / yourself","alt":["Be careful not to hurt yourself."]}],"task":{"prompt":"주말에 혼자서 한 일을 <b>재귀대명사(myself, by myself 등)</b>를 사용해 3문장으로 써 보세요. 재귀용법이나 강조용법, by oneself 표현을 자유롭게 활용하세요.","sample":"Last Saturday, I stayed home by myself. I made lunch myself and enjoyed myself a lot. I even taught myself a new song on the guitar.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"재귀대명사(myself, yourself, himself 등)를 사용했나요?","regex":"(myself|yourself|himself|herself|itself|ourselves|yourselves|themselves)"},{"label":"'by oneself' 표현을 사용했나요?","regex":"by\\s+(myself|yourself|himself|herself|itself|ourselves|yourselves|themselves)"}]},"images":""},{"id":"L2C9U1","title":"형용사","explainParts":[{"t":"수량형용사는 명사의 수나 양이 얼마나 되는지를 나타내요. 그런데 셀 수 있는 명사(books, friends)와 셀 수 없는 명사(water, money) 앞에 쓰는 말이 서로 달라요."},{"k":"many / much / a lot of","n":"many는 셀 수 있는 명사의 복수형 앞에(many books), much는 셀 수 없는 명사 앞에(much water) 써요. a lot of는 둘 다 앞에 쓸 수 있어요. 참고로 much는 주로 부정문·의문문에서 자연스러워요."},{"t":"‘조금 있는’과 ‘거의 없는’도 구분해서 써요."},{"k":"(a) few / (a) little","n":"셀 수 있는 명사에는 a few/few, 셀 수 없는 명사에는 a little/little을 써요. a가 붙으면 ‘조금 있는(긍정)’, a가 없으면 ‘거의 없는(부정)’ 뜻이에요. 예: a few friends(친구가 몇 명 있다) / few friends(친구가 거의 없다)."},{"t":"형용사가 여러 개일 때는 나열하는 순서가 정해져 있어요."},{"k":"형용사 어순","n":"보통 ‘의견 → 크기 → 모양 → 색깔 → 재료’ 순서로 명사 앞에 나열해요. 예: a beautiful small round wooden table(예쁜 작은 둥근 나무 탁자)."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"빈칸에 알맞은 말을 고르세요.\nI have ___ books in my bag.","o":["many","much","a little","little","a much"],"a":0,"e":"books는 셀 수 있는 복수명사이므로 many를 써요."},{"q":"빈칸에 알맞은 말을 고르세요.\nThere is ___ water in the bottle.","o":["many","a few","few","much","many a"],"a":3,"e":"water는 셀 수 없는 명사이므로 much를 써요."},{"q":"빈칸에 알맞은 말을 고르세요.\nI have ___ friends here, so I'm not lonely.","o":["a little","a few","much","little","a much"],"a":1,"e":"friends는 셀 수 있는 명사이고 ‘몇 명 있다’는 긍정의 뜻이므로 a few를 써요."},{"q":"빈칸에 알맞은 말을 고르세요.\nI have ___ money, so I can buy a snack.","o":["a few","few","a little","many","a many"],"a":2,"e":"money는 셀 수 없는 명사이고 ‘조금 있다’는 긍정의 뜻이므로 a little을 써요."},{"q":"빈칸에 알맞은 말을 고르세요.\nShe has ___ homework today.","o":["much","a few","a much","an many","a lot of"],"a":4,"e":"homework는 셀 수 없는 명사이고, 긍정문에서는 much보다 a lot of가 자연스러워요. a lot of는 셀 수 있는 명사와 셀 수 없는 명사 앞에 모두 쓸 수 있어요."},{"q":"빈칸에 알맞은 말을 고르세요.\nHe has ___ friends, so he feels lonely.","o":["a few","a little","much","few","little"],"a":3,"e":"a 없이 few를 쓰면 ‘거의 없는’이라는 부정의 뜻이 돼요."},{"q":"빈칸에 알맞은 말을 고르세요.\nThere is ___ time left. Hurry up!","o":["a little","few","little","a few","many"],"a":2,"e":"time은 셀 수 없는 명사이고 ‘거의 없는’ 뜻이므로 little을 써요."},{"q":"어순이 바른 것을 고르세요.\n그녀는 예쁜 빨간 드레스를 샀다.","o":["a red beautiful dress","a beautiful red dress","red a beautiful dress","beautiful a red dress","dress beautiful red"],"a":1,"e":"형용사는 ‘의견(beautiful) → 색깔(red)’ 순서로 명사 앞에 써요."},{"q":"밑줄 친 부분을 바르게 고친 것을 고르세요.\nThere are [[much]] people at the party.","o":["many","a little","little","a much","few"],"a":0,"e":"people은 셀 수 있는 복수명사이므로 much가 아니라 many를 써야 해요."},{"q":"빈칸에 알맞은 말을 고르세요.\nHe has a ___ table in his room.","o":["wooden round small","round wooden small","small wooden round","wooden small round","small round wooden"],"a":4,"e":"형용사는 ‘크기(small) → 모양(round) → 재료(wooden)’ 순서로 나열해요."}],"arrange":[{"ko":"나는 많은 책을 가지고 있다.","a":"I have many books."},{"ko":"그 병에는 물이 많이 있다.","a":"There is much water in the bottle."},{"ko":"나는 여기에 친구가 몇 명 있다.","a":"I have a few friends here."},{"ko":"나는 돈이 조금 있다.","a":"I have a little money."},{"ko":"그녀는 친구가 많다.","a":"She has a lot of friends."},{"ko":"그는 친구가 거의 없다.","a":"He has few friends."},{"ko":"시간이 거의 없다.","a":"There is little time."},{"ko":"그녀는 예쁜 빨간 드레스를 샀다.","a":"She bought a beautiful red dress."},{"ko":"공원에 사람이 많다.","a":"There are many people in the park."},{"ko":"나는 우유를 조금 마셨다.","a":"I drank a little milk."},{"ko":"그는 작고 둥근 나무 탁자를 가지고 있다.","a":"He has a small round wooden table."},{"ko":"나는 숙제가 많다.","a":"I have a lot of homework."},{"ko":"우리는 시간이 많지 않다.","a":"We don't have much time."},{"ko":"몇몇 학생들이 늦었다.","a":"A few students were late."},{"ko":"나는 실수를 거의 하지 않았다.","a":"I made few mistakes."}],"compose":[{"k":"나는 많은 책을 가지고 있다.","a":"I have many books.","h":"many / 셀 수 있는 명사","alt":["I have a lot of books.","I have lots of books."]},{"k":"그 병에는 물이 많이 있다.","a":"There is much water in the bottle.","h":"much / 셀 수 없는 명사","alt":["There is a lot of water in the bottle."]},{"k":"나는 여기에 친구가 몇 명 있다.","a":"I have a few friends here.","h":"a few / 셀 수 있는 명사","alt":[]},{"k":"나는 돈이 조금 있다.","a":"I have a little money.","h":"a little / 셀 수 없는 명사","alt":[]},{"k":"그녀는 친구가 많다.","a":"She has many friends.","h":"many / a lot of","alt":["She has a lot of friends.","She has lots of friends."]},{"k":"그는 친구가 거의 없다.","a":"He has few friends.","h":"few / 거의 없는","alt":[]},{"k":"시간이 거의 없다.","a":"There is little time.","h":"little / 거의 없는","alt":[]},{"k":"그녀는 예쁜 빨간 드레스를 샀다.","a":"She bought a beautiful red dress.","h":"의견-색깔 어순","alt":[]},{"k":"공원에 사람이 많다.","a":"There are many people in the park.","h":"many / people","alt":["There are a lot of people in the park."]},{"k":"그는 물을 많이 마신다.","a":"He drinks a lot of water.","h":"a lot of / 셀 수 없는 명사","alt":["He drinks lots of water."]},{"k":"그는 작고 둥근 나무 탁자를 가지고 있다.","a":"He has a small round wooden table.","h":"크기-모양-재료 어순","alt":[]},{"k":"나는 숙제가 많다.","a":"I have a lot of homework.","h":"a lot of / homework는 셀 수 없음","alt":["I have much homework."]},{"k":"우리는 시간이 많지 않다.","a":"We don't have much time.","h":"much / 부정문","alt":["We don't have a lot of time."]},{"k":"몇몇 학생들이 늦었다.","a":"A few students were late.","h":"a few / 복수동사","alt":[]},{"k":"나는 실수를 거의 하지 않았다.","a":"I made few mistakes.","h":"few / 거의 없는","alt":[]}],"task":{"prompt":"여러분이 가지고 있는 물건이나 여러분의 상황을 <b>수량형용사(many, much, a lot of, a few, a little, few, little 등)</b>를 사용하여 3문장으로 써 보세요. 셀 수 있는 명사와 셀 수 없는 명사를 모두 넣어 보세요.","sample":"I have many books in my room. I also have a few good friends at school. But I have a little free time on weekends.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"셀 수 있는 명사 수량형용사(many/a few/few) 사용","regex":"(many|a few|few)"},{"label":"셀 수 없는 명사 수량형용사(much/a little/little/a lot of) 사용","regex":"(much|a little|little|a lot of)"}]},"images":""},{"id":"L2C9U2","title":"부사","explainParts":[{"t":"부사는 동사, 형용사, 다른 부사를 꾸며 주는 말이에요. 보통 형용사에 -ly를 붙여 만들어요. (quick → quickly, slow → slowly)"},{"k":"빈도부사","n":"always(항상), usually(보통), often(자주), sometimes(가끔), never(결코 ~않다)처럼 '얼마나 자주'인지를 나타내요. be동사와 조동사 뒤, 일반동사 앞에 와요. (She is always kind. / I always get up early.)"},{"t":"hard(열심히), fast(빠르게), early(일찍)처럼 형용사와 형태가 똑같은 부사도 있어요. He works hard. 이때 hardly(거의 ~않다)와 헷갈리지 마세요."},{"k":"too와 either","n":"둘 다 '~도 역시'라는 뜻이에요. 긍정문에는 too를, 부정문에는 either를 문장 끝에 써요. (I like it, too. / Me too. / Me either.)"},{"k":"enough의 위치","n":"부사나 형용사를 꾸밀 때는 그 '뒤'에 와요. (fast enough, old enough) 하지만 명사를 꾸밀 때는 명사 '앞'에 와요. (enough time)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"형용사 'quick'의 부사형으로 알맞은 것은?","o":["quickly","quick","quicker","quickest","quickness"],"a":0,"e":"형용사 quick에 -ly를 붙여 부사 quickly를 만들어요."},{"q":"He works ___. (그는 열심히 일한다.) 빈칸에 알맞은 것은?","o":["hardly","hard","harder","hardness","hards"],"a":1,"e":"hard는 형태 그대로 '열심히'라는 부사이고, hardly는 '거의 ~않다'라는 뜻이에요."},{"q":"빈도부사가 바른 위치에 있는 문장은?","o":["I always am happy.","Always I am happy.","I am always happy.","I am happy always.","Am always I happy."],"a":2,"e":"빈도부사 always는 be동사 am 뒤에 와요."},{"q":"빈도부사가 바른 위치에 있는 문장은?","o":["He goes often to school.","Often goes he to school.","He goes to school often often.","He often goes to school.","He goes to often school."],"a":3,"e":"빈도부사 often은 일반동사 goes 앞에 와요."},{"q":"I like pizza. Me ___. 빈칸에 알맞은 것은?","o":["either","neither","too","so","also"],"a":2,"e":"긍정문에서 '나도 역시'는 too를 써요."},{"q":"I don't like coffee. Me ___. 빈칸에 알맞은 것은?","o":["either","too","also","neither","so"],"a":0,"e":"부정문에서 '나도 역시 안 그래'는 either를 써요."},{"q":"He is ___ to drive. (그는 운전할 만큼 나이가 충분히 많다.) 빈칸에 알맞은 것은?","o":["enough old","old too","too old enough","enough old enough","old enough"],"a":4,"e":"enough는 형용사 뒤에 오므로 old enough 형태로 써요."},{"q":"We have ___. (우리는 충분한 시간이 있다.) 빈칸에 알맞은 것은?","o":["time enough","much enough time","enough time","enough of time","time of enough"],"a":2,"e":"명사를 꾸밀 때 enough는 명사 앞에 와서 enough time이 돼요."},{"q":"She sings [[beautiful]] on the stage. 밑줄 친 부분을 바르게 고친 것은?","o":["beautifully","beautiful","beauty","more beautiful","beautifuly"],"a":0,"e":"동사 sings를 꾸미므로 형용사가 아닌 부사 beautifully가 알맞아요."},{"q":"다음 중 어법상 옳은 문장은?","o":["I never have seen a lion. Me either.","I have seen never a lion. Me too.","I never seen have a lion. Me too.","I have never seen a lion. Me either.","I have seen a lion never. Me too."],"a":3,"e":"never는 have와 과거분사 사이에 오고, 부정의 의미라 '나도'는 either를 써요."}],"arrange":[{"ko":"그는 열심히 일한다.","a":"He works hard."},{"ko":"그녀는 항상 친절하다.","a":"She is always kind."},{"ko":"나는 보통 아침을 먹는다.","a":"I usually eat breakfast."},{"ko":"그는 자주 축구를 한다.","a":"He often plays soccer."},{"ko":"나는 결코 거짓말을 하지 않는다.","a":"I never tell a lie."},{"ko":"나도 그래.","a":"Me too."},{"ko":"나도 안 그래.","a":"Me either."},{"ko":"그는 운전할 만큼 나이가 충분히 많다.","a":"He is old enough to drive."},{"ko":"그는 충분히 빠르게 달린다.","a":"He runs fast enough."},{"ko":"우리는 충분한 시간이 있다.","a":"We have enough time."},{"ko":"그녀는 아름답게 노래한다.","a":"She sings beautifully."},{"ko":"그들은 가끔 영화를 본다.","a":"They sometimes watch movies."},{"ko":"나는 커피를 좋아하지 않는다.","a":"I don't like coffee."},{"ko":"그 상자는 옮길 만큼 충분히 가볍다.","a":"The box is light enough to carry."},{"ko":"너는 빠르게 말한다.","a":"You speak fast."}],"compose":[{"k":"그는 열심히 공부한다.","a":"He studies hard.","h":"study / hard","alt":[]},{"k":"그녀는 항상 바쁘다.","a":"She is always busy.","h":"빈도부사 / be동사 뒤","alt":[]},{"k":"나는 자주 도서관에 간다.","a":"I often go to the library.","h":"often / 동사 앞","alt":[]},{"k":"그는 결코 늦지 않는다.","a":"He is never late.","h":"never / be동사 뒤","alt":[]},{"k":"나도 그래.","a":"Me too.","h":"긍정 / too","alt":[]},{"k":"나도 안 그래.","a":"Me either.","h":"부정 / either","alt":["Me neither."]},{"k":"그는 그것을 살 만큼 돈이 충분하다.","a":"He has enough money to buy it.","h":"enough / 명사 앞","alt":[]},{"k":"너는 충분히 빠르게 달린다.","a":"You run fast enough.","h":"fast / enough 뒤","alt":[]},{"k":"그녀는 조심스럽게 운전한다.","a":"She drives carefully.","h":"careful + ly","alt":[]},{"k":"우리는 가끔 함께 저녁을 먹는다.","a":"We sometimes have dinner together.","h":"sometimes / 동사 앞","alt":["We sometimes eat dinner together."]},{"k":"그는 나이가 충분히 많다.","a":"He is old enough.","h":"old / enough 뒤","alt":[]},{"k":"나는 보통 걸어서 학교에 간다.","a":"I usually walk to school.","h":"usually / 동사 앞","alt":[]},{"k":"그녀는 빠르게 말하지 않는다.","a":"She doesn't speak fast.","h":"fast / 부사","alt":[]},{"k":"그들은 충분한 물을 가지고 있다.","a":"They have enough water.","h":"enough / 명사 앞","alt":[]},{"k":"그는 아름답게 그림을 그린다.","a":"He draws beautifully.","h":"beautiful + ly","alt":[]}],"task":{"prompt":"여러분의 하루 일과를 부사를 사용해 영어로 3문장 이상 써 보세요. <b>빈도부사(always, usually, often, sometimes, never)</b>를 최소 한 번, <b>enough</b>를 최소 한 번 사용해야 해요.","sample":"I usually get up early in the morning. I always study hard after school. I don't sleep enough these days.","conds":[{"label":"3문장 이상 썼어요.","minSentences":3},{"label":"빈도부사(always/usually/often/sometimes/never)를 사용했어요.","regex":"(always|usually|often|sometimes|never)"},{"label":"enough를 사용했어요.","regex":"enough"}]},"images":""},{"id":"L2C10U1","title":"원급, 비교급, 최상급","explainParts":[{"t":"형용사나 부사는 두 대상 이상을 비교할 때 형태가 달라져요."},{"k":"원급 as ~ as","n":"두 대상의 정도가 서로 같을 때 'as + 원급(형용사/부사의 기본형) + as'를 써요. '~만큼 …한'의 뜻이에요. 예: She is as tall as me. (그녀는 나만큼 키가 크다.)"},{"t":"한쪽이 다른 쪽보다 '더 ~하다'라고 말할 때는 비교급을 써요."},{"k":"비교급 -er/more ~ than","n":"짧은 단어는 -er를 붙이고, 긴 단어는 앞에 more를 붙여요. 그리고 비교 대상 앞에 than을 써요. 예: taller than, more famous than."},{"t":"셋 이상 중에서 '가장 ~한' 것은 최상급으로 나타내요."},{"k":"최상급 the -est/the most","n":"짧은 단어는 'the + -est', 긴 단어는 'the most + 원급'을 써요. 예: the tallest, the most famous. 뒤에 in/of로 범위를 나타내요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"My bag is as ___ as yours.","o":["heavy","heavier","heaviest","more heavy","the heaviest"],"a":0,"e":"as ~ as 사이에는 형용사의 원급을 쓰므로 heavy가 맞아요."},{"q":"This river is ___ than that lake.","o":["deep","deeper","as deep","deepest","most deep"],"a":1,"e":"than이 있으므로 비교급 deeper를 써야 해요."},{"q":"Mt. Everest is ___ mountain in the world.","o":["high","higher","the highest","as high","more high"],"a":2,"e":"'세계에서 가장 높은'은 최상급 the highest로 나타내요."},{"q":"Math is ___ than English to me.","o":["difficult","the most difficult","as difficult","more difficult","difficulter"],"a":3,"e":"긴 형용사 difficult의 비교급은 more difficult예요."},{"q":"She is the ___ student in our school.","o":["smart","smarter","more smart","most smart","smartest"],"a":4,"e":"the 뒤에 오는 짧은 형용사의 최상급은 smartest예요."},{"q":"Today is as ___ as yesterday.","o":["cold","colder","coldest","more cold","the coldest"],"a":0,"e":"as ~ as 사이에는 원급 cold를 써요."},{"q":"Health is ___ than money.","o":["good","gooder","better","best","the best"],"a":2,"e":"good의 비교급은 불규칙 변화형인 better예요."},{"q":"He runs [[fast]] than me.","o":["fast","faster","fastest","more fast","the fastest"],"a":1,"e":"than이 있으므로 밑줄 부분은 비교급 faster가 되어야 해요."},{"q":"This is one of ___ cities in Korea.","o":["busy","busier","busiest","more busy","the busiest"],"a":4,"e":"'one of the + 최상급'이므로 the busiest를 써요."},{"q":"Her idea is ___ than mine.","o":["creative","creativer","most creative","more creative","the most creative"],"a":3,"e":"긴 형용사 creative의 비교급은 more creative예요."}],"arrange":[{"ko":"그는 나만큼 키가 크다.","a":"He is as tall as me."},{"ko":"그녀는 나보다 키가 더 크다.","a":"She is taller than me."},{"ko":"그는 우리 반에서 가장 키가 크다.","a":"He is the tallest in our class."},{"ko":"이 상자는 저것만큼 무겁다.","a":"This box is as heavy as that one."},{"ko":"오늘은 어제보다 더 춥다.","a":"Today is colder than yesterday."},{"ko":"이것은 가게에서 가장 싼 가방이다.","a":"This is the cheapest bag in the store."},{"ko":"수학은 영어보다 더 어렵다.","a":"Math is more difficult than English."},{"ko":"그녀는 반에서 가장 유명한 학생이다.","a":"She is the most famous student in the class."},{"ko":"건강은 돈보다 더 중요하다.","a":"Health is more important than money."},{"ko":"이 강은 저 강만큼 길다.","a":"This river is as long as that one."},{"ko":"나의 형은 나보다 나이가 더 많다.","a":"My brother is older than me."},{"ko":"그것은 세계에서 가장 높은 건물이다.","a":"It is the tallest building in the world."},{"ko":"이 책은 저 책만큼 재미있다.","a":"This book is as interesting as that one."},{"ko":"여름은 겨울보다 더 덥다.","a":"Summer is hotter than winter."},{"ko":"그는 우리 팀에서 가장 빠른 주자이다.","a":"He is the fastest runner on our team."}],"compose":[{"k":"그는 나만큼 힘이 세다.","a":"He is as strong as me.","h":"as ~ as / 원급","alt":["He is as strong as I am."]},{"k":"그녀는 그보다 더 어리다.","a":"She is younger than him.","h":"비교급 -er / than","alt":["She is younger than he is."]},{"k":"에베레스트 산은 세계에서 가장 높다.","a":"Mt. Everest is the highest in the world.","h":"the -est / 최상급","alt":["Mount Everest is the highest in the world."]},{"k":"이 영화는 저것보다 더 흥미롭다.","a":"This movie is more interesting than that one.","h":"more + 긴 형용사 / than","alt":["This movie is more interesting than that."]},{"k":"그는 우리 반에서 가장 인기 있는 소년이다.","a":"He is the most popular boy in our class.","h":"the most / 최상급","alt":[]},{"k":"내 가방은 네 것만큼 크다.","a":"My bag is as big as yours.","h":"as ~ as / 원급","alt":["My bag is as big as your bag."]},{"k":"겨울은 가을보다 더 춥다.","a":"Winter is colder than fall.","h":"-er / than","alt":["Winter is colder than autumn."]},{"k":"이것은 도시에서 가장 오래된 건물이다.","a":"This is the oldest building in the city.","h":"the -est / 최상급","alt":[]},{"k":"수학은 과학만큼 어렵다.","a":"Math is as difficult as science.","h":"as ~ as / 원급","alt":[]},{"k":"그녀는 나보다 더 빨리 달린다.","a":"She runs faster than me.","h":"부사 비교급 -er / than","alt":["She runs faster than I do."]},{"k":"건강은 가장 중요한 것이다.","a":"Health is the most important thing.","h":"the most / 최상급","alt":["Health is the most important thing of all."]},{"k":"이 강은 저 강만큼 깊다.","a":"This river is as deep as that one.","h":"as ~ as / 원급","alt":["This river is as deep as that river."]},{"k":"그는 그의 형보다 키가 더 크다.","a":"He is taller than his brother.","h":"-er / than","alt":[]},{"k":"그것은 가게에서 가장 비싼 시계이다.","a":"It is the most expensive watch in the store.","h":"the most / 최상급","alt":[]},{"k":"오늘은 어제만큼 덥다.","a":"Today is as hot as yesterday.","h":"as ~ as / 원급","alt":[]}],"task":{"prompt":"원급(<b>as ~ as</b>), 비교급(<b>-er/more ~ than</b>), 최상급(<b>the -est/the most</b>)을 각각 사용해서 자신과 가족 또는 친구를 비교하는 글을 써 보세요.","sample":"My sister is as kind as my mom. She is taller than me. She is the smartest person in my family.","conds":[{"label":"3문장 이상 쓰세요.","minSentences":3},{"label":"'as ~ as' 원급 표현을 사용하세요.","regex":"as\\s+\\w+\\s+as"},{"label":"비교급(-er/more ~ than) 또는 최상급(the -est/the most) 표현을 사용하세요.","regex":"(\\w+er than|more \\w+ than|the \\w+est|the most \\w+)"}]},"images":""},{"id":"L2C10U2","title":"원급, 비교급, 최상급을 이용한 표현","explainParts":[{"t":"원급·비교급·최상급을 활용한 여러 가지 유용한 표현을 배워요."},{"k":"as ~ as possible","n":"「as+원급+as possible」은 '가능한 한 ~하게'라는 뜻으로, 「as ~ as+주어+can」으로 바꿔 쓸 수 있어요. 예) as soon as possible = as soon as you can (가능한 한 빨리)"},{"k":"비교급 and 비교급","n":"「비교급 and 비교급」은 '점점 더 ~한/하게'라는 뜻이에요. 예) hotter and hotter(점점 더 더운). 긴 형용사는 more and more를 써요. 예) more and more interesting"},{"k":"the 비교급, the 비교급","n":"「the+비교급 ~, the+비교급 …」은 '~하면 할수록 더 …하다'라는 뜻이에요. 두 절 모두 앞에 the를 붙여요. 예) The more you sleep, the healthier you become."},{"k":"one of the 최상급","n":"「one of the+최상급+복수명사」는 '가장 ~한 것들 중 하나'라는 뜻이에요. 뒤에는 반드시 복수명사가 와야 해요. 예) one of the best players(최고의 선수들 중 한 명)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"as soon as possible의 우리말 뜻으로 알맞은 것은?","o":["가능한 한 빨리","가능한 한 천천히","빠르면 빠를수록","점점 더 빨리","가장 빠른 것 중 하나"],"a":0,"e":"「as ~ as possible」은 '가능한 한 ~하게'이므로 as soon as possible은 '가능한 한 빨리'예요."},{"q":"빈칸에 알맞은 것은? Run as ___ as possible. (가능한 한 빨리 뛰어라.)","o":["faster","fastest","fast","more fast","most fast"],"a":2,"e":"「as ~ as possible」 사이에는 원급이 오므로 fast가 알맞아요."},{"q":"빈칸에 알맞은 것은? It is getting ___ and colder. (점점 더 추워지고 있다.)","o":["cold","colder","coldest","more cold","as cold"],"a":1,"e":"「비교급 and 비교급」은 '점점 더 ~한'이므로 colder and colder가 되어야 해요."},{"q":"빈칸에 알맞은 것은? The weather is getting hotter and ___. (날씨가 점점 더 더워지고 있다.)","o":["hot","hottest","hotly","hotter","more hot"],"a":3,"e":"「비교급 and 비교급」 형태이므로 hotter and hotter가 알맞아요."},{"q":"빈칸에 알맞은 것은? ___ you sleep, the healthier you become. (많이 잘수록 더 건강해진다.)","o":["More","As more","The more","Most","The most"],"a":2,"e":"「the+비교급 ~, the+비교급 …」 구문이므로 The more가 알맞아요."},{"q":"빈칸에 알맞은 것은? The higher we climbed, ___ colder it became.","o":["the","a","as","more","most"],"a":0,"e":"「the 비교급, the 비교급」 구문은 두 번째 절 앞에도 the가 필요하므로 the colder가 돼요."},{"q":"빈칸에 알맞은 것은? Soccer is one of the most popular ___ in the world.","o":["sport","sports","sporting","a sport","sporty"],"a":1,"e":"「one of the 최상급」 뒤에는 복수명사가 오므로 sports가 알맞아요."},{"q":"빈칸에 알맞은 것은? She is one of the ___ students in her class. (가장 똑똑한 학생 중 한 명)","o":["smart","smarter","more smart","as smart","smartest"],"a":4,"e":"「one of the」 뒤에는 최상급이 오므로 smartest가 알맞아요."},{"q":"빈칸에 알맞은 것은? Please finish it as ___ as you can. (가능한 한 빨리)","o":["quick","quickly","quicker","quickest","more quickly"],"a":1,"e":"동사 finish를 수식하는 부사가 필요하고 「as ~ as」 사이엔 원급이 오므로 quickly가 알맞아요."},{"q":"다음 중 밑줄 친 부분이 어법상 어색한 것은?","o":["This is one of the [[tallest buildings]] in the city.","The more you practice, [[the better]] you become.","It is getting [[darker and darker]].","He is one of the best [[player]] on the team.","Come here as [[fast]] as possible."],"a":3,"e":"「one of the 최상급」 뒤에는 복수명사가 와야 하므로 player를 players로 고쳐야 해요."}],"arrange":[{"ko":"가능한 한 빨리 와라.","a":"Come as soon as possible."},{"ko":"나는 가능한 한 빨리 달렸다.","a":"I ran as fast as possible."},{"ko":"그것을 가능한 한 조용히 해라.","a":"Do it as quietly as possible."},{"ko":"날씨가 점점 더 더워지고 있다.","a":"The weather is getting hotter and hotter."},{"ko":"그 상자는 점점 더 무거워졌다.","a":"The box got heavier and heavier."},{"ko":"그는 점점 더 빨리 달렸다.","a":"He ran faster and faster."},{"ko":"많이 자면 잘수록 너는 더 건강해진다.","a":"The more you sleep, the healthier you become."},{"ko":"네가 열심히 공부할수록 너는 더 많이 배운다.","a":"The harder you study, the more you learn."},{"ko":"높이 올라갈수록 날씨가 더 추워졌다.","a":"The higher we climbed, the colder it got."},{"ko":"축구는 가장 인기 있는 스포츠 중 하나이다.","a":"Soccer is one of the most popular sports."},{"ko":"그녀는 반에서 가장 똑똑한 학생 중 한 명이다.","a":"She is one of the smartest students in her class."},{"ko":"이것은 세계에서 가장 높은 건물 중 하나이다.","a":"This is one of the tallest buildings in the world."},{"ko":"가능한 한 많은 책을 읽어라.","a":"Read as many books as possible."},{"ko":"그 영화는 점점 더 흥미로워졌다.","a":"The movie got more and more interesting."},{"ko":"그는 우리 팀 최고의 선수 중 한 명이다.","a":"He is one of the best players on our team."}],"compose":[{"k":"가능한 한 빨리 와라.","a":"Come as soon as possible.","h":"as ~ as possible / 명령문","alt":["Come as soon as you can."]},{"k":"나는 가능한 한 열심히 공부했다.","a":"I studied as hard as possible.","h":"as+원급+as possible","alt":["I studied as hard as I could."]},{"k":"그것을 가능한 한 천천히 말해라.","a":"Say it as slowly as possible.","h":"as ~ as possible / 명령문","alt":["Say it as slowly as you can."]},{"k":"날씨가 점점 더 추워지고 있다.","a":"The weather is getting colder and colder.","h":"비교급 and 비교급","alt":["It is getting colder and colder."]},{"k":"그 소리가 점점 더 커졌다.","a":"The sound got louder and louder.","h":"비교급 and 비교급","alt":["The sound became louder and louder."]},{"k":"그 이야기는 점점 더 흥미로워졌다.","a":"The story got more and more interesting.","h":"긴 형용사 / more and more","alt":["The story became more and more interesting."]},{"k":"네가 더 많이 연습할수록 너는 더 잘하게 된다.","a":"The more you practice, the better you become.","h":"the 비교급, the 비교급","alt":["The more you practice, the better you get."]},{"k":"날이 더울수록 나는 더 피곤해진다.","a":"The hotter it is, the more tired I get.","h":"the 비교급, the 비교급","alt":["The hotter it is, the more tired I become."]},{"k":"네가 더 일찍 시작할수록 너는 더 일찍 끝낸다.","a":"The earlier you start, the earlier you finish.","h":"the 비교급, the 비교급","alt":[]},{"k":"그것은 가장 재미있는 게임 중 하나이다.","a":"It is one of the most exciting games.","h":"one of the 최상급 + 복수명사","alt":["It's one of the most exciting games."]},{"k":"그는 세계 최고의 가수 중 한 명이다.","a":"He is one of the best singers in the world.","h":"one of the 최상급 / 복수명사","alt":["He's one of the best singers in the world."]},{"k":"서울은 한국에서 가장 큰 도시 중 하나이다.","a":"Seoul is one of the largest cities in Korea.","h":"one of the 최상급 + 복수명사","alt":[]},{"k":"가능한 한 많은 물을 마셔라.","a":"Drink as much water as possible.","h":"as much + 불가산명사 + as possible","alt":["Drink as much water as you can."]},{"k":"그 산은 점점 더 높아 보였다.","a":"The mountain looked higher and higher.","h":"비교급 and 비교급","alt":[]},{"k":"이것은 내가 읽은 가장 좋은 책 중 하나이다.","a":"This is one of the best books I have read.","h":"one of the 최상급 + 복수명사","alt":["This is one of the best books I've read.","This is one of the best books I have ever read."]}],"task":{"prompt":"여러분이 좋아하는 운동이나 취미에 대해 <b>원급·비교급·최상급 표현</b>을 사용하여 3문장 이상 영어로 써 보세요. <b>as ~ as possible</b>, <b>「비교급 and 비교급」</b>, <b>「one of the 최상급」</b> 표현을 활용하세요.","sample":"Soccer is one of the most popular sports in the world. When I play, I run as fast as possible. The games are getting more and more exciting.","conds":[{"label":"3문장 이상 썼나요?","minSentences":3},{"label":"「one of the 최상급 + 복수명사」 표현을 사용했나요?","regex":"[Oo]ne of the \\w+"},{"label":"「as ~ as possible」 또는 「비교급 and 비교급」 표현을 사용했나요?","regex":"as \\w+ as (possible|you can|I can)|\\w+er and \\w+er|more and more"}]},"images":""},{"id":"L2C11U1","title":"and, or, but의 주의할 쓰임","explainParts":[{"t":"등위접속사 and, or, but은 짝을 이루어 쓰는 상관접속사로도 자주 쓰여요."},{"k":"both A and B","n":"'A와 B 둘 다'라는 뜻이에요. A와 B를 둘 다 가리키므로 항상 복수 취급하여 복수 동사를 써요. 예) Both Tom and I are students."},{"t":"'A나 B 둘 중 하나'는 either A or B로, 'A도 B도 아닌'은 neither A nor B로 나타내요."},{"k":"either A or B / neither A nor B","n":"동사는 항상 가까이 있는 B에 수를 맞춰요. 예) Either you or he is right. / Neither she nor they are late."},{"t":"'A뿐만 아니라 B도'는 not only A but also B로 써요."},{"k":"not only A but also B","n":"이때도 동사는 가까운 B에 일치시켜요. 예) Not only you but also he likes music. (동사는 he에 맞춤)"}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"____ Tom and I are in the same class.","o":["Both","Either","Neither","Not only","As"],"a":0,"e":"'A와 B 둘 다'는 both A and B로 쓴다."},{"q":"Would you like either tea ____ coffee?","o":["and","nor","or","but","so"],"a":2,"e":"either A or B는 'A나 B 둘 중 하나'를 뜻하며 or를 쓴다."},{"q":"Neither Mina ____ Sujin came to the party.","o":["or","nor","and","but","also"],"a":1,"e":"neither A nor B는 'A도 B도 아닌'을 뜻하며 nor를 쓴다."},{"q":"Not only you but ____ your brother is invited.","o":["too","either","neither","also","both"],"a":3,"e":"not only A but also B는 'A뿐만 아니라 B도'를 뜻한다."},{"q":"Both my parents ____ teachers.","o":["is","are","was","has","am"],"a":1,"e":"both A and B는 항상 복수 취급하므로 복수 동사 are를 쓴다."},{"q":"Either the students or the teacher ____ wrong.","o":["are","were","is","have","do"],"a":2,"e":"either A or B의 동사는 가까운 B(the teacher)에 일치시켜 is를 쓴다."},{"q":"Neither he nor his friends ____ at home.","o":["is","was","has","are","am"],"a":3,"e":"neither A nor B의 동사는 가까운 B(his friends)에 맞춰 are를 쓴다."},{"q":"Not only the players but also the coach ____ happy.","o":["are","were","have","do","is"],"a":4,"e":"not only A but also B의 동사는 가까운 B(the coach)에 일치시켜 is를 쓴다."},{"q":"밑줄 친 부분을 바르게 고친 것은? Both Tom [[or]] Jerry are my friends.","o":["nor","but","and","also","either"],"a":2,"e":"both는 and와 짝을 이루므로 both A and B가 되어야 한다."},{"q":"다음 중 어법상 옳은 문장을 고르시오.","o":["Both she and he is happy.","Either you or I are wrong.","Not only he but also they is kind.","Neither my sister nor I am a student.","Either tea nor coffee is fine."],"a":3,"e":"neither A nor B는 가까운 I에 동사를 맞추므로 am이 옳다."}],"arrange":[{"ko":"Tom과 나는 둘 다 학생이다.","a":"Both Tom and I are students."},{"ko":"너는 차나 커피 둘 중 하나를 마실 수 있다.","a":"You can drink either tea or coffee."},{"ko":"Mina도 Sujin도 늦지 않았다.","a":"Neither Mina nor Sujin was late."},{"ko":"그뿐만 아니라 나도 바쁘다.","a":"Not only he but also I am busy."},{"ko":"내 부모님은 두 분 다 의사이시다.","a":"Both my parents are doctors."},{"ko":"너나 그 중 한 명이 틀렸다.","a":"Either you or he is wrong."},{"ko":"그녀도 그들도 집에 없다.","a":"Neither she nor they are at home."},{"ko":"그 선수들뿐만 아니라 코치도 행복하다.","a":"Not only the players but also the coach is happy."},{"ko":"개와 고양이 둘 다 귀엽다.","a":"Both dogs and cats are cute."},{"ko":"우리는 버스나 지하철 중 하나를 탈 수 있다.","a":"We can take either the bus or the subway."},{"ko":"그는 영어뿐만 아니라 중국어도 말한다.","a":"He speaks not only English but also Chinese."},{"ko":"너도 나도 옳지 않다.","a":"Neither you nor I am right."},{"ko":"그 학생들이나 선생님이 틀렸다.","a":"Either the students or the teacher is wrong."},{"ko":"그녀는 노래할 뿐만 아니라 춤도 출 수 있다.","a":"She can not only sing but also dance."},{"ko":"Tom과 그의 친구들 둘 다 축구를 좋아한다.","a":"Both Tom and his friends like soccer."}],"compose":[{"k":"차나 커피 둘 중 하나를 원하니?","a":"Do you want either tea or coffee?","h":"either A or B","alt":["Would you like either tea or coffee?"]},{"k":"Tom과 나는 둘 다 준비되었다.","a":"Both Tom and I are ready.","h":"both A and B / 복수 동사 are","alt":[]},{"k":"그도 그녀도 오지 않았다.","a":"Neither he nor she came.","h":"neither A nor B","alt":["Neither he nor she came here."]},{"k":"너뿐만 아니라 그도 옳다.","a":"Not only you but also he is right.","h":"not only A but also B / 동사는 he에 맞춤 / is","alt":[]},{"k":"내 부모님은 두 분 다 바쁘시다.","a":"Both my parents are busy.","h":"both / 복수 동사 are","alt":[]},{"k":"너나 그 중 한 명이 정답을 안다.","a":"Either you or he knows the answer.","h":"either A or B / 동사는 he에 맞춤 / knows","alt":[]},{"k":"그녀도 그들도 늦지 않았다.","a":"Neither she nor they were late.","h":"neither A nor B / 동사는 they에 맞춤 / were","alt":[]},{"k":"그는 축구뿐만 아니라 야구도 한다.","a":"He plays not only soccer but also baseball.","h":"not only A but also B","alt":[]},{"k":"개와 고양이 둘 다 귀엽다.","a":"Both dogs and cats are cute.","h":"both / 복수 동사 are","alt":[]},{"k":"우리는 버스나 택시 중 하나를 탈 수 있다.","a":"We can take either the bus or the taxi.","h":"either A or B","alt":[]},{"k":"너도 나도 틀리지 않았다.","a":"Neither you nor I am wrong.","h":"neither A nor B / 동사는 I에 맞춤 / am","alt":[]},{"k":"그 학생들이나 선생님이 옳다.","a":"Either the students or the teacher is right.","h":"either A or B / 동사는 teacher에 맞춤 / is","alt":[]},{"k":"그녀는 영어뿐만 아니라 프랑스어도 말한다.","a":"She speaks not only English but also French.","h":"not only A but also B","alt":[]},{"k":"Tom과 그의 친구들 둘 다 게임을 좋아한다.","a":"Both Tom and his friends like games.","h":"both A and B / 복수 동사 like","alt":[]},{"k":"너나 그들 중 한 쪽이 청소해야 한다.","a":"Either you or they have to clean.","h":"either A or B / 동사는 they에 맞춤 / have","alt":[]}],"task":{"prompt":"다음 상관접속사를 사용하여 나와 내 친구에 대한 영어 문장 3개를 써 보세요. <b>both A and B</b>, <b>either A or B</b>, <b>not only A but also B</b> 중 두 종류 이상을 반드시 포함하세요.","sample":"Both my friend and I like music. Either pizza or chicken is fine for lunch. Not only I but also my friend is good at English.","conds":[{"label":"영어로 3문장 이상 쓰기","minSentences":3},{"label":"both A and B 구조 사용","regex":"(?i)both\\s+\\w+.*\\band\\b"},{"label":"either A or B 또는 not only A but also B 구조 사용","regex":"(?i)(either\\s+\\w+.*\\bor\\b|not only.*but also)"}]},"images":""},{"id":"L2C11U2","title":"부사절을 이끄는 접속사","explainParts":[{"t":"부사절은 문장 안에서 부사 역할을 하는 절로, 시간·이유·조건·양보 등의 의미를 더해 주며 접속사가 이끕니다."},{"k":"시간 접속사","n":"when(~할 때), while(~하는 동안), before(~하기 전에), after(~한 후에)가 시간을 나타내는 부사절을 이끕니다. 예: When I arrived, the class had started."},{"t":"이유를 나타낼 때는 because(~ 때문에)를 씁니다. 예: Because it rained, we stayed home."},{"k":"because와 although","n":"because는 '~때문에'라는 이유를, although는 '비록 ~일지라도'라는 양보를 나타냅니다. 예: Although he was tired, he kept working."},{"t":"조건은 if(만약 ~라면), 목적은 so that(~하기 위해서)으로 나타냅니다. 예: If you hurry, you can catch the bus."},{"k":"부사절의 위치와 콤마","n":"부사절이 문장 앞에 오면 뒤에 콤마(,)를 찍고, 문장 뒤에 오면 보통 콤마를 쓰지 않습니다. 예: When you go out, close the door. / Close the door when you go out."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"___ I arrived, everyone was already there. (내가 도착했을 때)","o":["When","Because","Although","If","So"],"a":0,"e":"'~할 때'라는 시간의 의미는 접속사 when으로 나타냅니다."},{"q":"He stayed home ___ it was raining. (비가 오고 있었기 때문에)","o":["although","because","before","while","if"],"a":1,"e":"'~때문에'라는 이유는 접속사 because로 나타냅니다."},{"q":"___ he was tired, he finished his homework. (비록 피곤했지만)","o":["Because","When","Although","If","After"],"a":2,"e":"'비록 ~지만'이라는 양보의 의미는 although로 나타냅니다."},{"q":"Wash your hands ___ you eat. (먹기 전에)","o":["after","because","although","before","so"],"a":3,"e":"'~하기 전에'는 접속사 before로 나타냅니다."},{"q":"___ you study hard, you will pass the exam. (열심히 공부하면)","o":["If","Although","Because","While","After"],"a":0,"e":"'만약 ~라면'이라는 조건은 접속사 if로 나타냅니다."},{"q":"She listened to music ___ she was doing her homework. (숙제를 하는 동안)","o":["before","while","because","although","if"],"a":1,"e":"'~하는 동안'이라는 시간의 의미는 while로 나타냅니다."},{"q":"I turned off the light ___ I could sleep. (잘 수 있도록)","o":["because","although","so that","before","while"],"a":2,"e":"'~하기 위해서, ~할 수 있도록'이라는 목적은 so that으로 나타냅니다."},{"q":"밑줄 친 부분과 바꿔 쓸 수 있는 것은? Even though he was sick, he went to school. → [[Even though]]","o":["Although","Because","When","If","So that"],"a":0,"e":"even though는 '비록 ~지만'의 뜻으로 although와 바꿔 쓸 수 있습니다."},{"q":"The baby cried ___ he was hungry. (배가 고팠기 때문에)","o":["although","when","if","because","so that"],"a":3,"e":"'~때문에'라는 이유는 because로 나타냅니다."},{"q":"다음 중 어법과 의미가 자연스러운 문장은?","o":["Because he was rich, but he was not happy.","When you will arrive, call me.","Although it rained, so we stayed home.","If you don't hurry, you missed the bus.","After I finished dinner, I washed the dishes."],"a":4,"e":"시간의 부사절(After ...) 뒤에 주절이 자연스럽게 연결된 올바른 문장입니다."}],"arrange":[{"ko":"내가 도착했을 때 비가 오고 있었다.","a":"It was raining when I arrived."},{"ko":"그는 피곤했지만 계속 공부했다.","a":"Although he was tired, he kept studying."},{"ko":"비가 왔기 때문에 우리는 집에 있었다.","a":"Because it rained, we stayed home."},{"ko":"네가 잠들기 전에 이를 닦아라.","a":"Brush your teeth before you go to sleep."},{"ko":"숙제를 끝낸 후에 나는 TV를 봤다.","a":"After I finished my homework, I watched TV."},{"ko":"내가 요리하는 동안 그녀는 방을 청소했다.","a":"While I was cooking, she cleaned the room."},{"ko":"만약 네가 서두르면 버스를 탈 수 있다.","a":"If you hurry, you can catch the bus."},{"ko":"그는 시험에 통과하기 위해 열심히 공부했다.","a":"He studied hard so that he could pass the exam."},{"ko":"날씨가 추웠기 때문에 나는 코트를 입었다.","a":"Because it was cold, I wore a coat."},{"ko":"비록 그것은 비쌌지만 그녀는 그것을 샀다.","a":"Although it was expensive, she bought it."},{"ko":"그가 전화했을 때 나는 자고 있었다.","a":"I was sleeping when he called."},{"ko":"우리는 영화가 시작하기 전에 도착했다.","a":"We arrived before the movie started."},{"ko":"만약 내일 비가 오면 우리는 집에 있을 것이다.","a":"If it rains tomorrow, we will stay home."},{"ko":"그녀는 버스를 놓쳤기 때문에 늦었다.","a":"She was late because she missed the bus."},{"ko":"네가 나갈 때 문을 닫아라.","a":"Close the door when you go out."}],"compose":[{"k":"내가 어렸을 때 나는 시골에서 살았다.","a":"When I was young, I lived in the countryside.","h":"when / ~할 때 / 콤마","alt":["I lived in the countryside when I was young."]},{"k":"비록 그는 어리지만 매우 현명하다.","a":"Although he is young, he is very wise.","h":"although / 비록 ~지만","alt":["He is very wise although he is young."]},{"k":"배가 고팠기 때문에 나는 샌드위치를 먹었다.","a":"Because I was hungry, I ate a sandwich.","h":"because / ~때문에","alt":["I ate a sandwich because I was hungry."]},{"k":"집을 나서기 전에 창문을 닫아라.","a":"Before you leave home, close the window.","h":"before / ~하기 전에","alt":["Close the window before you leave home."]},{"k":"저녁을 먹은 후에 우리는 산책했다.","a":"After we had dinner, we took a walk.","h":"after / ~한 후에","alt":["We took a walk after we had dinner."]},{"k":"내가 책을 읽는 동안 그는 게임을 했다.","a":"While I was reading a book, he played a game.","h":"while / ~하는 동안","alt":["He played a game while I was reading a book."]},{"k":"만약 네가 열심히 노력하면 성공할 것이다.","a":"If you try hard, you will succeed.","h":"if / 만약 ~라면","alt":["You will succeed if you try hard."]},{"k":"그녀는 기차를 잡기 위해 빨리 뛰었다.","a":"She ran fast so that she could catch the train.","h":"so that / ~하기 위해","alt":["She ran fast so that she would catch the train."]},{"k":"눈이 왔기 때문에 학교가 문을 닫았다.","a":"Because it snowed, the school closed.","h":"because / ~때문에","alt":["The school closed because it snowed."]},{"k":"비록 늦었지만 그들은 계속 걸었다.","a":"Although it was late, they kept walking.","h":"although / 비록 ~지만","alt":["They kept walking although it was late."]},{"k":"내가 집에 도착했을 때 엄마가 요리하고 계셨다.","a":"When I got home, my mom was cooking.","h":"when / ~할 때","alt":["My mom was cooking when I got home."]},{"k":"시험이 끝난 후에 우리는 파티를 했다.","a":"After the exam finished, we had a party.","h":"after / ~한 후에","alt":["We had a party after the exam finished."]},{"k":"만약 네가 아프면 병원에 가야 한다.","a":"If you are sick, you should go to the hospital.","h":"if / 만약 ~라면","alt":["You should go to the hospital if you are sick."]},{"k":"버스를 놓쳤기 때문에 그는 걸어서 갔다.","a":"Because he missed the bus, he walked.","h":"because / ~때문에","alt":["He walked because he missed the bus."]},{"k":"네가 준비되면 우리는 출발할 것이다.","a":"When you are ready, we will leave.","h":"when / ~할 때","alt":["We will leave when you are ready."]}],"task":{"prompt":"여러분의 어제 하루를 <b>부사절 접속사(when, because, although, if 등)</b>를 사용하여 3문장 이상으로 써 보세요.","sample":"When I woke up, it was already 8 o'clock. Because I was late, I ran to school. Although I was tired, I studied hard all day.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"부사절 접속사(when/because/although/if 등) 사용","regex":"\\b([Ww]hen|[Ww]hile|[Bb]efore|[Aa]fter|[Bb]ecause|[Aa]lthough|[Ii]f|[Ss]o that)\\b"},{"label":"부사절과 주절을 콤마(,)로 구분하기","regex":","}]},"images":""},{"id":"L2C11U3","title":"명사절을 이끄는 접속사","explainParts":[{"t":"명사절은 문장 안에서 주어, 목적어, 보어 역할을 하는 하나의 덩어리(절)예요. 접속사가 이런 명사절을 이끌어요."},{"k":"that절","n":"접속사 that이 이끄는 명사절로 '~라는 것, ~라고'의 뜻이에요. I think that he is right.(나는 그가 옳다고 생각한다)처럼 목적어로 자주 쓰이며, 이때 목적어 자리의 that은 생략할 수 있어요. 주어·보어 자리에도 올 수 있어요."},{"t":"예: That he is honest is true.(주어) / I know that he is honest.(목적어) / The truth is that he is honest.(보어)"},{"k":"if / whether","n":"'~인지 아닌지'의 뜻으로 확실하지 않은 내용을 나타내는 명사절을 이끌어요. I wonder if it is true.(나는 그것이 사실인지 궁금하다)처럼 쓰여요. if는 주로 목적어 자리에, whether는 주어·목적어·보어 자리 모두에 쓸 수 있어요."},{"t":"whether는 뒤에 or not을 붙여 '~인지 아닌지'를 강조할 수 있어요. 반면 if 바로 뒤에는 or not을 쓰지 않아요."},{"t":"명사절 안의 동사는 주어의 인칭·수, 그리고 시제에 맞게 정확히 써야 해요."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"빈칸에 알맞은 것은? I think ___ he is honest. (나는 그가 정직하다고 생각한다.)","o":["that","if","what","so","and"],"a":0,"e":"'~라고 생각하다'는 think that으로 나타내므로 that이 알맞아요."},{"q":"빈칸에 알맞은 것은? I wonder ___ it is true. (나는 그것이 사실인지 궁금하다.)","o":["because","if","that","and","but"],"a":1,"e":"'~인지 아닌지 궁금하다'는 wonder if로 나타내므로 if가 알맞아요."},{"q":"빈칸에 알맞은 것은? ___ he told a lie is clear. (그가 거짓말을 했다는 것은 분명하다.)","o":["If","When","That","So","But"],"a":2,"e":"주어 역할을 하는 명사절을 이끌어 '~라는 것'을 뜻하는 That이 알맞아요."},{"q":"빈칸에 알맞은 것은? Do you know ___ she is coming? (너는 그녀가 오는지 아니?)","o":["that","so","if","because","what"],"a":2,"e":"'~인지 아닌지'를 물으므로 목적어절을 이끄는 if가 알맞아요."},{"q":"밑줄 친 부분과 바꿔 쓸 수 있는 것은? I don't know [[if]] she likes me.","o":["that","whether","what","when","because"],"a":1,"e":"'~인지 아닌지'의 뜻인 if는 whether로 바꿔 쓸 수 있어요."},{"q":"빈칸에 알맞은 것은? The truth is ___ she loves music. (진실은 그녀가 음악을 사랑한다는 것이다.)","o":["if","whether","that","what","why"],"a":2,"e":"be동사 뒤 보어 자리에서 '~라는 것'을 뜻하는 that이 알맞아요."},{"q":"빈칸에 알맞은 것은? I believe ___ honesty is important. (나는 정직이 중요하다고 믿는다.)","o":["if","whether","when","that","because"],"a":3,"e":"'~라고 믿다'는 believe that으로 나타내므로 that이 알맞아요."},{"q":"빈칸에 알맞은 것은? I'm not sure ___ or not it will rain. (나는 비가 올지 안 올지 확실하지 않다.)","o":["that","if","when","what","whether"],"a":4,"e":"'~인지 아닌지'를 강조하는 'whether ~ or not' 형태이므로 whether가 알맞아요."},{"q":"빈칸에 알맞은 것은? ___ we win or lose doesn't matter. (우리가 이기든 지든 중요하지 않다.)","o":["If","That","Because","Whether","When"],"a":3,"e":"주어 자리에는 if를 쓸 수 없고, '~인지 아닌지'를 뜻하는 whether를 써요."},{"q":"다음 중 어법상 옳은 문장은?","o":["I know that she is a doctor.","I think if he is right.","I wonder that it is true.","Whether he will come are unknown.","I asked her that she was okay."],"a":0,"e":"know that 뒤에 올바른 명사절이 이어진 'I know that she is a doctor.'가 어법상 옳아요."}],"arrange":[{"ko":"나는 그가 옳다고 생각한다.","a":"I think that he is right."},{"ko":"나는 그것이 사실인지 궁금하다.","a":"I wonder if it is true."},{"ko":"나는 그가 정직하다는 것을 안다.","a":"I know that he is honest."},{"ko":"문제는 그녀가 올지 안 올지이다.","a":"The question is whether she will come."},{"ko":"나는 그가 파티에 올지 궁금하다.","a":"I wonder whether he will come to the party."},{"ko":"그가 그 시험에 통과한 것은 놀랍다.","a":"That he passed the exam is surprising."},{"ko":"나는 네가 옳다고 믿는다.","a":"I believe that you are right."},{"ko":"나는 그녀가 나를 좋아하는지 모른다.","a":"I don't know if she likes me."},{"ko":"사실은 그가 거짓말을 했다는 것이다.","a":"The truth is that he told a lie."},{"ko":"나는 비가 올지 안 올지 확실하지 않다.","a":"I'm not sure whether or not it will rain."},{"ko":"우리가 이기든 지든 중요하지 않다.","a":"Whether we win or lose doesn't matter."},{"ko":"그녀는 그 소식이 사실이라고 말했다.","a":"She said that the news was true."},{"ko":"나는 그가 집에 있는지 물었다.","a":"I asked whether he was at home."},{"ko":"그가 온다는 것은 확실하다.","a":"It is certain that he will come."},{"ko":"나는 그 계획이 좋다고 생각한다.","a":"I think that the plan is good."}],"compose":[{"k":"나는 그가 옳다고 생각한다.","a":"I think that he is right.","h":"think that / 목적어절","alt":["I think he is right."]},{"k":"나는 그것이 사실인지 궁금하다.","a":"I wonder if it is true.","h":"wonder if / ~인지","alt":["I wonder whether it is true."]},{"k":"나는 그가 정직하다는 것을 안다.","a":"I know that he is honest.","h":"know that","alt":["I know he is honest."]},{"k":"문제는 그녀가 올지 안 올지이다.","a":"The question is whether she will come.","h":"보어 자리 / whether","alt":["The question is whether or not she will come."]},{"k":"나는 그가 파티에 올지 궁금하다.","a":"I wonder if he will come to the party.","h":"wonder if","alt":["I wonder whether he will come to the party."]},{"k":"나는 네가 옳다고 믿는다.","a":"I believe that you are right.","h":"believe that","alt":["I believe you are right."]},{"k":"나는 그녀가 나를 좋아하는지 모른다.","a":"I don't know if she likes me.","h":"don't know if","alt":["I don't know whether she likes me."]},{"k":"사실은 그가 거짓말을 했다는 것이다.","a":"The truth is that he told a lie.","h":"보어 that","alt":["The truth is that he lied."]},{"k":"나는 비가 올지 안 올지 확실하지 않다.","a":"I'm not sure whether it will rain.","h":"not sure whether","alt":["I'm not sure if it will rain.","I'm not sure whether or not it will rain."]},{"k":"그가 그 시험에 통과했다는 것은 놀랍다.","a":"That he passed the exam is surprising.","h":"주어절 That","alt":["It is surprising that he passed the exam."]},{"k":"그녀는 그 이야기가 사실이라고 말했다.","a":"She said that the story was true.","h":"said that / 시제일치","alt":["She said the story was true."]},{"k":"나는 그가 집에 있는지 물었다.","a":"I asked whether he was at home.","h":"asked whether","alt":["I asked if he was at home."]},{"k":"그가 온다는 것은 확실하다.","a":"It is certain that he will come.","h":"It ~ that / 가주어","alt":["That he will come is certain."]},{"k":"나는 그 계획이 좋다고 생각한다.","a":"I think that the plan is good.","h":"think that","alt":["I think the plan is good."]},{"k":"나는 그 답이 맞는지 궁금하다.","a":"I wonder if the answer is correct.","h":"wonder if","alt":["I wonder whether the answer is correct."]}],"task":{"prompt":"명사절을 이끄는 접속사 <b>that</b>과 <b>if 또는 whether</b>를 사용하여, 자신의 생각과 궁금한 점을 영어로 3문장 이상 써 보세요.","sample":"I think that English is fun. I wonder if I can speak it well. I believe that I will improve soon.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"접속사 that 사용하기","regex":"\\bthat\\b"},{"label":"if 또는 whether 사용하기","regex":"\\b(if|whether)\\b"}]},"images":""},{"id":"L2C12U1","title":"who, which, that (주격 관계대명사)","explainParts":[{"t":"관계대명사는 두 문장을 하나로 이어 주면서, 앞에 나온 명사(선행사)를 뒤에서 꾸며 주는 역할을 해요."},{"k":"주격 관계대명사","n":"관계대명사가 이끄는 절 안에서 '주어' 역할을 하는 것을 말해요. 뒤에는 보통 동사가 바로 이어져요. 예: the boy who runs fast (소년이 달린다 → who가 주어 역할)."},{"t":"선행사가 '사람'이면 who, '사물·동물'이면 which를 써요."},{"k":"that의 쓰임","n":"that은 사람이든 사물이든 상관없이 who와 which를 대신해 쓸 수 있어요. 예: the boy that runs fast = the boy who runs fast."},{"t":"예를 들어 The boy who runs fast is my brother. (빠르게 달리는 그 소년은 내 남동생이다.) 처럼 who 뒤의 동사가 선행사 the boy를 설명해요."},{"k":"동사의 수 일치","n":"주격 관계대명사 뒤의 동사는 '선행사'의 수에 맞춰요. 선행사가 단수면 단수 동사, 복수면 복수 동사를 써요. 예: a dog which barks (단수) / dogs which bark (복수)."}],"explainNote":"노란 부분을 눌러 설명을 확인하세요.","quiz":[{"q":"빈칸에 알맞은 것은? I have a friend ___ lives in Busan.","o":["who","which","what","whose","where"],"a":0,"e":"선행사 a friend가 사람이므로 주격 관계대명사 who를 써요."},{"q":"빈칸에 알맞은 것은? This is the book ___ won the prize.","o":["who","which","whom","when","why"],"a":1,"e":"선행사 the book이 사물이므로 주격 관계대명사 which를 써요."},{"q":"빈칸에 알맞은 것은? Look at the dog ___ is barking loudly.","o":["who","whose","which","where","what"],"a":2,"e":"선행사 the dog은 동물이므로 which를 쓰며, that으로도 바꿀 수 있어요."},{"q":"빈칸에 알맞은 것은? The boy ___ runs fast is my classmate.","o":["which","what","whose","who","when"],"a":3,"e":"선행사 The boy가 사람이므로 주격 관계대명사 who가 알맞아요."},{"q":"빈칸에 who와 which를 모두 대신할 수 있는 것은? He is a singer ___ sings beautifully.","o":["that","what","whose","where","why"],"a":0,"e":"that은 사람과 사물 선행사 모두에 쓸 수 있는 주격 관계대명사예요. 선행사 a singer(사람) 뒤에서 who를 대신해요."},{"q":"빈칸에 알맞은 것은? I know a girl ___ can speak three languages.","o":["which","who","what","whom","where"],"a":1,"e":"선행사 a girl이 사람이므로 who를 써요."},{"q":"밑줄 친 부분이 어법상 틀린 것은? The apples [[which is]] on the table are fresh.","o":["The apples","which is","on the table","are fresh","없음"],"a":1,"e":"선행사 The apples가 복수이므로 관계대명사절의 동사도 which are로 써야 해요."},{"q":"빈칸에 알맞은 것은? She bought a car ___ has a large trunk.","o":["who","whose","which","when","what"],"a":2,"e":"선행사 a car가 사물이므로 which를 쓰고, 단수라 동사도 has예요."},{"q":"우리말과 같도록 빈칸에 알맞은 것은? '나는 하늘을 나는 새들을 좋아한다.' I like the birds ___ fly in the sky.","o":["who","whose","what","which","whom"],"a":3,"e":"선행사 the birds가 동물(복수)이므로 which를 쓰고 동사는 fly예요."},{"q":"어법상 옳은 문장은?","o":["The man which teaches us is kind.","I met a woman who sing very well.","This is a phone which have a big screen.","The students who study hard get good grades.","A cat which are black is on the roof."],"a":3,"e":"선행사 The students(사람, 복수)에 who를 쓰고 복수 동사 study를 맞춘 문장만 옳아요."}],"arrange":[{"ko":"나는 빠르게 달리는 그 소년을 안다.","a":"I know the boy who runs fast."},{"ko":"짖고 있는 그 개는 나의 것이다.","a":"The dog which barks is mine."},{"ko":"부산에 사는 한 친구가 있다.","a":"I have a friend who lives in Busan."},{"ko":"이것은 상을 받은 그 책이다.","a":"This is the book which won the prize."},{"ko":"세 개의 언어를 말할 수 있는 소녀를 안다.","a":"I know a girl who can speak three languages."},{"ko":"큰 트렁크를 가진 차를 원한다.","a":"I want a car which has a large trunk."},{"ko":"우리를 가르치는 그 선생님은 친절하다.","a":"The teacher who teaches us is kind."},{"ko":"하늘을 나는 그 새들은 아름답다.","a":"The birds which fly in the sky are beautiful."},{"ko":"그는 모두가 좋아하는 가수이다.","a":"He is a singer that everyone likes."},{"ko":"큰 화면을 가진 전화기를 샀다.","a":"I bought a phone which has a big screen."},{"ko":"열심히 공부하는 그 학생들은 좋은 성적을 받는다.","a":"The students who study hard get good grades."},{"ko":"지붕 위에 있는 그 고양이는 검다.","a":"The cat which is on the roof is black."},{"ko":"영어를 가르치는 한 남자를 만났다.","a":"I met a man who teaches English."},{"ko":"매우 잘 노래하는 여자를 안다.","a":"I know a woman who sings very well."},{"ko":"신선한 그 사과들은 식탁 위에 있다.","a":"The apples which are fresh are on the table."}],"compose":[{"k":"나는 빠르게 달리는 그 소년을 안다.","a":"I know the boy who runs fast.","h":"선행사 사람 → who / 동사 runs","alt":["I know the boy that runs fast."]},{"k":"짖고 있는 그 개는 나의 것이다.","a":"The dog which barks is mine.","h":"선행사 동물 → which / barks","alt":["The dog that barks is mine."]},{"k":"부산에 사는 한 친구가 있다.","a":"I have a friend who lives in Busan.","h":"사람 → who / lives","alt":["I have a friend that lives in Busan."]},{"k":"이것은 상을 받은 그 책이다.","a":"This is the book which won the prize.","h":"사물 → which / won","alt":["This is the book that won the prize."]},{"k":"세 개의 언어를 말할 수 있는 소녀를 안다.","a":"I know a girl who can speak three languages.","h":"사람 → who / can speak","alt":["I know a girl that can speak three languages."]},{"k":"큰 트렁크를 가진 차를 원한다.","a":"I want a car which has a large trunk.","h":"사물 → which / has","alt":["I want a car that has a large trunk."]},{"k":"우리를 가르치는 그 선생님은 친절하다.","a":"The teacher who teaches us is kind.","h":"사람 → who / teaches","alt":["The teacher that teaches us is kind."]},{"k":"하늘을 나는 그 새들은 아름답다.","a":"The birds which fly in the sky are beautiful.","h":"동물 복수 → which / fly","alt":["The birds that fly in the sky are beautiful."]},{"k":"그는 모두가 좋아하는 가수이다.","a":"He is a singer that everyone likes.","h":"사람 → that/who 가능","alt":["He is a singer who everyone likes.","He is a singer whom everyone likes."]},{"k":"큰 화면을 가진 전화기를 샀다.","a":"I bought a phone which has a big screen.","h":"사물 → which / has","alt":["I bought a phone that has a big screen."]},{"k":"열심히 공부하는 그 학생들은 좋은 성적을 받는다.","a":"The students who study hard get good grades.","h":"사람 복수 → who / study","alt":["The students that study hard get good grades."]},{"k":"지붕 위에 있는 그 고양이는 검다.","a":"The cat which is on the roof is black.","h":"동물 단수 → which / is","alt":["The cat that is on the roof is black."]},{"k":"영어를 가르치는 한 남자를 만났다.","a":"I met a man who teaches English.","h":"사람 → who / teaches","alt":["I met a man that teaches English."]},{"k":"매우 잘 노래하는 여자를 안다.","a":"I know a woman who sings very well.","h":"사람 단수 → who / sings","alt":["I know a woman that sings very well."]},{"k":"신선한 그 사과들은 식탁 위에 있다.","a":"The apples which are fresh are on the table.","h":"사물 복수 → which / are","alt":["The apples that are fresh are on the table."]}],"task":{"prompt":"여러분이 소개하고 싶은 사람이나 사물을 <b>주격 관계대명사 who, which, that</b>을 사용하여 설명하는 글을 써 보세요. 선행사가 사람이면 who, 사물·동물이면 which를 쓰고, 뒤에 오는 동사의 수를 선행사에 맞추세요.","sample":"I have a friend who plays the guitar very well. She has a dog which barks at strangers. I also like the songs that make people happy.","conds":[{"label":"3문장 이상 쓰기","minSentences":3},{"label":"주격 관계대명사 who, which, that 중 하나 이상 사용","regex":"\\b(who|which|that)\\b"},{"label":"선행사(명사) 뒤에 관계대명사를 사용하기","regex":"\\b(who|which|that)\\s+\\w+"}]},"images":""},{"id":"L2C12U2","title":"who(m), which, that (목적격 관계대명사)","explainParts":[{"t":"목적격 관계대명사는 뒤에 오는 문장에서 목적어 역할을 하면서, 앞에 있는 명사(선행사)를 꾸며 줘요. 「선행사 + 관계대명사 + 주어 + 동사」의 순서예요."},{"k":"who(m)","n":"선행사가 '사람'일 때 쓰는 목적격 관계
